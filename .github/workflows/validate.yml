name: Validate Venu JEE

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate modular paths
        run: python build.py
      - name: Parse every active JavaScript module
        run: node tests/check-js-syntax.mjs
