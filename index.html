CH = CH.concat([
{
id:'physics-vectors', subject:'physics', cls:11, ord:2,
title:B('Vectors','सदिश'),
blurb:B('Scalars and vectors, addition, resolution, unit vectors, dot and cross products and relative velocity.','अदिश और सदिश, योग, वियोजन, मात्रक सदिश, अदिश और सदिश गुणनफल तथा सापेक्ष वेग।'),
sections:[
 {h:B('Scalars and vectors','अदिश और सदिश'),
  body:B(
   '<p>A <b>scalar</b> has magnitude only: mass, time, distance, speed, energy, temperature, work, power. Scalars add like ordinary numbers.</p><p>A <b>vector</b> has magnitude and direction and obeys the vector laws of addition: displacement, velocity, acceleration, force, momentum, torque. A vector is written as <b>A</b> (or A with an arrow) and its magnitude as |A| or A.</p><ul><li><b>Equal vectors</b> have the same magnitude and direction.</li><li>The <b>negative</b> of A has the same magnitude and opposite direction.</li><li>A <b>unit vector</b> has magnitude 1. The unit vector along A is Â = A/|A|.</li><li>A <b>null vector</b> has zero magnitude and no definite direction.</li><li>Multiplying by a scalar k changes the magnitude by |k|. If k is negative, the direction reverses.</li></ul><p>Be careful: electric current and pressure have a direction in some contexts, but they do not add by the vector law, so they are scalars. Angle (in radian) is not a vector either, although small rotation is treated as one.</p>',
   '<p><b>अदिश</b> (scalar) में केवल परिमाण होता है: द्रव्यमान, समय, दूरी, चाल, ऊर्जा, ताप, कार्य, शक्ति। अदिश साधारण संख्याओं की तरह जुड़ते हैं।</p><p><b>सदिश</b> (vector) में परिमाण और दिशा दोनों होते हैं और वह सदिश योग के नियम मानता है: विस्थापन, वेग, त्वरण, बल, संवेग, बल आघूर्ण। सदिश को <b>A</b> (या A के ऊपर तीर) से और परिमाण को |A| या A से लिखते हैं।</p><ul><li><b>समान सदिशों</b> का परिमाण और दिशा समान होती है।</li><li>A का <b>ऋणात्मक सदिश</b> उसी परिमाण का पर विपरीत दिशा का होता है।</li><li><b>मात्रक सदिश</b> का परिमाण 1 होता है। A की दिशा में मात्रक सदिश Â = A/|A| है।</li><li><b>शून्य सदिश</b> का परिमाण शून्य होता है और उसकी कोई निश्चित दिशा नहीं होती।</li><li>अदिश k से गुणा करने पर परिमाण |k| गुना हो जाता है। k ऋणात्मक हो तो दिशा उलट जाती है।</li></ul><p>सावधान: विद्युत धारा और दाब की कुछ संदर्भों में दिशा दिखती है, पर वे सदिश योग का नियम नहीं मानते, इसलिए अदिश हैं। कोण (रेडियन में) भी सदिश नहीं है, यद्यपि छोटे घूर्णन को सदिश माना जाता है।</p>')},
 {h:B('Addition of vectors','सदिशों का योग'),
  body:B(
   '<p><b>Triangle law.</b> Place the tail of B on the head of A. The vector from the tail of A to the head of B is the resultant R = A + B. For many vectors the same idea gives the polygon law.</p><p><b>Parallelogram law.</b> If two vectors A and B act from the same point with angle θ between them, the diagonal from that point is the resultant.</p><p class="eq">R = '+R('A² + B² + 2AB cosθ')+'</p><p>The direction of R makes an angle α with A, where</p><p class="eq">tan α = '+F('B sinθ','A + B cosθ')+'</p><ul><li>Maximum: θ = 0°, R = A + B.</li><li>Minimum: θ = 180°, R = |A − B|.</li><li>θ = 90°: R = √(A² + B²).</li><li>For |A| = |B| = P: R = 2P cos(θ/2).</li></ul><p><b>Subtraction</b> is addition of the negative: A − B = A + (−B). Its magnitude is √(A² + B² − 2AB cosθ). Vector addition is commutative (A + B = B + A) and associative.</p>',
   '<p><b>त्रिभुज नियम।</b> B की पूँछ को A के शीर्ष पर रखो। A की पूँछ से B के शीर्ष तक का सदिश परिणामी R = A + B है। कई सदिशों के लिए यही विचार बहुभुज नियम देता है।</p><p><b>समांतर चतुर्भुज नियम।</b> यदि दो सदिश A और B एक ही बिंदु से कार्य करें और उनके बीच कोण θ हो, तो उस बिंदु से खींचा गया विकर्ण परिणामी है।</p><p class="eq">R = '+R('A² + B² + 2AB cosθ')+'</p><p>R की दिशा A से कोण α बनाती है, जहाँ</p><p class="eq">tan α = '+F('B sinθ','A + B cosθ')+'</p><ul><li>अधिकतम: θ = 0°, R = A + B।</li><li>न्यूनतम: θ = 180°, R = |A − B|।</li><li>θ = 90°: R = √(A² + B²)।</li><li>|A| = |B| = P के लिए: R = 2P cos(θ/2)।</li></ul><p><b>घटाना</b> ऋणात्मक सदिश को जोड़ना है: A − B = A + (−B)। इसका परिमाण √(A² + B² − 2AB cosθ) है। सदिश योग क्रमविनिमेय (A + B = B + A) और साहचर्य है।</p>'),
  dg:'vectors_1',
  cap:B('Triangle law (left) and parallelogram law (right) of vector addition.','सदिश योग का त्रिभुज नियम (बाएँ) और समांतर चतुर्भुज नियम (दाएँ)।')},
 {h:B('Resolution and unit vectors','वियोजन और मात्रक सदिश'),
  body:B(
   '<p>Any vector can be split into two perpendicular <b>components</b>. If A makes an angle θ with the x-axis,</p><p class="eq">A<sub>x</sub> = A cosθ, A<sub>y</sub> = A sinθ</p><p>and the magnitude and direction are recovered by</p><p class="eq">A = '+R('A<sub>x</sub>² + A<sub>y</sub>²')+', tan θ = '+F('A<sub>y</sub>','A<sub>x</sub>')+'</p><p>The unit vectors <b>î, ĵ, k̂</b> point along the +x, +y and +z axes. They are perpendicular to each other and each has magnitude 1. In three dimensions</p><p class="eq">A = A<sub>x</sub> î + A<sub>y</sub> ĵ + A<sub>z</sub> k̂, |A| = '+R('A<sub>x</sub>² + A<sub>y</sub>² + A<sub>z</sub>²')+'</p><p>Adding vectors in this form is easy: add the matching components. If A = 2î + 3ĵ and B = î − ĵ, then A + B = 3î + 2ĵ.</p><p>Resolution is the standard tool for inclined planes and projectiles. Resolve along and perpendicular to the plane, or along the horizontal and vertical.</p>',
   '<p>किसी भी सदिश को दो परस्पर लंबवत <b>घटकों</b> में तोड़ा जा सकता है। यदि A, x-अक्ष से कोण θ बनाता है तो</p><p class="eq">A<sub>x</sub> = A cosθ, A<sub>y</sub> = A sinθ</p><p>और परिमाण तथा दिशा वापस इस प्रकार मिलती है</p><p class="eq">A = '+R('A<sub>x</sub>² + A<sub>y</sub>²')+', tan θ = '+F('A<sub>y</sub>','A<sub>x</sub>')+'</p><p>मात्रक सदिश <b>î, ĵ, k̂</b> क्रमशः +x, +y और +z अक्षों की दिशा में हैं। वे परस्पर लंबवत हैं और प्रत्येक का परिमाण 1 है। तीन विमाओं में</p><p class="eq">A = A<sub>x</sub> î + A<sub>y</sub> ĵ + A<sub>z</sub> k̂, |A| = '+R('A<sub>x</sub>² + A<sub>y</sub>² + A<sub>z</sub>²')+'</p><p>इस रूप में सदिश जोड़ना आसान है: संगत घटकों को जोड़ दो। यदि A = 2î + 3ĵ और B = î − ĵ हो, तो A + B = 3î + 2ĵ।</p><p>वियोजन नततल और प्रक्षेप्य के लिए मुख्य साधन है। तल के अनुदिश और लंबवत, या क्षैतिज और ऊर्ध्वाधर दिशाओं में वियोजित करो।</p>'),
  dg:'vectors_2',
  cap:B('Resolving a vector A into components A cosθ along x and A sinθ along y.','सदिश A का x के अनुदिश A cosθ और y के अनुदिश A sinθ घटकों में वियोजन।')},
 {h:B('Dot product (scalar product)','अदिश गुणनफल (डॉट गुणनफल)'),
  body:B(
   '<p>The <b>dot product</b> of A and B is a scalar:</p><p class="eq">A · B = AB cosθ = A<sub>x</sub>B<sub>x</sub> + A<sub>y</sub>B<sub>y</sub> + A<sub>z</sub>B<sub>z</sub></p><p>It is the magnitude of A times the component of B along A. Properties:</p><ul><li>Commutative: A · B = B · A. Distributive over addition.</li><li>î · î = ĵ · ĵ = k̂ · k̂ = 1 and î · ĵ = ĵ · k̂ = k̂ · î = 0.</li><li>A · A = A², so A = √(A · A).</li><li>If A · B = 0 and neither is null, the vectors are <b>perpendicular</b>. If A · B = ±AB, they are parallel or antiparallel.</li></ul><p>The angle between two vectors is found from</p><p class="eq">cosθ = '+F('A · B','AB')+'</p><p>Work is a dot product: W = F · d = Fd cosθ. Power is P = F · v. The component of A along a direction n̂ is A · n̂.</p>',
   '<p>A और B का <b>अदिश गुणनफल</b> (dot product) एक अदिश है:</p><p class="eq">A · B = AB cosθ = A<sub>x</sub>B<sub>x</sub> + A<sub>y</sub>B<sub>y</sub> + A<sub>z</sub>B<sub>z</sub></p><p>यह A के परिमाण और A की दिशा में B के घटक का गुणनफल है। गुण:</p><ul><li>क्रमविनिमेय: A · B = B · A। योग पर वितरण नियम लागू।</li><li>î · î = ĵ · ĵ = k̂ · k̂ = 1 और î · ĵ = ĵ · k̂ = k̂ · î = 0।</li><li>A · A = A², इसलिए A = √(A · A)।</li><li>यदि A · B = 0 और कोई भी शून्य सदिश नहीं है तो सदिश <b>लंबवत</b> हैं। यदि A · B = ±AB हो तो वे समांतर या प्रतिसमांतर हैं।</li></ul><p>दो सदिशों के बीच का कोण इस सूत्र से मिलता है</p><p class="eq">cosθ = '+F('A · B','AB')+'</p><p>कार्य एक अदिश गुणनफल है: W = F · d = Fd cosθ। शक्ति P = F · v है। किसी दिशा n̂ में A का घटक A · n̂ है।</p>')},
 {h:B('Cross product (vector product)','सदिश गुणनफल (क्रॉस गुणनफल)'),
  body:B(
   '<p>The <b>cross product</b> A × B is a vector.</p><p class="eq">|A × B| = AB sinθ</p><p>Its direction is perpendicular to the plane of A and B, given by the <b>right-hand rule</b>: curl the fingers of the right hand from A towards B through the smaller angle. The thumb gives the direction of A × B.</p><ul><li>Not commutative: A × B = −(B × A).</li><li>A × A = 0. For parallel vectors A × B = 0.</li><li>î × ĵ = k̂, ĵ × k̂ = î, k̂ × î = ĵ. Reverse the order and the sign changes.</li><li>The magnitude |A × B| is the <b>area of the parallelogram</b> with sides A and B. Half of it is the area of the triangle.</li></ul><p>In components,</p><p class="eq">A × B = '+MX([['î','ĵ','k̂'],['A<sub>x</sub>','A<sub>y</sub>','A<sub>z</sub>'],['B<sub>x</sub>','B<sub>y</sub>','B<sub>z</sub>']],true)+'</p><p>Torque τ = r × F, angular momentum L = r × p and the magnetic force F = qv × B are all cross products.</p>',
   '<p><b>सदिश गुणनफल</b> (cross product) A × B एक सदिश है।</p><p class="eq">|A × B| = AB sinθ</p><p>इसकी दिशा A और B के तल के लंबवत होती है, जो <b>दाएँ हाथ के नियम</b> से मिलती है: दाएँ हाथ की उँगलियों को छोटे कोण से A से B की ओर मोड़ो। अँगूठा A × B की दिशा बताता है।</p><ul><li>क्रमविनिमेय नहीं: A × B = −(B × A)।</li><li>A × A = 0। समांतर सदिशों के लिए A × B = 0।</li><li>î × ĵ = k̂, ĵ × k̂ = î, k̂ × î = ĵ। क्रम उलटने पर चिह्न बदल जाता है।</li><li>परिमाण |A × B| भुजाओं A और B वाले <b>समांतर चतुर्भुज का क्षेत्रफल</b> है। इसका आधा त्रिभुज का क्षेत्रफल है।</li></ul><p>घटकों में</p><p class="eq">A × B = '+MX([['î','ĵ','k̂'],['A<sub>x</sub>','A<sub>y</sub>','A<sub>z</sub>'],['B<sub>x</sub>','B<sub>y</sub>','B<sub>z</sub>']],true)+'</p><p>बल आघूर्ण τ = r × F, कोणीय संवेग L = r × p और चुंबकीय बल F = qv × B सभी सदिश गुणनफल हैं।</p>')},
 {h:B('Relative velocity','सापेक्ष वेग'),
  body:B(
   '<p>The velocity of A <b>relative to</b> B is how A appears to move for an observer sitting on B.</p><p class="eq">v<sub>AB</sub> = v<sub>A</sub> − v<sub>B</sub></p><p>Both v<sub>A</sub> and v<sub>B</sub> are measured from the ground. This is a vector subtraction, so the directions matter.</p><ul><li>Moving in the same direction: v<sub>AB</sub> = v<sub>A</sub> − v<sub>B</sub> (the difference of speeds).</li><li>Moving in opposite directions: v<sub>AB</sub> = v<sub>A</sub> + v<sub>B</sub> (the sum of speeds).</li><li>At right angles: v<sub>AB</sub> = √(v<sub>A</sub>² + v<sub>B</sub>²).</li></ul><p>Also v<sub>BA</sub> = −v<sub>AB</sub>.</p><p><b>Rain and umbrella.</b> A man walking through vertical rain feels the rain coming at a slant. The rain relative to the man is v<sub>r</sub> − v<sub>m</sub>. He tilts the umbrella towards the direction from which this relative velocity comes, that is, forward.</p><p><b>River and boat.</b> The velocity of a boat relative to the ground is v<sub>b</sub> = v<sub>boat, water</sub> + v<sub>water</sub>, a vector sum.</p>',
   '<p>B के <b>सापेक्ष</b> A का वेग वह है जो B पर बैठे प्रेक्षक को A की गति दिखती है।</p><p class="eq">v<sub>AB</sub> = v<sub>A</sub> − v<sub>B</sub></p><p>v<sub>A</sub> और v<sub>B</sub> दोनों धरती के सापेक्ष मापे जाते हैं। यह सदिश घटाव है, इसलिए दिशाएँ मायने रखती हैं।</p><ul><li>एक ही दिशा में गति: v<sub>AB</sub> = v<sub>A</sub> − v<sub>B</sub> (चालों का अंतर)।</li><li>विपरीत दिशाओं में गति: v<sub>AB</sub> = v<sub>A</sub> + v<sub>B</sub> (चालों का योग)।</li><li>समकोण पर: v<sub>AB</sub> = √(v<sub>A</sub>² + v<sub>B</sub>²)।</li></ul><p>साथ ही v<sub>BA</sub> = −v<sub>AB</sub>।</p><p><b>वर्षा और छाता।</b> ऊर्ध्वाधर वर्षा में चलते आदमी को वर्षा तिरछी आती लगती है। आदमी के सापेक्ष वर्षा v<sub>r</sub> − v<sub>m</sub> है। वह छाते को उस दिशा की ओर झुकाता है जहाँ से यह सापेक्ष वेग आता है, यानी आगे की ओर।</p><p><b>नदी और नाव।</b> धरती के सापेक्ष नाव का वेग v<sub>नाव, जल</sub> + v<sub>जल</sub> है, जो सदिश योग है।</p>')}
],
formulas:[
 [B('Resultant magnitude','परिणामी का परिमाण'),'R = '+R('A² + B² + 2AB cosθ')],
 [B('Resultant direction','परिणामी की दिशा'),'tan α = '+F('B sinθ','A + B cosθ')],
 [B('Components','घटक'),'A<sub>x</sub> = A cosθ, A<sub>y</sub> = A sinθ'],
 [B('Magnitude in 3D','3D में परिमाण'),'|A| = '+R('A<sub>x</sub>² + A<sub>y</sub>² + A<sub>z</sub>²')],
 [B('Unit vector','मात्रक सदिश'),'Â = '+F('A','|A|')],
 [B('Dot product','अदिश गुणनफल'),'A · B = AB cosθ = A<sub>x</sub>B<sub>x</sub> + A<sub>y</sub>B<sub>y</sub> + A<sub>z</sub>B<sub>z</sub>'],
 [B('Angle between vectors','सदिशों के बीच कोण'),'cosθ = '+F('A · B','AB')],

 [B('Relative velocity','सापेक्ष वेग'),'v<sub>AB</sub> = v<sub>A</sub> − v<sub>B</sub>']
],
examples:[
 {lv:'easy',
  q:B('Two forces of 3 N and 4 N act at right angles to each other. Find the magnitude and direction of the resultant.','3 N और 4 N के दो बल परस्पर समकोण पर लगते हैं। परिणामी का परिमाण और दिशा ज्ञात करो।'),
  a:B('<p>R = √(3² + 4²) = √25 = <b>5 N</b>.</p><p>tan α = 4 sin 90° / (3 + 4 cos 90°) = 4/3, so α ≈ <b>53°</b> with the 3 N force.</p>','<p>R = √(3² + 4²) = √25 = <b>5 N</b>।</p><p>tan α = 4 sin 90° / (3 + 4 cos 90°) = 4/3, इसलिए 3 N बल से α ≈ <b>53°</b>।</p>')},
 {lv:'easy',
  q:B('Resolve a force of 10 N acting at 30° above the horizontal into horizontal and vertical components.','क्षैतिज से 30° ऊपर लगे 10 N के बल को क्षैतिज और ऊर्ध्वाधर घटकों में वियोजित करो।'),
  a:B('<p>F<sub>x</sub> = 10 cos 30° = 10 × 0.866 = <b>8.66 N</b></p><p>F<sub>y</sub> = 10 sin 30° = 10 × 0.5 = <b>5 N</b></p><p>Check: √(8.66² + 5²) = √100 = 10 N.</p>','<p>F<sub>x</sub> = 10 cos 30° = 10 × 0.866 = <b>8.66 N</b></p><p>F<sub>y</sub> = 10 sin 30° = 10 × 0.5 = <b>5 N</b></p><p>जाँच: √(8.66² + 5²) = √100 = 10 N।</p>')},
 {lv:'medium',
  q:B('Find the angle between A = 2î + 3ĵ + k̂ and B = î − 2ĵ + 2k̂.','A = 2î + 3ĵ + k̂ और B = î − 2ĵ + 2k̂ के बीच कोण ज्ञात करो।'),
  a:B('<p>A · B = (2)(1) + (3)(−2) + (1)(2) = 2 − 6 + 2 = −2.</p><p>|A| = √(4 + 9 + 1) = √14 ≈ 3.742 and |B| = √(1 + 4 + 4) = 3.</p><p>cosθ = −2 / (3 × 3.742) = −0.178, so θ ≈ <b>100°</b> (obtuse, as A · B is negative).</p>','<p>A · B = (2)(1) + (3)(−2) + (1)(2) = 2 − 6 + 2 = −2।</p><p>|A| = √(4 + 9 + 1) = √14 ≈ 3.742 और |B| = √(1 + 4 + 4) = 3।</p><p>cosθ = −2 / (3 × 3.742) = −0.178, इसलिए θ ≈ <b>100°</b> (अधिक कोण, क्योंकि A · B ऋणात्मक है)।</p>')},
 {lv:'medium',
  q:B('For the same A = 2î + 3ĵ + k̂ and B = î − 2ĵ + 2k̂, find A × B and the area of the parallelogram formed by them.','उन्हीं A = 2î + 3ĵ + k̂ और B = î − 2ĵ + 2k̂ के लिए A × B और उनसे बने समांतर चतुर्भुज का क्षेत्रफल ज्ञात करो।'),
  a:B('<p>A × B = î(3·2 − 1·(−2)) − ĵ(2·2 − 1·1) + k̂(2·(−2) − 3·1)</p><p>= <b>8î − 3ĵ − 7k̂</b>.</p><p>Area = |A × B| = √(64 + 9 + 49) = √122 ≈ <b>11.05</b> square units.</p>','<p>A × B = î(3·2 − 1·(−2)) − ĵ(2·2 − 1·1) + k̂(2·(−2) − 3·1)</p><p>= <b>8î − 3ĵ − 7k̂</b>।</p><p>क्षेत्रफल = |A × B| = √(64 + 9 + 49) = √122 ≈ <b>11.05</b> वर्ग इकाई।</p>')},
 {lv:'medium',
  q:B('Two vectors of equal magnitude P have a resultant of magnitude P. Find the angle between them.','समान परिमाण P के दो सदिशों का परिणामी भी P परिमाण का है। उनके बीच कोण ज्ञात करो।'),
  a:B('<p>R² = P² + P² + 2P² cosθ = P²</p><p>2 + 2 cosθ = 1, so cosθ = −½ and θ = <b>120°</b>.</p><p>Check with R = 2P cos(θ/2) = 2P cos 60° = P.</p>','<p>R² = P² + P² + 2P² cosθ = P²</p><p>2 + 2 cosθ = 1, इसलिए cosθ = −½ और θ = <b>120°</b>।</p><p>R = 2P cos(θ/2) से जाँच: 2P cos 60° = P।</p>')},
 {lv:'hard',
  q:B('Rain falls vertically at 3 m/s. A man walks east at 4 m/s. Find the speed of the rain relative to him and the angle from the vertical at which he must hold his umbrella.','वर्षा 3 m/s से ऊर्ध्वाधर गिर रही है। एक आदमी 4 m/s से पूर्व की ओर चलता है। उसके सापेक्ष वर्षा की चाल और वह कोण ज्ञात करो जो उसे छाते को ऊर्ध्वाधर से बनाना चाहिए।'),

rev:{

 hi:['अदिश संख्याओं की तरह जुड़ते हैं। सदिश त्रिभुज या समांतर चतुर्भुज नियम से जुड़ते हैं।','R का मान |A − B| (θ = 180°) से A + B (θ = 0°) तक रहता है।','अदिश गुणनफल अदिश है और कार्य देता है। सदिश गुणनफल सदिश है और बल आघूर्ण देता है।','A · B = 0 का अर्थ लंबवत। A × B = 0 का अर्थ समांतर।','|A × B| भुजाओं A और B वाले समांतर चतुर्भुज का क्षेत्रफल है।','सापेक्ष वेग: v<sub>AB</sub> = v<sub>A</sub> − v<sub>B</sub>, यह सदिश घटाव है।']},
mis:{

D3.wave3d={
  en:'Travelling wave: every particle does SHM, the shape moves forward',hi:'चलती तरंग: हर कण SHM करता है, आकृति आगे बढ़ती है',h:0.9,scale:0.8,center:[0,0,0],spin:false,view:{yaw:-0.5,pitch:0.25,zoom:1},
  params:[
    {k:'lam',en:'Wavelength λ (m)',hi:'तरंगदैर्घ्य λ (m)',min:1,max:4,val:2,step:1,unit:''},
    {k:'f',en:'Frequency f (Hz)',hi:'आवृत्ति f (Hz)',min:1,max:5,val:2,step:1,unit:''},
    {k:'A',en:'Amplitude (×)',hi:'आयाम (×)',min:1,max:3,val:2,step:1,unit:''}
  ],
  frame:function(S,t,P,l){
    var lam=P.lam,f=P.f,A=P.A*0.12,k=2*Math.PI/lam,w=2*Math.PI*f,tau=t*0.2,i,N=40,pts=[],X,x,y;
    S.line([-1.3,0,0],[1.3,0,0],'muted',1,true);
    for(i=0;i<=N;i++){X=4*i/N;x=-1.3+0.65*X;y=A*Math.sin(k*X-w*tau);pts.push([x,y,0])}
    S.path(pts,'accent',2.2);
    for(i=0;i<=N;i+=2){X=4*i/N;x=-1.3+0.65*X;y=A*Math.sin(k*X-w*tau);S.sphere([x,y,0],0.03,i===20?'hi':'phys',i===20)}
    var yh=A*Math.sin(k*2-w*tau);
    S.line([0,-0.4,0],[0,0.4,0],'hi',1,true);
    S.arrow([-0.4,-0.62,0],[0.4,-0.62,0],'accent',2);
    S.text([0.55,-0.62,0],'v = fλ','accent',11,'left',true);
    S.line([-1.3,-0.45,0],[-1.3+0.65*lam,-0.45,0],'ink',1.4);
    S.text([-1.3+0.325*lam,-0.52,0],'λ','ink',11);
    S.hud(0.04,0.07,'λ = '+lam+' m   f = '+f+' Hz   v = fλ = '+(f*lam)+' m/s','accent',12,'left',true);
    S.hud(0.04,0.16,'k = 2π/λ = '+k.toFixed(2)+' rad/m   ω = 2πf = '+w.toFixed(1)+' rad/s','ink',11,'left');
    S.hud(0.04,0.25,sx(l,'The highlighted particle only moves up and down; the shape travels.','चमकता कण केवल ऊपर-नीचे चलता है; आकृति आगे बढ़ती है।'),'muted',10,'left');
  }
};

D3.standing3d={
  en:'Standing waves on a string fixed at both ends: nodes and antinodes',hi:'दोनों सिरों पर बँधी डोरी में अप्रगामी तरंगें: निस्पंद और प्रस्पंद',h:0.9,scale:0.8,center:[0,0,0],spin:false,view:{yaw:-0.45,pitch:0.22,zoom:1},
  params:[{k:'n',en:'Harmonic number n',hi:'हार्मोनिक क्रमांक n',min:1,max:5,val:3,step:1,unit:''}],
  frame:function(S,t,P,l){
    var n=P.n,q,pts=[],up=[],dn=[],u,amp=0.4,c=Math.cos(2*Math.PI*0.4*n*t*0.5);
    S.box([-1.25,0,0],[0.08,0.5,0.3],'muted');S.box([1.25,0,0],[0.08,0.5,0.3],'muted');
    for(q=0;q<=80;q++){u=q/80;var s=Math.sin(n*Math.PI*u);pts.push([-1.2+2.4*u,amp*s*c,0]);up.push([-1.2+2.4*u,amp*s,0]);dn.push([-1.2+2.4*u,-amp*s,0])}
    S.path(up,'line',1,true);S.path(dn,'line',1,true);
    S.path(pts,'accent',2.4);
    for(q=0;q<=n;q++)S.sphere([-1.2+2.4*q/n,0,0],0.045,'bad',false);
    for(q=0;q<n;q++)S.text([-1.2+2.4*(q+0.5)/n,-amp-0.12,0],'A','good',10,'center',true);
    S.text([-1.2,0.35,0],'N','bad',10,'center',true);
    var v=200,L=1;
    S.hud(0.04,0.07,'n = '+n+'   λ = 2L/n = '+(2/n).toFixed(2)+' m   '+sx(l,'nodes = ','निस्पंद = ')+(n+1)+'   '+sx(l,'antinodes = ','प्रस्पंद = ')+n,'accent',12,'left',true);
    S.hud(0.04,0.16,'fₙ = nv/2L = '+(n*v/(2*L))+' Hz   (v = 200 m/s, L = 1 m)','ink',12,'left',true);
    S.hud(0.04,0.25,sx(l,'Red dots = nodes (never move); A = antinodes (move most).','लाल बिंदु = निस्पंद (कभी नहीं हिलते); A = प्रस्पंद (सबसे ज़्यादा हिलते हैं)।'),'muted',10,'left');
  }
};

D3.doppler3d={
  en:'Doppler effect: wave fronts bunch up in front of a moving source',hi:'डॉप्लर प्रभाव: चलते स्रोत के आगे तरंगाग्र पास-पास आ जाते हैं',h:0.9,scale:0.4,center:[0,0,0],spin:false,view:{yaw:0,pitch:1.05,zoom:1},
  params:[{k:'M',en:'Source speed (×0.1 of sound speed)',hi:'स्रोत की चाल (ध्वनि चाल का ×0.1)',min:0,max:8,val:4,step:1,unit:''}],
  frame:function(S,t,P,l){
    var M=P.M,vsF=M*0.1,c=0.5,Te=0.5,ph=(t%Te),k,a,R,cx;
    for(k=0;k<7;k++){a=ph+k*Te;R=c*a;cx=-vsF*c*a;S.ring([cx,0,0],R,'xz',k===0?'accent':'phys',k===0?2:1.5)}
    S.sphere([0,0,0],0.06,'hi',true);
    S.arrow([0,0.0,0.18],[0.45*vsF+0.02,0.0,0.18],'bad',2.2);
    S.sphere([1.55,0,0],0.05,'good',false);S.sphere([-1.55,0,0],0.05,'good',false);
    S.text([1.55,0.0,0.15],sx(l,'ahead','आगे'),'good',10,'center',true);
    S.text([-1.55,0.0,0.15],sx(l,'behind','पीछे'),'good',10,'center',true);
    var vs=M*34,f0=500;
    S.hud(0.04,0.07,sx(l,'Source speed ','स्रोत की चाल ')+vs+' m/s  (v = 340 m/s, f₀ = 500 Hz)','accent',12,'left',true);
    S.hud(0.04,0.16,sx(l,'Ahead: f′ = ','आगे: f′ = ')+(f0*340/(340-vs)).toFixed(0)+' Hz    '+sx(l,'Behind: f′ = ','पीछे: f′ = ')+(f0*340/(340+vs)).toFixed(0)+' Hz','ink',12,'left',true);
    S.hud(0.04,0.25,sx(l,'Top view. Bunched fronts ahead = higher pitch; stretched behind = lower.','ऊपर से दृश्य। आगे पास-पास अग्र = ऊँची तान; पीछे फैले हुए = नीची तान।'),'muted',10,'left');
  }
};

CH=CH.concat([{
id:'physics-waves', subject:'physics', cls:11, ord:15,
title:B('Waves','तरंगें'),
blurb:B('Wave motion, speed of waves, superposition and standing waves, sound in pipes, beats and the Doppler effect.','तरंग गति, तरंगों की चाल, अध्यारोपण और अप्रगामी तरंगें, नलियों में ध्वनि, विस्पंद और डॉप्लर प्रभाव।'),
sections:[
 {h:B('Wave motion and wave speed','तरंग गति और तरंग की चाल'),
  body:B(
   '<p class="def"><b>In simple words:</b> a wave carries <b>energy</b> from place to place without carrying the material itself. Each particle just vibrates in place and passes the disturbance to its neighbour.</p><ul><li><b>Transverse wave:</b> particles vibrate at right angles to the direction of travel (string, light). It needs rigidity, so it travels in solids and on liquid surfaces.</li><li><b>Longitudinal wave:</b> particles vibrate along the direction of travel (sound). It forms compressions and rarefactions and travels in solids, liquids and gases.</li></ul><p class="eq">v = fλ        y = A sin(kx − ωt)        k = 2π/λ</p><ul><li>Wavelength λ = distance between two nearest points in the same phase (crest to crest).</li><li>The sign: <b>kx − ωt</b> means the wave moves towards +x; <b>kx + ωt</b> means towards −x.</li><li>Speed on a stretched string: <b>v = √(T/μ)</b>, where T is tension and μ is mass per unit length.</li><li>Speed of sound in a gas: <b>v = √(γP/ρ) = √(γRT/M)</b>, so v ∝ √T. In air at 20 °C, v ≈ 343 m/s.</li><li>Intensity I ∝ A²f². The speed depends on the medium, the frequency depends on the source.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> तरंग <b>ऊर्जा</b> को एक जगह से दूसरी जगह ले जाती है, पदार्थ को नहीं। हर कण अपनी जगह पर ही कंपन करता है और विक्षोभ को अपने पड़ोसी तक पहुँचा देता है।</p><ul><li><b>अनुप्रस्थ तरंग:</b> कण गति की दिशा के लंबवत कंपन करते हैं (डोरी, प्रकाश)। इसके लिए दृढ़ता चाहिए, इसलिए यह ठोसों और द्रव की सतह पर चलती है।</li><li><b>अनुदैर्ध्य तरंग:</b> कण गति की दिशा में ही कंपन करते हैं (ध्वनि)। इसमें संपीडन और विरलन बनते हैं और यह ठोस, द्रव तथा गैस तीनों में चलती है।</li></ul><p class="eq">v = fλ        y = A sin(kx − ωt)        k = 2π/λ</p><ul><li>तरंगदैर्घ्य λ = समान कला वाले दो निकटतम बिंदुओं के बीच की दूरी (शीर्ष से शीर्ष)।</li><li>चिह्न: <b>kx − ωt</b> का अर्थ है तरंग +x की ओर चल रही है; <b>kx + ωt</b> का अर्थ −x की ओर।</li><li>तनी हुई डोरी में चाल: <b>v = √(T/μ)</b>, जहाँ T तनाव और μ प्रति इकाई लंबाई द्रव्यमान है।</li><li>गैस में ध्वनि की चाल: <b>v = √(γP/ρ) = √(γRT/M)</b>, अतः v ∝ √T। 20 °C की हवा में v ≈ 343 m/s।</li><li>तीव्रता I ∝ A²f²। चाल माध्यम पर निर्भर करती है, आवृत्ति स्रोत पर।</li></ul>'),
  d3:'wave3d',
  cap:B('Watch the glowing particle: it only moves up and down, while the wave shape moves to the right. Try changing λ and f to see v = fλ.','चमकते कण को देखो: वह केवल ऊपर-नीचे चलता है, जबकि तरंग की आकृति दाईं ओर बढ़ती है। v = fλ देखने के लिए λ और f बदलो।')},
 {h:B('Superposition and standing waves','अध्यारोपण और अप्रगामी तरंगें'),
  body:B(
   '<p class="def"><b>In simple words:</b> when two waves meet, their displacements simply add up (<b>superposition</b>). When two identical waves travel in opposite directions, they make a <b>standing wave</b>: some points never move (nodes) and some move the most (antinodes).</p><p class="eq">y = 2A sin(kx) cos(ωt)</p><ul><li><b>Nodes</b> are spaced λ/2 apart; so are antinodes. A node and the next antinode are λ/4 apart.</li><li><b>String fixed at both ends:</b> nodes at both ends, so L = nλ/2 and <b>f<sub>n</sub> = nv/2L</b> (n = 1, 2, 3…). n = 1 is the fundamental, n = 2 the second harmonic.</li><li>No energy flows along a standing wave; all particles between two nodes move in phase.</li><li>A <b>wave reflected from a fixed end</b> changes phase by π (node there). From a free end there is no phase change (antinode there).</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> जब दो तरंगें मिलती हैं तो उनके विस्थापन बस जुड़ जाते हैं (<b>अध्यारोपण</b>)। जब दो एक-जैसी तरंगें विपरीत दिशाओं में चलती हैं तो <b>अप्रगामी तरंग</b> बनती है: कुछ बिंदु कभी नहीं हिलते (निस्पंद) और कुछ सबसे ज़्यादा हिलते हैं (प्रस्पंद)।</p><p class="eq">y = 2A sin(kx) cos(ωt)</p><ul><li><b>निस्पंद</b> λ/2 दूरी पर होते हैं; प्रस्पंद भी। एक निस्पंद और अगले प्रस्पंद के बीच λ/4 दूरी होती है।</li><li><b>दोनों सिरों पर बँधी डोरी:</b> दोनों सिरों पर निस्पंद, इसलिए L = nλ/2 और <b>f<sub>n</sub> = nv/2L</b> (n = 1, 2, 3…)। n = 1 मूल स्वर है, n = 2 द्वितीय हार्मोनिक।</li><li>अप्रगामी तरंग के अनुदिश ऊर्जा प्रवाहित नहीं होती; दो निस्पंदों के बीच सभी कण एक ही कला में चलते हैं।</li><li><b>बँधे सिरे से परावर्तन</b> में कला π से बदलती है (वहाँ निस्पंद)। मुक्त सिरे से कला नहीं बदलती (वहाँ प्रस्पंद)।</li></ul>'),
  d3:'standing3d',
  cap:B('Change n from 1 to 5. The red dots stay still (nodes); between them the string swings up and down together.','n को 1 से 5 तक बदलो। लाल बिंदु स्थिर रहते हैं (निस्पंद); उनके बीच डोरी एक साथ ऊपर-नीचे झूलती है।')},
 {h:B('Sound in pipes','नलियों में ध्वनि'),
  body:B(
   '<p class="def"><b>In simple words:</b> air in a pipe vibrates like a string, but the end rules change. At a <b>closed</b> end the air cannot move (node). At an <b>open</b> end it moves freely (antinode).</p><ul><li><b>Open pipe</b> (both ends open): antinodes at both ends. <b>f<sub>n</sub> = nv/2L</b>, n = 1, 2, 3… all harmonics are present.</li><li><b>Closed pipe</b> (one end closed): node at the closed end, antinode at the open end. <b>f = (2n − 1)v/4L</b>, i.e. v/4L, 3v/4L, 5v/4L… only odd harmonics.</li></ul><p class="eq">Open: f₁ = v/2L        Closed: f₁ = v/4L</p><ul><li>For the same length, a closed pipe’s fundamental is <b>half</b> that of an open pipe.</li><li><b>End correction:</b> the real antinode sits slightly outside the open end, about 0.6r (r = pipe radius).</li><li>Loudness depends on intensity (β = 10 log(I/I₀) decibels). Pitch depends on frequency. Quality (timbre) depends on the mix of harmonics.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> नली में हवा डोरी की तरह कंपन करती है, पर सिरों के नियम बदल जाते हैं। <b>बंद</b> सिरे पर हवा हिल नहीं सकती (निस्पंद)। <b>खुले</b> सिरे पर हवा आज़ादी से हिलती है (प्रस्पंद)।</p><ul><li><b>खुली नली</b> (दोनों सिरे खुले): दोनों सिरों पर प्रस्पंद। <b>f<sub>n</sub> = nv/2L</b>, n = 1, 2, 3… सभी हार्मोनिक मौजूद रहते हैं।</li><li><b>बंद नली</b> (एक सिरा बंद): बंद सिरे पर निस्पंद, खुले सिरे पर प्रस्पंद। <b>f = (2n − 1)v/4L</b>, यानी v/4L, 3v/4L, 5v/4L… केवल विषम हार्मोनिक।</li></ul><p class="eq">खुली: f₁ = v/2L        बंद: f₁ = v/4L</p><ul><li>समान लंबाई के लिए बंद नली का मूल स्वर खुली नली के मूल स्वर का <b>आधा</b> होता है।</li><li><b>सिरा संशोधन:</b> वास्तविक प्रस्पंद खुले सिरे से थोड़ा बाहर बनता है, लगभग 0.6r (r = नली की त्रिज्या)।</li><li>प्रबलता तीव्रता पर निर्भर करती है (β = 10 log(I/I₀) डेसिबल)। तारत्व आवृत्ति पर, और गुणता (टिम्बर) हार्मोनिकों के मिश्रण पर निर्भर करती है।</li></ul>')},
 {h:B('Beats and the Doppler effect','विस्पंद और डॉप्लर प्रभाव'),
  body:B(
   '<p class="def"><b>In simple words:</b> two sounds of slightly different pitch make a throbbing loud-soft-loud sound: <b>beats</b>. And when a source and a listener move relative to each other, the pitch changes: the <b>Doppler effect</b> (an ambulance sounds higher while coming, lower while going).</p><p class="eq">Beat frequency = |f₁ − f₂|</p><p class="eq">f′ = f (v ± v<sub>o</sub>) / (v ∓ v<sub>s</sub>)</p><ul><li>Take <b>upper signs</b> (+ in the numerator, − in the denominator) when the observer moves <b>towards</b> the source and the source moves <b>towards</b> the observer. Reverse the signs for moving away.</li><li>v = speed of sound, v<sub>o</sub> = observer’s speed, v<sub>s</sub> = source’s speed. Speeds are measured relative to the medium.</li><li>Approach raises the frequency; receding lowers it. Only the <b>relative motion along the line joining them</b> matters.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> थोड़ी अलग तान की दो ध्वनियाँ मिलकर तेज़-धीमी-तेज़ धड़कती ध्वनि बनाती हैं: <b>विस्पंद</b>। और जब स्रोत और श्रोता एक-दूसरे के सापेक्ष चलते हैं तो तान बदल जाती है: <b>डॉप्लर प्रभाव</b> (एम्बुलेंस आते समय ऊँची और जाते समय नीची सुनाई देती है)।</p><p class="eq">विस्पंद आवृत्ति = |f₁ − f₂|</p><p class="eq">f′ = f (v ± v<sub>o</sub>) / (v ∓ v<sub>s</sub>)</p><ul><li>जब श्रोता स्रोत की <b>ओर</b> और स्रोत श्रोता की <b>ओर</b> चल रहा हो तो <b>ऊपर वाले चिह्न</b> लो (अंश में +, हर में −)। दूर जाने पर चिह्न उलट दो।</li><li>v = ध्वनि की चाल, v<sub>o</sub> = श्रोता की चाल, v<sub>s</sub> = स्रोत की चाल। चालें माध्यम के सापेक्ष मापी जाती हैं।</li><li>पास आने पर आवृत्ति बढ़ती है; दूर जाने पर घटती है। केवल दोनों को मिलाने वाली रेखा के अनुदिश <b>सापेक्ष गति</b> मायने रखती है।</li></ul>'),
  d3:'doppler3d',
  cap:B('Top view of circular wave fronts from a moving source. Increase the source speed and see the fronts crowd together ahead and spread out behind.','चलते स्रोत से निकले वृत्ताकार तरंगाग्रों का ऊपर से दृश्य। स्रोत की चाल बढ़ाओ और देखो कि आगे अग्र पास-पास आ जाते हैं और पीछे फैल जाते हैं।')}
],

D3.work3d={
  en:'Work done by a force at an angle: W = F d cos θ',hi:'कोण पर लगे बल द्वारा कार्य: W = F d cos θ',h:0.85,scale:0.72,center:[-0.1,-0.1,0],spin:true,view:{yaw:-0.5,pitch:0.3,zoom:1},
  params:[
    {k:'th',en:'Angle θ of the pull (°)',hi:'खिंचाव का कोण θ (°)',min:0,max:90,val:30,step:10,unit:''},
    {k:'F',en:'Force F (N)',hi:'बल F (N)',min:5,max:30,val:20,step:5,unit:''}
  ],
  frame:function(S,t,P,l){
    var th=P.th*Math.PI/180,F=P.F,c=Math.cos(th),s=Math.sin(th),tt=(t%3.2)/2.4;if(tt>1)tt=1;
    var d=2*tt;
    S.floor([[-1.3,0,-0.5],[1.3,0,-0.5],[1.3,0,0.5],[-1.3,0,0.5]],'soft',0.8,'line');
    S.line([-0.9,0.002,0.4],[0.95,0.002,0.4],'muted',1);S.text([-0.9,-0.07,0.46],'0','muted',9.5,'center',true);S.text([0.95,-0.07,0.46],'2 m','muted',9.5,'center',true);
    var X=-0.9+0.925*d;
    S.box([X,0.1,0],[0.28,0.2,0.24],'accent');
    var top=[X,0.22,0],k=0.018*F;
    S.arrow(top,[top[0]+k*c*1.2,top[1]+k*s*1.2,0],'hi',3);
    if(P.th>0&&P.th<90){S.line(top,[top[0]+k*c*1.2,top[1],0],'good',1.6);S.line([top[0]+k*c*1.2,top[1],0],[top[0]+k*c*1.2,top[1]+k*s*1.2,0],'muted',1.2)}
    S.text([top[0]+k*c*1.2+0.05,top[1]+k*s*1.2+0.07,0],'F','hi',12,'left',true);
    var W=F*d*c;
    S.hud(0.04,0.07,'F = '+F+' N   θ = '+P.th+'°   d = '+d.toFixed(1)+' m','ink',12,'left',true);
    S.hud(0.04,0.16,'W = F d cos θ = '+(Math.round(W*10)/10)+' J','accent',13,'left',true);
    S.hud(0.04,0.25,P.th===90?sx(l,'θ = 90°: force ⟂ motion, no work','θ = 90°: बल ⟂ गति, कार्य शून्य'):sx(l,'only the part along the motion (F cos θ) does work','केवल गति के अनुदिश भाग (F cos θ) कार्य करता है'),'muted',10,'left');
  }
};
D3.energy3d={
  en:'Pendulum: potential and kinetic energy swap, total stays constant',hi:'लोलक: स्थितिज और गतिज ऊर्जा बदलती हैं, कुल स्थिर रहती है',h:0.9,scale:0.66,center:[0,-0.1,0],spin:true,view:{yaw:-0.45,pitch:0.15,zoom:1},
  params:[{k:'a',en:'Release angle (°)',hi:'छोड़ने का कोण (°)',min:10,max:80,val:50,step:10,unit:''}],
  frame:function(S,t,P,l){
    var a0=P.a*Math.PI/180,L=1.0,g=10,py=0.75,th=a0*Math.cos(t*2.3),i;
    var bx=L*Math.sin(th),by=py-L*Math.cos(th);
    S.floor([[-1.5,py-L-0.12,-0.5],[1.5,py-L-0.12,-0.5],[1.5,py-L-0.12,0.5],[-1.5,py-L-0.12,0.5]],'soft',0.6,'line');
    S.line([-0.35,py,0],[0.35,py,0],'ink',5);
    var tr=[];for(i=-20;i<=20;i++){var q=a0*i/20;tr.push([L*Math.sin(q),py-L*Math.cos(q),0])}
    S.path(tr,'muted',1);
    S.line([0,py,0],[bx,by,0],'ink',2);
    S.sphere([bx,by,0],0.09,'accent',true);
    var h=L*(1-Math.cos(th)),Et=g*L*(1-Math.cos(a0)),PE=g*h,KE=Math.max(0,Et-PE),u=0.11,base=py-L-0.1,bxp=1.05;
    [[PE,'accent',0],[KE,'good',0.22],[Et,'hi',0.44]].forEach(function(r){
      var hh=Math.max(0.01,r[0]*u);S.box([bxp+r[2],base+hh/2,0],[0.16,hh,0.16],r[1]);
    });
    S.text([bxp,base-0.07,0],'PE','accent',11,'center',true);S.text([bxp+0.22,base-0.07,0],'KE','good',11,'center',true);S.text([bxp+0.44,base-0.07,0],sx(l,'Total','कुल'),'hi',11,'center',true);

CH=CH.concat([{
id:'physics-work-energy-power', subject:'physics', cls:11, ord:6,
title:B('Work, Energy and Power','कार्य, ऊर्जा और शक्ति'),
blurb:B('Work, kinetic and potential energy, the work–energy theorem, conservation of energy, power and collisions.','कार्य, गतिज और स्थितिज ऊर्जा, कार्य–ऊर्जा प्रमेय, ऊर्जा संरक्षण, शक्ति और टक्करें।'),
sections:[
 {h:B('Work','कार्य'),
  body:B(
   '<p class="def"><b>In simple words:</b> in physics, work is done only when a force moves something. Pushing a wall hard does <b>no work</b> (it does not move). Work is the force along the motion times the distance moved.</p><p class="eq">W = F · d = F d cos θ        unit: joule (J)</p><ul><li>θ is the angle between the force and the displacement.</li><li>θ = 0°: full work (W = Fd). θ = 90°: <b>zero work</b> (like gravity on a horizontal motion, or the centripetal force). θ &gt; 90°: <b>negative work</b> (like friction).</li><li>Work is a <b>scalar</b>, but it can be positive, negative or zero.</li><li>For a changing force, work = <b>area under the F–x graph</b>: W = ∫F dx.</li><li>1 J = work done by 1 N over 1 m.</li></ul><p>In the figure, a block is pulled along the floor at an angle θ. Only the horizontal part F cos θ moves it, so at θ = 90° the work becomes zero.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> भौतिकी में कार्य तभी होता है जब कोई बल किसी चीज़ को हिलाए। दीवार को पूरी ताक़त से धकेलने पर <b>कोई कार्य नहीं</b> होता (वह हिलती नहीं)। कार्य = गति के अनुदिश बल × चली गई दूरी।</p><p class="eq">W = F · d = F d cos θ        मात्रक: जूल (J)</p><ul><li>θ बल और विस्थापन के बीच का कोण है।</li><li>θ = 0°: पूरा कार्य (W = Fd)। θ = 90°: <b>कार्य शून्य</b> (जैसे क्षैतिज गति पर गुरुत्व, या अभिकेंद्र बल)। θ &gt; 90°: <b>ऋणात्मक कार्य</b> (जैसे घर्षण)।</li><li>कार्य <b>अदिश</b> है, पर धनात्मक, ऋणात्मक या शून्य हो सकता है।</li><li>बदलते बल के लिए कार्य = <b>F–x ग्राफ के नीचे का क्षेत्रफल</b>: W = ∫F dx।</li><li>1 J = 1 N बल द्वारा 1 m पर किया कार्य।</li></ul><p>चित्र में एक गुटका फर्श पर कोण θ से खींचा जा रहा है। केवल क्षैतिज भाग F cos θ उसे हिलाता है, इसलिए θ = 90° पर कार्य शून्य हो जाता है।</p>'),
  d3:'work3d',
  cap:B('The block moves 2 m. Change the angle and the force and watch the work W = F d cos θ change.','गुटका 2 m चलता है। कोण और बल बदलो और कार्य W = F d cos θ को बदलते देखो।')},
 {h:B('Kinetic energy and the work–energy theorem','गतिज ऊर्जा और कार्य–ऊर्जा प्रमेय'),
  body:B(
   '<p class="def"><b>In simple words:</b> kinetic energy (KE) is the energy a body has because it is moving. The work you do on a body ends up as a change in its kinetic energy.</p><p class="eq">KE = ½ m v² = p² / (2m)</p><p class="eq">W<sub>net</sub> = ΔKE = ½ m v² − ½ m u²</p><ul><li>KE is always positive. It depends on the <b>square</b> of speed: double the speed, 4 times the KE.</li><li>The <b>work–energy theorem</b> holds even for variable forces and is the quickest way to find speeds.</li><li>Positive net work speeds a body up; negative net work (friction, brakes) slows it down.</li></ul><p>Example: a 1000 kg car going from 10 m/s to 20 m/s needs net work ½ × 1000 × (400 − 100) = 150 000 J.</p><p><b>Spring:</b> stretching a spring by x stores energy ½kx². The force F = −kx (Hooke’s law) grows with x, so the work is the triangle area under the F–x graph.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> गतिज ऊर्जा (KE) वह ऊर्जा है जो किसी पिंड में उसके चलने के कारण होती है। पिंड पर तुम जो कार्य करते हो वह उसकी गतिज ऊर्जा में परिवर्तन बन जाता है।</p><p class="eq">KE = ½ m v² = p² / (2m)</p><p class="eq">W<sub>net</sub> = ΔKE = ½ m v² − ½ m u²</p><ul><li>KE हमेशा धनात्मक होती है। यह चाल के <b>वर्ग</b> पर निर्भर है: चाल दोगुनी तो KE चार गुनी।</li><li><b>कार्य–ऊर्जा प्रमेय</b> परिवर्ती बलों के लिए भी सही है और चाल निकालने का सबसे तेज़ तरीका है।</li><li>धनात्मक परिणामी कार्य पिंड को तेज़ करता है; ऋणात्मक परिणामी कार्य (घर्षण, ब्रेक) उसे धीमा करता है।</li></ul><p>उदाहरण: 1000 kg की कार को 10 m/s से 20 m/s करने के लिए परिणामी कार्य ½ × 1000 × (400 − 100) = 150 000 J चाहिए।</p><p><b>स्प्रिंग:</b> स्प्रिंग को x खींचने पर ½kx² ऊर्जा संचित होती है। बल F = −kx (हुक का नियम) x के साथ बढ़ता है, इसलिए कार्य F–x ग्राफ के नीचे के त्रिभुज का क्षेत्रफल है।</p>')},
 {h:B('Potential energy and conservation of energy','स्थितिज ऊर्जा और ऊर्जा संरक्षण'),
  body:B(
   '<p class="def"><b>In simple words:</b> potential energy (PE) is stored energy because of position or shape. A stone held high, or a squeezed spring, can give back energy when released.</p><p class="eq">Gravitational PE = m g h        Spring PE = ½ k x²</p><p><b>Conservative force</b> (gravity, spring): the work done does not depend on the path, and PE can be defined. Friction is <b>non-conservative</b>: energy is lost as heat.</p><p class="eq">KE + PE = constant   (only conservative forces act)</p><ul><li>Free fall: PE falls as KE rises; speed after falling height h is v = √(2gh).</li><li>In the pendulum figure the bob has maximum PE at the ends and maximum KE at the lowest point. The tall golden bar (total) never changes.</li><li>With friction, total mechanical energy decreases; the loss equals the work done by friction.</li></ul><p>Example: a bob released from a height of 0.8 m above its lowest point reaches the bottom with v = √(2 × 10 × 0.8) = 4 m/s.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> स्थितिज ऊर्जा (PE) स्थिति या आकार के कारण संचित ऊर्जा है। ऊँचाई पर रखा पत्थर या दबी हुई स्प्रिंग छोड़ने पर ऊर्जा वापस दे सकती है।</p><p class="eq">गुरुत्वीय PE = m g h        स्प्रिंग PE = ½ k x²</p><p><b>संरक्षी बल</b> (गुरुत्व, स्प्रिंग): कार्य पथ पर निर्भर नहीं करता और PE परिभाषित हो सकती है। घर्षण <b>असंरक्षी</b> है: ऊर्जा ऊष्मा बनकर नष्ट होती है।</p><p class="eq">KE + PE = अचर   (केवल संरक्षी बल लगें)</p><ul><li>मुक्त पतन: PE घटती है और KE बढ़ती है; h ऊँचाई गिरने के बाद चाल v = √(2gh)।</li><li>लोलक के चित्र में गोलक की PE सिरों पर अधिकतम और KE सबसे निचले बिंदु पर अधिकतम है। ऊँचा चमकीला स्तंभ (कुल) कभी नहीं बदलता।</li><li>घर्षण होने पर कुल यांत्रिक ऊर्जा घटती है; हानि घर्षण द्वारा किए गए कार्य के बराबर है।</li></ul><p>उदाहरण: सबसे निचले बिंदु से 0.8 m ऊँचाई से छोड़ा गया गोलक नीचे v = √(2 × 10 × 0.8) = 4 m/s से पहुँचता है।</p>'),
  d3:'energy3d',
  cap:B('As the bob swings, PE and KE exchange but the total (right-most bar) stays constant.','जैसे ही गोलक झूलता है, PE और KE आपस में बदलती हैं पर कुल (सबसे दाईं पट्टी) स्थिर रहता है।')},
 {h:B('Power and collisions','शक्ति और टक्कर'),
  body:B(
   '<p class="def"><b>In simple words:</b> <b>power</b> tells how fast work is done. Two lifts can raise the same load to the same height, but the one that does it in less time has more power.</p><p class="eq">P = W / t = F · v        unit: watt (W) = J/s</p><ul><li>1 horsepower (hp) = 746 W. 1 kWh = 3.6 × 10⁶ J (the electricity “unit”).</li></ul><p><b>Collisions:</b> momentum is <b>always</b> conserved in a collision (no external force).</p><ul><li><b>Elastic:</b> KE is also conserved. For a head-on elastic collision of m₁ with u₁ on m₂ at rest: v₁ = (m₁ − m₂)u₁/(m₁ + m₂), v₂ = 2m₁u₁/(m₁ + m₂).</li><li><b>Inelastic:</b> KE is lost. <b>Perfectly inelastic:</b> bodies stick together, v = (m₁u₁ + m₂u₂)/(m₁ + m₂), maximum KE loss.</li><li>Coefficient of restitution e = (speed of separation)/(speed of approach): e = 1 elastic, e = 0 perfectly inelastic.</li><li>Equal masses in an elastic head-on collision exchange velocities.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>शक्ति</b> बताती है कि कार्य कितनी तेज़ी से होता है। दो लिफ्टें एक ही भार को एक ही ऊँचाई तक उठा सकती हैं, पर जो कम समय में उठाए उसकी शक्ति अधिक है।</p><p class="eq">P = W / t = F · v        मात्रक: वाट (W) = J/s</p><ul><li>1 अश्वशक्ति (hp) = 746 W। 1 kWh = 3.6 × 10⁶ J (बिजली की “यूनिट”)।</li></ul><p><b>टक्कर:</b> टक्कर में संवेग <b>हमेशा</b> संरक्षित रहता है (कोई बाहरी बल न हो)।</p><ul><li><b>प्रत्यास्थ:</b> KE भी संरक्षित। विरामावस्था वाले m₂ पर u₁ से आते m₁ की सीधी प्रत्यास्थ टक्कर में: v₁ = (m₁ − m₂)u₁/(m₁ + m₂), v₂ = 2m₁u₁/(m₁ + m₂)।</li><li><b>अप्रत्यास्थ:</b> KE की हानि। <b>पूर्णतः अप्रत्यास्थ:</b> पिंड चिपक जाते हैं, v = (m₁u₁ + m₂u₂)/(m₁ + m₂), KE की अधिकतम हानि।</li><li>प्रत्यानयन गुणांक e = (अलगाव की चाल)/(पास आने की चाल): e = 1 प्रत्यास्थ, e = 0 पूर्णतः अप्रत्यास्थ।</li><li>बराबर द्रव्यमानों की सीधी प्रत्यास्थ टक्कर में वेग आपस में बदल जाते हैं।</li></ul>')}
],

examples:[
 {lv:'easy',
  q:B('A force of 20 N moves a body 5 m, at 60° to the displacement. Find the work done.','20 N का बल एक पिंड को 5 m चलाता है, विस्थापन से 60° कोण पर। किया गया कार्य ज्ञात करो।'),
  a:B('<p>W = F d cos θ = 20 × 5 × cos 60° = 100 × 0.5 = <b>50 J</b>.</p>','<p>W = F d cos θ = 20 × 5 × cos 60° = 100 × 0.5 = <b>50 J</b>।</p>')},
 {lv:'easy',
  q:B('Find the kinetic energy of a 2 kg body moving at 10 m/s.','10 m/s से चलते 2 kg के पिंड की गतिज ऊर्जा ज्ञात करो।'),
  a:B('<p>KE = ½mv² = ½ × 2 × 100 = <b>100 J</b>.</p>','<p>KE = ½mv² = ½ × 2 × 100 = <b>100 J</b>।</p>')},
 {lv:'medium',
  q:B('How much work must be done to increase the speed of a 1000 kg car from 10 m/s to 20 m/s?','1000 kg की कार की चाल 10 m/s से 20 m/s करने के लिए कितना कार्य करना होगा?'),
  a:B('<p>W = ΔKE = ½ × 1000 × (20² − 10²) = 500 × 300 = <b>1.5 × 10⁵ J</b>.</p>','<p>W = ΔKE = ½ × 1000 × (20² − 10²) = 500 × 300 = <b>1.5 × 10⁵ J</b>।</p>')},
 {lv:'medium',
  q:B('A pendulum bob is released from a height of 0.8 m above its lowest point. Find its speed at the lowest point (g = 10 m/s²).','एक लोलक का गोलक अपने निम्नतम बिंदु से 0.8 m ऊँचाई से छोड़ा गया। निम्नतम बिंदु पर उसकी चाल ज्ञात करो (g = 10 m/s²)।'),
  a:B('<p>Energy conservation: mgh = ½mv², so v = √(2gh) = √(2 × 10 × 0.8) = √16 = <b>4 m/s</b>.</p>','<p>ऊर्जा संरक्षण: mgh = ½mv², अतः v = √(2gh) = √(2 × 10 × 0.8) = √16 = <b>4 m/s</b>।</p>')},
 {lv:'medium',
  q:B('A motor lifts a 500 kg load through 20 m in 10 s. Find the power output (g = 10 m/s²).','एक मोटर 500 kg के भार को 10 s में 20 m ऊपर उठाती है। निर्गत शक्ति ज्ञात करो (g = 10 m/s²)।'),
  a:B('<p>Work = mgh = 500 × 10 × 20 = 100 000 J.</p><p>P = W/t = 100 000/10 = 10 000 W = <b>10 kW</b>.</p>','<p>कार्य = mgh = 500 × 10 × 20 = 100 000 J।</p><p>P = W/t = 100 000/10 = 10 000 W = <b>10 kW</b>।</p>')},
 {lv:'hard',
  q:B('A 2 kg body moving at 6 m/s collides head-on and elastically with a 4 kg body at rest. Find both velocities after the collision and verify that the kinetic energy is conserved.','6 m/s से चलता 2 kg का पिंड विरामावस्था में रखे 4 kg के पिंड से सीधी प्रत्यास्थ टक्कर करता है। टक्कर के बाद दोनों वेग ज्ञात करो और सत्यापित करो कि गतिज ऊर्जा संरक्षित है।'),
  a:B('<p>v₁ = (2 − 4)(6)/(6) = <b>−2 m/s</b> (it bounces back). v₂ = 2(2)(6)/6 = <b>4 m/s</b>.</p><p>KE before = ½ × 2 × 36 = 36 J. KE after = ½ × 2 × 4 + ½ × 4 × 16 = 4 + 32 = 36 J. Conserved ✓.</p>','<p>v₁ = (2 − 4)(6)/(6) = <b>−2 m/s</b> (वह पीछे लौटता है)। v₂ = 2(2)(6)/6 = <b>4 m/s</b>।</p><p>पहले KE = ½ × 2 × 36 = 36 J। बाद में KE = ½ × 2 × 4 + ½ × 4 × 16 = 4 + 32 = 36 J। संरक्षित ✓।</p>')}
],
rev:{
 en:['Work W = Fd cos θ is a scalar; it is zero when force ⟂ motion and negative for friction.','Work–energy theorem: net work = change in kinetic energy.','KE = ½mv²; PE = mgh (gravity) or ½kx² (spring).','With only conservative forces, KE + PE stays constant.','Power = work/time = F·v; 1 hp = 746 W.','In every collision momentum is conserved; KE is conserved only in an elastic collision.'],

}]);

TESTS[11]=TESTS[11].concat([
 {ch:'physics-work-energy-power',
  q:B('The work done by the centripetal force on a body in uniform circular motion is','एकसमान वृत्तीय गति में पिंड पर अभिकेंद्र बल द्वारा किया गया कार्य है'),

/* ---------- book model ---------- */
var BOOKS={}, SUBS=['physics','chemistry','maths'];
function classChapters(cls){
  var SORD={physics:0,chemistry:1,maths:2}, out=[];
  var have={};
  CH.forEach(function(c){have[c.id]=c;if(!c._att&&D3ATT[c.id]){c._att=1;D3ATT[c.id].forEach(function(a){var sc=c.sections[a[0]];if(sc&&!sc.d3){sc.d3=a[1];sc.cap3=a[2]}})}});
  if(cls===11){
    SUBS.forEach(function(sub){
      PLAN11[sub].forEach(function(p,i){
        var id=sub+'-'+p[0], c=have[id];
        if(c&&c.cls===11){c.ord=i+1;out.push(c)}
        else{out.push({id:id,subject:sub,cls:11,ord:i+1,title:B(p[1],p[2]),pending:true})}
      });
    });
    CH.forEach(function(c){if(c.cls===11&&!out.some(function(o){return o.id===c.id})){out.push(c)}});
  }else{out=CH.filter(function(c){return c.cls===cls})}
  return out.map(function(c,i){return {c:c,i:i}}).sort(function(a,b){
    return SORD[a.c.subject]-SORD[b.c.subject]||(a.c.ord||0)-(b.c.ord||0)||a.i-b.i;
  }).map(function(x){return x.c});
}
function book(cls,sub){
  var key=cls+'-'+sub;
  if(BOOKS[key])return BOOKS[key];
  var chs=classChapters(cls).filter(function(c){return c.subject===sub});
  var pages=[{t:'cover'},{t:'toc',label:'ii'}], info=[], n=0;
  chs.forEach(function(c,ci){
    var no=ci+1, figN=0;
    var rec={c:c,no:no,start:0,secs:[],fx:0,ex:[],rev:0};
    if(c.pending){rec.pending=true;info.push(rec);return}
    var add=function(p){p.num=++n;p.ci=ci;p.label=String(p.num);pages.push(p);return p};
    rec.start=add({t:'opener'}).num;
    c.sections.forEach(function(s,si){
      var p={t:'concept',si:si};
      if(s.d3){p.fig=no+'.'+(++figN)}
      if(s.dg){p.fig2=no+'.'+(++figN)}
      add(p);
      rec.secs.push({h:s.h,num:p.num});
    });
    rec.fx=add({t:'formulas'}).num;
    for(var i=0;i<c.examples.length;i+=3){
      var items=[];
      for(var j=i;j<Math.min(i+3,c.examples.length);j++){items.push({x:c.examples[j],no:no+'.'+(j+1)})}
      rec.ex.push(add({t:'examples',items:items}).num);
    }
    rec.rev=add({t:'revision'}).num;
    info.push(rec);
  });
  BOOKS[key]={cls:cls,sub:sub,base:'b'+key,chs:chs,info:info,pages:pages,total:n};
  return BOOKS[key];
}
function pHref(bk,idx){
  if(idx===0)return '#'+bk.base;
  if(idx===1)return '#'+bk.base+'-toc';
  return '#'+bk.base+'-p'+bk.pages[idx].num;
}
function numHref(base,num){return '#'+base+'-p'+num}

function pageHTML(bk,idx){
  var p=bk.pages[idx], cls=bk.cls;

  if(p.t==='cover'){

      +'<div class="cvact">'+segHTML()+'</div>'
      +'<div class="cvact"><a class="btn pri" href="'+numHref(bk.base,1)+'">'+t(U.start)+'</a><a class="btn" href="#'+bk.base+'-toc">'+t(U.contents)+'</a><a class="btn" href="#t'+cls+'-'+bk.sub+'">'+t(U.takeTest)+'</a></div></div>';
  }
  var odd, head, subj='', body;
  if(p.t==='toc'){
    odd=false; head=hd; body=tocBody(bk);
  }else{
    var c=bk.info[p.ci].c; subj=c.subject;

  }
  return '<div class="paper '+(odd?'odd':'even')+'"'+(subj?' data-subject="'+subj+'"':'')+'><div class="run"><span>'+head+'</span></div><div class="pbody">'+body+'</div><div class="pnum">'+p.label+'</div></div>';
}

  var prev=idx>0?pHref(bk,idx-1):'', next=idx<last?pHref(bk,idx+1):'#t'+bk.cls+'-'+bk.sub;

function matchSel(q){var c=CHBY[q.ch];return !!c&&(TS.sub==='all'||c.subject===TS.sub)&&(TS.ch==='all'||q.ch===TS.ch)}
function resample(){
  var list=[];
  TESTS[TS.cls].forEach(function(q,i){if(matchSel(q)){list.push(i)}});
  TS.total=list.length;
  if(list.length>30){
    for(var i=list.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=list[i];list[i]=list[j];list[j]=tmp}
    list=list.slice(0,30);
  }
  TS.sel=list;TS.ans={};TS.done=false;
}
function answeredCount(){var n=0;TS.sel.forEach(function(i){if(TS.ans[i]!==undefined){n++}});return n}
function testView(cls,psub){
  var tk=cls+'-'+(psub||'');
  if(psub!==undefined&&TS.key!==tk){TS={cls:cls,key:tk,sub:psub||'all',ch:'all',ans:{},done:false,sel:[],total:0};resample()}
  else if(TS.cls!==cls){TS={cls:cls,key:tk,sub:'all',ch:'all',ans:{},done:false,sel:[],total:0};resample()}
  var bk={chs:classChapters(cls).filter(function(c){return !c.pending})}, all=TESTS[cls], list=TS.sel;
  var subs=['physics','chemistry','maths'].filter(function(s){return bk.chs.some(function(c){return c.subject===s})});
  var chips='<button type="button" class="chip" data-tsub="all" aria-pressed="'+(TS.sub==='all')+'">'+t(U.allSub)+'</button>'
    +subs.map(function(s){return '<button type="button" class="chip" data-tsub="'+s+'" aria-pressed="'+(TS.sub===s)+'">'+t(SUBJ[s])+'</button>'}).join('');
  var opts='<option value="all"'+(TS.ch==='all'?' selected':'')+'>'+t(U.allCh)+'</option>'
    +bk.chs.filter(function(c){return TS.sub==='all'||c.subject===TS.sub}).map(function(c){return '<option value="'+c.id+'"'+(TS.ch===c.id?' selected':'')+'>'+esc(t(c.title))+'</option>'}).join('');
  var picker='<div class="chips" role="group">'+chips+'</div><label class="selwrap"><span class="cnt">'+t(U.chapterWord)+'</span><select id="tch" class="sel">'+opts+'</select></label>';
  var note=TS.total>list.length?'<p class="cnt">'+t(U.showing)+' '+list.length+' '+t(U.ofWord)+' '+TS.total+' '+t(U.qsWord)+'. '+t(U.newSetHint)+'</p>':'';
  var sum='';
  if(TS.done){
    var ok=0,bad=0,sk=0;
    list.forEach(function(i){var a=TS.ans[i];if(a===undefined){sk++}else if(a===all[i].a){ok++}else{bad++}});
    sum='<div class="sum"><div class="big">'+(ok*4-bad)+' <small>/ '+(list.length*4)+'</small></div><div class="row"><span>'+t(U.rightN)+': <b>'+ok+'</b></span><span>'+t(U.wrongN)+': <b>'+bad+'</b></span><span>'+t(U.skipN)+': <b>'+sk+'</b></span></div></div>';
  }
  var qs=list.map(function(i,n){
    var q=all[i], c=CHBY[q.ch], a=TS.ans[i];
    var opts2=q.o.map(function(o,oi){
      var cl='';
      if(TS.done){if(oi===q.a){cl=' ok'}else if(a===oi){cl=' no'}}
      var tick=TS.done?(oi===q.a?'<span class="tick">✓</span>':(a===oi?'<span class="tick">✗</span>':'')):'';
      return '<label class="opt'+cl+'"><input type="radio" name="q'+i+'" value="'+oi+'"'+(a===oi?' checked':'')+(TS.done?' disabled':'')+'><span>'+ot(o)+'</span>'+tick+'</label>';
    }).join('');
    return '<div class="tq" data-subject="'+c.subject+'"><div class="qh"><span>Q'+(n+1)+'</span><span>'+t(SUBJ[c.subject])+' · '+t(c.title)+'</span></div><div class="qt">'+t(q.q)+'</div><div class="opts">'+opts2+'</div>'
      +(TS.done?'<div class="why"><b>'+t(U.why)+'</b><p>'+t(q.e)+'</p></div>':'')+'</div>';
  }).join('');
  var bar=!list.length?'<p class="cnt">'+t(U.noQ)+'</p>'
    :TS.done
    ?'<div class="tbar"><button type="button" class="btn pri" data-act="retry">'+t(U.retry)+'</button><a class="btn" href="#'+(TS.sub==='all'?'c'+cls:'b'+cls+'-'+TS.sub)+'">'+t(U.readBook)+'</a></div>'
    :'<div class="tbar"><button type="button" class="btn pri" data-act="submit">'+t(U.submit)+'</button><span class="cnt" id="cnt">'+answeredCount()+' / '+list.length+' '+t(U.answered)+'</span></div>';
  pager.hidden=true; cur={book:false,prev:'',next:''};
  document.body.removeAttribute('data-subject');
  app.innerHTML='<div class="in test"><h1>'+t(U.testWord)+' · '+t(CLS[cls].name)+'</h1><p class="sub">'+t(U.marking)+'</p>'
    +picker+note+sum+qs+bar+'</div>';
}

/* ---------- routing ---------- */
function route(anim,top){
  var h=location.hash.slice(1), m;
  if((m=/^b(11|12)-(physics|chemistry|maths)(?:-(toc|p(\d+)))?$/.exec(h))){
    bookView(+m[1],m[2],m[3]==='toc'?'toc':'',m[4],anim);
  }else if((m=/^t(11|12)(?:-(physics|chemistry|maths))?$/.exec(h))){
    testView(+m[1],m[2]||'');
  }else if((m=/^c(11|12)(?:-.*)?$/.exec(h))){
    classView(+m[1]);
  }else{
    pager.hidden=true; cur={book:false,prev:'',next:''};
    home();
  }
  if(top){window.scrollTo(0,0)}
}
function syncSeg(){
  var bs=document.querySelectorAll('[data-lang]');
  for(var i=0;i<bs.length;i++){bs[i].setAttribute('aria-pressed',String(bs[i].getAttribute('data-lang')===lang))}
  document.documentElement.lang=lang;
}
function go(href){if(href){location.hash=href.slice(1)}}

document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-lang]'):null;
  if(el){
    lang=el.getAttribute('data-lang');
    LS.set('venu.lang',lang);
    var y=window.scrollY;
    route(false,false);
    syncSeg();
    window.scrollTo(0,y);
  }
});
app.addEventListener('click',function(e){
  var d=e.target.closest('[data-done]');
  if(d){
    var on=toggleDone(d.getAttribute('data-done'));
    d.setAttribute('aria-pressed',String(on));
    d.textContent=on?t(U.marked):t(U.mark);
    return;
  }
  var c=e.target.closest('[data-tsub]');
  if(c){TS.sub=c.getAttribute('data-tsub');TS.ch='all';resample();testView(TS.cls);return}
  var a=e.target.closest('[data-act]');
  if(a){
    var act=a.getAttribute('data-act');
    if(act==='submit'){TS.done=true}
    if(act==='retry'){resample()}
    testView(TS.cls);
    window.scrollTo(0,0);
  }
});
app.addEventListener('change',function(e){
  var el=e.target;
  if(el&&el.id==='tch'){TS.ch=el.value;resample();testView(TS.cls);return}
  if(el&&el.name&&/^q\d+$/.test(el.name)&&!TS.done){
    TS.ans[+el.name.slice(1)]=+el.value;
    var cn=document.getElementById('cnt');
    if(cn){cn.textContent=answeredCount()+' / '+listIdx().length+' '+t(U.answered)}
  }
});
var tx=0,ty=0,tok=false;
app.addEventListener('touchstart',function(e){
  var p0=e.touches[0];tx=p0.clientX;ty=p0.clientY;
  tok=!e.target.closest('.fx,.eq,.mx,.dt,.d3');
},{passive:true});
app.addEventListener('touchend',function(e){
  if(!tok||!cur.book)return;
  var p1=e.changedTouches[0],dx=p1.clientX-tx,dy=p1.clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dy)<45){go(dx<0?cur.next:cur.prev)}
});
document.addEventListener('keydown',function(e){
  if(!cur.book)return;
  var tg=e.target&&e.target.tagName;
  if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(e.key==='ArrowRight'){go(cur.next)}
  if(e.key==='ArrowLeft'){go(cur.prev)}
});
window.addEventListener('hashchange',function(){route(true,true);syncSeg()});

syncSeg();
route(false,false);

})();
</script>
