CH=CH.concat([{
id:'chemistry-organic-basics', subject:'chemistry', cls:11, ord:8,
title:B('Organic Chemistry: Basic Principles','कार्बनिक रसायन: आधारभूत सिद्धांत'),
blurb:B('Why carbon is special, IUPAC naming, isomerism, and the electronic effects and reaction types used throughout organic chemistry.','कार्बन क्यों खास है, IUPAC नामकरण, समावयवता, तथा संपूर्ण कार्बनिक रसायन में प्रयुक्त इलेक्ट्रॉनिक प्रभाव और अभिक्रिया प्रकार।'),
sections:[
 {h:B('Why carbon? Hybridisation and bonding','कार्बन ही क्यों? संकरण और आबंधन'),
  body:B(
   '<p class="def"><b>In simple words:</b> carbon can form <b>four strong bonds</b> and link to itself endlessly (<b>catenation</b>), which is why it builds millions of different compounds. The shape around each carbon depends on its hybridisation.</p><ul><li><b>sp³:</b> 4 σ bonds, tetrahedral, bond angle 109.5° (e.g. CH₄, all single bonds).</li><li><b>sp²:</b> 3 σ bonds + 1 unhybridised p orbital forming a π bond, trigonal planar, 120° (e.g. C=C in alkenes).</li><li><b>sp:</b> 2 σ bonds + 2 unhybridised p orbitals forming 2 π bonds, linear, 180° (e.g. C≡C in alkynes).</li></ul><p class="eq">σ bond: head-on overlap, free rotation        π bond: sideways overlap, no free rotation</p><ul><li>A double bond = 1σ + 1π; a triple bond = 1σ + 2π. π bonds are weaker and more reactive than σ bonds.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> कार्बन <b>चार मज़बूत बंध</b> बना सकता है और खुद से अनगिनत तरीकों से जुड़ सकता है (<b>शृंखलन</b>), इसीलिए यह लाखों अलग-अलग यौगिक बनाता है। हर कार्बन के चारों ओर आकृति उसके संकरण पर निर्भर करती है।</p><ul><li><b>sp³:</b> 4 σ बंध, चतुष्फलकीय, बंध कोण 109.5° (जैसे CH₄, सभी एकल बंध)।</li><li><b>sp²:</b> 3 σ बंध + 1 असंकरित p कक्षक जो π बंध बनाता है, त्रिकोणीय समतलीय, 120° (जैसे एल्कीनों में C=C)।</li><li><b>sp:</b> 2 σ बंध + 2 असंकरित p कक्षक जो 2 π बंध बनाते हैं, रैखिक, 180° (जैसे एल्काइनों में C≡C)।</li></ul><p class="eq">σ बंध: आमने-सामने अतिव्यापन, मुक्त घूर्णन        π बंध: बग़ल में अतिव्यापन, मुक्त घूर्णन नहीं</p><ul><li>द्विबंध = 1σ + 1π; त्रिबंध = 1σ + 2π। π बंध, σ बंध से कमज़ोर और अधिक अभिक्रियाशील होते हैं।</li></ul>'),
  d3:'hybrid3d',
  cap:B('Slide between sp³, sp² and sp. Notice the bond angle widening and the number of bonds around carbon changing.','sp³, sp² और sp के बीच स्लाइड करो। बंध कोण का बदलना और कार्बन के चारों ओर बंधों की संख्या देखो।')},
 {h:B('Naming organic compounds (IUPAC)','कार्बनिक यौगिकों का नामकरण (IUPAC)'),
  body:B(
   '<p class="def"><b>In simple words:</b> IUPAC naming is just a set rule: find the longest carbon chain, number it to give the lowest locants, name the parts, and put them together.</p><ol><li>Find the <b>longest continuous chain</b> containing the principal functional group — this gives the parent name (meth-, eth-, prop-, but-, pent- for 1 to 5 carbons, etc.).</li><li>Number the chain from whichever end gives the <b>lowest locants</b> to the principal characteristic group, then to multiple bonds, then to substituents.</li><li>Name substituents as prefixes in alphabetical order with their locants (e.g. 2-methyl, 3-chloro).</li><li>Use suffixes for the principal group: -ol (alcohol), -al (aldehyde), -one (ketone), -oic acid (carboxylic acid), -ene (double bond), -yne (triple bond).</li></ol><p class="eq">e.g. CH₃–CH(CH₃)–CH₂–OH = 2-methylpropan-1-ol</p>',
   '<p class="def"><b>सरल शब्दों में:</b> IUPAC नामकरण बस एक निश्चित नियम है: सबसे लंबी कार्बन श्रृंखला ढूँढो, उसे इस तरह क्रमांकित करो कि सबसे कम स्थान-अंक मिलें, भागों के नाम रखो, और सबको जोड़ दो।</p><ol><li>प्रमुख क्रियात्मक समूह वाली <b>सबसे लंबी सतत श्रृंखला</b> ढूँढो — यह मूल नाम देती है (1 से 5 कार्बन के लिए मेथ-, एथ-, प्रोप-, ब्यूट-, पेंट- आदि)।</li><li>श्रृंखला को उस सिरे से क्रमांकित करो जो प्रमुख लाक्षणिक समूह को <b>सबसे कम स्थान-अंक</b> दे, फिर बहुबंधों को, फिर प्रतिस्थापियों को।</li><li>प्रतिस्थापियों को वर्णानुक्रम में उनके स्थान-अंकों के साथ उपसर्ग के रूप में लिखो (जैसे 2-मेथिल, 3-क्लोरो)।</li><li>प्रमुख समूह के लिए प्रत्यय उपयोग करो: -ऑल (एल्कोहॉल), -ऐल (एल्डिहाइड), -ओन (कीटोन), -ओइक अम्ल (कार्बोक्सिलिक अम्ल), -ईन (द्विबंध), -आइन (त्रिबंध)।</li></ol><p class="eq">जैसे CH₃–CH(CH₃)–CH₂–OH = 2-मेथिलप्रोपेन-1-ऑल</p>')},
 {h:B('Isomerism','समावयवता'),
  body:B(
   '<p class="def"><b>In simple words:</b> <b>isomers</b> are different compounds with the <b>same molecular formula</b> but a different arrangement of atoms — same bricks, different buildings.</p><ul><li><b>Structural isomerism</b> (different connectivity):<ul><li><b>Chain:</b> different carbon skeleton (butane vs isobutane).</li><li><b>Position:</b> same skeleton, substituent at a different position (1-chloropropane vs 2-chloropropane).</li><li><b>Functional group:</b> different functional groups altogether (ethanol vs dimethyl ether, both C₂H₆O).</li><li><b>Metamerism:</b> different alkyl groups on either side of the same functional group (diethyl ether vs methyl propyl ether).</li></ul></li><li><b>Stereoisomerism</b> (same connectivity, different 3D arrangement): geometrical (cis–trans) and optical isomerism — covered in detail in Class 12.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>समावयव</b> वे यौगिक हैं जिनका <b>आण्विक सूत्र समान</b> है पर परमाणुओं की व्यवस्था अलग है — एक जैसी ईंटें, अलग इमारतें।</p><ul><li><b>संरचनात्मक समावयवता</b> (अलग संयोजकता):<ul><li><b>श्रृंखला:</b> अलग कार्बन कंकाल (ब्यूटेन बनाम आइसोब्यूटेन)।</li><li><b>स्थिति:</b> समान कंकाल, प्रतिस्थापी अलग स्थान पर (1-क्लोरोप्रोपेन बनाम 2-क्लोरोप्रोपेन)।</li><li><b>क्रियात्मक समूह:</b> पूरी तरह अलग क्रियात्मक समूह (एथेनॉल बनाम डाइमेथिल ईथर, दोनों C₂H₆O)।</li><li><b>मध्यावयवता:</b> एक ही क्रियात्मक समूह के दोनों ओर अलग एल्किल समूह (डाइएथिल ईथर बनाम मेथिल प्रोपिल ईथर)।</li></ul></li><li><b>त्रिविम समावयवता</b> (समान संयोजकता, अलग त्रिविम व्यवस्था): ज्यामितीय (सिस-ट्रांस) और प्रकाशिक समावयवता — कक्षा 12 में विस्तार से।</li></ul>')},
 {h:B('Electronic effects and reaction types','इलेक्ट्रॉनिक प्रभाव और अभिक्रिया प्रकार'),
  body:B(
   '<p class="def"><b>In simple words:</b> atoms and groups can push or pull electron density through bonds, and this changes how reactive a molecule is and where a reaction happens.</p><ul><li><b>Inductive effect (I):</b> electron pull/push through σ bonds, dies out after 2–3 bonds. −I groups (−NO₂, −F, −Cl, −COOH) pull electrons; +I groups (alkyl, −O⁻) push electrons.</li><li><b>Resonance (mesomeric, R):</b> electron delocalisation through π bonds/lone pairs across a conjugated system; stronger and longer-range than I.</li><li><b>Hyperconjugation:</b> overlap of a C–H σ bond with an adjacent empty or π orbital; stabilises carbocations and alkenes (more alkyl groups = more stable).</li><li><b>Electromeric effect (E):</b> temporary, complete electron shift in a multiple bond in the presence of an attacking reagent.</li></ul><p>Main reaction types: <b>substitution</b> (one group replaces another), <b>addition</b> (atoms add across a multiple bond), <b>elimination</b> (atoms removed to form a multiple bond), <b>rearrangement</b> (atoms within the molecule reorganise).</p>',
   '<p class="def"><b>सरल शब्दों में:</b> परमाणु और समूह बंधों के ज़रिए इलेक्ट्रॉन घनत्व को धकेल या खींच सकते हैं, और यह तय करता है कि अणु कितना अभिक्रियाशील है और अभिक्रिया कहाँ होती है।</p><ul><li><b>प्रेरणिक प्रभाव (I):</b> σ बंधों से इलेक्ट्रॉन खिंचाव/धकेलाव, 2–3 बंधों के बाद खत्म हो जाता है। −I समूह (−NO₂, −F, −Cl, −COOH) इलेक्ट्रॉन खींचते हैं; +I समूह (एल्किल, −O⁻) इलेक्ट्रॉन धकेलते हैं।</li><li><b>अनुनाद (मेसोमेरिक, R):</b> संयुग्मित तंत्र में π बंधों/एकाकी युग्मों के ज़रिए इलेक्ट्रॉन का विस्थानीकरण; I से अधिक मज़बूत और दूर तक असर करता है।</li><li><b>अतिसंयुग्मन:</b> C–H σ बंध का पड़ोसी खाली या π कक्षक से अतिव्यापन; कार्बधनायनों और एल्कीनों को स्थायित्व देता है (ज़्यादा एल्किल समूह = ज़्यादा स्थायित्व)।</li><li><b>इलेक्ट्रोमेरिक प्रभाव (E):</b> आक्रामक अभिकर्मक की उपस्थिति में बहुबंध में अस्थायी, पूर्ण इलेक्ट्रॉन विस्थापन।</li></ul><p>मुख्य अभिक्रिया प्रकार: <b>प्रतिस्थापन</b> (एक समूह दूसरे की जगह लेता है), <b>योगात्मक</b> (परमाणु बहुबंध में जुड़ते हैं), <b>विलोपन</b> (परमाणु हटकर बहुबंध बनता है), <b>पुनर्विन्यास</b> (अणु के भीतर परमाणु पुनः व्यवस्थित होते हैं)।</p>')
 }
],

  a:B('<p>A carbocation is stabilised when an adjacent C–H σ bond overlaps with the empty p orbital on the positive carbon, spreading out (delocalising) the positive charge.</p><p>A 3° carbocation has more adjacent C–H bonds (more α-hydrogens available through attached alkyl groups) than a 2°, which has more than a 1°, which has more than methyl (which has none).</p><p>More hyperconjugative structures possible → more charge delocalisation → <b>more stability</b>, giving 3° > 2° > 1° > methyl.</p>','<p>कार्बधनायन तब स्थिर होता है जब पड़ोसी C–H σ बंध धनात्मक कार्बन के खाली p कक्षक से अतिव्यापन करता है, जिससे धनात्मक आवेश फैल (विस्थानीकृत) जाता है।</p><p>3° कार्बधनायन में जुड़े एल्किल समूहों से उपलब्ध पड़ोसी C–H बंध (α-हाइड्रोजन) 2° से ज़्यादा होते हैं, 2° में 1° से ज़्यादा, और 1° में मेथिल (जिसमें कोई नहीं) से ज़्यादा।</p><p>ज़्यादा अतिसंयुग्मी संरचनाएँ → ज़्यादा आवेश विस्थानीकरण → <b>ज़्यादा स्थिरता</b>, इसलिए 3° > 2° > 1° > मेथिल।</p>')}

rev:{

D3.spring3d={
  en:'Spring–block SHM: position, x–t graph, period from m and k',hi:'स्प्रिंग–गुटका SHM: स्थिति, x–t ग्राफ, m और k से आवर्तकाल',h:0.9,scale:0.8,center:[0,0.3,0],spin:false,view:{yaw:-0.5,pitch:0.25,zoom:1},
  params:[
    {k:'m',en:'Mass m (kg)',hi:'द्रव्यमान m (kg)',min:1,max:4,val:2,step:1,unit:''},
    {k:'k',en:'Spring constant k (N/m)',hi:'स्प्रिंग नियतांक k (N/m)',min:50,max:200,val:100,step:50,unit:''},
    {k:'A',en:'Amplitude A (cm)',hi:'आयाम A (cm)',min:2,max:10,val:6,step:2,unit:''}
  ],
  frame:function(S,t,P,l){
    var m=P.m,k=P.k,A=P.A,w=Math.sqrt(k/m),T=2*Math.PI/w,ph=t*1.6,vis=A/10*0.55,x=vis*Math.cos(ph),i,n=24,pts=[],x1=-1.35,x2=x-0.15,a;
    S.floor([[-1.5,-0.16,-0.5],[1.5,-0.16,-0.5],[1.5,-0.16,0.5],[-1.5,-0.16,0.5]],'soft',0.6,'line');
    S.box([-1.4,0.0,0],[0.1,0.5,0.6],'muted');
    for(i=0;i<=n;i++){a=(i===0||i===n)?0:0.075;pts.push([x1+(x2-x1)*i/n,a*Math.cos(i*1.3),a*Math.sin(i*1.3)])}
    S.path(pts,'ink',1.6);
    S.box([x,0,0],[0.3,0.3,0.3],'phys');
    S.line([0,-0.16,0],[0,0.55,0],'muted',1,true);
    S.text([0,-0.3,0],sx(l,'mean position','माध्य स्थिति'),'muted',10);
    /* x-t graph */
    var gx=-0.9,gy=0.95,gw=1.8,gh=0.22,p2=[],q;
    S.line([gx,gy,0],[gx+gw,gy,0],'muted',1);
    S.line([gx,gy-gh-0.04,0],[gx,gy+gh+0.04,0],'muted',1);
    for(q=0;q<=60;q++){p2.push([gx+gw*q/60,gy+gh*Math.cos(q/60*4*Math.PI),0])}
    S.path(p2,'accent',1.8);
    var u=((ph/(2*Math.PI))%2)/2;
    S.sphere([gx+gw*u,gy+gh*Math.cos(u*4*Math.PI),0],0.035,'hi',true);
    S.text([gx+gw+0.05,gy,0],'t','muted',11,'left');
    S.text([gx-0.05,gy+gh,0],'x','muted',11,'right');
    var Am=A/100;
    S.hud(0.04,0.07,'T = 2π√(m/k) = '+T.toFixed(2)+' s    f = '+(1/T).toFixed(2)+' Hz','accent',12,'left',true);
    S.hud(0.04,0.16,'v_max = Aω = '+(Am*w).toFixed(2)+' m/s    a_max = Aω² = '+(Am*w*w).toFixed(1)+' m/s²','ink',12,'left',true);
    S.hud(0.04,0.25,sx(l,'Shown slowed down. Heavier mass or softer spring = slower.','धीमा करके दिखाया गया। भारी द्रव्यमान या नरम स्प्रिंग = धीमा दोलन।'),'muted',10,'left');
  }
};

D3.reson3d={
  en:'Resonance: amplitude vs driving frequency for three damping levels',hi:'अनुनाद: तीन अवमंदन स्तरों के लिए आयाम बनाम चालक आवृत्ति',h:0.9,scale:0.62,center:[0,0.0,0],spin:true,view:{yaw:-0.6,pitch:0.3,zoom:1},
  params:[{k:'r',en:'Driving frequency ratio ω/ω₀ (×0.1)',hi:'चालक आवृत्ति अनुपात ω/ω₀ (×0.1)',min:2,max:20,val:10,step:1,unit:''}],
  frame:function(S,t,P,l){
    var r=P.r/10,zs=[0.1,0.25,0.5],zz=[-0.35,0,0.35],cols=['bad','accent','good'],j,q;
    function Amp(rr,z){return 1/Math.sqrt(Math.pow(1-rr*rr,2)+Math.pow(2*z*rr,2))}
    function G(rr,A,zo){return [-1+rr*0.95,-0.5+Math.min(A,5.5)/5.5*1.4,zo]}
    S.line([-1,-0.5,0],[1,-0.5,0],'muted',1.2);S.line([-1,-0.5,0],[-1,1.0,0],'muted',1.2);
    S.text([1.05,-0.5,0],'ω/ω₀','muted',11,'left');S.text([-1,1.1,0],'A','muted',11);
    S.line([-1+0.95,-0.5,0],[-1+0.95,-0.4,0],'muted',1.2);S.text([-0.05,-0.62,0],'1','muted',10);
    for(j=0;j<3;j++){
      var pts=[];for(q=1;q<=40;q++){var rr=q/20;pts.push(G(rr,Amp(rr,zs[j]),zz[j]))}
      S.path(pts,cols[j],j===1?2.2:1.6);
      S.sphere(G(r,Amp(r,zs[j]),zz[j]),0.04,cols[j],true);
      S.line(G(r,0,zz[j]),G(r,Amp(r,zs[j]),zz[j]),cols[j],1,true);
    }

    S.hud(0.04,0.16,sx(l,'Curves for damping ζ = 0.1 (red), 0.25, 0.5 (green)','अवमंदन ζ = 0.1 (लाल), 0.25, 0.5 (हरा)'),'ink',11,'left');

CH=CH.concat([{
id:'physics-oscillations', subject:'physics', cls:11, ord:14,
title:B('Oscillations','दोलन'),
blurb:B('Simple harmonic motion, spring and pendulum, energy in SHM, damping and resonance.','सरल आवर्त गति, स्प्रिंग और लोलक, SHM में ऊर्जा, अवमंदन और अनुनाद।'),
sections:[
 {h:B('Simple harmonic motion (SHM)','सरल आवर्त गति (SHM)'),
  body:B(
   '<p class="def"><b>In simple words:</b> in SHM an object moves back and forth about a middle point, and the pull towards the middle grows in proportion to how far it is from the middle. Far away = strong pull back; at the middle = no pull.</p><p class="eq">F = −kx        a = −ω²x</p><ul><li>x is the displacement from the mean position. The minus sign says the force always points towards the mean position.</li><li><b>Amplitude A</b> = maximum displacement. <b>Period T</b> = time for one full oscillation. <b>Frequency f</b> = 1/T.</li></ul><p class="eq">x = A sin(ωt + φ)        ω = 2π/T = 2πf</p><ul><li>Velocity at displacement x: <b>v = ω√(A² − x²)</b>. It is maximum (Aω) at the mean position and zero at the extremes.</li><li>Acceleration is maximum (Aω²) at the extremes and zero at the mean position.</li></ul><p>φ is the <b>phase constant</b>; it tells where the motion starts. Velocity leads displacement by 90°.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> SHM में वस्तु बीच के एक बिंदु के दोनों ओर आगे-पीछे चलती है, और बीच की ओर खिंचाव उतना ही बढ़ता है जितनी वह बीच से दूर हो। दूर = ज़ोर से वापस खिंचाव; बीच में = कोई खिंचाव नहीं।</p><p class="eq">F = −kx        a = −ω²x</p><ul><li>x माध्य स्थिति से विस्थापन है। ऋण चिह्न बताता है कि बल हमेशा माध्य स्थिति की ओर होता है।</li><li><b>आयाम A</b> = अधिकतम विस्थापन। <b>आवर्तकाल T</b> = एक पूरे दोलन का समय। <b>आवृत्ति f</b> = 1/T।</li></ul><p class="eq">x = A sin(ωt + φ)        ω = 2π/T = 2πf</p><ul><li>विस्थापन x पर वेग: <b>v = ω√(A² − x²)</b>। यह माध्य स्थिति पर अधिकतम (Aω) और चरम बिंदुओं पर शून्य होता है।</li><li>त्वरण चरम बिंदुओं पर अधिकतम (Aω²) और माध्य स्थिति पर शून्य होता है।</li></ul><p>φ <b>कला-नियतांक</b> है; यह बताता है कि गति कहाँ से शुरू हुई। वेग विस्थापन से 90° आगे रहता है।</p>'),
  d3:'spring3d',
  cap:B('A block on a spring slides to and fro. The graph above shows x against t; the glowing dot is the block’s present position. Change m, k and A.','स्प्रिंग पर गुटका आगे-पीछे चलता है। ऊपर का ग्राफ x बनाम t दिखाता है; चमकता बिंदु गुटके की वर्तमान स्थिति है। m, k और A बदलकर देखो।')},
 {h:B('Spring and pendulum','स्प्रिंग और लोलक'),
  body:B(
   '<p class="def"><b>In simple words:</b> a stiffer spring or lighter block oscillates faster; a longer pendulum swings slower. Both give SHM (the pendulum only for small angles, below about 10°–15°).</p><p class="eq">Spring–mass: T = 2π√(m/k)        Pendulum: T = 2π√(L/g)</p><ul><li><b>Springs in parallel:</b> k = k₁ + k₂ (stiffer).</li><li><b>Springs in series:</b> 1/k = 1/k₁ + 1/k₂ (softer). Cutting a spring into n equal parts makes each part n times stiffer.</li><li>A vertical spring has the same T = 2π√(m/k); gravity only shifts the mean position.</li><li>The pendulum’s T does not depend on the mass of the bob. A <b>seconds pendulum</b> has T = 2 s, so L ≈ 1 m on Earth.</li><li>On a different planet T ∝ 1/√g. In a lift accelerating upward with a, g becomes g + a.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> कड़ा स्प्रिंग या हल्का गुटका तेज़ दोलन करता है; लंबा लोलक धीमा झूलता है। दोनों SHM देते हैं (लोलक केवल छोटे कोणों, लगभग 10°–15° से कम, के लिए)।</p><p class="eq">स्प्रिंग–द्रव्यमान: T = 2π√(m/k)        लोलक: T = 2π√(L/g)</p><ul><li><b>समानांतर स्प्रिंग:</b> k = k₁ + k₂ (अधिक कड़ा)।</li><li><b>श्रेणी स्प्रिंग:</b> 1/k = 1/k₁ + 1/k₂ (अधिक नरम)। स्प्रिंग को n बराबर भागों में काटने पर हर भाग n गुना कड़ा हो जाता है।</li><li>ऊर्ध्वाधर स्प्रिंग में भी T = 2π√(m/k) ही रहता है; गुरुत्व केवल माध्य स्थिति खिसकाता है।</li><li>लोलक का T गोलक के द्रव्यमान पर निर्भर नहीं करता। <b>सेकंड लोलक</b> का T = 2 s होता है, इसलिए पृथ्वी पर L ≈ 1 m।</li><li>दूसरे ग्रह पर T ∝ 1/√g। a त्वरण से ऊपर जाती लिफ्ट में g की जगह g + a हो जाता है।</li></ul>'),
  d3:'pend3d',
  cap:B('The bob swings along a small arc. Try L = 0.5, 1 and 2 m and see how T changes; the mass never matters.','गोलक छोटे चाप पर झूलता है। L = 0.5, 1 और 2 m लेकर देखो कि T कैसे बदलता है; द्रव्यमान कभी मायने नहीं रखता।')},
 {h:B('Energy in SHM','SHM में ऊर्जा'),
  body:B(
   '<p class="def"><b>In simple words:</b> energy keeps changing between motion energy (KE) and stored spring energy (PE), but the total stays the same (no friction). At the middle it is all KE; at the ends it is all PE.</p><p class="eq">KE = ½k(A² − x²)        PE = ½kx²        E = ½kA²</p><ul><li>E depends on A²: double the amplitude and the energy becomes 4 times.</li><li>KE = PE when x = ±A/√2.</li><li>KE and PE each oscillate at <b>twice</b> the frequency of the motion. Their average over a cycle is E/2 each.</li><li>The <b>phase</b> of the SHM at time t is ωt + φ.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> ऊर्जा गति-ऊर्जा (KE) और स्प्रिंग में जमा ऊर्जा (PE) के बीच बदलती रहती है, पर कुल ऊर्जा वही रहती है (घर्षण नहीं हो तो)। बीच में सब KE होती है; सिरों पर सब PE।</p><p class="eq">KE = ½k(A² − x²)        PE = ½kx²        E = ½kA²</p><ul><li>E, A² पर निर्भर है: आयाम दोगुना करो तो ऊर्जा 4 गुना हो जाती है।</li><li>KE = PE तब होती है जब x = ±A/√2।</li><li>KE और PE दोनों गति की आवृत्ति से <b>दोगुनी</b> आवृत्ति पर दोलन करती हैं। एक चक्र में दोनों का औसत E/2 होता है।</li><li>समय t पर SHM की <b>कला</b> ωt + φ होती है।</li></ul>')},
 {h:B('Damped, forced oscillations and resonance','अवमंदित, प्रणोदित दोलन और अनुनाद'),
  body:B(
   '<p class="def"><b>In simple words:</b> real oscillations die out because of friction or air drag (<b>damping</b>). If you keep pushing it at a steady rhythm, it is a <b>forced oscillation</b>. If your rhythm matches the object’s own natural rhythm, the swings grow huge: <b>resonance</b>.</p><ul><li><b>Free (natural) oscillation:</b> no outside push; frequency ω₀ = √(k/m).</li><li><b>Damped:</b> amplitude falls as A = A₀e<sup>−bt/2m</sup>. Frequency is slightly lower.</li><li><b>Forced:</b> the system finally oscillates at the <b>driving</b> frequency, not its own.</li></ul><p class="eq">Resonance: ω<sub>driving</sub> ≈ ω₀  →  amplitude is maximum</p><ul><li>Less damping gives a taller, sharper resonance peak.</li><li>Examples: pushing a swing at the right moment, a radio tuned to a station, soldiers breaking step on a bridge.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> असली दोलन घर्षण या हवा के प्रतिरोध (<b>अवमंदन</b>) से धीरे-धीरे रुक जाते हैं। अगर तुम एक तय लय में लगातार धक्का देते रहो तो यह <b>प्रणोदित दोलन</b> है। अगर तुम्हारी लय वस्तु की अपनी प्राकृतिक लय से मिल जाए तो झूले बहुत बड़े हो जाते हैं: <b>अनुनाद</b>।</p><ul><li><b>मुक्त (प्राकृतिक) दोलन:</b> बाहरी धक्का नहीं; आवृत्ति ω₀ = √(k/m)।</li><li><b>अवमंदित:</b> आयाम A = A₀e<sup>−bt/2m</sup> के अनुसार घटता है। आवृत्ति थोड़ी कम हो जाती है।</li><li><b>प्रणोदित:</b> तंत्र अंत में <b>चालक</b> आवृत्ति पर दोलन करता है, अपनी आवृत्ति पर नहीं।</li></ul><p class="eq">अनुनाद: ω<sub>चालक</sub> ≈ ω₀  →  आयाम अधिकतम</p><ul><li>कम अवमंदन से शिखर ऊँचा और तीखा होता है।</li><li>उदाहरण: झूले को सही समय पर धक्का देना, रेडियो का स्टेशन पर ट्यून होना, पुल पर सैनिकों का कदम-ताल तोड़ना।</li></ul>'),
  d3:'reson3d',
  cap:B('Three curves for three damping levels. Slide the ratio to 1 and see all amplitudes peak; the least damped one is the tallest.','तीन अवमंदन स्तरों के लिए तीन वक्र। अनुपात को 1 पर लाओ और देखो कि सभी आयाम शिखर पर पहुँचते हैं; सबसे कम अवमंदित वाला सबसे ऊँचा है।')}
],

D3.period3d={
  en:'Atomic size across a period and down a group',hi:'एक आवर्त में और एक वर्ग में परमाणु आकार',h:0.9,scale:0.8,center:[0,0,0],spin:false,view:{yaw:0,pitch:0.15,zoom:1},
  params:[{k:'m',en:'View: 1 = across period 3, 2 = down group 1',hi:'दृश्य: 1 = आवर्त 3 में, 2 = वर्ग 1 में',min:1,max:2,val:1,step:1,unit:''}],
  frame:function(S,t,P,l){
    var m=P.m,i;
    var per=[['Na',186],['Mg',160],['Al',143],['Si',117],['P',110],['S',104],['Cl',99]];
    var grp=[['Li',152],['Na',186],['K',227],['Rb',248]];
    var data=m===1?per:grp,n=data.length;
    for(i=0;i<n;i++){
      var r=data[i][1]/650,pos;
      if(m===1)pos=[-1.1+2.2*i/(n-1),r-0.5,0];
      else pos=[0,0.6-1.2*i/(n-1),0];
      S.sphere(pos,r,i%2===0?'chem':'accent',true);
      S.text([pos[0],pos[1]-r-0.1,0],data[i][0],'ink',11,'center',true);
    }
    if(m===1){
      S.arrow([-1.2,0.75,0],[1.2,0.75,0],'bad',2);
      S.hud(0.04,0.07,sx(l,'Across period 3 (Na → Cl): radius decreases','आवर्त 3 में (Na → Cl): त्रिज्या घटती है'),'accent',12,'left',true);
      S.hud(0.04,0.16,sx(l,'Nuclear charge increases, same shell pulls in tighter','नाभिकीय आवेश बढ़ता है, वही कोश ज़्यादा कसकर खिंचता है'),'ink',11,'left');
    }else{
      S.arrow([0,0.75,0],[0,-0.75,0],'good',2);
      S.hud(0.04,0.07,sx(l,'Down group 1 (Li → Rb): radius increases','वर्ग 1 में (Li → Rb): त्रिज्या बढ़ती है'),'accent',12,'left',true);
      S.hud(0.04,0.16,sx(l,'A new shell is added each time you go down','हर बार नीचे जाने पर एक नया कोश जुड़ता है'),'ink',11,'left');
    }
    S.hud(0.04,0.25,sx(l,'Sphere size ∝ actual atomic radius (picometres)','गोले का आकार ∝ वास्तविक परमाणु त्रिज्या (पिकोमीटर)'),'muted',10,'left');
  }
};

CH=CH.concat([{
id:'chemistry-periodicity', subject:'chemistry', cls:11, ord:3,
title:B('Classification of Elements and Periodicity','तत्वों का वर्गीकरण और आवर्तिता'),
blurb:B('The modern periodic table, periodic trends in size, ionization enthalpy, electron gain enthalpy and electronegativity.','आधुनिक आवर्त सारणी, आकार, आयनन एन्थैल्पी, इलेक्ट्रॉन लब्धि एन्थैल्पी और वैद्युतऋणात्मकता में आवर्ती प्रवृत्तियाँ।'),
sections:[
 {h:B('The modern periodic table','आधुनिक आवर्त सारणी'),
  body:B(
   '<p class="def"><b>In simple words:</b> elements are arranged in a grid so that elements with similar chemical behaviour line up in the same column. Each row is called a <b>period</b>, each column a <b>group</b>.</p><ul><li><b>Mendeleev’s law (1869):</b> properties of elements are a periodic function of their <b>atomic mass</b>. He left gaps for undiscovered elements and predicted their properties correctly.</li><li><b>Modern periodic law (Moseley, 1913):</b> properties are a periodic function of <b>atomic number</b>, not mass. This fixed a few anomalies (like Ar before K, even though Ar’s mass is slightly higher).</li></ul><p class="eq">Moseley’s law: √ν = a(Z − b)</p><ul><li>There are <b>18 groups</b> and <b>7 periods</b>. Period number = number of shells (n) of the outermost electron.</li><li><b>s-block</b> (groups 1–2), <b>p-block</b> (13–18), <b>d-block</b> (3–12, transition metals), <b>f-block</b> (lanthanoids, actinoids).</li><li>Elements in the same group have the <b>same number of valence electrons</b>, which is why they behave alike.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> तत्वों को एक ग्रिड में इस तरह रखा गया है कि समान रासायनिक व्यवहार वाले तत्व एक ही स्तंभ में आएँ। हर पंक्ति को <b>आवर्त</b> और हर स्तंभ को <b>वर्ग</b> कहते हैं।</p><ul><li><b>मेंडेलीफ का नियम (1869):</b> तत्वों के गुण उनके <b>परमाणु द्रव्यमान</b> के आवर्ती फलन हैं। उन्होंने अज्ञात तत्वों के लिए जगह छोड़ी और उनके गुणों का सही अनुमान लगाया।</li><li><b>आधुनिक आवर्त नियम (मोज़ले, 1913):</b> गुण <b>परमाणु क्रमांक</b> के आवर्ती फलन हैं, द्रव्यमान के नहीं। इससे कुछ विसंगतियाँ दूर हुईं (जैसे Ar का K से पहले आना, भले ही Ar का द्रव्यमान थोड़ा अधिक है)।</li></ul><p class="eq">मोज़ले का नियम: √ν = a(Z − b)</p><ul><li><b>18 वर्ग</b> और <b>7 आवर्त</b> हैं। आवर्त संख्या = बाह्यतम इलेक्ट्रॉन के कोशों (n) की संख्या।</li><li><b>s-ब्लॉक</b> (वर्ग 1–2), <b>p-ब्लॉक</b> (13–18), <b>d-ब्लॉक</b> (3–12, संक्रमण धातुएँ), <b>f-ब्लॉक</b> (लैंथेनॉइड, एक्टिनॉइड)।</li><li>एक ही वर्ग के तत्वों में <b>संयोजकता इलेक्ट्रॉन समान</b> होते हैं, इसीलिए वे एक जैसा व्यवहार करते हैं।</li></ul>')},
 {h:B('Atomic and ionic radius','परमाणु और आयनिक त्रिज्या'),
  body:B(
   '<p class="def"><b>In simple words:</b> atomic radius is roughly how big an atom is. It shrinks as you move right across a period (the nucleus pulls harder) and grows as you move down a group (a new shell is added).</p><p class="eq">Z<sub>eff</sub> = Z − σ  (effective nuclear charge)</p><ul><li><b>Across a period (left→right):</b> nuclear charge Z increases but electrons go into the <b>same shell</b>, so Z<sub>eff</sub> increases and radius <b>decreases</b>.</li><li><b>Down a group (top→bottom):</b> a new outer shell is added each time, so radius <b>increases</b>, despite Z also increasing.</li><li><b>Cation</b> (lost electron(s)) is <b>smaller</b> than its parent atom; <b>anion</b> (gained electron(s)) is <b>larger</b>.</li><li>Isoelectronic species (same electron count, e.g. O²⁻, F⁻, Na⁺, Mg²⁺): radius decreases as nuclear charge increases.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> परमाणु त्रिज्या लगभग बताती है कि परमाणु कितना बड़ा है। आवर्त में दाईं ओर जाने पर यह घटती है (नाभिक ज़्यादा ज़ोर से खींचता है) और वर्ग में नीचे जाने पर बढ़ती है (एक नया कोश जुड़ता है)।</p><p class="eq">Z<sub>eff</sub> = Z − σ  (प्रभावी नाभिकीय आवेश)</p><ul><li><b>आवर्त में (बाएँ→दाएँ):</b> नाभिकीय आवेश Z बढ़ता है पर इलेक्ट्रॉन <b>उसी कोश</b> में जाते हैं, इसलिए Z<sub>eff</sub> बढ़ता है और त्रिज्या <b>घटती</b> है।</li><li><b>वर्ग में (ऊपर→नीचे):</b> हर बार एक नया बाहरी कोश जुड़ता है, इसलिए त्रिज्या <b>बढ़ती</b> है, भले ही Z भी बढ़े।</li><li><b>धनायन</b> (इलेक्ट्रॉन खोया) अपने मूल परमाणु से <b>छोटा</b> होता है; <b>ऋणायन</b> (इलेक्ट्रॉन पाया) <b>बड़ा</b> होता है।</li><li>समइलेक्ट्रॉनिक स्पीशीज़ (समान इलेक्ट्रॉन संख्या, जैसे O²⁻, F⁻, Na⁺, Mg²⁺): नाभिकीय आवेश बढ़ने के साथ त्रिज्या घटती है।</li></ul>'),
  d3:'period3d',
  cap:B('Switch between the period-3 view and the group-1 view and watch the spheres shrink or grow.','आवर्त-3 दृश्य और वर्ग-1 दृश्य के बीच बदलो और देखो गोले कैसे सिकुड़ते या बढ़ते हैं।')},
 {h:B('Ionization enthalpy and electron gain enthalpy','आयनन एन्थैल्पी और इलेक्ट्रॉन लब्धि एन्थैल्पी'),
  body:B(
   '<p class="def"><b>In simple words:</b> <b>ionization enthalpy</b> is how hard it is to pull an electron off an atom (always needs energy). <b>Electron gain enthalpy</b> is what happens when an atom grabs an extra electron (usually releases energy).</p><p class="eq">X(g) → X⁺(g) + e⁻        ΔH = IE₁ (always positive)</p><p class="eq">X(g) + e⁻ → X⁻(g)        ΔH = ΔegH (usually negative)</p><ul><li><b>IE</b> generally <b>increases</b> across a period (harder to remove, stronger pull) and <b>decreases</b> down a group (electron is farther, easier to remove).</li><li>Exceptions: IE of Be > B, and N > O, because of extra stability of fully-filled (2s²) and half-filled (2p³) sub-shells.</li><li><b>Successive ionization enthalpies</b> always increase: IE₁ < IE₂ < IE₃… A huge jump shows a stable noble-gas-like configuration was just broken.</li><li>Electron gain enthalpy becomes less negative (or positive) down a group, and noble gases have positive values (they resist gaining electrons).</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>आयनन एन्थैल्पी</b> बताती है कि किसी परमाणु से इलेक्ट्रॉन निकालना कितना मुश्किल है (हमेशा ऊर्जा चाहिए)। <b>इलेक्ट्रॉन लब्धि एन्थैल्पी</b> यह बताती है कि परमाणु एक अतिरिक्त इलेक्ट्रॉन पकड़ने पर क्या होता है (आमतौर पर ऊर्जा निकलती है)।</p><p class="eq">X(g) → X⁺(g) + e⁻        ΔH = IE₁ (हमेशा धनात्मक)</p><p class="eq">X(g) + e⁻ → X⁻(g)        ΔH = ΔegH (आमतौर पर ऋणात्मक)</p><ul><li><b>IE</b> सामान्यतः आवर्त में <b>बढ़ती</b> है (निकालना मुश्किल, ज़्यादा खिंचाव) और वर्ग में <b>घटती</b> है (इलेक्ट्रॉन दूर है, निकालना आसान)।</li><li>अपवाद: Be का IE, B से अधिक; N का O से अधिक — पूर्ण-भरे (2s²) और अर्ध-भरे (2p³) उपकोशों की अतिरिक्त स्थिरता के कारण।</li><li><b>क्रमिक आयनन एन्थैल्पियाँ</b> हमेशा बढ़ती हैं: IE₁ < IE₂ < IE₃… बड़ी छलांग बताती है कि अभी-अभी एक स्थिर उत्कृष्ट-गैस-जैसा विन्यास टूटा है।</li><li>इलेक्ट्रॉन लब्धि एन्थैल्पी वर्ग में नीचे जाने पर कम ऋणात्मक (या धनात्मक) होती जाती है; उत्कृष्ट गैसों के मान धनात्मक होते हैं (वे इलेक्ट्रॉन लेने का विरोध करती हैं)।</li></ul>')},
 {h:B('Electronegativity and periodic trends summary','वैद्युतऋणात्मकता और आवर्ती प्रवृत्तियों का सारांश'),
  body:B(
   '<p class="def"><b>In simple words:</b> <b>electronegativity</b> is how strongly an atom pulls shared (bonding) electrons towards itself in a molecule. Fluorine pulls the hardest of all elements.</p><ul><li>Electronegativity (Pauling scale) generally <b>increases</b> across a period and <b>decreases</b> down a group — same direction as ionization enthalpy.</li><li>Fluorine (F) = 4.0 is the most electronegative element; caesium/francium are among the least.</li><li>A high electronegativity difference between two bonded atoms makes the bond more <b>ionic</b>; a small or zero difference keeps it <b>covalent</b>.</li></ul><p class="eq">Across a period: radius ↓, IE ↑, electronegativity ↑, metallic character ↓</p><p class="eq">Down a group: radius ↑, IE ↓, electronegativity ↓, metallic character ↑</p><ul><li><b>Metallic character</b> (tendency to lose electrons) is the mirror image of IE/electronegativity trends.</li><li><b>Diagonal relationship:</b> some elements resemble the element diagonally below-right more than their own group (e.g. Li resembles Mg, Be resembles Al) because their sizes and charge densities are similar.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>वैद्युतऋणात्मकता</b> बताती है कि कोई परमाणु अणु में साझा (बंधक) इलेक्ट्रॉनों को अपनी ओर कितनी ज़ोर से खींचता है। फ्लोरीन सबसे ज़्यादा खींचता है।</p><ul><li>वैद्युतऋणात्मकता (पॉलिंग स्केल) सामान्यतः आवर्त में <b>बढ़ती</b> है और वर्ग में <b>घटती</b> है — आयनन एन्थैल्पी की ही दिशा में।</li><li>फ्लोरीन (F) = 4.0 सबसे अधिक वैद्युतऋणात्मक तत्व है; सीज़ियम/फ्रांसियम सबसे कम में से हैं।</li><li>दो बंधित परमाणुओं के बीच बड़ा वैद्युतऋणात्मकता अंतर बंध को अधिक <b>आयनिक</b> बनाता है; छोटा या शून्य अंतर उसे <b>सहसंयोजक</b> रखता है।</li></ul><p class="eq">आवर्त में: त्रिज्या ↓, IE ↑, वैद्युतऋणात्मकता ↑, धात्विक गुण ↓</p><p class="eq">वर्ग में: त्रिज्या ↑, IE ↓, वैद्युतऋणात्मकता ↓, धात्विक गुण ↑</p><ul><li><b>धात्विक गुण</b> (इलेक्ट्रॉन खोने की प्रवृत्ति) IE/वैद्युतऋणात्मकता प्रवृत्तियों का उल्टा है।</li><li><b>विकर्ण संबंध:</b> कुछ तत्व अपने ही वर्ग के बजाय तिरछे नीचे-दाएँ वाले तत्व से मिलते-जुलते हैं (जैसे Li, Mg से मिलता है; Be, Al से) क्योंकि उनका आकार और आवेश घनत्व समान होता है।</li></ul>')}
],

D3.combo3d={
  en:'Choosing r objects out of n',hi:'n में से r वस्तुएँ चुनना',h:0.8,scale:0.72,center:[0,0.2,0],spin:true,view:{yaw:-0.45,pitch:0.5,zoom:1},
  params:[{k:'n',en:'Objects n',hi:'वस्तुएँ n',min:3,max:8,val:5,step:1,unit:''},{k:'r',en:'Choose r',hi:'चुनो r',min:1,max:7,val:2,step:1,unit:''}],
  frame:function(S,t,P,l){
    var n=P.n,r=Math.min(P.r,n),i,all=[];
    (function go(s,cur){if(cur.length===r){all.push(cur.slice());return}for(var k=s;k<n;k++){cur.push(k);go(k+1,cur);cur.pop()}})(0,[]);
    var f=function(m){var q=1;for(var k=2;k<=m;k++)q*=k;return q};
    var nC=all.length,nP=f(n)/f(n-r),idx=Math.floor(t*1.6)%nC,sel=all[idx];
    S.floor([[-1.7,-0.4,-1.4],[1.7,-0.4,-1.4],[1.7,-0.4,1.4],[-1.7,-0.4,1.4]],'soft',0.7,'line');
    var w=Math.min(0.55,3/n);
    for(i=0;i<n;i++){
      var x=(i-(n-1)/2)*w,on=sel.indexOf(i)>=0;
      S.shadow([x,0,0],0.12,-0.4);
      S.rod([x,-0.4,0],[x,on?0.35:-0.05,0],0.03,'muted');
      S.sphere([x,on?0.5:0.05,0],0.14,on?'hi':'accent',on);
      S.text([x,-0.55,0.1],String(i+1),on?'hi':'ink',12,'center',true);
    }
    S.hud(0.04,0.07,'n = '+n+',  r = '+r,'accent',13,'left',true);
    S.hud(0.04,0.16,'nCr = '+nC+sx(l,'   (order does not matter)','   (क्रम नहीं देखा जाता)'),'hi',12,'left',true);
    S.hud(0.04,0.25,'nPr = '+nP+sx(l,'   (order matters)','   (क्रम देखा जाता है)'),'ink',12,'left',true);
    S.hud(0.04,0.34,sx(l,'Group ','समूह ')+(idx+1)+' / '+nC,'muted',12,'left');
    S.hud(0.04,0.93,'nPr = nCr × r!  →  '+nP+' = '+nC+' × '+f(r),'good',12,'left',true);
  }
};

CH=CH.concat([{
id:'maths-permutations-combinations', subject:'maths', cls:11, ord:7,
title:B('Permutations and Combinations','क्रमचय और संचय'),
blurb:B('The counting principle, arrangements, selections, circular arrangements and counting with conditions.','गणना का सिद्धांत, विन्यास, चयन, वृत्तीय विन्यास और शर्तों के साथ गिनती।'),
sections:[
 {h:B('The counting principles and factorial','गणना के सिद्धांत और क्रमगुणित'),
  body:B(
   '<p class="def"><b>In simple words:</b> counting ways is the art of not listing them one by one.</p><ul><li><b>Multiplication principle:</b> if one job can be done in m ways and, after that, a second job in n ways, then both jobs can be done in <b>m × n</b> ways. Use it for “and”.</li><li><b>Addition principle:</b> if a job can be done in m ways <i>or</i> in n different ways (never both together), the total is <b>m + n</b>. Use it for “or”.</li></ul><p>Example: a shirt from 4 and a trouser from 3 can be chosen in 4 × 3 = 12 ways. A 2-digit number with digits from {1, 2, 3, 4, 5} that repeat digits can be made in 5 × 5 = 25 ways.</p><p><b>Factorial:</b> n! = n × (n − 1) × … × 2 × 1, with 0! = 1. It is the number of ways to put n different objects in a row.</p><p class="eq">5! = 120,  6! = 720,  n! = n · (n − 1)!</p><p>Keep a problem simple: decide the positions with a restriction <b>first</b>, then fill the free ones.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> तरीकों की गिनती का अर्थ है उन्हें एक-एक करके सूचीबद्ध किए बिना गिनना।</p><ul><li><b>गुणन सिद्धांत:</b> यदि एक काम m तरीकों से हो और उसके बाद दूसरा काम n तरीकों से, तो दोनों काम <b>m × n</b> तरीकों से हो सकते हैं। “और” के लिए इसका प्रयोग करो।</li><li><b>योग सिद्धांत:</b> यदि कोई काम m तरीकों से <i>या</i> n भिन्न तरीकों से हो (दोनों साथ कभी नहीं), तो कुल तरीके <b>m + n</b> हैं। “या” के लिए इसका प्रयोग करो।</li></ul><p>उदाहरण: 4 कमीज़ों में से एक और 3 पतलूनों में से एक 4 × 3 = 12 तरीकों से चुनी जा सकती है। अंक {1, 2, 3, 4, 5} में से, अंक दोहराकर, 2 अंकों की संख्या 5 × 5 = 25 तरीकों से बनती है।</p><p><b>क्रमगुणित:</b> n! = n × (n − 1) × … × 2 × 1, तथा 0! = 1। यह n भिन्न वस्तुओं को एक पंक्ति में रखने के तरीकों की संख्या है।</p><p class="eq">5! = 120,  6! = 720,  n! = n · (n − 1)!</p><p>प्रश्न को सरल रखो: जिन स्थानों पर शर्त हो उन्हें <b>पहले</b> भरो, फिर बाकी स्थान भरो।</p>')},
 {h:B('Permutations: when order matters','क्रमचय: जब क्रम मायने रखता है'),
  body:B(
   '<p class="def"><b>In simple words:</b> a <b>permutation</b> is an arrangement. Putting A before B is different from putting B before A.</p><p class="eq">ⁿPᵣ = n!/(n − r)!  = n(n − 1)(n − 2)…(n − r + 1)</p><p>This is the number of ways to arrange r objects chosen from n different objects. With r = n it is n!.</p><ul><li><b>Repetition allowed:</b> r places, each filled in n ways, gives nʳ.</li><li><b>Alike objects:</b> if p of them are alike of one kind, q of another kind, r of a third, the arrangements of all n are <b>n!/(p! q! r!)</b>. So LEADER (two E) can be arranged in 6!/2! = 360 ways.</li><li><b>Objects always together:</b> glue them into one block, arrange the blocks, then arrange inside the block.</li></ul><p><b>Circular arrangements.</b> Around a round table there is no first seat, so turning everyone by one seat changes nothing. The number is <b>(n − 1)!</b>. If clockwise and anticlockwise are the same (a necklace), divide by 2.</p><p>Use the figure: change n and see how many arrangements a row has compared with a table.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>क्रमचय</b> एक विन्यास (arrangement) है। A को B से पहले रखना, B को A से पहले रखने से भिन्न है।</p><p class="eq">ⁿPᵣ = n!/(n − r)!  = n(n − 1)(n − 2)…(n − r + 1)</p><p>यह n भिन्न वस्तुओं में से चुनी गई r वस्तुओं को सजाने के तरीकों की संख्या है। r = n होने पर यह n! है।</p><ul><li><b>पुनरावृत्ति की छूट:</b> r स्थान, हर एक n तरीकों से भरा जाए तो nʳ।</li><li><b>समान वस्तुएँ:</b> यदि n में से p एक प्रकार की, q दूसरे प्रकार की और r तीसरे प्रकार की समान हों, तो सबको सजाने के तरीके <b>n!/(p! q! r!)</b> हैं। अतः LEADER (दो E) को 6!/2! = 360 तरीकों से सजाया जा सकता है।</li><li><b>वस्तुएँ हमेशा साथ:</b> उन्हें एक खंड में बाँध लो, खंडों को सजाओ, फिर खंड के भीतर सजाओ।</li></ul><p><b>वृत्तीय विन्यास।</b> गोल मेज़ पर कोई पहली कुर्सी नहीं होती, इसलिए सबको एक कुर्सी घुमाने पर कुछ नहीं बदलता। संख्या <b>(n − 1)!</b> है। यदि दक्षिणावर्त और वामावर्त एक ही माने जाएँ (माला), तो 2 से भाग दो।</p><p>चित्र का प्रयोग करो: n बदलकर देखो कि पंक्ति और मेज़ पर विन्यासों की संख्या में कितना अंतर है।</p>'),
  d3:'table3d',
  cap:B('The same people around a round table. Rotating the whole group does not give a new arrangement, so the count is (n − 1)!.','एक ही लोग गोल मेज़ के चारों ओर। पूरे समूह को घुमाने से नया विन्यास नहीं बनता, इसलिए गिनती (n − 1)! है।')},
 {h:B('Combinations: when order does not matter','संचय: जब क्रम मायने नहीं रखता'),
  body:B(
   '<p class="def"><b>In simple words:</b> a <b>combination</b> is a selection. Choosing a team of A, B, C is the same team however you list it.</p><p class="eq">ⁿCᵣ = n!/(r!(n − r)!)</p><p>Since every group of r objects can be arranged in r! ways, <b>ⁿPᵣ = ⁿCᵣ × r!</b>. This is why combinations are fewer than permutations.</p><p><b>Important properties:</b></p><ul><li>ⁿCᵣ = ⁿCₙ₋ᵣ (choosing the ones you take is the same as choosing the ones you leave).</li><li>ⁿC₀ = ⁿCₙ = 1 and ⁿC₁ = n.</li><li>ⁿCᵣ + ⁿCᵣ₋₁ = ⁿ⁺¹Cᵣ (Pascal’s rule).</li><li>If ⁿCₓ = ⁿCᵧ then x = y or x + y = n.</li></ul><p>Example: 8C3 = 8·7·6/(3·2·1) = 56. A committee of 3 chosen from 8 people can be formed in 56 ways.</p><p>In the figure the red spheres are the chosen ones. Watch how each new group appears and compare nCr with nPr.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>संचय</b> एक चयन (selection) है। A, B, C की टीम चुनना, उन्हें किसी भी क्रम में लिखने पर भी वही टीम है।</p><p class="eq">ⁿCᵣ = n!/(r!(n − r)!)</p><p>हर r वस्तुओं के समूह को r! तरीकों से सजाया जा सकता है, इसलिए <b>ⁿPᵣ = ⁿCᵣ × r!</b>। इसीलिए संचय, क्रमचय से कम होते हैं।</p><p><b>महत्वपूर्ण गुण:</b></p><ul><li>ⁿCᵣ = ⁿCₙ₋ᵣ (जिन्हें लेना है उन्हें चुनना, जिन्हें छोड़ना है उन्हें चुनने के बराबर है)।</li><li>ⁿC₀ = ⁿCₙ = 1 और ⁿC₁ = n।</li><li>ⁿCᵣ + ⁿCᵣ₋₁ = ⁿ⁺¹Cᵣ (पास्कल नियम)।</li><li>यदि ⁿCₓ = ⁿCᵧ तो x = y या x + y = n।</li></ul><p>उदाहरण: 8C3 = 8·7·6/(3·2·1) = 56। 8 व्यक्तियों में से 3 की समिति 56 तरीकों से बन सकती है।</p><p>चित्र में लाल गोले चुने हुए हैं। देखो कि हर नया समूह कैसे बनता है और nCr की तुलना nPr से करो।</p>'),
  d3:'combo3d',
  cap:B('Every red pair or group is one combination. Different orders of the same group are not counted again.','हर लाल जोड़ी या समूह एक संचय है। उसी समूह के भिन्न क्रम दोबारा नहीं गिने जाते।')},
 {h:B('Counting with conditions','शर्तों के साथ गिनती'),
  body:B(
   '<p>Most JEE problems are a mix of selecting (combinations) and arranging (permutations). Work in this order.</p><ol><li><b>Select first</b> with C, then <b>arrange</b> with P or with factorials.</li><li><b>“At least one”:</b> count everything, then subtract the cases with none. Example: a committee of 3 from 5 men and 4 women with at least one woman: 9C3 − 5C3 = 84 − 10 = 74.</li><li><b>Digits:</b> fill the restricted place first. The leading digit cannot be 0 and an even number needs an even last digit.</li><li><b>Geometry:</b> n points, no three in a line, give nC2 lines and nC3 triangles. An n-sided polygon has <b>nC2 − n</b> diagonals, e.g. hexagon 15 − 6 = 9.</li><li><b>Words with repeats:</b> divide by the factorial of each repeat.</li></ol><p><b>Check:</b> try your method on a tiny case you can list by hand, such as 3 people, before trusting it on a big one.</p>',
   '<p>JEE के अधिकतर प्रश्न चयन (संचय) और विन्यास (क्रमचय) का मिश्रण होते हैं। इस क्रम में काम करो।</p><ol><li><b>पहले चुनो</b> C से, फिर <b>सजाओ</b> P या क्रमगुणित से।</li><li><b>“कम से कम एक”:</b> सब कुछ गिनो, फिर वे स्थितियाँ घटाओ जिनमें कोई नहीं है। उदाहरण: 5 पुरुषों और 4 महिलाओं में से कम से कम एक महिला वाली 3 की समिति: 9C3 − 5C3 = 84 − 10 = 74।</li><li><b>अंक:</b> प्रतिबंधित स्थान पहले भरो। प्रथम अंक 0 नहीं हो सकता और सम संख्या के लिए अंतिम अंक सम चाहिए।</li><li><b>ज्यामिति:</b> n बिंदु, जिनमें कोई तीन संरेख नहीं, nC2 रेखाएँ और nC3 त्रिभुज बनाते हैं। n भुजा वाले बहुभुज के <b>nC2 − n</b> विकर्ण होते हैं, जैसे षट्भुज के 15 − 6 = 9।</li><li><b>दोहराव वाले शब्द:</b> हर दोहराव के क्रमगुणित से भाग दो।</li></ol><p><b>जाँच:</b> बड़े प्रश्न पर भरोसा करने से पहले अपनी विधि किसी छोटे उदाहरण, जैसे 3 व्यक्तियों, पर आज़माओ जिसे हाथ से गिना जा सके।</p>')}
],

 {h:B('Sample space and events','प्रतिदर्श समष्टि और घटनाएँ'),
  body:B(
   '<p class="def"><b>In simple words:</b> an <b>experiment</b> is something you do whose result is uncertain, like tossing a coin. All possible results together make the <b>sample space S</b>. An <b>event</b> is any group of results you care about.</p><ul><li>Toss one coin: S = {H, T}, 2 outcomes.</li><li>Toss two coins: S = {HH, HT, TH, TT}, 4 outcomes.</li><li>Throw one die: S = {1, 2, 3, 4, 5, 6}.</li><li>Throw two dice: 6 × 6 = <b>36</b> outcomes.</li><li>Pick a card from a deck: 52 outcomes (13 in each of 4 suits).</li></ul><p><b>Types of events:</b></p><ul><li><b>Impossible event:</b> no outcome (the empty set).</li><li><b>Sure event:</b> the whole sample space S.</li><li><b>Mutually exclusive events:</b> cannot happen together.</li><li><b>Complement</b> E′ (not E): all outcomes that are not in E.</li></ul><p>In the figure each square is one outcome of two dice. Choose a sum with the slider and the matching squares rise up.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>प्रयोग</b> वह काम है जिसका परिणाम अनिश्चित हो, जैसे सिक्का उछालना। सभी संभावित परिणाम मिलकर <b>प्रतिदर्श समष्टि S</b> बनाते हैं। <b>घटना</b> उन परिणामों का कोई भी समूह है जो तुम्हें चाहिए।</p><ul><li>एक सिक्का: S = {H, T}, 2 परिणाम।</li><li>दो सिक्के: S = {HH, HT, TH, TT}, 4 परिणाम।</li><li>एक पासा: S = {1, 2, 3, 4, 5, 6}।</li><li>दो पासे: 6 × 6 = <b>36</b> परिणाम।</li><li>ताश की गड्डी से एक पत्ता: 52 परिणाम (4 रंगों में 13-13)।</li></ul><p><b>घटनाओं के प्रकार:</b></p><ul><li><b>असंभव घटना:</b> कोई परिणाम नहीं (रिक्त समुच्चय)।</li><li><b>निश्चित घटना:</b> पूरा प्रतिदर्श समष्टि S।</li><li><b>परस्पर अपवर्जी घटनाएँ:</b> एक साथ नहीं हो सकतीं।</li><li><b>पूरक</b> E′ (E नहीं): वे सभी परिणाम जो E में नहीं हैं।</li></ul><p>चित्र में हर वर्ग दो पासों का एक परिणाम है। स्लाइडर से योग चुनो और मेल खाते वर्ग ऊपर उठ जाते हैं।</p>'),
  d3:'prob3d',
  cap:B('All 36 outcomes of two dice. The raised blocks are the outcomes for the chosen sum.','दो पासों के सभी 36 परिणाम। उठे हुए खंड चुने गए योग के परिणाम हैं।')},
 {h:B('Probability of an event','घटना की प्रायिकता'),
  body:B(
   '<p class="def"><b>In simple words:</b> probability is a number from 0 to 1 that tells you how likely something is. 0 means it never happens, 1 means it always happens. If all outcomes are equally likely, count the ones you want and divide by the total.</p><p class="eq">P(E) = n(E) / n(S) = (favourable outcomes) / (total outcomes)</p><ul><li>0 ≤ P(E) ≤ 1.</li><li>P(S) = 1 and P(impossible) = 0.</li><li>The probabilities of all single outcomes add up to 1.</li><li><b>Complement:</b> P(E′) = 1 − P(E). Use this when “not” is easier to count, for example “at least one head”.</li></ul><p>Example: a die is thrown. The event “a prime number” = {2, 3, 5}. P = 3/6 = 1/2.</p><p>Example: two dice, sum 7. The pairs are (1,6), (2,5), (3,4), (4,3), (5,2), (6,1): 6 outcomes, so P = 6/36 = 1/6. This is the most likely sum, as the figure shows when you set the slider to 7.</p><p>Odds in favour of E = P(E) : P(E′) = n(E) : (n(S) − n(E)).</p>',
   '<p class="def"><b>सरल शब्दों में:</b> प्रायिकता 0 से 1 के बीच की संख्या है जो बताती है कि कोई बात कितनी संभव है। 0 का अर्थ है कभी नहीं होगी, 1 का अर्थ है हमेशा होगी। यदि सभी परिणाम समान रूप से संभव हों तो चाहे गए परिणाम गिनो और कुल से भाग दो।</p><p class="eq">P(E) = n(E) / n(S) = (अनुकूल परिणाम) / (कुल परिणाम)</p><ul><li>0 ≤ P(E) ≤ 1।</li><li>P(S) = 1 और P(असंभव) = 0।</li><li>सभी एकल परिणामों की प्रायिकताओं का योग 1 होता है।</li><li><b>पूरक:</b> P(E′) = 1 − P(E)। जब “नहीं” गिनना आसान हो तब इसका प्रयोग करो, जैसे “कम से कम एक चित”।</li></ul><p>उदाहरण: एक पासा फेंका गया। घटना “अभाज्य संख्या” = {2, 3, 5}। P = 3/6 = 1/2।</p><p>उदाहरण: दो पासे, योग 7। जोड़े (1,6), (2,5), (3,4), (4,3), (5,2), (6,1): 6 परिणाम, अतः P = 6/36 = 1/6। यह सबसे संभावित योग है, जैसा चित्र में स्लाइडर 7 पर रखने से दिखता है।</p><p>E के पक्ष में विषमता = P(E) : P(E′) = n(E) : (n(S) − n(E))।</p>')},
 {h:B('Addition rule and independent events','योग नियम और स्वतंत्र घटनाएँ'),
  body:B(
   '<p class="def"><b>In simple words:</b> “A or B” means at least one of them happens. If you just add P(A) and P(B), the overlap (both together) is counted twice, so you subtract it once.</p><p class="eq">P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</p><ul><li>If A and B are <b>mutually exclusive</b>, P(A ∩ B) = 0, so P(A ∪ B) = P(A) + P(B).</li><li>P(neither A nor B) = 1 − P(A ∪ B).</li><li>P(A only) = P(A) − P(A ∩ B).</li></ul><p><b>Independent events</b> (JEE): the result of one does not change the other, like two separate coin tosses.</p><p class="eq">P(A ∩ B) = P(A) × P(B)</p><p><b>Conditional probability</b> (JEE): the chance of A when B is already known to have happened.</p><p class="eq">P(A | B) = P(A ∩ B) / P(B)</p><p>Example: a card is drawn from 52. A = king (4), B = heart (13), A ∩ B = king of hearts (1). P(A ∪ B) = 4/52 + 13/52 − 1/52 = 16/52 = 4/13.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> “A या B” का अर्थ है उनमें से कम से कम एक हो। यदि P(A) और P(B) सीधे जोड़ दो, तो साझा भाग (दोनों साथ) दो बार गिन जाता है, इसलिए उसे एक बार घटाओ।</p><p class="eq">P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</p><ul><li>यदि A और B <b>परस्पर अपवर्जी</b> हैं तो P(A ∩ B) = 0, अतः P(A ∪ B) = P(A) + P(B)।</li><li>P(न A न B) = 1 − P(A ∪ B)।</li><li>P(केवल A) = P(A) − P(A ∩ B)।</li></ul><p><b>स्वतंत्र घटनाएँ</b> (JEE): एक का परिणाम दूसरी को नहीं बदलता, जैसे दो अलग सिक्का-उछाल।</p><p class="eq">P(A ∩ B) = P(A) × P(B)</p><p><b>सप्रतिबंध प्रायिकता</b> (JEE): जब B का होना पहले से पता हो तब A की संभावना।</p><p class="eq">P(A | B) = P(A ∩ B) / P(B)</p><p>उदाहरण: 52 पत्तों में से एक पत्ता खींचा। A = बादशाह (4), B = पान (13), A ∩ B = पान का बादशाह (1)। P(A ∪ B) = 4/52 + 13/52 − 1/52 = 16/52 = 4/13।</p>')},
 {h:B('Coins, dice and cards: quick tricks','सिक्के, पासे और ताश: तेज़ तरीके'),
  body:B(
   '<p class="def"><b>In simple words:</b> most problems fit three templates. Know the totals and the probability is just a count.</p><ul><li><b>n coins:</b> 2ⁿ outcomes. Probability of exactly r heads = nCr / 2ⁿ.</li><li><b>Two dice:</b> 36 outcomes. Sum distribution: 2→1, 3→2, 4→3, 5→4, 6→5, 7→6, 8→5, 9→4, 10→3, 11→2, 12→1 ways.</li><li><b>Cards:</b> 52 = 4 suits × 13. 26 red, 26 black, 12 face cards, 4 aces, 4 kings.</li><li><b>Without replacement:</b> after one card is drawn, the total reduces. P(two aces) = (4/52) × (3/51).</li><li><b>At least one:</b> use 1 − P(none).</li></ul><p>Example: three coins, exactly two heads. 3C2 / 2³ = 3/8.</p><p>Example: at least one head in three coins = 1 − P(no head) = 1 − 1/8 = 7/8.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> अधिकतर प्रश्न तीन साँचों में आते हैं। कुल परिणाम पता हों तो प्रायिकता बस गिनती है।</p><ul><li><b>n सिक्के:</b> 2ⁿ परिणाम। ठीक r चित की प्रायिकता = nCr / 2ⁿ।</li><li><b>दो पासे:</b> 36 परिणाम। योग के तरीके: 2→1, 3→2, 4→3, 5→4, 6→5, 7→6, 8→5, 9→4, 10→3, 11→2, 12→1।</li><li><b>ताश:</b> 52 = 4 रंग × 13। 26 लाल, 26 काले, 12 चित्र वाले, 4 इक्के, 4 बादशाह।</li><li><b>बिना प्रतिस्थापन:</b> एक पत्ता निकलने पर कुल घट जाता है। P(दो इक्के) = (4/52) × (3/51)।</li><li><b>कम से कम एक:</b> 1 − P(कोई नहीं) लगाओ।</li></ul><p>उदाहरण: तीन सिक्के, ठीक दो चित। 3C2 / 2³ = 3/8।</p><p>उदाहरण: तीन सिक्कों में कम से कम एक चित = 1 − P(कोई चित नहीं) = 1 − 1/8 = 7/8।</p>')}
],

    [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]].forEach(function(e){S.line(co[e[0]],co[e[1]],'muted',1.2)});

    S.box([1.0,yb+bh/2,0],[0.15,bh,0.15],'accent');S.text([1.0,yb-0.08,0],'P','accent',11,'center',true);

  }

D3.buoy3d={
  en:"Archimedes' principle: will it float or sink?",hi:'आर्किमिडीज़ का सिद्धांत: तैरेगा या डूबेगा?',h:0.9,scale:0.85,center:[0,0,0],spin:true,view:{yaw:-0.45,pitch:0.22,zoom:1},
  params:[{k:'r',en:'Block density ÷ water density (×0.1)',hi:'गुटके का घनत्व ÷ पानी का घनत्व (×0.1)',min:2,max:14,val:6,step:1,unit:''}],

    S.hud(0.04,0.25,'B = ρ(water)·V(submerged)·g',  'muted',10.5,'left');
  }
};
D3.flow3d={
  en:'Flow through a pipe: continuity and Bernoulli',hi:'पाइप में प्रवाह: सतत्ता और बर्नूली',h:0.9,scale:0.72,center:[0,-0.1,0],spin:true,view:{yaw:-0.4,pitch:0.3,zoom:1},
  params:[{k:'q',en:'Area ratio A₁ / A₂',hi:'क्षेत्रफल अनुपात A₁ / A₂',min:1,max:9,val:4,step:1,unit:''}],
  frame:function(S,t,P,l){
    var q=P.q,r1=0.28,r2=r1/Math.sqrt(q),i,N=40,xs=[],cum=[0];
    function R(x){var u=Math.min(1,Math.max(0,(Math.abs(x)-0.35)/0.4)),sm=u*u*(3-2*u);return r2+(r1-r2)*sm}
    for(i=0;i<=200;i++){xs.push(-1.3+i*2.6/200);if(i>0){var rr=R(xs[i]);cum.push(cum[i-1]+rr*rr)}}
    var tot=cum[200];
    for(i=0;i<=24;i++){var x=-1.3+i*2.6/24;S.ring([x,0,0],R(x),'yz','muted',1)}
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var pts=[];for(i=0;i<=40;i++){var x=-1.3+i*2.6/40;pts.push([x,d[0]*R(x),d[1]*R(x)])}S.path(pts,'ink',1.8)});
    for(i=0;i<N;i++){
      var qv=((t*0.22+i/N)%1)*tot,j=0;while(j<200&&cum[j]<qv)j++;
      var x=xs[j],ang=i*2.4,rr=R(x)*0.55;
      S.sphere([x,rr*Math.cos(ang),rr*Math.sin(ang)],0.022,'accent',true);
    }
    var v1=1,v2=q*v1,dP=0.5*1000*(v2*v2-v1*v1)/1000;
    [[-1.0,'v₁',v1],[0,'v₂',v2],[1.0,'v₁',v1]].forEach(function(c,k){
      var hh=Math.max(0.05,0.4-0.0026*c[2]*c[2]);
      S.box([c[0],0.4+hh/2,0],[0.1,hh,0.1],'good');
    });
    S.text([0,0.4,0.2],sx(l,'pressure','दाब'),'good',9.5,'center',true);
    S.hud(0.04,0.07,'A₁v₁ = A₂v₂  →  v₂ = '+v2+' v₁','accent',12,'left',true);
    S.hud(0.04,0.16,sx(l,'Narrow part: faster flow, lower pressure','संकरा भाग: तेज़ प्रवाह, कम दाब'),'good',12,'left',true);
    S.hud(0.04,0.25,sx(l,'P + ½ρv² = constant (horizontal pipe)','P + ½ρv² = अचर (क्षैतिज पाइप)'),'muted',10.5,'left');
  }
};

CH=CH.concat([{
id:'physics-properties-of-fluids', subject:'physics', cls:11, ord:10,
title:B('Mechanical Properties of Fluids','तरलों के यांत्रिक गुण'),
blurb:B("Pressure, Pascal's law, buoyancy, continuity and Bernoulli's equation, viscosity and surface tension.",'दाब, पास्कल का नियम, उत्प्लावन, सतत्ता और बर्नूली समीकरण, श्यानता और पृष्ठ तनाव।'),
sections:[
 {h:B("Pressure and Pascal's law",'दाब और पास्कल का नियम'),
  body:B(
   '<p class="def"><b>In simple words:</b> a <b>fluid</b> is anything that flows: a liquid or a gas. <b>Pressure</b> is how hard a fluid pushes on each square metre of a surface.</p><p class="eq">P = F / A        unit: pascal (Pa) = N/m²</p><ul><li>Pressure is a scalar; it pushes <b>equally in all directions</b> at a point.</li><li>1 atm = 1.013 × 10⁵ Pa ≈ 10⁵ Pa. The air above you pushes down with this pressure.</li></ul><p><b>Pressure at depth h</b> in a liquid of density ρ:</p><p class="eq">P = P₀ + ρ g h        (gauge pressure = ρgh)</p><ul><li>It depends only on <b>depth</b> and the liquid, not on the shape or width of the container. This is why liquid stands at the same level in all arms of connected vessels.</li><li>In water, pressure rises by about 10⁴ Pa (0.1 atm) for every metre.</li></ul><p><b>Pascal’s law:</b> pressure applied to an enclosed liquid is passed on <b>undiminished</b> to every part of it.</p><p class="eq">F₁ / A₁ = F₂ / A₂        (hydraulic lift)</p><p>A small force on a small piston lifts a large load on a big piston: force is multiplied by A₂/A₁ (the distance is reduced in proportion).</p><p>Drag the depth slider in the figure: the pressure grows 10 kPa per metre.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>तरल</b> वह है जो बह सके: द्रव या गैस। <b>दाब</b> बताता है कि तरल किसी सतह के हर वर्ग मीटर पर कितनी ज़ोर से धकेलता है।</p><p class="eq">P = F / A        मात्रक: पास्कल (Pa) = N/m²</p><ul><li>दाब अदिश है; यह एक बिंदु पर <b>हर दिशा में समान</b> धकेलता है।</li><li>1 atm = 1.013 × 10⁵ Pa ≈ 10⁵ Pa। तुम्हारे ऊपर की हवा इसी दाब से नीचे धकेलती है।</li></ul><p>ρ घनत्व के द्रव में <b>गहराई h पर दाब</b>:</p><p class="eq">P = P₀ + ρ g h        (गेज दाब = ρgh)</p><ul><li>यह केवल <b>गहराई</b> और द्रव पर निर्भर है, बर्तन के आकार या चौड़ाई पर नहीं। इसीलिए जुड़े बर्तनों की सभी भुजाओं में द्रव एक ही स्तर पर रहता है।</li><li>पानी में हर मीटर पर दाब लगभग 10⁴ Pa (0.1 atm) बढ़ता है।</li></ul><p><b>पास्कल का नियम:</b> बंद द्रव पर लगाया गया दाब उसके हर भाग में <b>बिना घटे</b> पहुँचता है।</p><p class="eq">F₁ / A₁ = F₂ / A₂        (द्रवचालित लिफ्ट)</p><p>छोटे पिस्टन पर छोटा बल बड़े पिस्टन पर बड़ा भार उठा देता है: बल A₂/A₁ गुना हो जाता है (दूरी उसी अनुपात में घटती है)।</p><p>चित्र में गहराई स्लाइडर खींचो: दाब हर मीटर पर 10 kPa बढ़ता है।</p>'),
  d3:'pressure3d',
  cap:B('The probe feels equal pressure from all six sides. Going deeper adds 10 kPa per metre (the bar on the right).','जाँच-गोला छहों ओर से समान दाब महसूस करता है। गहरे जाने पर हर मीटर पर 10 kPa बढ़ता है (दाईं पट्टी)।')},
 {h:B("Buoyancy and Archimedes' principle",'उत्प्लावन और आर्किमिडीज़ का सिद्धांत'),
  body:B(
   '<p class="def"><b>In simple words:</b> a liquid pushes <b>up</b> on anything dipped in it, because the pressure at the bottom of the object is larger than at the top. This upward push is the <b>buoyant force</b>.</p><p><b>Archimedes’ principle:</b> the buoyant force equals the <b>weight of the liquid displaced</b>.</p><p class="eq">B = ρ<sub>liquid</sub> · V<sub>immersed</sub> · g</p><ul><li><b>Floats</b> if ρ<sub>body</sub> &lt; ρ<sub>liquid</sub>. The fraction under the surface = ρ<sub>body</sub>/ρ<sub>liquid</sub>.</li><li><b>Sinks</b> if ρ<sub>body</sub> &gt; ρ<sub>liquid</sub>. Then B &lt; W and the bottom pushes up with a normal force.</li><li>Apparent weight of a submerged body = W − B.</li><li>Floating means B = W, so the body displaces liquid whose weight equals its own. A steel ship floats because its hollow shape displaces a large volume.</li><li>Ice (ρ = 920) floats with 92% under water in water (ρ = 1000).</li></ul><p>In the figure, move the density ratio. Below 1 the block floats with exactly that fraction submerged; above 1 it sinks and the table pushes back.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> द्रव डूबी हुई हर चीज़ पर <b>ऊपर</b> की ओर धक्का देता है, क्योंकि वस्तु के तल पर दाब ऊपरी भाग से अधिक होता है। यह ऊपर का धक्का <b>उत्प्लावन बल</b> है।</p><p><b>आर्किमिडीज़ का सिद्धांत:</b> उत्प्लावन बल <b>विस्थापित द्रव के भार</b> के बराबर होता है।</p><p class="eq">B = ρ<sub>द्रव</sub> · V<sub>डूबा</sub> · g</p><ul><li>ρ<sub>पिंड</sub> &lt; ρ<sub>द्रव</sub> हो तो <b>तैरता है</b>। सतह के नीचे का भाग = ρ<sub>पिंड</sub>/ρ<sub>द्रव</sub>।</li><li>ρ<sub>पिंड</sub> &gt; ρ<sub>द्रव</sub> हो तो <b>डूबता है</b>। तब B &lt; W और तल अभिलंब बल से ऊपर धकेलता है।</li><li>डूबे पिंड का आभासी भार = W − B।</li><li>तैरने का अर्थ B = W है, अर्थात पिंड अपने भार के बराबर द्रव हटाता है। स्टील का जहाज़ इसलिए तैरता है क्योंकि उसका खोखला आकार बहुत अधिक आयतन हटाता है।</li><li>बर्फ (ρ = 920) पानी (ρ = 1000) में 92% अंदर रहकर तैरती है।</li></ul><p>चित्र में घनत्व अनुपात बदलो। 1 से कम पर गुटका ठीक उतने भाग के साथ तैरता है; 1 से अधिक पर डूबता है और मेज़ वापस धकेलती है।</p>'),
  d3:'buoy3d',
  cap:B('W is weight and B is buoyancy. When ρ is less than 1, B equals W and the block floats; above 1 it sinks.','W भार है और B उत्प्लावन। ρ का मान 1 से कम हो तो B = W और गुटका तैरता है; 1 से अधिक पर डूबता है।')},
 {h:B("Fluid flow: continuity and Bernoulli's equation",'तरल प्रवाह: सतत्ता और बर्नूली समीकरण'),
  body:B(
   '<p class="def"><b>In simple words:</b> for a smooth, steady flow of an incompressible liquid, the same volume must pass every point of the pipe each second. So where the pipe narrows, the liquid must <b>speed up</b>. This is the <b>equation of continuity</b>.</p><p class="eq">A₁ v₁ = A₂ v₂</p><p><b>Bernoulli’s equation:</b> energy conservation for a flowing liquid (steady, non-viscous, incompressible).</p><p class="eq">P + ½ ρ v² + ρ g h = constant</p><ul><li>Where the flow is <b>faster, the pressure is lower</b> (at the same height). This is the main idea.</li><li><b>Applications:</b> the lift on an aeroplane wing (faster air above, lower pressure), the atomiser/sprayer, the Venturi meter, a curved cricket ball.</li><li><b>Torricelli’s law:</b> speed of water coming out of a hole at depth h below the surface: v = √(2gh), like free fall through h.</li></ul><p>In the figure, dots flow through a pipe that narrows in the middle. Increase the area ratio: the dots speed up and the pressure columns drop in the narrow part.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> अदबनीय द्रव के चिकने, स्थिर प्रवाह में पाइप के हर बिंदु से हर सेकंड समान आयतन गुज़रना चाहिए। इसलिए जहाँ पाइप संकरा होता है वहाँ द्रव <b>तेज़</b> हो जाता है। यह <b>सतत्ता समीकरण</b> है।</p><p class="eq">A₁ v₁ = A₂ v₂</p><p><b>बर्नूली समीकरण:</b> बहते द्रव (स्थिर, अश्यान, अदबनीय) के लिए ऊर्जा संरक्षण।</p><p class="eq">P + ½ ρ v² + ρ g h = अचर</p><ul><li>जहाँ प्रवाह <b>तेज़ है, वहाँ दाब कम</b> है (समान ऊँचाई पर)। यही मुख्य विचार है।</li><li><b>उपयोग:</b> हवाई जहाज़ के पंख का उत्थापन (ऊपर तेज़ हवा, कम दाब), फुहारक/एटमाइज़र, वेन्चुरीमीटर, घूमती क्रिकेट गेंद का मुड़ना।</li><li><b>टॉरिसेली का नियम:</b> सतह से h नीचे छेद से निकलते पानी की चाल: v = √(2gh), जैसे h तक मुक्त पतन।</li></ul><p>चित्र में बिंदु ऐसे पाइप में बहते हैं जो बीच में संकरा है। क्षेत्रफल अनुपात बढ़ाओ: बिंदु तेज़ हो जाते हैं और संकरे भाग में दाब के स्तंभ घट जाते हैं।</p>'),
  d3:'flow3d',
  cap:B('The pipe narrows in the middle. The dots move faster there and the pressure column becomes shorter.','पाइप बीच में संकरा है। वहाँ बिंदु तेज़ चलते हैं और दाब का स्तंभ छोटा हो जाता है।')},
 {h:B('Viscosity','श्यानता'),
  body:B(
   '<p class="def"><b>In simple words:</b> <b>viscosity</b> is the “thickness” or internal friction of a fluid. Honey is more viscous than water: its layers drag on each other more, so it flows slowly.</p><p class="eq">F = η A (dv/dx)        unit of η: Pa·s (poise in CGS)</p><ul><li>Layers moving at different speeds drag each other. dv/dx is the velocity gradient.</li><li>Viscosity of <b>liquids decreases</b> with temperature; of <b>gases increases</b>.</li></ul><p><b>Stokes’ law:</b> a small sphere of radius r moving at speed v in a fluid feels a drag</p><p class="eq">F = 6 π η r v</p><p><b>Terminal velocity:</b> a falling ball speeds up until weight = buoyancy + viscous drag, then moves at a constant speed.</p><p class="eq">v<sub>t</sub> = 2 r² (ρ − σ) g / (9 η)</p><p>(ρ = density of the ball, σ = density of the fluid.) Raindrops reach terminal velocity; a bigger drop has a bigger v<sub>t</sub> since v<sub>t</sub> ∝ r².</p><p><b>Reynolds number</b> decides the flow type: low values give smooth (laminar) flow, high values give turbulent flow.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>श्यानता</b> तरल की “गाढ़ापन” या आंतरिक घर्षण है। शहद पानी से अधिक श्यान है: उसकी परतें एक-दूसरे को अधिक रोकती हैं, इसलिए वह धीरे बहता है।</p><p class="eq">F = η A (dv/dx)        η का मात्रक: Pa·s (CGS में पॉइज़)</p><ul><li>अलग-अलग चाल से चलती परतें एक-दूसरे को रोकती हैं। dv/dx वेग प्रवणता है।</li><li><b>द्रवों</b> की श्यानता तापमान बढ़ने पर <b>घटती</b> है; <b>गैसों</b> की <b>बढ़ती</b> है।</li></ul><p><b>स्टोक्स का नियम:</b> r त्रिज्या का छोटा गोला तरल में चाल v से चले तो उस पर श्यान बल लगता है</p><p class="eq">F = 6 π η r v</p><p><b>सीमांत वेग:</b> गिरती गेंद तब तक तेज़ होती है जब तक भार = उत्प्लावन + श्यान बल न हो जाए, फिर वह अचर चाल से चलती है।</p><p class="eq">v<sub>t</sub> = 2 r² (ρ − σ) g / (9 η)</p><p>(ρ = गेंद का घनत्व, σ = तरल का घनत्व।) वर्षा की बूँदें सीमांत वेग पाती हैं; बड़ी बूँद का v<sub>t</sub> बड़ा होता है क्योंकि v<sub>t</sub> ∝ r²।</p><p><b>रेनॉल्ड्स संख्या</b> प्रवाह का प्रकार तय करती है: कम मान पर चिकना (धारारेखी) प्रवाह, अधिक मान पर विक्षुब्ध प्रवाह।</p>')},
 {h:B('Surface tension','पृष्ठ तनाव'),
  body:B(
   '<p class="def"><b>In simple words:</b> the surface of a liquid behaves like a stretched elastic skin. That is why small insects walk on water and drops are round. Molecules at the surface are pulled inward by their neighbours, so the surface tries to become as <b>small</b> as possible.</p><p class="eq">T = F / l = (surface energy) / (area)        unit: N/m or J/m²</p><ul><li>Extra pressure inside a <b>drop</b>: ΔP = 2T/R. Inside a <b>soap bubble</b> (two surfaces): ΔP = 4T/R.</li><li>Surface tension falls as temperature rises, and falls when soap or detergent is added.</li><li>Water (T ≈ 0.072 N/m) wets glass; the angle of contact θ is less than 90°. Mercury does not wet glass (θ &gt; 90°).</li></ul><p><b>Capillary rise:</b> in a narrow tube of radius r, the liquid climbs (or is pushed down, for mercury) by</p><p class="eq">h = 2 T cos θ / (ρ g r)</p><p>The narrower the tube, the higher the rise. Water in a 0.5 mm radius tube rises h = 2 × 0.07/(1000 × 10 × 5 × 10⁻⁴) = 0.028 m ≈ 2.8 cm. This is how plants draw water and how a wick draws oil.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> द्रव की सतह खिंची हुई प्रत्यास्थ झिल्ली की तरह व्यवहार करती है। इसीलिए छोटे कीड़े पानी पर चल पाते हैं और बूँदें गोल होती हैं। सतह के अणुओं को पड़ोसी भीतर की ओर खींचते हैं, इसलिए सतह यथासंभव <b>छोटी</b> होना चाहती है।</p><p class="eq">T = F / l = (पृष्ठ ऊर्जा) / (क्षेत्रफल)        मात्रक: N/m या J/m²</p><ul><li><b>बूँद</b> के भीतर अतिरिक्त दाब: ΔP = 2T/R। <b>साबुन के बुलबुले</b> (दो सतहें) में: ΔP = 4T/R।</li><li>तापमान बढ़ने पर और साबुन या डिटर्जेंट मिलाने पर पृष्ठ तनाव घटता है।</li><li>पानी (T ≈ 0.072 N/m) काँच को भिगोता है; संपर्क कोण θ, 90° से कम होता है। पारा काँच को नहीं भिगोता (θ &gt; 90°)।</li></ul><p><b>केशिका चढ़ाव:</b> r त्रिज्या की संकरी नली में द्रव इतना चढ़ता है (या पारे के लिए नीचे दबता है)</p><p class="eq">h = 2 T cos θ / (ρ g r)</p><p>नली जितनी संकरी, चढ़ाव उतना अधिक। 0.5 mm त्रिज्या की नली में पानी h = 2 × 0.07/(1000 × 10 × 5 × 10⁻⁴) = 0.028 m ≈ 2.8 cm चढ़ता है। इसी से पौधे पानी खींचते हैं और बत्ती तेल खींचती है।</p>')}
],

examples:[

  a:B('<p>Gauge = ρgh = 1000 × 10 × 10 = <b>10⁵ Pa</b>.</p><p>Absolute = P₀ + ρgh = 10⁵ + 10⁵ = <b>2 × 10⁵ Pa</b> (2 atm).</p>','<p>गेज = ρgh = 1000 × 10 × 10 = <b>10⁵ Pa</b>।</p><p>परम = P₀ + ρgh = 10⁵ + 10⁵ = <b>2 × 10⁵ Pa</b> (2 atm)।</p>')},
 {lv:'easy',

 {lv:'hard',

],
rev:{

D3.stressstrain3d={
  en:'Stress–strain curve of a ductile metal (move along the curve)',hi:'तन्य धातु का प्रतिबल–विकृति वक्र (वक्र पर चलो)',h:0.85,scale:0.9,center:[0,-0.05,0],spin:true,view:{yaw:-0.45,pitch:0.3,zoom:1},
  params:[{k:'p',en:'Position on the curve (0 to 10)',hi:'वक्र पर स्थिति (0 से 10)',min:0,max:10,val:2,step:1,unit:''}],
  frame:function(S,t,P,l){
    var pts=[[0,0],[0.12,0.5],[0.25,1.0],[0.3,1.1],[0.45,1.05],[0.6,1.25],[0.8,1.5],[1.0,1.65],[1.15,1.7],[1.25,1.55],[1.35,1.4]],i;
    var ux=0.62,uy=0.5,x0=-0.5,y0=-0.45;
    function M(p,z){return [x0+p[0]*ux,y0+p[1]*uy,z]}
    S.floor([[-0.7,y0-0.001,-0.45],[1.0,y0-0.001,-0.45],[1.0,y0-0.001,0.45],[-0.7,y0-0.001,0.45]],'soft',0.4,'line');
    S.arrow([x0,y0,0],[x0+1.0*1.0,y0,0],'ink',1.3);S.arrow([x0,y0,0],[x0,y0+1.0,0],'ink',1.3);
    S.text([x0+1.05,y0-0.05,0],sx(l,'strain ε','विकृति ε'),'ink',11,'left',true);S.text([x0-0.02,y0+1.08,0],sx(l,'stress σ','प्रतिबल σ'),'ink',11,'center',true);
    var c1=pts.map(function(p){return M(p,0.3)}),c2=pts.map(function(p){return M(p,-0.3)});
    for(i=0;i<pts.length-1;i++)S.poly([M(pts[i],-0.3),M(pts[i+1],-0.3),M(pts[i+1],0.3),M(pts[i],0.3)],'accent',0.25);
    S.path(c1,'accent',3);S.path(c2,'accent',1.4);
    var p=Math.max(0,Math.min(10,P.p)),pr=pts[p],mk=M(pr,0.3);
    S.line(M([pr[0],0],0.3),mk,'muted',1);S.line(M([0,pr[1]],0.3),mk,'muted',1);
    S.sphere(mk,0.055*(1+0.15*Math.sin(t*4)),'hi',true);
    var zone=p<=2?sx(l,"Hooke's law: stress ∝ strain",'हुक का नियम: प्रतिबल ∝ विकृति'):(p===3?sx(l,'Elastic limit: still returns to shape','प्रत्यास्थ सीमा: अब भी आकार वापस पाता है'):(p===4?sx(l,'Yield point: plastic flow begins','पराभव बिंदु: सुघट्य प्रवाह शुरू'):(p<=7?sx(l,'Plastic region: permanent stretch','सुघट्य क्षेत्र: स्थायी खिंचाव'):(p<10?sx(l,'Near the ultimate strength: necking','चरम सामर्थ्य के पास: गर्दन बनना'):sx(l,'Fracture: the wire breaks','भंजन: तार टूट जाता है')))));
    S.hud(0.04,0.07,'ε = '+pr[0].toFixed(2)+'%   σ = '+(pr[1]*100|0)+' MPa','ink',12,'left',true);
    S.hud(0.04,0.16,zone,'hi',12,'left',true);
    S.hud(0.04,0.25,sx(l,'Steepness of the straight part = Young’s modulus','सीधे भाग की ढलान = यंग गुणांक'),'muted',10,'left');
  }
};

  en:'A wire hanging from a ceiling under a load',hi:'छत से लटका तार जिस पर भार लगा है',h:0.9,scale:0.62,center:[0,-0.25,0],spin:true,view:{yaw:-0.5,pitch:0.2,zoom:1},
  params:[
    {k:'m',en:'Load M (kg)',hi:'भार M (kg)',min:10,max:100,val:50,step:10,unit:''},
    {k:'y',en:'Material (1 steel, 2 copper, 3 aluminium)',hi:'पदार्थ (1 स्टील, 2 तांबा, 3 एल्युमिनियम)',min:1,max:3,val:1,step:1,unit:''}
  ],
  frame:function(S,t,P,l){
    var Ys=[2e11,1.2e11,7e10],names=['steel','copper','aluminium'],nameh=['स्टील','तांबा','एल्युमिनियम'],Y=Ys[P.y-1];
    var F=P.m*10,A=1e-6,L=2,dL=F*L/(A*Y),sig=F/A,eps=dL/L;
    var top=0.8,L0=1.2,ext=dL*1000*0.045,damp=Math.exp(-((t%5))*0.9),bob=ext*(1+0.3*damp*Math.cos((t%5)*9));
    S.line([-0.4,top,0],[0.4,top,0],'ink',5);S.box([0,top+0.03,0],[0.9,0.06,0.3],'muted');
    var by=top-L0-bob,side=0.1+0.0012*P.m;
    S.line([0,top,0],[0,by,0],'ink',2.4);
    S.box([0,by-side/2,0],[side,side,side],'accent');
    S.text([side/2+0.1,by-side/2,0],P.m+' kg','accent',11,'left',true);
    S.line([0.25,top-L0,0],[0.35,top-L0,0],'muted',1.2);S.text([0.38,top-L0,0],sx(l,'original length','मूल लंबाई'),'muted',9.5,'left',false);
    S.arrow([-0.3,by,0],[-0.3,by-0.3,0],'bad',2.4);
    S.hud(0.04,0.07,sx(l,names[P.y-1],nameh[P.y-1])+'   F = Mg = '+F+' N','ink',12,'left',true);
    S.hud(0.04,0.16,'σ = F/A = '+(sig/1e6).toFixed(0)+' MPa   ε = '+eps.toExponential(1),'accent',12,'left',true);
    S.hud(0.04,0.25,'ΔL = FL/(AY) = '+(dL*1000).toFixed(1)+' mm  (L = 2 m, A = 1 mm²)','good',11,'left',true);
  }
};

CH=CH.concat([{
id:'physics-properties-of-solids', subject:'physics', cls:11, ord:9,
title:B('Mechanical Properties of Solids','ठोसों के यांत्रिक गुण'),
blurb:B("Stress, strain, Hooke's law, the stress–strain curve, elastic moduli, Poisson's ratio and elastic energy.",'प्रतिबल, विकृति, हुक का नियम, प्रतिबल–विकृति वक्र, प्रत्यास्थता गुणांक, प्वाँसों अनुपात और प्रत्यास्थ ऊर्जा।'),
sections:[
 {h:B("Stress, strain and Hooke's law",'प्रतिबल, विकृति और हुक का नियम'),
  body:B(
   '<p class="def"><b>In simple words:</b> a body is <b>elastic</b> if it returns to its original shape after you remove the force (like a spring or a steel wire). When you pull a wire, the wire resists. <b>Stress</b> is the force the material feels per unit area, and <b>strain</b> is how much it stretched compared with its original length.</p><p class="eq">Stress σ = F / A        unit: N/m² (pascal)</p><p class="eq">Strain ε = ΔL / L        no unit</p><ul><li>Types of stress: <b>tensile</b> (stretching), <b>compressive</b> (squeezing), <b>shearing</b> (sliding layers), <b>hydraulic</b> (pressure on all sides).</li><li><b>Hooke’s law:</b> within the elastic limit, stress is proportional to strain.</li></ul><p class="eq">σ = Y ε   (σ ∝ ε)</p><p>On the stress–strain graph of a metal: straight line (Hooke) → elastic limit → yield point → plastic region (permanent change) → ultimate strength → fracture. A <b>ductile</b> material (copper) has a long plastic region; a <b>brittle</b> one (glass) breaks soon after the elastic limit.</p><p>In the figure, move the marker along the curve and read the zone name.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> कोई पिंड <b>प्रत्यास्थ</b> है यदि बल हटाने पर वह अपने मूल आकार में लौट आए (जैसे स्प्रिंग या स्टील का तार)। तार को खींचो तो तार विरोध करता है। <b>प्रतिबल</b> पदार्थ में प्रति इकाई क्षेत्रफल लगा बल है और <b>विकृति</b> मूल लंबाई की तुलना में खिंचाव की मात्रा है।</p><p class="eq">प्रतिबल σ = F / A        मात्रक: N/m² (पास्कल)</p><p class="eq">विकृति ε = ΔL / L        कोई मात्रक नहीं</p><ul><li>प्रतिबल के प्रकार: <b>तनन</b> (खिंचाव), <b>संपीडन</b> (दबाव), <b>अपरूपण</b> (परतें फिसलना), <b>जलीय</b> (चारों ओर से दाब)।</li><li><b>हुक का नियम:</b> प्रत्यास्थ सीमा के भीतर प्रतिबल, विकृति के समानुपाती होता है।</li></ul><p class="eq">σ = Y ε   (σ ∝ ε)</p><p>धातु के प्रतिबल–विकृति ग्राफ में: सीधी रेखा (हुक) → प्रत्यास्थ सीमा → पराभव बिंदु → सुघट्य क्षेत्र (स्थायी परिवर्तन) → चरम सामर्थ्य → भंजन। <b>तन्य</b> पदार्थ (तांबा) में लंबा सुघट्य क्षेत्र होता है; <b>भंगुर</b> पदार्थ (काँच) प्रत्यास्थ सीमा के तुरंत बाद टूट जाता है।</p><p>चित्र में चिह्न को वक्र पर चलाओ और क्षेत्र का नाम पढ़ो।</p>'),
  d3:'stressstrain3d',
  cap:B('Slide along the stress–strain curve. The straight part obeys Hooke’s law; after the yield point the stretch becomes permanent.','प्रतिबल–विकृति वक्र पर चलो। सीधा भाग हुक के नियम का पालन करता है; पराभव बिंदु के बाद खिंचाव स्थायी हो जाता है।')},
 {h:B('Elastic moduli','प्रत्यास्थता गुणांक'),
  body:B(
   '<p class="def"><b>In simple words:</b> the <b>modulus of elasticity</b> is stress divided by strain. A larger modulus means a <b>stiffer</b> material that deforms less for the same stress. There is one modulus for each type of stress.</p><ul><li><b>Young’s modulus Y</b> (stretching a wire):</li></ul><p class="eq">Y = (F/A) / (ΔL/L) = F L / (A ΔL)</p><ul><li><b>Bulk modulus B</b> (squeezing from all sides): B = −ΔP / (ΔV/V). Compressibility = 1/B.</li><li><b>Shear modulus η</b> (sliding layers): η = shear stress / shear strain = (F/A)/θ.</li><li><b>Poisson’s ratio</b>: when a wire stretches it gets thinner. σ<sub>p</sub> = lateral strain / longitudinal strain (without sign), between 0 and 0.5.</li></ul><p><b>Typical Y:</b> steel 2 × 10¹¹ Pa, copper 1.2 × 10¹¹, aluminium 7 × 10¹⁰. Steel is stiffer than rubber, and steel is therefore “more elastic” in physics even though rubber stretches more.</p><p>In the figure the same load is hung from steel, copper and aluminium: ΔL is smallest for steel, with the largest Y. Note that ΔL ∝ L/(A Y): a longer or thinner wire stretches more.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>प्रत्यास्थता गुणांक</b> प्रतिबल को विकृति से भाग देने पर मिलता है। बड़ा गुणांक यानी अधिक <b>कठोर</b> पदार्थ जो समान प्रतिबल पर कम विकृत होता है। हर प्रकार के प्रतिबल का अपना एक गुणांक है।</p><ul><li><b>यंग गुणांक Y</b> (तार को खींचना):</li></ul><p class="eq">Y = (F/A) / (ΔL/L) = F L / (A ΔL)</p><ul><li><b>आयतन प्रत्यास्थता गुणांक B</b> (चारों ओर से दबाना): B = −ΔP / (ΔV/V)। संपीड्यता = 1/B।</li><li><b>अपरूपण गुणांक η</b> (परतों का फिसलना): η = अपरूपण प्रतिबल / अपरूपण विकृति = (F/A)/θ।</li><li><b>प्वाँसों अनुपात</b>: तार खिंचने पर पतला होता है। σ<sub>p</sub> = पार्श्व विकृति / अनुदैर्घ्य विकृति (चिह्न रहित), 0 और 0.5 के बीच।</li></ul><p><b>प्रारूपिक Y:</b> स्टील 2 × 10¹¹ Pa, तांबा 1.2 × 10¹¹, एल्युमिनियम 7 × 10¹⁰। स्टील रबर से अधिक कठोर है, इसलिए भौतिकी में स्टील “अधिक प्रत्यास्थ” है, भले ही रबर अधिक खिंचता हो।</p><p>चित्र में स्टील, तांबे और एल्युमिनियम से समान भार लटकाया गया है: सबसे बड़े Y वाले स्टील में ΔL सबसे कम है। ध्यान दो ΔL ∝ L/(A Y): लंबा या पतला तार अधिक खिंचता है।</p>'),
  d3:'stretch3d',
  cap:B('A wire of length 2 m carries a load. The stretch is exaggerated in the picture; the readout shows the real ΔL.','2 m लंबाई का तार भार उठाए है। चित्र में खिंचाव बढ़ाकर दिखाया गया है; आँकड़ों में वास्तविक ΔL है।')},
 {h:B('Elastic energy and applications','प्रत्यास्थ ऊर्जा और उपयोग'),
  body:B(
   '<p class="def"><b>In simple words:</b> when you stretch a wire you do work, and that work is stored in it as <b>elastic potential energy</b>, just as in a spring. The area under the force–extension graph is the energy.</p><p class="eq">U = ½ F ΔL = ½ (stress)(strain)(volume)</p><p class="eq">Energy per unit volume u = ½ σ ε = ½ Y ε² = σ² / 2Y</p><ul><li>The wire behaves like a spring with constant k = YA/L, so F = kΔL and U = ½kΔL².</li><li><b>Safety factor:</b> cranes and bridges use cables loaded far below the breaking stress.</li><li>Steel for springs and beams (high Y, wide elastic range); copper for wires (ductile).</li><li>A beam supports a load better when deeper than wide, since bending depends on thickness, so I-shaped girders are used.</li></ul><p>Example: a 2 m steel wire (A = 1 mm²) carrying 100 N stretches by 1 mm, storing U = ½ × 100 × 0.001 = 0.05 J.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> तार को खींचने पर तुम कार्य करते हो और वह कार्य स्प्रिंग की तरह <b>प्रत्यास्थ स्थितिज ऊर्जा</b> के रूप में उसमें जमा हो जाता है। बल–विस्तार ग्राफ के नीचे का क्षेत्रफल ही ऊर्जा है।</p><p class="eq">U = ½ F ΔL = ½ (प्रतिबल)(विकृति)(आयतन)</p><p class="eq">प्रति इकाई आयतन ऊर्जा u = ½ σ ε = ½ Y ε² = σ² / 2Y</p><ul><li>तार स्प्रिंग की तरह व्यवहार करता है जिसका स्प्रिंग नियतांक k = YA/L है, अतः F = kΔL और U = ½kΔL²।</li><li><b>सुरक्षा गुणक:</b> क्रेन और पुलों में केबल पर भार भंजन प्रतिबल से बहुत कम रखा जाता है।</li><li>स्प्रिंग और बीम के लिए स्टील (बड़ा Y, चौड़ी प्रत्यास्थ सीमा); तारों के लिए तांबा (तन्य)।</li><li>बीम चौड़ाई से अधिक गहराई होने पर अधिक भार सहती है, क्योंकि झुकाव मोटाई पर निर्भर है, इसीलिए I-आकार के गर्डर लगते हैं।</li></ul><p>उदाहरण: 2 m लंबा स्टील का तार (A = 1 mm²) 100 N वहन करने पर 1 mm खिंचता है और U = ½ × 100 × 0.001 = 0.05 J संचित करता है।</p>')},
 {h:B('Solving elasticity problems','प्रत्यास्थता के प्रश्न हल करना'),
  body:B(
   '<p class="def"><b>In simple words:</b> almost every question is ΔL = FL/(AY) in disguise. Follow the same four steps every time.</p><ul><li><b>Step 1:</b> convert units: mm² → 10⁻⁶ m², cm² → 10⁻⁴ m², mass to force with F = Mg.</li><li><b>Step 2:</b> for a circular wire use A = πr² (radius, not diameter).</li><li><b>Step 3:</b> write the proportion: ΔL ∝ F L / (r² Y). Ratio problems then need no numbers.</li><li><b>Step 4:</b> check the answer against the breaking stress, and against the elastic limit.</li></ul><p><b>Two wires in series</b> (joined end to end) carry the same force; their extensions add. <b>Two wires in parallel</b> share the load: the stiffer wire carries more.</p><p><b>Heated and clamped rod:</b> if a rod of length L is heated by ΔT but cannot expand, the thermal stress is σ = Y α ΔT (α is the linear expansion coefficient).</p><p><b>Hanging wire under its own weight:</b> the top is stretched most because it carries the whole weight; the extension is ΔL = MgL/(2AY).</p>',
   '<p class="def"><b>सरल शब्दों में:</b> लगभग हर प्रश्न भेष बदला हुआ ΔL = FL/(AY) ही है। हर बार वही चार चरण अपनाओ।</p><ul><li><b>चरण 1:</b> मात्रक बदलो: mm² → 10⁻⁶ m², cm² → 10⁻⁴ m², द्रव्यमान से बल F = Mg।</li><li><b>चरण 2:</b> वृत्ताकार तार के लिए A = πr² (त्रिज्या, व्यास नहीं)।</li><li><b>चरण 3:</b> समानुपात लिखो: ΔL ∝ F L / (r² Y)। तब अनुपात वाले प्रश्नों में संख्याएँ चाहिए ही नहीं।</li><li><b>चरण 4:</b> उत्तर को भंजन प्रतिबल और प्रत्यास्थ सीमा से मिलाकर जाँचो।</li></ul><p><b>श्रेणी में दो तार</b> (सिरे से सिरा जुड़े) में बल समान होता है; विस्तार जुड़ते हैं। <b>समांतर में दो तार</b> भार बाँटते हैं: अधिक कठोर तार अधिक भार उठाता है।</p><p><b>गर्म और जकड़ी छड़:</b> यदि L लंबाई की छड़ ΔT से गर्म हो पर फैल न सके तो तापीय प्रतिबल σ = Y α ΔT होता है (α रैखिक प्रसार गुणांक है)।</p><p><b>अपने भार से लटका तार:</b> ऊपरी सिरा सबसे अधिक खिंचता है क्योंकि वह पूरा भार उठाता है; विस्तार ΔL = MgL/(2AY)।</p>')}
],

examples:[
 {lv:'easy',
  q:B('A force of 100 N acts on a cross-section of 2 cm². Find the stress.','2 cm² अनुप्रस्थ काट पर 100 N बल लगता है। प्रतिबल ज्ञात करो।'),
  a:B('<p>A = 2 cm² = 2 × 10⁻⁴ m². σ = F/A = 100/(2 × 10⁻⁴) = <b>5 × 10⁵ Pa</b>.</p>','<p>A = 2 cm² = 2 × 10⁻⁴ m²। σ = F/A = 100/(2 × 10⁻⁴) = <b>5 × 10⁵ Pa</b>।</p>')},
 {lv:'easy',
  q:B('A 2 m wire stretches by 1 mm. Find the strain.','2 m का तार 1 mm खिंच जाता है। विकृति ज्ञात करो।'),
  a:B('<p>ε = ΔL/L = 10⁻³/2 = <b>5 × 10⁻⁴</b> (no unit).</p>','<p>ε = ΔL/L = 10⁻³/2 = <b>5 × 10⁻⁴</b> (कोई मात्रक नहीं)।</p>')},
 {lv:'medium',
  q:B('A steel wire (Y = 2 × 10¹¹ Pa), 2 m long and 1 mm² in cross-section, carries a load of 100 N. Find its extension.','एक स्टील का तार (Y = 2 × 10¹¹ Pa), 2 m लंबा और 1 mm² अनुप्रस्थ काट वाला, 100 N भार वहन करता है। उसका विस्तार ज्ञात करो।'),
  a:B('<p>ΔL = FL/(AY) = 100 × 2/(10⁻⁶ × 2 × 10¹¹) = 200/(2 × 10⁵) = 10⁻³ m = <b>1 mm</b>.</p>','<p>ΔL = FL/(AY) = 100 × 2/(10⁻⁶ × 2 × 10¹¹) = 200/(2 × 10⁵) = 10⁻³ m = <b>1 mm</b>।</p>')},
 {lv:'medium',
  q:B('Wire 2 has twice the length and twice the radius of wire 1 (same material, same load). Compare the extensions.','तार 2 की लंबाई और त्रिज्या तार 1 से दोगुनी है (वही पदार्थ, वही भार)। विस्तारों की तुलना करो।'),
  a:B('<p>ΔL ∝ L/A ∝ L/r². Ratio = 2/(2²) = 1/2.</p><p>So the extension of wire 2 is <b>half</b> that of wire 1.</p>','<p>ΔL ∝ L/A ∝ L/r²। अनुपात = 2/(2²) = 1/2।</p><p>अतः तार 2 का विस्तार तार 1 का <b>आधा</b> है।</p>')},
 {lv:'medium',
  q:B('Find the elastic energy stored in the wire of the previous steel wire example (F = 100 N, ΔL = 1 mm) and the energy per unit volume.','पहले वाले स्टील तार के उदाहरण (F = 100 N, ΔL = 1 mm) में संचित प्रत्यास्थ ऊर्जा और प्रति इकाई आयतन ऊर्जा ज्ञात करो।'),

  d3:'redox3d',
