<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Venu JEE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Serif+Devanagari:wght@600;700&display=swap">
<style>
/* Layout: a desk-coloured screen holding one paper page at a time, with running head and folio; the covers are the only saturated surfaces. */
:root{
  color-scheme:light;
  --font-s:"Noto Serif","Noto Serif Devanagari",Georgia,"Times New Roman",serif;
  --font-b:"Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-m:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,"Times New Roman",serif;
  --bg:#E3E8EE; --paper:#FFFFFF; --ink:#16212C; --muted:#586878; --line:#D5DCE4; --edge:#BFCAD6;
  --phys:#1D5FD1; --chem:#087558; --math:#B04F00; --hi:#C2255C; --bad:#B3261E; --good:#087558; --on:#FFFFFF;
  --phys-soft:#E5EDFB; --chem-soft:#DFF2EB; --math-soft:#FBEBDD;
  --accent:var(--phys); --soft:var(--phys-soft);
  --cov11:#16284A; --cov12:#5B1F33; --covink:#F4F0E6; --covgold:#E3B64F;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1118; --paper:#16202C; --ink:#E6EDF4; --muted:#9AABBB; --line:#27384A; --edge:#33475C;
    --phys:#7BA6FF; --chem:#46CFA5; --math:#FFA05A; --hi:#FF7BA8; --bad:#FF8A80; --good:#46CFA5; --on:#0B1118;
    --phys-soft:#17294A; --chem-soft:#11352C; --math-soft:#3B2515;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1118; --paper:#16202C; --ink:#E6EDF4; --muted:#9AABBB; --line:#27384A; --edge:#33475C;
  --phys:#7BA6FF; --chem:#46CFA5; --math:#FFA05A; --hi:#FF7BA8; --bad:#FF8A80; --good:#46CFA5; --on:#0B1118;
  --phys-soft:#17294A; --chem-soft:#11352C; --math-soft:#3B2515;
}
[data-subject="physics"]{--accent:var(--phys);--soft:var(--phys-soft)}
[data-subject="chemistry"]{--accent:var(--chem);--soft:var(--chem-soft)}
[data-subject="maths"]{--accent:var(--math);--soft:var(--math-soft)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--font-b)}
html[lang="hi"] body{line-height:1.85}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input{font-family:inherit}
.hid{position:absolute;width:0;height:0;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--edge)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px}
.brand{font:700 1.25rem var(--font-s);text-decoration:none;letter-spacing:.01em;white-space:nowrap}
.brand i{font-style:normal;color:var(--hi)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:999px;background:var(--paper);padding:2px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.88rem;padding:6px 14px;border-radius:999px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* buttons */
.btn{font-weight:600;font-size:.95rem;padding:10px 16px;border-radius:10px;border:1px solid var(--edge);background:var(--paper);color:var(--ink);min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}

/* home */
.hero{padding-block:28px 6px}
.hero h1{font:700 clamp(2.1rem,10vw,3.3rem)/1.08 var(--font-s);margin:0 0 10px;letter-spacing:-.01em}
.hero h1 i{font-style:normal;color:var(--hi)}
.hero p{margin:0;color:var(--muted);max-width:54ch}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:26px;padding-bottom:56px}
.bk{min-width:0;display:flex;flex-direction:column;gap:12px}
.bk .btns{display:flex;flex-direction:column;gap:8px}
.meta{color:var(--muted);font-size:.88rem;margin:0}

/* covers */
.cover{position:relative;overflow:hidden;aspect-ratio:3/4;width:100%;background:var(--cv);color:var(--covink);border-radius:4px 12px 12px 4px;display:flex;flex-direction:column;justify-content:space-between;padding:1.5em 1.2em 1.3em 2.3em;font-size:11px;line-height:1.3;text-decoration:none;box-shadow:0 1px 0 rgba(0,0,0,.2),0 10px 22px -10px rgba(0,0,0,.45)}
.cover.lg{font-size:17px;max-width:360px;margin:0 auto}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.4em;background:linear-gradient(90deg,rgba(0,0,0,.38),rgba(0,0,0,.08) 65%,rgba(255,255,255,.1))}
.cover::after{content:"";position:absolute;left:1.9em;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}
.cover svg{position:absolute;right:-12%;bottom:6%;width:92%;height:auto;opacity:.2;pointer-events:none}
.cover.cov11{--cv:var(--cov11)}
.cover.cov12{--cv:var(--cov12)}
.cv-top,.cv-mid,.cv-bot{position:relative}
.cv-brand{font-weight:600;font-size:1em;letter-spacing:.22em;text-transform:uppercase;color:var(--covgold)}
.cv-word{font-size:1.5em;font-weight:500;margin-top:.2em}
.cv-num{font:700 6.6em/.95 var(--font-s)}
.cv-rule{width:3.2em;height:.22em;background:var(--covgold);margin:.5em 0}
.cv-sub{font-size:1.05em;font-weight:500;max-width:14em}
.cv-for{font-size:.9em;opacity:.8;margin-top:.3em}
.cvwrap{display:flex;flex-direction:column;gap:20px;align-items:stretch;padding-block:10px 20px}
.cvact{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}

/* paper page */
.page{padding-block:20px 100px}
.paper{position:relative;background:var(--paper);border:1px solid var(--edge);border-radius:4px;padding:14px 20px 16px;margin:0 8px 8px 0;min-height:min(72vh,680px);display:flex;flex-direction:column;box-shadow:3px 3px 0 0 var(--paper),3px 3px 0 1px var(--edge),6px 6px 0 0 var(--paper),6px 6px 0 1px var(--edge)}
.paper.turn{animation:turn .22s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.run{display:flex;justify-content:flex-start;font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:.05em;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:20px;text-transform:uppercase}
html[lang="hi"] .run{text-transform:none;letter-spacing:0;font-size:.85rem}
.paper.odd .run{justify-content:flex-end;text-align:right}
.pbody{flex:1;min-width:0}
.pnum{margin-top:26px;padding-top:10px;font:600 1rem var(--font-s);color:var(--muted);text-align:left}
.paper.odd .pnum{text-align:right}

.ph{font:700 clamp(1.35rem,5.6vw,1.7rem)/1.25 var(--font-s);margin:0 0 14px;color:var(--accent);text-wrap:balance}
html[lang="hi"] .ph{line-height:1.4}
.mini{font:600 .8rem var(--font-b);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 4px}
html[lang="hi"] .mini{text-transform:none;letter-spacing:0;font-size:.95rem}
.op-no{font-weight:600;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
html[lang="hi"] .op-no{letter-spacing:0;text-transform:none;font-size:1rem}
.op-t{font:700 clamp(1.9rem,8.4vw,2.7rem)/1.14 var(--font-s);margin:8px 0 2px;text-wrap:balance}
html[lang="hi"] .op-t{line-height:1.3}
.op-alt{color:var(--muted);font-weight:500;margin:0 0 12px}
.lead{margin:12px 0 0;max-width:60ch}
.tl-list{margin-top:4px}
.tl{display:flex;align-items:flex-end;gap:8px;padding:9px 0;text-decoration:none;min-height:44px}
.tl .tn{font:600 1rem var(--font-s);color:var(--muted);min-width:1.4em}
.tl .tx{min-width:0}
.tl .tg{display:block;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
html[lang="hi"] .tl .tg{letter-spacing:0;text-transform:none;font-size:.85rem}
.tl .dots{flex:1;min-width:14px;border-bottom:1.5px dotted var(--muted);transform:translateY(-5px);opacity:.7}
.tl .pg{font:600 1rem var(--font-s);flex:none}
.tl:hover .tx{color:var(--accent)}
.tl .ck{color:var(--good);font-weight:700;margin-left:4px}

/* page content */
.sec{max-width:64ch}
.sec p{margin:.6em 0}
.sec ul,.sec ol{margin:.6em 0;padding-left:1.3em}
.sec li{margin:.45em 0}
.eq{background:var(--soft);border-radius:8px;padding:10px 14px;font:400 1.2rem/1.9 var(--font-m);overflow-x:auto;min-width:0}
figure{margin:20px 0 0;max-width:600px}
figure svg{display:block;width:100%;height:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px}
figcaption{color:var(--muted);font-size:.9rem;margin-top:8px}
figcaption b{color:var(--ink)}
.fbox{background:var(--soft);border-radius:10px;padding:2px 16px;max-width:640px}
.frow{padding:12px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.fl{font-size:.85rem;font-weight:500;color:var(--muted)}
.fx{font:400 1.15rem/1.9 var(--font-m);overflow-x:auto;min-width:0}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .2em;line-height:1.25}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em}
.fr>span:last-child{padding:0 .25em}
.sq{white-space:nowrap}
.sq>span{border-top:1.5px solid currentColor;padding:0 .15em;margin-left:.05em}
.mx,.dt{display:inline-grid;vertical-align:middle;gap:2px 16px;padding:4px 14px;text-align:center;margin:0 .2em;font-family:var(--font-m);line-height:1.5}
.mx.c2,.dt.c2{grid-template-columns:repeat(2,auto)}
.mx.c3,.dt.c3{grid-template-columns:repeat(3,auto)}
.dt{border-left:1.6px solid currentColor;border-right:1.6px solid currentColor}
.mx{border-left:1.6px solid currentColor;border-right:1.6px solid currentColor;background:linear-gradient(currentColor 0 0) left top/6px 1.6px no-repeat,linear-gradient(currentColor 0 0) right top/6px 1.6px no-repeat,linear-gradient(currentColor 0 0) left bottom/6px 1.6px no-repeat,linear-gradient(currentColor 0 0) right bottom/6px 1.6px no-repeat}
.exs{max-width:64ch}
.ex{padding:4px 0 18px}
.ex+.ex{border-top:1px solid var(--line);padding-top:18px}
.exh{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:.92rem;color:var(--accent)}
.pill{border:1px solid var(--line);border-radius:999px;padding:0 10px;font-weight:500;color:var(--muted);font-size:.82rem}
.exq{font-weight:500}
.sol-l{font-weight:600;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
html[lang="hi"] .sol-l{letter-spacing:0;text-transform:none;font-size:.95rem}
.exa{padding-left:12px;border-left:3px solid var(--soft)}
.exa p{margin:.45em 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px 32px}
.two h3{font:700 1.1rem var(--font-s);margin:0 0 4px;color:var(--accent)}
.two ul{list-style:none;margin:0;padding:0}
.two li{position:relative;padding-left:1.5em;margin:.55em 0}
.two li::before{position:absolute;left:0;font-weight:700}
.good li::before{content:"✓";color:var(--good)}
.bad li::before{content:"✗";color:var(--bad)}
.markrow{margin-top:26px}

/* pager */
.pager{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px)}
.pager .in{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:58px}
.pb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:88px;padding:0 14px;border-radius:10px;border:1px solid var(--edge);background:var(--paper);color:var(--ink);font-weight:600;font-size:.92rem;text-decoration:none;white-space:nowrap}
.pb[aria-disabled="true"]{opacity:.35;pointer-events:none}
.pm{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--ink);padding:6px 4px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.pm .pl{font:600 .92rem var(--font-s);white-space:nowrap}
.pm small{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 .72rem var(--font-b);color:var(--muted)}

/* test */
.test{padding-block:22px 64px}
.test h1{font:700 clamp(1.7rem,7vw,2.4rem)/1.15 var(--font-s);margin:0 0 6px}
.test .sub{color:var(--muted);margin:0 0 14px;max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.chip{border:1px solid var(--edge);background:var(--paper);color:var(--ink);font-weight:500;font-size:.92rem;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tq{background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:16px;margin-bottom:14px}
.tq .qh{display:flex;gap:10px;align-items:center;font-size:.85rem;font-weight:600;color:var(--accent);margin-bottom:6px}
.tq .qh span:first-child{font-family:var(--font-s)}
.tq .qt{font-weight:500;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;min-height:44px;background:var(--paper)}
.opt input{margin-top:.4em;accent-color:var(--accent);flex:none}
.opt span{min-width:0}
.opt.ok{border-color:var(--good);background:var(--chem-soft)}
.opt.no{border-color:var(--bad)}
.opt .tick{margin-left:auto;font-weight:700;flex:none}
.opt.ok .tick{color:var(--good)}
.opt.no .tick{color:var(--bad)}
.why{margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:8px;font-size:.95rem}
.why b{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
html[lang="hi"] .why b{letter-spacing:0;text-transform:none;font-size:.9rem}
.why p{margin:.3em 0 0}
.sum{background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:18px;margin:0 0 18px}
.sum .big{font:700 2.4rem/1.1 var(--font-s)}
.sum .big small{font-size:1.1rem;color:var(--muted);font-weight:600}
.sum .row{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:8px;color:var(--muted)}
.sum .row b{color:var(--ink)}
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.cnt{color:var(--muted);font-size:.92rem}

/* diagrams */
svg text{font-family:inherit}
.t{fill:var(--ink);font-size:11.5px}
.tm{fill:var(--muted);font-size:10.5px}
.tb{font-weight:600}
.big{font-size:15px}
.ton{fill:var(--on)}
.f1{fill:var(--accent)}.f2{fill:var(--ink)}.f3{fill:var(--hi)}
.axis{stroke:var(--ink);stroke-width:1.4;fill:none;opacity:.85}
.dash{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;fill:none}
.curve{fill:none;stroke-width:2.4;stroke-linecap:round}
.c1{stroke:var(--accent)}.c2{stroke:var(--ink)}.c3{stroke:var(--hi)}
.vec{stroke:var(--hi);stroke-width:2;fill:none;marker-end:url(#ah)}
.dbl{stroke:var(--ink);stroke-width:1.2;fill:none;marker-start:url(#ai);marker-end:url(#ai)}
.fld{stroke:var(--ink);stroke-width:1.5;fill:none;marker-end:url(#ah)}
.arc{fill:none;stroke:var(--ink);stroke-width:1.2}
.dot{fill:var(--ink)}
.box{fill:var(--soft);stroke:var(--accent);stroke-width:1.4}
.core{fill:var(--accent)}
.b1{fill:var(--accent)}.b2{fill:var(--ink)}.b3{fill:var(--hi)}
.mk-hi{fill:var(--hi)}.mk-ink{fill:var(--ink)}
.pos{fill:var(--hi)}.neg{fill:var(--phys)}
.gs{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:6 4}
.wire{stroke:var(--ink);stroke-width:1.6;fill:none}
.glass{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linejoin:round}
.sol{fill:var(--soft)}
.zn{fill:var(--muted)}.cu{fill:var(--math)}
.br-o{stroke:var(--ink);stroke-width:12;fill:none;stroke-linejoin:round}
.br-i{stroke:var(--soft);stroke-width:8;fill:none;stroke-linejoin:round}
.hl{fill:var(--soft)}
.hl2{fill:var(--accent)}
.brk{stroke:var(--ink);stroke-width:2;fill:none}
.par{fill:var(--soft);stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}

@media (prefers-reduced-motion:reduce){.paper.turn{animation:none}*{scroll-behavior:auto!important}}

.mini[data-subject]{color:var(--accent)}
.selwrap{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.sel{flex:1;min-width:0;min-height:44px;padding:8px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}

/* subject books */
.cover.cvs-physics{--cv:#16284A}
.cover.cvs-chemistry{--cv:#1B4D3E}
.cover.cvs-maths{--cv:#6B3410}
.cv-num.sm{font:700 2.5em/1.05 var(--font-s);margin:.2em 0 .1em;overflow-wrap:anywhere}
.crumb{margin:14px 0 0}
.crumb a{color:var(--accent);text-decoration:none;font-weight:600;font-size:.95rem}
.in>.tbar{margin:0 0 40px}

.tl.soon{opacity:.55;cursor:default}
.tl.soon .pg{font-size:.78rem;white-space:nowrap}

/* 3D interactive figures */
.fig3{max-width:600px}
.d3{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.d3c{display:block;width:100%;touch-action:none;cursor:grab;background:radial-gradient(120% 90% at 50% 0%,var(--soft),var(--paper))}
.d3c:active{cursor:grabbing}
.d3bar{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap;border-top:1px solid var(--line)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:.85rem}
.d3hint{color:var(--muted);font-size:.8rem;margin-left:auto}
.d3pars{padding:2px 12px 10px;display:grid;gap:6px}
.d3p{display:grid;grid-template-columns:minmax(70px,auto) 1fr 3.6em;gap:10px;align-items:center;font-size:.88rem}
.d3p input{width:100%;accent-color:var(--accent)}
.d3p output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.eq{border:1.5px solid var(--accent)}
.def{background:var(--soft);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:12px 0}
.page table,.body table{border-collapse:collapse;width:100%;font-size:.82em;margin:.7em 0}
.page td,.page th,.body td,.body th{border:1px solid var(--line);padding:3px 2px;text-align:center}
.page th,.body th{background:var(--soft)}

.ph.plain{color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg class="hid" aria-hidden="true" focusable="false"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-hi"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-ink"/></marker>
</defs></svg>
<header class="top"><div class="in">
  <a class="brand" href="#home">Venu <i>JEE</i></a>
  <div class="seg" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="hi" aria-pressed="false">हिं</button>
  </div>
</div></header>
<main id="app"></main>

 {lv:'medium',
  q:B('A projectile has the same range for two angles of projection. If one angle is 30°, find the other angle and the ratio of the maximum heights.','एक प्रक्षेप्य के लिए दो प्रक्षेपण कोणों पर परास समान है। यदि एक कोण 30° है, तो दूसरा कोण और अधिकतम ऊँचाइयों का अनुपात ज्ञात करो।'),
  a:B('<p>Angles with the same range add up to 90°, so the other angle is <b>60°</b>.</p><p>H ∝ sin²θ, so H₁ : H₂ = sin²30° : sin²60° = ¼ : ¾ = <b>1 : 3</b>.</p>','<p>समान परास वाले कोणों का योग 90° होता है, इसलिए दूसरा कोण <b>60°</b> है।</p><p>H ∝ sin²θ, इसलिए H₁ : H₂ = sin²30° : sin²60° = ¼ : ¾ = <b>1 : 3</b>।</p>')},
 {lv:'medium',
  q:B('At what angle of projection is the range equal to four times the maximum height?','किस प्रक्षेपण कोण पर परास, अधिकतम ऊँचाई का चार गुना होता है?'),
  a:B('<p>Use tanθ = 4H / R. Given R = 4H, so tanθ = 4H / 4H = 1.</p><p>θ = <b>45°</b></p>','<p>tanθ = 4H / R का प्रयोग करो। दिया है R = 4H, इसलिए tanθ = 4H / 4H = 1।</p><p>θ = <b>45°</b></p>')},
 {lv:'medium',
  q:B('A stone is thrown horizontally at 10 m/s from the top of an 80 m tower. Find the time to reach the ground, the horizontal distance covered, and the speed just before hitting the ground. (g = 10 m/s²)','एक पत्थर को 80 m ऊँची मीनार की चोटी से 10 m/s की चाल से क्षैतिज फेंका गया। धरती तक पहुँचने का समय, क्षैतिज दूरी, और धरती से टकराने से ठीक पहले की चाल ज्ञात करो। (g = 10 m/s²)'),
  a:S('<p>t = √(2h/g) = √(2 × 80 / 10) = √16 = <b>4 s</b></p><p>x = u · t = 10 × 4 = <b>40 m</b></p><p>v<sub>y</sub> = gt = 10 × 4 = 40 m/s, so speed = √(10² + 40²) = √1700 ≈ <b>41.2 m/s</b></p>')},
 {lv:'hard',
  q:B('A particle is projected with speed u at angle θ to the horizontal. Find the radius of curvature of its path at the highest point.','एक कण को u चाल से क्षैतिज से θ कोण पर फेंका गया। उसके पथ का उच्चतम बिंदु पर वक्रता त्रिज्या ज्ञात करो।'),
  a:B('<p>At the highest point, velocity is purely horizontal: v = u cosθ, and the only acceleration is g, acting straight down — exactly centripetal to the path at that instant.</p><p>For circular (curved) motion, centripetal acceleration = v²/r, so g = (u cosθ)² / r.</p><p>r = <b>u² cos²θ / g</b>.</p><p>Check: at θ = 0 (horizontal throw), r = u²/g, matching the usual horizontal-projection result.</p>','<p>उच्चतम बिंदु पर वेग पूर्णतः क्षैतिज है: v = u cosθ, और एकमात्र त्वरण g है, जो सीधे नीचे की ओर है — यह उस क्षण पथ के लिए ठीक अभिकेंद्री त्वरण है।</p><p>वक्रीय गति के लिए, अभिकेंद्री त्वरण = v²/r, इसलिए g = (u cosθ)² / r।</p><p>r = <b>u² cos²θ / g</b>।</p><p>जाँच: θ = 0 (क्षैतिज फेंक) पर r = u²/g मिलता है, जो सामान्य क्षैतिज-प्रक्षेपण परिणाम से मेल खाता है।</p>')}
],
rev:{
 en:['Horizontal velocity never changes. Vertical velocity changes by g every second.','At the highest point v<sub>y</sub> = 0 and the speed is u cosθ, the minimum speed.','Time of flight depends only on the vertical motion.','θ and (90° − θ) give the same range. 45° gives the maximum.','tanθ = 4H/R is a quick shortcut when a question links range and height.','At two points at the same height the speed is the same.'],
 hi:['क्षैतिज वेग कभी नहीं बदलता। ऊर्ध्वाधर वेग हर सेकंड g से बदलता है।','उच्चतम बिंदु पर v<sub>y</sub> = 0 और चाल u cosθ होती है, जो न्यूनतम चाल है।','उड़ान काल केवल ऊर्ध्वाधर गति पर निर्भर करता है।','θ और (90° − θ) पर परास समान होता है। 45° पर अधिकतम होता है।','जब प्रश्न परास और ऊँचाई जोड़े, तो tanθ = 4H/R काम का शॉर्टकट है।','समान ऊँचाई के दो बिंदुओं पर चाल समान होती है।']},
mis:{
 en:['Using g with the wrong sign. Pick one direction as positive and stay with it.','Using u instead of u cosθ for the horizontal distance.','Applying R = u² sin2θ / g when landing height differs from launch height. It works only at the same level.','Calculator in radians while the angle is in degrees.'],
 hi:['g का चिह्न गलत लेना। एक दिशा को धनात्मक चुनो और उसी पर टिके रहो।','क्षैतिज दूरी में u cosθ की जगह u ले लेना।','प्रक्षेपण और गिरने की ऊँचाई अलग हो तब भी R = u² sin2θ / g लगा देना। यह केवल समान स्तर पर लागू होता है।','कोण डिग्री में है पर कैलकुलेटर रेडियन में है।']}
},

/* ===== CHEMISTRY ===== */
{
id:'chemistry-mole-concept', subject:'chemistry', cls:11, ord:1,
title:B('Mole Concept','मोल अवधारणा'),
blurb:B('Counting particles by mass, volume and concentration, plus empirical formulas and limiting reagents.','द्रव्यमान, आयतन और सांद्रता से कणों की गिनती, साथ में मूलानुपाती सूत्र और सीमांत अभिकर्मक।'),
sections:[
 {h:B('What is a mole?','मोल क्या है?'),
  body:B(
   '<p>Atoms and molecules are far too small to count one by one, so chemists count them in bunches. One <b>mole</b> is a bunch of 6.022 × 10²³ particles. That number is the <b>Avogadro constant</b>, N<sub>A</sub>.</p><p>The mass of one mole in grams is the <b>molar mass</b> (M). It equals the atomic or molecular mass in u, numerically. H₂O has molecular mass 18 u, so M = 18 g/mol.</p><p>One mole of any ideal gas at 0 °C and 1 atm occupies <b>22.4 L</b>. If a question defines STP as 0 °C and 1 bar, use 22.7 L instead.</p>',
   '<p>परमाणु और अणु इतने छोटे हैं कि उन्हें एक-एक करके गिनना संभव नहीं, इसलिए रसायनज्ञ उन्हें गुच्छों में गिनते हैं। एक <b>मोल</b> में 6.022 × 10²³ कण होते हैं। इस संख्या को <b>आवोगाद्रो संख्या</b> (N<sub>A</sub>) कहते हैं।</p><p>एक मोल का ग्राम में द्रव्यमान <b>मोलर द्रव्यमान</b> (M) कहलाता है। संख्या में यह परमाणु या अणु द्रव्यमान (u में) के बराबर होता है। H₂O का अणु द्रव्यमान 18 u है, इसलिए M = 18 g/mol।</p><p>0 °C और 1 atm पर किसी भी आदर्श गैस का एक मोल <b>22.4 L</b> आयतन घेरता है। यदि प्रश्न में STP का अर्थ 0 °C और 1 bar दिया हो, तो 22.7 L लो।</p>'),
  dg:'hub',
  cap:B('The mole links mass, number of particles, gas volume and solution strength.','मोल द्रव्यमान, कणों की संख्या, गैस के आयतन और विलयन की सांद्रता को जोड़ता है।')},
 {h:B('Concentration terms','सांद्रता के पद'),
  body:B(
   '<ul><li><b>Molarity (M)</b> = moles of solute / volume of solution in litres. Unit: mol/L.</li><li><b>Molality (m)</b> = moles of solute / mass of solvent in kg. Unit: mol/kg.</li><li><b>Mole fraction</b> x<sub>A</sub> = n<sub>A</sub> / (n<sub>A</sub> + n<sub>B</sub>). All mole fractions in a mixture add up to 1.</li><li><b>Mass percent (w/w)</b> = mass of solute / mass of solution × 100.</li></ul><p>Molarity changes with temperature because the volume changes. Molality and mole fraction do not, since they depend only on mass and moles.</p>',
   '<ul><li><b>मोलरता (M)</b> = विलेय के मोल / विलयन का आयतन लीटर में। मात्रक: mol/L।</li><li><b>मोललता (m)</b> = विलेय के मोल / विलायक का द्रव्यमान kg में। मात्रक: mol/kg।</li><li><b>मोल-अंश</b> x<sub>A</sub> = n<sub>A</sub> / (n<sub>A</sub> + n<sub>B</sub>)। मिश्रण में सभी मोल-अंशों का योग 1 होता है।</li><li><b>द्रव्यमान प्रतिशत (w/w)</b> = विलेय का द्रव्यमान / विलयन का द्रव्यमान × 100।</li></ul><p>तापमान बदलने पर आयतन बदलता है, इसलिए मोलरता बदलती है। मोललता और मोल-अंश केवल द्रव्यमान और मोल पर निर्भर हैं, इसलिए नहीं बदलते।</p>')},
 {h:B('Empirical and molecular formula','मूलानुपाती और आण्विक सूत्र'),
  body:B(
   '<p>The empirical formula is the simplest whole-number ratio of atoms. The molecular formula is the actual number of atoms in one molecule.</p><ol><li>Take 100 g of the compound, so each percentage becomes grams.</li><li>Divide each mass by its atomic mass to get moles.</li><li>Divide all moles by the smallest value.</li><li>If a ratio is not a whole number (like 1.5), multiply everything to make it whole.</li><li>Molecular formula = n × empirical formula, where n = '+F('molecular mass','empirical formula mass')+'.</li></ol>',
   '<p>मूलानुपाती सूत्र परमाणुओं का सरलतम पूर्ण-संख्या अनुपात बताता है। आण्विक सूत्र एक अणु में परमाणुओं की वास्तविक संख्या बताता है।</p><ol><li>यौगिक का 100 g लो, ताकि हर प्रतिशत सीधे ग्राम बन जाए।</li><li>हर द्रव्यमान को परमाणु द्रव्यमान से भाग देकर मोल निकालो।</li><li>सभी मोल को सबसे छोटे मान से भाग दो।</li><li>अनुपात पूर्ण संख्या न हो (जैसे 1.5), तो सबको गुणा करके पूर्ण संख्या बनाओ।</li><li>आण्विक सूत्र = n × मूलानुपाती सूत्र, जहाँ n = '+F('आण्विक द्रव्यमान','मूलानुपाती सूत्र का द्रव्यमान')+'।</li></ol>')},
 {h:B('Limiting reagent','सीमांत अभिकर्मक'),
  body:B(
   '<p>The reactant that gets used up first is the <b>limiting reagent</b>. It decides how much product forms. The other reactant is in excess.</p><ol><li>Write the balanced equation.</li><li>Convert every given amount to moles.</li><li>Divide each by its coefficient. The smallest value is the limiting reagent.</li><li>Calculate the product from the limiting reagent only.</li></ol>',
   '<p>जो अभिकारक सबसे पहले खत्म हो जाता है वह <b>सीमांत अभिकर्मक</b> है। वही तय करता है कि कितना उत्पाद बनेगा। दूसरा अभिकारक आधिक्य में रहता है।</p><ol><li>संतुलित समीकरण लिखो।</li><li>दी गई हर मात्रा को मोल में बदलो।</li><li>हर मोल को उसके गुणांक से भाग दो। सबसे छोटा मान सीमांत अभिकर्मक है।</li><li>उत्पाद की मात्रा केवल सीमांत अभिकर्मक से निकालो।</li></ol>'),
  dg:'lr',
  cap:B('N₂ + 3H₂ → 2NH₃ starting with 2 mol N₂ and 3 mol H₂. Hydrogen runs out first.','N₂ + 3H₂ → 2NH₃, शुरुआत में 2 mol N₂ और 3 mol H₂। हाइड्रोजन पहले खत्म हो जाती है।')}
],
formulas:[
 [B('Moles from mass','द्रव्यमान से मोल'),'n = '+F('m','M')],
 [B('Moles from number of particles','कणों की संख्या से मोल'),'n = '+F('N','N<sub>A</sub>')],
 [B('Moles of gas at 0 °C, 1 atm','0 °C, 1 atm पर गैस के मोल'),'n = '+F('V (litres)','22.4')],
 [B('Molarity','मोलरता'),'M = '+F('moles of solute','volume of solution (L)')],
 [B('Molality','मोललता'),'m = '+F('moles of solute','mass of solvent (kg)')],
 [B('Mole fraction','मोल-अंश'),'x<sub>A</sub> = '+F('n<sub>A</sub>','n<sub>A</sub> + n<sub>B</sub>')],
 [B('Dilution','तनुकरण'),'M<sub>1</sub>V<sub>1</sub> = M<sub>2</sub>V<sub>2</sub>'],
 [B('Molecular formula multiplier','आण्विक सूत्र का गुणक'),'n = '+F('molecular mass','empirical formula mass')]

examples:[
 {lv:'easy',
  q:B('How many molecules are in 18 g of water? How many hydrogen atoms?','18 g जल में कितने अणु होते हैं? हाइड्रोजन के कितने परमाणु?'),
  a:B('<p>M(H₂O) = 18 g/mol, so n = 18 / 18 = 1 mol.</p><p>Molecules = 1 × 6.022 × 10²³ = <b>6.022 × 10²³</b></p><p>Each molecule has 2 H atoms, so H atoms = <b>1.204 × 10²⁴</b>.</p>','<p>M(H₂O) = 18 g/mol, इसलिए n = 18 / 18 = 1 mol।</p><p>अणु = 1 × 6.022 × 10²³ = <b>6.022 × 10²³</b></p><p>हर अणु में 2 H परमाणु हैं, इसलिए H परमाणु = <b>1.204 × 10²⁴</b>।</p>')},
 {lv:'easy',
  q:B('What volume does 11 g of CO₂ occupy at 0 °C and 1 atm?','0 °C और 1 atm पर 11 g CO₂ कितना आयतन घेरेगी?'),
  a:B('<p>M(CO₂) = 44 g/mol, so n = 11 / 44 = 0.25 mol.</p><p>V = 0.25 × 22.4 = <b>5.6 L</b></p>','<p>M(CO₂) = 44 g/mol, इसलिए n = 11 / 44 = 0.25 mol।</p><p>V = 0.25 × 22.4 = <b>5.6 L</b></p>')},
 {lv:'easy',
  q:B('4 g of NaOH is dissolved in water to make 500 mL of solution. Find the molarity.','4 g NaOH को जल में घोलकर 500 mL विलयन बनाया गया। मोलरता ज्ञात करो।'),
  a:B('<p>M(NaOH) = 40 g/mol, so n = 4 / 40 = 0.1 mol.</p><p>V = 500 mL = 0.5 L.</p><p>Molarity = 0.1 / 0.5 = <b>0.2 M</b></p>','<p>M(NaOH) = 40 g/mol, इसलिए n = 4 / 40 = 0.1 mol।</p><p>V = 500 mL = 0.5 L।</p><p>मोलरता = 0.1 / 0.5 = <b>0.2 M</b></p>')},
 {lv:'medium',
  q:B('A compound has 40% C, 6.7% H and 53.3% O by mass. Its molar mass is 180 g/mol. Find the empirical and molecular formulas.','एक यौगिक में द्रव्यमान से 40% C, 6.7% H और 53.3% O है। इसका मोलर द्रव्यमान 180 g/mol है। मूलानुपाती और आण्विक सूत्र ज्ञात करो।'),
  a:B('<p>In 100 g: C = 40/12 = 3.33 mol, H = 6.7/1 = 6.7 mol, O = 53.3/16 = 3.33 mol.</p><p>Divide by 3.33: C : H : O = 1 : 2 : 1. Empirical formula = <b>CH₂O</b> (mass 30).</p><p>n = 180 / 30 = 6, so molecular formula = <b>C₆H₁₂O₆</b>.</p>','<p>100 g में: C = 40/12 = 3.33 mol, H = 6.7/1 = 6.7 mol, O = 53.3/16 = 3.33 mol।</p><p>3.33 से भाग देने पर C : H : O = 1 : 2 : 1। मूलानुपाती सूत्र = <b>CH₂O</b> (द्रव्यमान 30)।</p><p>n = 180 / 30 = 6, इसलिए आण्विक सूत्र = <b>C₆H₁₂O₆</b>।</p>')},
 {lv:'medium',
  q:B('2 mol N₂ reacts with 3 mol H₂ to form NH₃. Find the limiting reagent and the mass of NH₃ formed.','2 mol N₂ और 3 mol H₂ अभिक्रिया करके NH₃ बनाते हैं। सीमांत अभिकर्मक और बने NH₃ का द्रव्यमान ज्ञात करो।'),
  a:B('<p>N₂ + 3H₂ → 2NH₃</p><p>N₂: 2 / 1 = 2. H₂: 3 / 3 = 1. The smaller value is H₂, so <b>H₂ is limiting</b>.</p><p>NH₃ formed = 3 × (2/3) = 2 mol. Mass = 2 × 17 = <b>34 g</b>.</p><p>N₂ used = 1 mol, so 1 mol N₂ is left over.</p>','<p>N₂ + 3H₂ → 2NH₃</p><p>N₂: 2 / 1 = 2। H₂: 3 / 3 = 1। छोटा मान H₂ का है, इसलिए <b>H₂ सीमांत है</b>।</p><p>बना NH₃ = 3 × (2/3) = 2 mol। द्रव्यमान = 2 × 17 = <b>34 g</b>।</p><p>N₂ का उपयोग = 1 mol, इसलिए 1 mol N₂ बच जाती है।</p>')},
 {lv:'medium',
  q:B('How much water must be added to 100 mL of 2 M HCl to make it 0.5 M? Assume volumes add.','100 mL 2 M HCl को 0.5 M बनाने के लिए कितना जल मिलाना होगा? आयतन जुड़ते हैं, मानो।'),
  a:B('<p>M₁V₁ = M₂V₂ gives 2 × 100 = 0.5 × V₂, so V₂ = 400 mL.</p><p>Water to add = 400 − 100 = <b>300 mL</b></p>','<p>M₁V₁ = M₂V₂ से 2 × 100 = 0.5 × V₂, इसलिए V₂ = 400 mL।</p><p>मिलाने वाला जल = 400 − 100 = <b>300 mL</b></p>')}
],
rev:{
 en:['1 mole = 6.022 × 10²³ particles. The particles can be atoms, molecules, ions or electrons.','n = m / M is the workhorse. Most problems start by converting to moles.','Molarity changes with temperature. Molality does not.','Mole fractions of all components add up to 1.','To find the limiting reagent, compare moles divided by coefficient, never grams.','Ask “atoms or molecules?” Each H₂O molecule has 3 atoms.'],
 hi:['1 मोल = 6.022 × 10²³ कण। ये कण परमाणु, अणु, आयन या इलेक्ट्रॉन हो सकते हैं।','n = m / M सबसे ज़्यादा काम आने वाला सूत्र है। अधिकतर प्रश्न मोल निकालने से शुरू होते हैं।','मोलरता तापमान से बदलती है। मोललता नहीं बदलती।','सभी घटकों के मोल-अंशों का योग 1 होता है।','सीमांत अभिकर्मक के लिए मोल ÷ गुणांक की तुलना करो, ग्राम की कभी नहीं।','पूछो: “परमाणु या अणु?” H₂O के हर अणु में 3 परमाणु होते हैं।']},
mis:{

blurb:B('Roots, discriminant, sum and product of roots, and the parabola behind every quadratic.','मूल, विविक्तकर, मूलों का योग और गुणनफल, और हर द्विघात के पीछे का परवलय।'),
sections:[

  body:B(
   '<p>A quadratic equation has the form <b>ax² + bx + c = 0</b> with a ≠ 0. Its two roots (zeroes) come from the quadratic formula:</p><p class="eq">x = '+F('−b ± '+R('b² − 4ac'),'2a')+'</p><p>The expression under the root, <b>D = b² − 4ac</b>, is the <b>discriminant</b>. It tells you about the roots without solving.</p>',
   '<p>द्विघात समीकरण का रूप <b>ax² + bx + c = 0</b> होता है, जहाँ a ≠ 0। इसके दो मूल (शून्यक) द्विघात सूत्र से मिलते हैं:</p><p class="eq">x = '+F('−b ± '+R('b² − 4ac'),'2a')+'</p><p>मूल के नीचे की राशि <b>D = b² − 4ac</b> को <b>विविक्तकर</b> (discriminant) कहते हैं। यह समीकरण हल किए बिना ही मूलों की प्रकृति बता देता है।</p>')},
 {h:B('Nature of the roots','मूलों की प्रकृति'),
  body:B(
   '<p>For real a, b, c:</p><ul><li><b>D &gt; 0:</b> two distinct real roots. The parabola cuts the x-axis at two points.</li><li><b>D = 0:</b> two equal real roots, x = −b/2a. The parabola just touches the x-axis.</li><li><b>D &lt; 0:</b> two non-real complex roots that are conjugates. The parabola never meets the x-axis.</li></ul><p>If a, b, c are rational and D is a perfect square, the roots are rational. If D &gt; 0 but not a perfect square, the roots are irrational conjugates.</p>',
   '<p>वास्तविक a, b, c के लिए:</p><ul><li><b>D &gt; 0:</b> दो भिन्न वास्तविक मूल। परवलय x-अक्ष को दो बिंदुओं पर काटता है।</li><li><b>D = 0:</b> दो बराबर वास्तविक मूल, x = −b/2a। परवलय x-अक्ष को केवल छूता है।</li><li><b>D &lt; 0:</b> दो अवास्तविक (सम्मिश्र) मूल, जो संयुग्मी होते हैं। परवलय x-अक्ष से कभी नहीं मिलता।</li></ul><p>यदि a, b, c परिमेय हैं और D पूर्ण वर्ग है, तो मूल परिमेय होते हैं। यदि D &gt; 0 है पर पूर्ण वर्ग नहीं, तो मूल अपरिमेय संयुग्मी होते हैं।</p>'),

  cap:B('The three cases for a &gt; 0.','a &gt; 0 के लिए तीन स्थितियाँ।')},
 {h:B('Sum and product of roots','मूलों का योग और गुणनफल'),
  body:B(
   '<p>If α and β are the roots, then</p><ul><li>α + β = −b/a</li><li>αβ = c/a</li></ul><p>In the other direction, the equation with roots α and β is <b>x² − (α + β)x + αβ = 0</b>.</p><p>JEE questions use these to find expressions like α² + β² without solving for α and β:</p><ul><li>α² + β² = (α + β)² − 2αβ</li><li>α³ + β³ = (α + β)³ − 3αβ(α + β)</li><li>|α − β| = √D / |a|</li></ul>',

/* ===== PHYSICS 12 ===== */
{
id:'physics-electrostatics', subject:'physics', cls:12, ord:1,
title:B('Electrostatics','स्थिर वैद्युतिकी'),
blurb:B('Coulomb’s law, electric field, Gauss’s law and electric potential.','कूलॉम का नियम, विद्युत क्षेत्र, गाउस का नियम और विद्युत विभव।'),
sections:[
 {h:B('Charge and Coulomb’s law','आवेश और कूलॉम का नियम'),
  body:B(
   '<p>Electric charge is of two kinds, positive and negative. Like charges repel and unlike charges attract. Charge is <b>quantised</b> (q = ne, where e = 1.6 × 10⁻¹⁹ C) and it is <b>conserved</b>.</p><p><b>Coulomb’s law.</b> The force between two point charges q₁ and q₂ at a distance r in vacuum is</p><p class="eq">F = k '+F('q₁q₂','r²')+'</p><p>where k = 1/(4πε₀) = 9 × 10⁹ N m²/C². In a medium of dielectric constant K the force becomes K times smaller.</p><p>With many charges, the net force on one charge is the <b>vector sum</b> of the forces due to each of the others. This is the superposition principle.</p>',
   '<p>विद्युत आवेश दो प्रकार का होता है, धनात्मक और ऋणात्मक। सजातीय आवेश एक-दूसरे को प्रतिकर्षित करते हैं और विजातीय आवेश आकर्षित करते हैं। आवेश <b>क्वांटित</b> है (q = ne, जहाँ e = 1.6 × 10⁻¹⁹ C) और <b>संरक्षित</b> रहता है।</p><p><b>कूलॉम का नियम।</b> निर्वात में r दूरी पर रखे दो बिंदु आवेशों q₁ और q₂ के बीच बल</p><p class="eq">F = k '+F('q₁q₂','r²')+'</p><p>होता है, जहाँ k = 1/(4πε₀) = 9 × 10⁹ N m²/C²। परावैद्युतांक K वाले माध्यम में बल K गुना कम हो जाता है।</p><p>कई आवेश हों तो किसी एक आवेश पर कुल बल बाकी सभी आवेशों से लगने वाले बलों का <b>सदिश योग</b> होता है। यही अध्यारोपण का सिद्धांत है।</p>'),
  dg:'coul',
  cap:B('Two like charges repel each other with equal and opposite forces.','दो सजातीय आवेश समान परिमाण और विपरीत दिशा के बलों से एक-दूसरे को प्रतिकर्षित करते हैं।')},
 {h:B('Electric field and the dipole','विद्युत क्षेत्र और द्विध्रुव'),
  body:B(
   '<p>The <b>electric field</b> at a point is the force per unit positive test charge, E = F/q₀. For a point charge Q, E = kQ/r². It points away from Q if Q is positive and towards Q if Q is negative.</p><p><b>Field lines</b> start on positive charges and end on negative charges. They never cross. Where the lines are closer, the field is stronger, and the tangent to a line gives the direction of E.</p><p>An <b>electric dipole</b> is a pair of equal and opposite charges ±q separated by a small distance 2a. Its dipole moment is p = q × 2a, directed from −q to +q.</p><ul><li>On the axis: E = 2kp / r³ (for r ≫ a), along p.</li><li>On the equatorial line: E = kp / r³, opposite to p.</li><li>In a uniform field: torque τ = pE sinθ and potential energy U = −pE cosθ.</li></ul>',
   '<p>किसी बिंदु पर <b>विद्युत क्षेत्र</b> प्रति इकाई धनात्मक परीक्षण आवेश पर लगने वाला बल है, E = F/q₀। बिंदु आवेश Q के लिए E = kQ/r²। Q धनात्मक हो तो क्षेत्र Q से दूर की ओर और ऋणात्मक हो तो Q की ओर होता है।</p><p><b>क्षेत्र रेखाएँ</b> धनात्मक आवेश से शुरू होकर ऋणात्मक आवेश पर समाप्त होती हैं। ये कभी एक-दूसरे को नहीं काटतीं। जहाँ रेखाएँ पास-पास हों वहाँ क्षेत्र प्रबल होता है, और रेखा की स्पर्श रेखा E की दिशा बताती है।</p><p><b>विद्युत द्विध्रुव</b> छोटी दूरी 2a पर रखे बराबर और विपरीत आवेशों ±q का जोड़ा है। इसका द्विध्रुव आघूर्ण p = q × 2a होता है, जिसकी दिशा −q से +q की ओर है।</p><ul><li>अक्षीय स्थिति पर: E = 2kp / r³ (r ≫ a के लिए), p की दिशा में।</li><li>निरक्षीय रेखा पर: E = kp / r³, p के विपरीत दिशा में।</li><li>एकसमान क्षेत्र में: बल आघूर्ण τ = pE sinθ और स्थितिज ऊर्जा U = −pE cosθ।</li></ul>'),
  dg:'dipole',
  cap:B('Field lines of an electric dipole. The lines leave +q and end on −q.','विद्युत द्विध्रुव की क्षेत्र रेखाएँ। रेखाएँ +q से निकलकर −q पर समाप्त होती हैं।')},
 {h:B('Gauss’s law','गाउस का नियम'),
  body:B(
   '<p>The <b>electric flux</b> through a surface is Φ = ∮ E · dA. <b>Gauss’s law</b> says the total flux through any closed surface equals the enclosed charge divided by ε₀.</p><p class="eq">Φ = ∮ E · dA = '+F('q<sub>enc</sub>','ε₀')+'</p><p>Choose a Gaussian surface that matches the symmetry, so that E is constant over it.</p><ul><li><b>Point charge or charged sphere</b>, outside: E = kQ/r².</li><li><b>Thin spherical shell:</b> E = 0 inside, kQ/r² outside.</li><li><b>Solid non-conducting sphere</b>, inside: E = kQr/R³.</li><li><b>Infinite line charge</b> (λ per unit length): E = λ / (2πε₀r).</li><li><b>Infinite plane sheet</b> (σ per unit area): E = σ / 2ε₀. Just outside a conductor: E = σ/ε₀.</li></ul>',
   '<p>किसी पृष्ठ से गुज़रने वाला <b>विद्युत फ्लक्स</b> Φ = ∮ E · dA है। <b>गाउस का नियम</b> कहता है कि किसी भी बंद पृष्ठ से कुल फ्लक्स, उसके भीतर के आवेश को ε₀ से भाग देने पर मिलता है।</p><p class="eq">Φ = ∮ E · dA = '+F('q<sub>enc</sub>','ε₀')+'</p><p>ऐसा गाउसीय पृष्ठ चुनो जो सममिति से मेल खाए, ताकि उस पर E स्थिर रहे।</p><ul><li><b>बिंदु आवेश या आवेशित गोला</b>, बाहर: E = kQ/r²।</li><li><b>पतला गोलीय कोश:</b> भीतर E = 0, बाहर kQ/r²।</li><li><b>ठोस अचालक गोला</b>, भीतर: E = kQr/R³।</li><li><b>अनंत रेखीय आवेश</b> (λ प्रति इकाई लंबाई): E = λ / (2πε₀r)।</li><li><b>अनंत समतल चादर</b> (σ प्रति इकाई क्षेत्रफल): E = σ / 2ε₀। चालक के ठीक बाहर: E = σ/ε₀।</li></ul>'),
  dg:'gauss',
  cap:B('A charge q at the centre of a spherical Gaussian surface. The field is radial and the same all over the surface.','गोलीय गाउसीय पृष्ठ के केंद्र में आवेश q। क्षेत्र त्रिज्य है और पूरे पृष्ठ पर समान है।')},
 {h:B('Electric potential','विद्युत विभव'),
  body:B(
   '<p>The <b>electric potential</b> at a point is the work done per unit positive charge in bringing it from infinity to that point. For a point charge, V = kq/r. Potential is a scalar, so potentials from several charges add as ordinary numbers, with their signs.</p><ul><li>Work done in moving a charge q from A to B: W = q (V<sub>B</sub> − V<sub>A</sub>).</li><li>Field and potential: E = −dV/dr. The field points towards falling potential.</li><li>Potential energy of two point charges: U = k q₁q₂ / r.</li><li><b>Equipotential surfaces</b> are always perpendicular to the field lines. No work is done in moving a charge along one.</li><li>Inside a conductor E = 0 and the potential is the same everywhere.</li></ul>',
   '<p>किसी बिंदु पर <b>विद्युत विभव</b> अनंत से उस बिंदु तक इकाई धनात्मक आवेश लाने में किया गया कार्य है। बिंदु आवेश के लिए V = kq/r। विभव अदिश राशि है, इसलिए कई आवेशों के विभव चिह्न सहित साधारण संख्याओं की तरह जुड़ते हैं।</p><ul><li>आवेश q को A से B तक ले जाने में कार्य: W = q (V<sub>B</sub> − V<sub>A</sub>)।</li><li>क्षेत्र और विभव: E = −dV/dr। क्षेत्र घटते विभव की ओर होता है।</li><li>दो बिंदु आवेशों की स्थितिज ऊर्जा: U = k q₁q₂ / r।</li><li><b>समविभव पृष्ठ</b> सदैव क्षेत्र रेखाओं के लंबवत होते हैं। इन पर आवेश चलाने में कोई कार्य नहीं होता।</li><li>चालक के भीतर E = 0 और विभव हर जगह समान रहता है।</li></ul>')}
],

 {lv:'medium',
  q:B('Charges +4 μC and +1 μC are 30 cm apart. Find the point on the line joining them where the net field is zero.','+4 μC और +1 μC के आवेश 30 cm दूर हैं। उन्हें मिलाने वाली रेखा पर वह बिंदु ज्ञात करो जहाँ कुल क्षेत्र शून्य हो।'),
  a:B('<p>The point lies between them, at distance x from the 4 μC charge. The two fields cancel there.</p><p>k·4 / x² = k·1 / (0.3 − x)², so 2 / x = 1 / (0.3 − x).</p><p>2(0.3 − x) = x, so x = <b>0.2 m</b> from the 4 μC charge (0.1 m from the 1 μC charge).</p>','<p>बिंदु दोनों के बीच होगा, 4 μC आवेश से दूरी x पर। वहाँ दोनों क्षेत्र एक-दूसरे को काटते हैं।</p><p>k·4 / x² = k·1 / (0.3 − x)², इसलिए 2 / x = 1 / (0.3 − x)।</p><p>2(0.3 − x) = x, इसलिए x = 0.2 m, यानी 4 μC आवेश से <b>0.2 m</b> (1 μC आवेश से 0.1 m)।</p>')},

 {lv:'hard',
  q:B('A charge of 8.85 nC sits at the centre of a cube. Find the total flux through the cube and the flux through one face. (ε₀ = 8.85 × 10⁻¹² C²/N m²)','8.85 nC का आवेश एक घन के केंद्र पर रखा है। घन से कुल फ्लक्स और एक फलक से फ्लक्स ज्ञात करो। (ε₀ = 8.85 × 10⁻¹² C²/N m²)'),
  a:B('<p>Total flux = q / ε₀ = 8.85 × 10⁻⁹ / 8.85 × 10⁻¹² = <b>1000 N m²/C</b>.</p><p>By symmetry the six faces share it equally: 1000 / 6 ≈ <b>167 N m²/C</b> per face.</p>','<p>कुल फ्लक्स = q / ε₀ = 8.85 × 10⁻⁹ / 8.85 × 10⁻¹² = <b>1000 N m²/C</b>।</p><p>सममिति के कारण छहों फलकों में यह बराबर बँटता है: 1000 / 6 ≈ प्रति फलक <b>167 N m²/C</b>।</p>')},
 {lv:'easy',
  q:B('Find the potential at 0.9 m from a 10 nC charge. How much work is needed to bring a 2 nC charge from infinity to that point?','10 nC के आवेश से 0.9 m दूरी पर विभव ज्ञात करो। 2 nC का आवेश अनंत से उस बिंदु तक लाने में कितना कार्य करना होगा?'),
  a:S('<p>V = kq / r = 9 × 10⁹ × 10 × 10⁻⁹ / 0.9 = 90 / 0.9 = <b>100 V</b></p><p>W = qV = 2 × 10⁻⁹ × 100 = <b>2 × 10⁻⁷ J</b></p>')}
],
rev:{
 en:['Force and field are vectors. Potential and energy are scalars.','Field lines never cross and always start on + and end on −.','Gauss’s law needs a closed surface. Only the enclosed charge counts.','Inside a thin charged shell E = 0, but the potential equals its value at the surface.','Equipotential surfaces are perpendicular to field lines.','On the axis of a dipole the field is twice the equatorial field at the same distance.'],
 hi:['बल और क्षेत्र सदिश हैं। विभव और ऊर्जा अदिश हैं।','क्षेत्र रेखाएँ कभी नहीं कटतीं और + से शुरू होकर − पर समाप्त होती हैं।','गाउस के नियम के लिए बंद पृष्ठ चाहिए। केवल भीतर का आवेश गिना जाता है।','पतले आवेशित कोश के भीतर E = 0, पर विभव पृष्ठ के विभव के बराबर रहता है।','समविभव पृष्ठ क्षेत्र रेखाओं के लंबवत होते हैं।','समान दूरी पर द्विध्रुव का अक्षीय क्षेत्र, निरक्षीय क्षेत्र का दोगुना होता है।']},
mis:{
 en:['Using cm or μC directly. Convert to m and C first.','Adding magnitudes of fields at a point instead of adding vectors.','Forgetting that a point where E = 0 need not have V = 0.','Using the line-charge or sheet formula for a finite object.'],
 hi:['cm या μC सीधे लगा देना। पहले m और C में बदलो।','किसी बिंदु पर क्षेत्रों को सदिश की तरह जोड़ने की जगह केवल परिमाण जोड़ देना।','यह भूल जाना कि जहाँ E = 0 हो वहाँ V = 0 होना ज़रूरी नहीं।','सीमित आकार की वस्तु पर अनंत रेखा या चादर का सूत्र लगा देना।']}
},

/* ===== CHEMISTRY 12 ===== */
{
id:'chemistry-electrochemistry', subject:'chemistry', cls:12, ord:1,
title:B('Electrochemistry','वैद्युतरसायन'),
blurb:B('Galvanic cells, electrode potential, the Nernst equation and Faraday’s laws.','गैल्वनिक सेल, इलेक्ट्रोड विभव, नेर्न्स्ट समीकरण और फैराडे के नियम।'),
sections:[
 {h:B('The galvanic cell','गैल्वनिक सेल'),
  body:B(
   '<p>A <b>galvanic (voltaic) cell</b> turns the energy of a spontaneous redox reaction into electrical energy. The Daniell cell uses zinc and copper:</p><p class="eq">Zn | Zn²⁺ (1 M) || Cu²⁺ (1 M) | Cu</p><ul><li><b>Anode</b> (negative): oxidation. Zn → Zn²⁺ + 2e⁻.</li><li><b>Cathode</b> (positive): reduction. Cu²⁺ + 2e⁻ → Cu.</li><li>Electrons flow in the outside wire from anode to cathode. Conventional current flows the other way.</li><li>The <b>salt bridge</b> lets ions move between the two beakers. It keeps each solution electrically neutral and completes the circuit.</li></ul><p>Remember: <b>An Ox</b> (anode, oxidation) and <b>Red Cat</b> (reduction, cathode).</p>',
   '<p><b>गैल्वनिक (वोल्टीय) सेल</b> स्वतः होने वाली रेडॉक्स अभिक्रिया की ऊर्जा को विद्युत ऊर्जा में बदलता है। डेनियल सेल में जिंक और कॉपर होते हैं:</p><p class="eq">Zn | Zn²⁺ (1 M) || Cu²⁺ (1 M) | Cu</p><ul><li><b>ऐनोड</b> (ऋणात्मक): उपचयन। Zn → Zn²⁺ + 2e⁻।</li><li><b>कैथोड</b> (धनात्मक): अपचयन। Cu²⁺ + 2e⁻ → Cu।</li><li>बाहरी तार में इलेक्ट्रॉन ऐनोड से कैथोड की ओर बहते हैं। परंपरागत धारा उल्टी दिशा में मानी जाती है।</li><li><b>लवण सेतु</b> दोनों बीकरों के बीच आयनों को चलने देता है। यह हर विलयन को विद्युत उदासीन रखता है और परिपथ पूरा करता है।</li></ul><p>याद रखो: <b>An Ox</b> (ऐनोड पर उपचयन) और <b>Red Cat</b> (कैथोड पर अपचयन)।</p>'),
  dg:'daniell',
  cap:B('The Daniell cell. Electrons flow from the zinc anode to the copper cathode through the wire.','डेनियल सेल। इलेक्ट्रॉन तार से होकर जिंक ऐनोड से कॉपर कैथोड की ओर बहते हैं।')},
 {h:B('Electrode potential and EMF','इलेक्ट्रोड विभव और विद्युत वाहक बल'),
  body:B(
   '<p>The <b>standard electrode potential</b> E° of a half-cell is measured against the standard hydrogen electrode (SHE), which is fixed at 0 V. Tables list E° as <b>reduction potentials</b> at 298 K, 1 M and 1 atm.</p><ul><li>Zn²⁺/Zn: −0.76 V</li><li>Fe²⁺/Fe: −0.44 V</li><li>H⁺/H₂: 0.00 V</li><li>Cu²⁺/Cu: +0.34 V</li><li>Ag⁺/Ag: +0.80 V</li></ul><p>For a cell, with both values taken as reduction potentials:</p><p class="eq">E°<sub>cell</sub> = E°<sub>cathode</sub> − E°<sub>anode</sub></p><p>The half-cell with the higher reduction potential becomes the cathode. A reaction is spontaneous when E°<sub>cell</sub> &gt; 0. A species with a higher E° is a stronger oxidising agent.</p>',
   '<p>अर्ध-सेल का <b>मानक इलेक्ट्रोड विभव</b> E° मानक हाइड्रोजन इलेक्ट्रोड (SHE) के सापेक्ष मापा जाता है, जिसका मान 0 V तय है। सारणियों में E° को 298 K, 1 M और 1 atm पर <b>अपचयन विभव</b> के रूप में लिखा जाता है।</p><ul><li>Zn²⁺/Zn: −0.76 V</li><li>Fe²⁺/Fe: −0.44 V</li><li>H⁺/H₂: 0.00 V</li><li>Cu²⁺/Cu: +0.34 V</li><li>Ag⁺/Ag: +0.80 V</li></ul><p>किसी सेल के लिए, दोनों मान अपचयन विभव लेकर:</p><p class="eq">E°<sub>cell</sub> = E°<sub>cathode</sub> − E°<sub>anode</sub></p><p>जिस अर्ध-सेल का अपचयन विभव अधिक होता है वह कैथोड बनता है। जब E°<sub>cell</sub> &gt; 0 हो, तो अभिक्रिया स्वतः होती है। जिस स्पीशीज़ का E° अधिक हो वह प्रबल ऑक्सीकारक होती है।</p>')},
 {h:B('The Nernst equation','नेर्न्स्ट समीकरण'),
  body:B(
   '<p>When concentrations are not 1 M, the cell potential changes. For a reaction in which n electrons are transferred:</p><p class="eq">E = E° − '+F('RT','nF')+' ln Q</p><p>At 298 K this becomes</p><p class="eq">E = E° − '+F('0.0591','n')+' log Q</p><p>Q is the reaction quotient. Solids and pure liquids are left out of Q.</p><ul><li>At equilibrium E = 0 and Q = K, so log K = nE° / 0.0591.</li><li>Gibbs energy: ΔG° = −nFE°, and ΔG = −nFE. Here F = 96500 C/mol.</li><li>A <b>concentration cell</b> has the same electrode on both sides, so E° = 0. Its potential depends only on the ratio of concentrations.</li></ul>',
   '<p>जब सांद्रताएँ 1 M नहीं होतीं, तो सेल विभव बदल जाता है। जिस अभिक्रिया में n इलेक्ट्रॉन स्थानांतरित होते हैं उसके लिए:</p><p class="eq">E = E° − '+F('RT','nF')+' ln Q</p><p>298 K पर यह बन जाता है</p><p class="eq">E = E° − '+F('0.0591','n')+' log Q</p><p>Q अभिक्रिया भागफल है। ठोस और शुद्ध द्रव Q में नहीं लिखे जाते।</p><ul><li>साम्यावस्था पर E = 0 और Q = K, इसलिए log K = nE° / 0.0591।</li><li>गिब्स ऊर्जा: ΔG° = −nFE° और ΔG = −nFE। यहाँ F = 96500 C/mol।</li><li><b>सांद्रता सेल</b> में दोनों ओर समान इलेक्ट्रोड होते हैं, इसलिए E° = 0। इसका विभव केवल सांद्रताओं के अनुपात पर निर्भर करता है।</li></ul>'),
  dg:'nernst',
  cap:B('E falls in a straight line as log Q grows, and reaches zero when Q = K.','log Q बढ़ने पर E सीधी रेखा में घटता है और Q = K पर शून्य हो जाता है।')},
 {h:B('Electrolysis and Faraday’s laws','विद्युत अपघटन और फैराडे के नियम'),
  body:B(
   '<p>In <b>electrolysis</b> an external source forces a non-spontaneous reaction to happen. Reduction still occurs at the cathode and oxidation at the anode, but now the cathode is the negative electrode.</p><p><b>First law.</b> The mass deposited is proportional to the charge passed.</p><p class="eq">m = '+F('M','nF')+' × Q'+SP+'where Q = I × t</p><p><b>Second law.</b> For the same charge, the masses deposited are in the ratio of the equivalent masses:</p><p class="eq">'+F('m₁','m₂')+' = '+F('E₁','E₂')+'</p><ul><li>One mole of electrons carries 1 F = 96500 C.</li><li>To deposit 1 mole of a metal ion M<sup>n+</sup> you need n faradays.</li><li>In aqueous electrolysis, water can compete: H₂ may form at the cathode and O₂ at the anode.</li></ul>',
   '<p><b>विद्युत अपघटन</b> में बाहरी स्रोत एक ऐसी अभिक्रिया को कराता है जो स्वतः नहीं होती। कैथोड पर अब भी अपचयन और ऐनोड पर उपचयन होता है, पर अब कैथोड ऋणात्मक इलेक्ट्रोड होता है।</p><p><b>पहला नियम।</b> जमा हुआ द्रव्यमान प्रवाहित आवेश के समानुपाती होता है।</p><p class="eq">m = '+F('M','nF')+' × Q'+SP+'जहाँ Q = I × t</p><p><b>दूसरा नियम।</b> समान आवेश के लिए जमा द्रव्यमान तुल्यांकी द्रव्यमानों के अनुपात में होते हैं:</p><p class="eq">'+F('m₁','m₂')+' = '+F('E₁','E₂')+'</p><ul><li>इलेक्ट्रॉनों के एक मोल पर 1 F = 96500 C आवेश होता है।</li><li>धातु आयन M<sup>n+</sup> का 1 मोल जमा करने के लिए n फैराडे चाहिए।</li><li>जलीय विद्युत अपघटन में जल भी प्रतिस्पर्धा करता है: कैथोड पर H₂ और ऐनोड पर O₂ बन सकती है।</li></ul>')}
],
formulas:[
 [B('Cell EMF','सेल का विद्युत वाहक बल'),'E°<sub>cell</sub> = E°<sub>cathode</sub> − E°<sub>anode</sub>'],
 [B('Nernst equation','नेर्न्स्ट समीकरण'),'E = E° − '+F('RT','nF')+' ln Q'],
 [B('Nernst equation at 298 K','298 K पर नेर्न्स्ट समीकरण'),'E = E° − '+F('0.0591','n')+' log Q'],
 [B('Gibbs energy','गिब्स ऊर्जा'),'ΔG° = −nFE°'],
 [B('Equilibrium constant at 298 K','298 K पर साम्य नियतांक'),'log K = '+F('nE°','0.0591')],
 [B('Charge','आवेश'),'Q = I × t'],
 [B('Faraday’s first law','फैराडे का पहला नियम'),'m = '+F('M','nF')+' × I t'],
 [B('Faraday constant','फैराडे नियतांक'),'F = 96500 C mol⁻¹']

examples:[
 {lv:'easy',
  q:B('Find E°cell and ΔG° for Zn | Zn²⁺ || Cu²⁺ | Cu. (E°Zn²⁺/Zn = −0.76 V, E°Cu²⁺/Cu = +0.34 V)','Zn | Zn²⁺ || Cu²⁺ | Cu के लिए E°cell और ΔG° ज्ञात करो। (E°Zn²⁺/Zn = −0.76 V, E°Cu²⁺/Cu = +0.34 V)'),
  a:S('<p>E°cell = 0.34 − (−0.76) = <b>1.10 V</b></p><p>n = 2, so ΔG° = −nFE° = −2 × 96500 × 1.10 = −212300 J ≈ <b>−212.3 kJ/mol</b></p>')},
 {lv:'easy',
  q:B('Can copper reduce Zn²⁺ ions to zinc under standard conditions?','क्या मानक परिस्थितियों में कॉपर Zn²⁺ आयनों को अपचयित करके जिंक बना सकता है?'),
  a:B('<p>The reaction is Zn²⁺ + Cu → Zn + Cu²⁺.</p><p>E°cell = E°(Zn²⁺/Zn) − E°(Cu²⁺/Cu) = −0.76 − 0.34 = −1.10 V.</p><p>E°cell is negative, so the reaction is <b>not spontaneous</b>. Copper cannot do it.</p>','<p>अभिक्रिया है Zn²⁺ + Cu → Zn + Cu²⁺।</p><p>E°cell = E°(Zn²⁺/Zn) − E°(Cu²⁺/Cu) = −0.76 − 0.34 = −1.10 V।</p><p>E°cell ऋणात्मक है, इसलिए अभिक्रिया <b>स्वतः नहीं</b> होती। कॉपर ऐसा नहीं कर सकता।</p>')},
 {lv:'medium',
  q:B('Find the EMF of the Daniell cell at 298 K when [Zn²⁺] = 0.1 M and [Cu²⁺] = 0.01 M. (E° = 1.10 V)','298 K पर डेनियल सेल का विद्युत वाहक बल ज्ञात करो जब [Zn²⁺] = 0.1 M और [Cu²⁺] = 0.01 M हो। (E° = 1.10 V)'),
  a:S('<p>Zn + Cu²⁺ → Zn²⁺ + Cu, so Q = [Zn²⁺] / [Cu²⁺] = 0.1 / 0.01 = 10, and n = 2.</p><p>E = 1.10 − (0.0591 / 2) × log 10 = 1.10 − 0.02955 = <b>1.0705 V ≈ 1.07 V</b></p>')},
 {lv:'medium',
  q:B('Find the equilibrium constant of the Daniell cell reaction at 298 K. (E° = 1.10 V, n = 2)','298 K पर डेनियल सेल अभिक्रिया का साम्य नियतांक ज्ञात करो। (E° = 1.10 V, n = 2)'),
  a:B('<p>log K = nE° / 0.0591 = 2 × 1.10 / 0.0591 = 37.2</p><p>K = 10<sup>37.2</sup> ≈ <b>1.7 × 10³⁷</b>. The reaction goes almost to completion.</p>','<p>log K = nE° / 0.0591 = 2 × 1.10 / 0.0591 = 37.2</p><p>K = 10<sup>37.2</sup> ≈ <b>1.7 × 10³⁷</b>। अभिक्रिया लगभग पूरी तरह आगे बढ़ती है।</p>')},
 {lv:'easy',
  q:B('A current of 2 A is passed through CuSO₄ solution for 965 s. Find the mass of copper deposited. (Cu = 63.5)','CuSO₄ विलयन में 965 s तक 2 A धारा प्रवाहित की गई। जमा हुए कॉपर का द्रव्यमान ज्ञात करो। (Cu = 63.5)'),
  a:B('<p>Q = I t = 2 × 965 = 1930 C</p><p>Moles of electrons = 1930 / 96500 = 0.02 mol</p><p>Cu²⁺ + 2e⁻ → Cu, so moles of Cu = 0.01 mol</p><p>Mass = 0.01 × 63.5 = <b>0.635 g</b></p>','<p>Q = I t = 2 × 965 = 1930 C</p><p>इलेक्ट्रॉनों के मोल = 1930 / 96500 = 0.02 mol</p><p>Cu²⁺ + 2e⁻ → Cu, इसलिए Cu के मोल = 0.01 mol</p><p>द्रव्यमान = 0.01 × 63.5 = <b>0.635 g</b></p>')},
 {lv:'medium',
  q:B('The same charge is passed through AgNO₃ and CuSO₄ solutions in series. If 1.08 g of silver is deposited, find the mass of copper. (Ag = 108, Cu = 63.5)','AgNO₃ और CuSO₄ विलयनों में श्रेणी क्रम में समान आवेश प्रवाहित किया गया। यदि 1.08 g सिल्वर जमा हुई, तो कॉपर का द्रव्यमान ज्ञात करो। (Ag = 108, Cu = 63.5)'),
  a:B('<p>Moles of Ag = 1.08 / 108 = 0.01 mol, and Ag⁺ + e⁻ → Ag, so 0.01 mol of electrons passed.</p><p>Cu²⁺ needs 2 electrons per atom, so moles of Cu = 0.01 / 2 = 0.005 mol.</p><p>Mass of Cu = 0.005 × 63.5 = <b>0.3175 g</b></p>','<p>Ag के मोल = 1.08 / 108 = 0.01 mol, और Ag⁺ + e⁻ → Ag, इसलिए 0.01 mol इलेक्ट्रॉन प्रवाहित हुए।</p><p>Cu²⁺ को प्रति परमाणु 2 इलेक्ट्रॉन चाहिए, इसलिए Cu के मोल = 0.01 / 2 = 0.005 mol।</p><p>Cu का द्रव्यमान = 0.005 × 63.5 = <b>0.3175 g</b></p>')}
],
rev:{
 en:['Anode: oxidation. Cathode: reduction. This holds for every cell.','E°cell = E°cathode − E°anode. Always use reduction potentials.','Do not multiply E° by the coefficients when balancing. E° is an intensive property.','E = 0 at equilibrium, and then Q = K.','One faraday (96500 C) deposits one equivalent of any substance.','Higher reduction potential means a stronger oxidising agent.'],
 hi:['ऐनोड: उपचयन। कैथोड: अपचयन। यह हर सेल पर लागू होता है।','E°cell = E°cathode − E°anode। हमेशा अपचयन विभव ही लो।','संतुलन करते समय E° को गुणांकों से गुणा मत करो। E° एक गहन गुण है।','साम्यावस्था पर E = 0 और तब Q = K होता है।','एक फैराडे (96500 C) किसी भी पदार्थ का एक तुल्यांक जमा करता है।','अपचयन विभव जितना अधिक, ऑक्सीकारक उतना प्रबल।']},

/* ===== MATHS 12 ===== */
{
id:'maths-matrices-determinants', subject:'maths', cls:12, ord:1,
title:B('Matrices and Determinants','आव्यूह और सारणिक'),
blurb:B('Types and operations on matrices, determinants, the inverse and Cramer’s rule.','आव्यूहों के प्रकार और संक्रियाएँ, सारणिक, व्युत्क्रम और क्रेमर का नियम।'),
sections:[
 {h:B('Matrices and their types','आव्यूह और उनके प्रकार'),
  body:B(
   '<p>A <b>matrix</b> is a rectangular arrangement of numbers in rows and columns. A matrix with m rows and n columns has <b>order m × n</b>. The entry in row i and column j is written a<sub>ij</sub>.</p><ul><li><b>Square matrix:</b> m = n.</li><li><b>Diagonal matrix:</b> square, with every entry off the main diagonal equal to 0.</li><li><b>Scalar matrix:</b> diagonal with equal diagonal entries. The <b>identity matrix I</b> has all diagonal entries 1.</li><li><b>Symmetric:</b> Aᵀ = A. <b>Skew-symmetric:</b> Aᵀ = −A, so every diagonal entry is 0.</li><li><b>Upper (lower) triangular:</b> all entries below (above) the main diagonal are 0.</li></ul>',
   '<p><b>आव्यूह</b> संख्याओं की पंक्तियों और स्तंभों में आयताकार सजावट है। m पंक्तियों और n स्तंभों वाले आव्यूह की <b>कोटि m × n</b> होती है। पंक्ति i और स्तंभ j की प्रविष्टि को a<sub>ij</sub> लिखते हैं।</p><ul><li><b>वर्ग आव्यूह:</b> m = n।</li><li><b>विकर्ण आव्यूह:</b> वर्ग आव्यूह, जिसमें मुख्य विकर्ण के बाहर की हर प्रविष्टि 0 हो।</li><li><b>अदिश आव्यूह:</b> विकर्ण आव्यूह जिसके विकर्ण अवयव समान हों। <b>तत्समक आव्यूह I</b> में सभी विकर्ण अवयव 1 होते हैं।</li><li><b>सममित:</b> Aᵀ = A। <b>विषम सममित:</b> Aᵀ = −A, इसलिए हर विकर्ण अवयव 0 होता है।</li><li><b>ऊपरी (निचला) त्रिभुजाकार:</b> मुख्य विकर्ण के नीचे (ऊपर) की सभी प्रविष्टियाँ 0 हों।</li></ul>'),
  dg:'mxgrid',
  cap:B('A 3 × 3 matrix. The entry a₂₃ lies in row 2 and column 3.','एक 3 × 3 आव्यूह। अवयव a₂₃ पंक्ति 2 और स्तंभ 3 में है।')},
 {h:B('Operations on matrices','आव्यूहों पर संक्रियाएँ'),
  body:B(
   '<ul><li><b>Addition</b> works only for matrices of the same order. Add entry by entry.</li><li><b>Scalar multiple</b> kA multiplies every entry by k.</li><li><b>Multiplication</b> AB is defined only when the number of columns of A equals the number of rows of B. If A is m × n and B is n × p, then AB is m × p. The entry in row i, column j of AB is (row i of A) × (column j of B), multiplied pairwise and added.</li></ul><p>Matrix multiplication is <b>not commutative</b>: in general AB ≠ BA. It is associative, and it distributes over addition.</p><ul><li>(AB)ᵀ = BᵀAᵀ</li><li>(A + B)ᵀ = Aᵀ + Bᵀ</li><li>AI = IA = A</li></ul>',
   '<ul><li><b>जोड़</b> केवल समान कोटि के आव्यूहों का होता है। प्रविष्टि दर प्रविष्टि जोड़ो।</li><li><b>अदिश गुणज</b> kA में हर प्रविष्टि को k से गुणा किया जाता है।</li><li><b>गुणन</b> AB तभी परिभाषित है जब A के स्तंभों की संख्या B की पंक्तियों की संख्या के बराबर हो। यदि A, m × n और B, n × p हो तो AB, m × p होगा। AB की पंक्ति i, स्तंभ j की प्रविष्टि (A की पंक्ति i) और (B का स्तंभ j) के संगत अवयवों का गुणा करके जोड़ने पर मिलती है।</li></ul><p>आव्यूह गुणन <b>क्रमविनिमेय नहीं</b> है: सामान्यतः AB ≠ BA। यह साहचर्य है और जोड़ पर वितरित होता है।</p><ul><li>(AB)ᵀ = BᵀAᵀ</li><li>(A + B)ᵀ = Aᵀ + Bᵀ</li><li>AI = IA = A</li></ul>')},
 {h:B('Determinants, minors and cofactors','सारणिक, उपसारणिक और सहखंड'),
  body:B(
   '<p>Every square matrix A has a number |A| called its <b>determinant</b>. For a 2 × 2 matrix:</p><p class="eq">'+MX([['a','b'],['c','d']],true)+' = ad − bc</p><p>For a 3 × 3 determinant, expand along any row or column. Along the first row:</p><p class="eq">|A| = a₁₁(a₂₂a₃₃ − a₂₃a₃₂) − a₁₂(a₂₁a₃₃ − a₂₃a₃₁) + a₁₃(a₂₁a₃₂ − a₂₂a₃₁)</p><p>The <b>minor</b> M<sub>ij</sub> is the determinant left after deleting row i and column j. The <b>cofactor</b> is C<sub>ij</sub> = (−1)<sup>i+j</sup> M<sub>ij</sub>. Expanding along a row, |A| = a<sub>i1</sub>C<sub>i1</sub> + a<sub>i2</sub>C<sub>i2</sub> + a<sub>i3</sub>C<sub>i3</sub>.</p>',
   '<p>हर वर्ग आव्यूह A के साथ एक संख्या |A| जुड़ी होती है, जिसे उसका <b>सारणिक</b> कहते हैं। 2 × 2 आव्यूह के लिए:</p><p class="eq">'+MX([['a','b'],['c','d']],true)+' = ad − bc</p><p>3 × 3 सारणिक को किसी भी पंक्ति या स्तंभ के अनुदिश खोला जा सकता है। पहली पंक्ति के अनुदिश:</p><p class="eq">|A| = a₁₁(a₂₂a₃₃ − a₂₃a₃₂) − a₁₂(a₂₁a₃₃ − a₂₃a₃₁) + a₁₃(a₂₁a₃₂ − a₂₂a₃₁)</p><p><b>उपसारणिक</b> M<sub>ij</sub> वह सारणिक है जो पंक्ति i और स्तंभ j हटाने पर बचता है। <b>सहखंड</b> C<sub>ij</sub> = (−1)<sup>i+j</sup> M<sub>ij</sub> होता है। किसी पंक्ति के अनुदिश |A| = a<sub>i1</sub>C<sub>i1</sub> + a<sub>i2</sub>C<sub>i2</sub> + a<sub>i3</sub>C<sub>i3</sub>।</p>'),
  dg:'area',
  cap:B('A determinant as an area. The parallelogram on u = (4, 1) and v = (1, 3) has area |4 × 3 − 1 × 1| = 11.','सारणिक क्षेत्रफल के रूप में। u = (4, 1) और v = (1, 3) पर बने समांतर चतुर्भुज का क्षेत्रफल |4 × 3 − 1 × 1| = 11 है।')},
 {h:B('Properties of determinants','सारणिक के गुण'),
  body:B(
   '<ul><li>|Aᵀ| = |A|.</li><li>Swapping two rows (or columns) changes the sign of the determinant.</li><li>If two rows (or columns) are identical, or a row is all zeros, then |A| = 0.</li><li>Multiplying one row by k multiplies |A| by k. So for an n × n matrix, |kA| = kⁿ|A|.</li><li>Adding a multiple of one row to another row leaves |A| unchanged. Use this to make zeros before expanding.</li><li>|AB| = |A| |B|.</li><li>For a triangular matrix, |A| is the product of the diagonal entries.</li></ul>',
   '<ul><li>|Aᵀ| = |A|।</li><li>दो पंक्तियाँ (या स्तंभ) आपस में बदलने पर सारणिक का चिह्न बदल जाता है।</li><li>दो पंक्तियाँ (या स्तंभ) समान हों, या कोई पंक्ति पूरी शून्य हो, तो |A| = 0।</li><li>किसी एक पंक्ति को k से गुणा करने पर |A| भी k गुना हो जाता है। इसलिए n × n आव्यूह के लिए |kA| = kⁿ|A|।</li><li>एक पंक्ति के गुणज को दूसरी पंक्ति में जोड़ने पर |A| नहीं बदलता। खोलने से पहले शून्य बनाने में इसका प्रयोग करो।</li><li>|AB| = |A| |B|।</li><li>त्रिभुजाकार आव्यूह के लिए |A| विकर्ण अवयवों का गुणनफल होता है।</li></ul>')},
 {h:B('Adjoint and inverse','सहखंडज और व्युत्क्रम'),
  body:B(
   '<p>The <b>adjoint</b> adj A is the transpose of the matrix of cofactors. It satisfies</p><p class="eq">A · adj A = adj A · A = |A| I</p><p>If |A| ≠ 0, the matrix is <b>non-singular</b> and its inverse exists:</p><p class="eq">A⁻¹ = '+F('adj A','|A|')+'</p><p>For a 2 × 2 matrix, swap the diagonal entries, change the signs of the other two, and divide by |A|:</p><p class="eq">'+MX([['a','b'],['c','d']])+'⁻¹ = '+F('1','ad − bc')+' '+MX([['d','−b'],['−c','a']])+'</p><ul><li>(AB)⁻¹ = B⁻¹A⁻¹</li><li>|A⁻¹| = 1 / |A|</li><li>|adj A| = |A|ⁿ⁻¹ for an n × n matrix</li><li>If |A| = 0 the matrix is <b>singular</b> and has no inverse.</li></ul>',
   '<p>A का <b>सहखंडज</b> adj A, सहखंडों के आव्यूह का परिवर्त (transpose) होता है। यह इस संबंध को संतुष्ट करता है</p><p class="eq">A · adj A = adj A · A = |A| I</p><p>यदि |A| ≠ 0 हो तो आव्यूह <b>व्युत्क्रमणीय</b> (non-singular) है और उसका व्युत्क्रम मौजूद है:</p><p class="eq">A⁻¹ = '+F('adj A','|A|')+'</p><p>2 × 2 आव्यूह के लिए विकर्ण अवयव आपस में बदलो, बाकी दोनों के चिह्न बदलो और |A| से भाग दो:</p><p class="eq">'+MX([['a','b'],['c','d']])+'⁻¹ = '+F('1','ad − bc')+' '+MX([['d','−b'],['−c','a']])+'</p><ul><li>(AB)⁻¹ = B⁻¹A⁻¹</li><li>|A⁻¹| = 1 / |A|</li><li>n × n आव्यूह के लिए |adj A| = |A|ⁿ⁻¹</li><li>यदि |A| = 0 हो तो आव्यूह <b>अव्युत्क्रमणीय</b> (singular) है और उसका व्युत्क्रम नहीं होता।</li></ul>')},
 {h:B('Solving linear equations','रैखिक समीकरण हल करना'),
  body:B(
   '<p><b>Cramer’s rule.</b> For a₁x + b₁y = c₁ and a₂x + b₂y = c₂:</p><p class="eq">x = '+F('D<sub>x</sub>','D')+' ,'+SP+'y = '+F('D<sub>y</sub>','D')+'</p><p>D is the determinant of the coefficients. D<sub>x</sub> is D with the x-column replaced by the constants c₁, c₂. D<sub>y</sub> is D with the y-column replaced the same way.</p><ul><li>D ≠ 0: exactly one solution.</li><li>D = 0 and D<sub>x</sub> or D<sub>y</sub> ≠ 0: no solution.</li><li>D = 0 and D<sub>x</sub> = D<sub>y</sub> = 0: infinitely many solutions for two equations. With three variables this case needs a further check, since there may be infinitely many solutions or none.</li></ul><p><b>Matrix method.</b> Write the system as AX = B. If |A| ≠ 0 then X = A⁻¹B.</p><p>A homogeneous system AX = 0 always has the trivial solution X = 0. It has non-trivial solutions only when |A| = 0.</p>',
   '<p><b>क्रेमर का नियम।</b> a₁x + b₁y = c₁ और a₂x + b₂y = c₂ के लिए:</p><p class="eq">x = '+F('D<sub>x</sub>','D')+' ,'+SP+'y = '+F('D<sub>y</sub>','D')+'</p><p>D गुणांकों का सारणिक है। D<sub>x</sub> में D के x वाले स्तंभ की जगह अचर पद c₁, c₂ रखे जाते हैं। D<sub>y</sub> में y वाले स्तंभ की जगह इसी तरह रखे जाते हैं।</p><ul><li>D ≠ 0: ठीक एक हल।</li><li>D = 0 और D<sub>x</sub> या D<sub>y</sub> ≠ 0: कोई हल नहीं।</li><li>D = 0 और D<sub>x</sub> = D<sub>y</sub> = 0: दो समीकरणों के लिए अनंत हल। तीन चरों में इस स्थिति की आगे जाँच करनी पड़ती है, क्योंकि अनंत हल भी हो सकते हैं और कोई हल नहीं भी।</li></ul><p><b>आव्यूह विधि।</b> निकाय को AX = B लिखो। यदि |A| ≠ 0 हो तो X = A⁻¹B।</p><p>समघात निकाय AX = 0 का तुच्छ हल X = 0 सदैव होता है। अतुच्छ हल केवल तब होते हैं जब |A| = 0।</p>')}
],

examples:[

  q:B('If A = [[1, 2], [3, 4]] and B = [[0, 1], [1, 0]], find AB and BA.','यदि A = [[1, 2], [3, 4]] और B = [[0, 1], [1, 0]] हो, तो AB और BA ज्ञात करो।'),
  a:S('<p>AB = '+MX([['1×0+2×1','1×1+2×0'],['3×0+4×1','3×1+4×0']])+' = '+MX([['2','1'],['4','3']])+'</p><p>BA = '+MX([['0×1+1×3','0×2+1×4'],['1×1+0×3','1×2+0×4']])+' = '+MX([['3','4'],['1','2']])+'</p><p>So <b>AB ≠ BA</b>.</p>')},
 {lv:'easy',

 {lv:'medium',

rev:{
 en:['A determinant is a number. A matrix is an array.','AB ≠ BA in general, and (AB)ᵀ = BᵀAᵀ reverses the order.','|kA| = kⁿ|A|, not k|A|.','Two equal rows or a zero row means the determinant is 0.','A⁻¹ exists only when |A| ≠ 0.','Make zeros using row operations before expanding a 3 × 3 determinant.'],
 hi:['सारणिक एक संख्या है। आव्यूह एक सारणी है।','सामान्यतः AB ≠ BA, और (AB)ᵀ = BᵀAᵀ में क्रम उलट जाता है।','|kA| = kⁿ|A|, k|A| नहीं।','दो समान पंक्तियाँ या एक शून्य पंक्ति हो तो सारणिक 0 होता है।','A⁻¹ तभी होता है जब |A| ≠ 0 हो।','3 × 3 सारणिक खोलने से पहले पंक्ति संक्रियाओं से शून्य बनाओ।']},

  return '<svg viewBox="0 0 340 240" role="img" aria-label="'+sx(l,'Carnot cycle on a P-V diagram: two isothermals and two adiabatics','P-V आरेख पर कार्नो चक्र: दो समतापी और दो रुद्धोष्म प्रक्रम')+'">'

D3.func3d={

D3.quad3d={
  en:'Parabola of ax² + bx + c: roots, vertex and discriminant',hi:'ax² + bx + c का परवलय: मूल, शीर्ष और विविक्तकर',h:0.85,scale:0.78,center:[0,0,0],spin:true,view:{yaw:-0.45,pitch:0.3,zoom:1},
  params:[
    {k:'a',en:'a',hi:'a',min:-3,max:3,val:1,step:1,unit:''},
    {k:'b',en:'b',hi:'b',min:-6,max:6,val:-2,step:1,unit:''},
    {k:'c',en:'c',hi:'c',min:-6,max:6,val:-3,step:1,unit:''}
  ],
  frame:function(S,t,P,l){
    var a=P.a,b=P.b,c=P.c,i,ux=0.15,uy=0.075;
    function F(x){return a*x*x+b*x+c}
    function R(v){return Math.round(v*100)/100}
    S.floor([[-1.6,-0.9,-0.5],[1.6,-0.9,-0.5],[1.6,-0.9,0.5],[-1.6,-0.9,0.5]],'soft',0.4,'line');
    S.arrow([-1.55,0,0],[1.6,0,0],'ink',1.2);S.arrow([0,-0.9,0],[0,0.95,0],'ink',1.2);
    var p1=[],p2=[],xs=[];
    for(i=0;i<=60;i++){var x=-10+i*0.34;var y=F(x);if(Math.abs(y*uy)<=0.85&&Math.abs(x*ux)<=1.5){xs.push(x)}}
    for(i=0;i<xs.length-1;i++){var x1=xs[i],x2=xs[i+1];if(x2-x1<0.4)S.poly([[x1*ux,F(x1)*uy,-0.3],[x2*ux,F(x2)*uy,-0.3],[x2*ux,F(x2)*uy,0.3],[x1*ux,F(x1)*uy,0.3]],'accent',0.25)}
    xs.forEach(function(x){p1.push([x*ux,F(x)*uy,0.3]);p2.push([x*ux,F(x)*uy,-0.3])});
    S.path(p1,'accent',3);S.path(p2,'accent',1.4);
    var D=b*b-4*a*c,txt;
    if(a!==0){
      var vx=-b/(2*a),vy=F(vx);
      if(Math.abs(vy*uy)<0.9){S.sphere([vx*ux,vy*uy,0.3],0.05,'good',true);S.text([vx*ux+0.1,vy*uy-0.1,0.3],sx(l,'vertex','शीर्ष'),'good',10.5,'left',true)}
      if(D>=0){var r1=(-b+Math.sqrt(D))/(2*a),r2=(-b-Math.sqrt(D))/(2*a);
        [r1,r2].forEach(function(r){if(Math.abs(r*ux)<1.5)S.sphere([r*ux,0,0.3],0.055,'hi',true)});
        txt=D>0?sx(l,'two real roots: ','दो वास्तविक मूल: ')+R(Math.min(r1,r2))+', '+R(Math.max(r1,r2)):sx(l,'equal roots: ','बराबर मूल: ')+R(r1);
      }else txt=sx(l,'no real roots (curve misses the x-axis)','कोई वास्तविक मूल नहीं (वक्र x-अक्ष को नहीं छूता)');
      var tx=-3+6*(0.5+0.5*Math.sin(t*0.9));
      if(Math.abs(F(tx)*uy)<0.85)S.sphere([tx*ux,F(tx)*uy,0.3],0.04,'ink',true);
    }else txt=sx(l,'a = 0: this is a straight line, not a quadratic','a = 0: यह सरल रेखा है, द्विघात नहीं');
    S.hud(0.04,0.07,'y = '+a+'x² + ('+b+')x + ('+c+')','accent',12,'left',true);
    S.hud(0.04,0.16,'D = b² − 4ac = '+D,'ink',12.5,'left',true);
    S.hud(0.04,0.25,txt,'hi',11,'left',true);
  }
};

D3.pascal3d={
  en:'Pascal’s triangle as 3D bars',hi:'पास्कल त्रिभुज, 3D स्तंभों में',h:0.82,scale:0.95,center:[0,0.3,0],spin:true,view:{yaw:-0.55,pitch:0.55,zoom:1},
  params:[{k:'n',en:'Row n',hi:'पंक्ति n',min:2,max:12,val:6,step:1,unit:''}],
  frame:function(S,t,P,l){
    var n=P.n,r,k,C=[];
    for(r=0;r<=n;r++){C[r]=[];for(k=0;k<=r;k++)C[r][k]=(k===0||k===r)?1:C[r-1][k-1]+C[r-1][k]}
    var mx=C[n][Math.floor(n/2)],w=Math.min(0.24,2.4/(n+1)),dz=w*0.95;
    var pairs=[];for(r=2;r<=n;r++)for(k=1;k<r;k++)pairs.push([r,k]);
    var pr=pairs[Math.floor(t*0.9)%pairs.length];
    S.floor([[-1.6,0,-1.5],[1.6,0,-1.5],[1.6,0,1.5],[-1.6,0,1.5]],'soft',0.7,'line');
    for(r=0;r<=n;r++){
      for(k=0;k<=r;k++){
        var x=(k-r/2)*w*1.05,z=(r-n/2)*dz*1.05-0,h=Math.max(0.035,C[r][k]/mx*1.1),cc='accent';
        if(r===pr[0]&&k===pr[1])cc='hi';
        else if(r===pr[0]-1&&(k===pr[1]-1||k===pr[1]))cc='good';
        S.box([x,h/2,z],[w*0.82,h,dz*0.82],cc);
        if(cc!=='accent'||r===n)S.text([x,h+0.1,z],String(C[r][k]),cc==='accent'?'ink':cc,cc==='accent'?10.5:12,'center',true);
      }
    }
    S.hud(0.04,0.07,sx(l,'Row n = ','पंक्ति n = ')+n,'accent',13,'left',true);
    S.hud(0.04,0.16,sx(l,'Sum of row n = 2ⁿ = ','पंक्ति n का योग = 2ⁿ = ')+Math.pow(2,n),'ink',12,'left',true);
    S.hud(0.04,0.25,sx(l,'Each number = the two above it added: ','हर संख्या = ऊपर की दो संख्याओं का योग: ')+C[pr[0]-1][pr[1]-1]+' + '+C[pr[0]-1][pr[1]]+' = '+C[pr[0]][pr[1]],'hi',11.5,'left',true);
  }
};

CH=CH.concat([{
id:'maths-binomial-theorem', subject:'maths', cls:11, ord:8,
title:B('Binomial Theorem','द्विपद प्रमेय'),
blurb:B('Expanding (a + b)ⁿ, Pascal’s triangle, the general term, the middle term and useful applications.','(a + b)ⁿ का प्रसार, पास्कल त्रिभुज, व्यापक पद, मध्य पद और उपयोगी अनुप्रयोग।'),
sections:[
 {h:B('The binomial theorem','द्विपद प्रमेय'),
  body:B(
   '<p class="def"><b>In simple words:</b> a <b>binomial</b> is a sum of two terms, like (a + b). The binomial theorem is a ready formula for expanding (a + b)ⁿ without multiplying n times.</p><p class="eq">(a + b)ⁿ = ⁿC₀aⁿ + ⁿC₁aⁿ⁻¹b + ⁿC₂aⁿ⁻²b² + … + ⁿCₙbⁿ</p><p>The numbers ⁿCᵣ are the <b>binomial coefficients</b>.</p><ul><li>There are <b>n + 1</b> terms.</li><li>In every term the powers of a and b add up to n.</li><li>The power of a falls from n to 0 while the power of b rises from 0 to n.</li><li>Coefficients equally far from the two ends are equal, since ⁿCᵣ = ⁿCₙ₋ᵣ.</li></ul><p>Example: (x + 2)⁴ = x⁴ + 4·2x³ + 6·4x² + 4·8x + 16 = x⁴ + 8x³ + 24x² + 32x + 16.</p><p>For (a − b)ⁿ the signs alternate, because b is replaced by (−b): + − + − …</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>द्विपद</b> दो पदों का योग है, जैसे (a + b)। द्विपद प्रमेय (a + b)ⁿ को n बार गुणा किए बिना फैलाने का तैयार सूत्र है।</p><p class="eq">(a + b)ⁿ = ⁿC₀aⁿ + ⁿC₁aⁿ⁻¹b + ⁿC₂aⁿ⁻²b² + … + ⁿCₙbⁿ</p><p>संख्याएँ ⁿCᵣ <b>द्विपद गुणांक</b> कहलाती हैं।</p><ul><li>कुल <b>n + 1</b> पद होते हैं।</li><li>हर पद में a और b की घातों का योग n होता है।</li><li>a की घात n से 0 तक घटती है और b की घात 0 से n तक बढ़ती है।</li><li>दोनों सिरों से समान दूरी वाले गुणांक बराबर होते हैं, क्योंकि ⁿCᵣ = ⁿCₙ₋ᵣ।</li></ul><p>उदाहरण: (x + 2)⁴ = x⁴ + 4·2x³ + 6·4x² + 4·8x + 16 = x⁴ + 8x³ + 24x² + 32x + 16।</p><p>(a − b)ⁿ के लिए चिह्न एकांतर होते हैं, क्योंकि b की जगह (−b) आता है: + − + − …</p>')},
 {h:B('Pascal’s triangle','पास्कल त्रिभुज'),
  body:B(
   '<p class="def"><b>In simple words:</b> write the coefficients of (a + b)ⁿ for n = 0, 1, 2, … one row under another. You get a triangle in which every number is the <b>sum of the two numbers just above it</b>. This is <b>Pascal’s triangle</b>.</p><ul><li>Row 0: 1. Row 1: 1 1. Row 2: 1 2 1. Row 3: 1 3 3 1. Row 4: 1 4 6 4 1.</li><li>Each row is symmetric.</li><li>The sum of row n is 2ⁿ (put a = b = 1).</li><li>The rule ⁿ⁺¹Cᵣ = ⁿCᵣ + ⁿCᵣ₋₁ is exactly “add the two above”.</li></ul><p>Row 6 reads 1, 6, 15, 20, 15, 6, 1, so (a + b)⁶ has those coefficients. The triangle is useful for small n; for large n use the formula ⁿCᵣ.</p><p>In the figure each bar is a binomial coefficient. The sliding red bar is always the sum of the two green bars just above it. Turn the figure to see the bell-shaped pattern: the middle is tallest.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> n = 0, 1, 2, … के लिए (a + b)ⁿ के गुणांक एक के नीचे एक पंक्तियों में लिखो। एक त्रिभुज बनता है जिसकी हर संख्या <b>ठीक ऊपर की दो संख्याओं का योग</b> होती है। यही <b>पास्कल त्रिभुज</b> है।</p><ul><li>पंक्ति 0: 1। पंक्ति 1: 1 1। पंक्ति 2: 1 2 1। पंक्ति 3: 1 3 3 1। पंक्ति 4: 1 4 6 4 1।</li><li>हर पंक्ति सममित होती है।</li><li>पंक्ति n का योग 2ⁿ है (a = b = 1 रखो)।</li><li>नियम ⁿ⁺¹Cᵣ = ⁿCᵣ + ⁿCᵣ₋₁ ठीक “ऊपर की दो जोड़ो” है।</li></ul><p>पंक्ति 6 है 1, 6, 15, 20, 15, 6, 1, अतः (a + b)⁶ के यही गुणांक हैं। छोटे n के लिए त्रिभुज उपयोगी है; बड़े n के लिए सूत्र ⁿCᵣ लगाओ।</p><p>चित्र में हर स्तंभ एक द्विपद गुणांक है। चलता हुआ लाल स्तंभ हमेशा ठीक ऊपर के दो हरे स्तंभों का योग है। चित्र घुमाकर घंटी जैसा आकार देखो: बीच का स्तंभ सबसे ऊँचा होता है।</p>'),
  d3:'pascal3d',
  cap:B('Each bar is a binomial coefficient ⁿCᵣ. The red bar equals the sum of the two green bars above it.','हर स्तंभ एक द्विपद गुणांक ⁿCᵣ है। लाल स्तंभ, ऊपर के दो हरे स्तंभों के योग के बराबर है।')},
 {h:B('General term and middle term','व्यापक पद और मध्य पद'),
  body:B(
   '<p class="def"><b>In simple words:</b> instead of expanding everything, jump straight to the term you need. The <b>(r + 1)-th term</b> of (a + b)ⁿ is</p><p class="eq">T<sub>r+1</sub> = ⁿCᵣ aⁿ⁻ʳ bʳ</p><p>Note the index: the term number is r + 1, but the power of b is r.</p><p><b>Middle term:</b></p><ul><li>If n is <b>even</b>, there is one middle term, the (n/2 + 1)-th.</li><li>If n is <b>odd</b>, there are two middle terms, the ((n + 1)/2)-th and the ((n + 3)/2)-th.</li></ul><p><b>Term independent of x:</b> write the general term, collect the power of x, set it to 0, solve for r.</p><p>Example: in (x² + 1/x)⁹, T<sub>r+1</sub> = ⁹Cᵣ x<sup>2(9−r)</sup> · x<sup>−r</sup> = ⁹Cᵣ x<sup>18−3r</sup>. For x⁰ we need 18 − 3r = 0, so r = 6 and the term is ⁹C₆ = 84.</p><p><b>Greatest coefficient</b> of (1 + x)ⁿ: ⁿC<sub>n/2</sub> for even n, and ⁿC<sub>(n±1)/2</sub> for odd n.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> सब कुछ फैलाने के बजाय सीधे अपने चाहे पद पर पहुँचो। (a + b)ⁿ का <b>(r + 1) वाँ पद</b> है</p><p class="eq">T<sub>r+1</sub> = ⁿCᵣ aⁿ⁻ʳ bʳ</p><p>सूचकांक पर ध्यान दो: पद संख्या r + 1 है पर b की घात r है।</p><p><b>मध्य पद:</b></p><ul><li>यदि n <b>सम</b> है तो एक मध्य पद होता है, (n/2 + 1) वाँ।</li><li>यदि n <b>विषम</b> है तो दो मध्य पद होते हैं, ((n + 1)/2) वाँ और ((n + 3)/2) वाँ।</li></ul><p><b>x से स्वतंत्र पद:</b> व्यापक पद लिखो, x की घात इकट्ठी करो, उसे 0 के बराबर रखो और r निकालो।</p><p>उदाहरण: (x² + 1/x)⁹ में T<sub>r+1</sub> = ⁹Cᵣ x<sup>2(9−r)</sup> · x<sup>−r</sup> = ⁹Cᵣ x<sup>18−3r</sup>। x⁰ के लिए 18 − 3r = 0, अतः r = 6 और पद ⁹C₆ = 84 है।</p><p>(1 + x)ⁿ का <b>महत्तम गुणांक</b>: सम n के लिए ⁿC<sub>n/2</sub> और विषम n के लिए ⁿC<sub>(n±1)/2</sub>।</p>')},
 {h:B('Special results and applications','विशेष परिणाम और अनुप्रयोग'),
  body:B(
   '<p>Putting special values in the theorem gives powerful results.</p><ul><li>Put x = 1 in (1 + x)ⁿ: <b>ⁿC₀ + ⁿC₁ + … + ⁿCₙ = 2ⁿ</b>.</li><li>Put x = −1: ⁿC₀ − ⁿC₁ + ⁿC₂ − … = 0, so the sum of even-place coefficients equals the sum of odd-place coefficients, each <b>2ⁿ⁻¹</b>.</li><li><b>Sum of coefficients</b> of a polynomial: put every variable equal to 1.</li><li>(1 + x)ⁿ ≈ 1 + nx when x is very small. For example (1.01)¹⁰ = (1 + 0.01)¹⁰ ≈ 1 + 0.1 + 0.0045 = 1.1045.</li></ul><p><b>Remainders:</b> to find the remainder of aⁿ when divided by m, write a as (a multiple of m) ± 1, expand, and see which terms survive. For 7¹⁰³ ÷ 25: 7² = 49 = 50 − 1, so the power is 7·(50 − 1)⁵¹, whose remainder comes only from 7·(−1)⁵¹ = −7. Adding 25 gives 18.</p><p><b>Check your expansion</b> by putting a = b = 1: the coefficients must add up to 2ⁿ.</p>',
   '<p>प्रमेय में विशेष मान रखने पर शक्तिशाली परिणाम मिलते हैं।</p><ul><li>(1 + x)ⁿ में x = 1 रखो: <b>ⁿC₀ + ⁿC₁ + … + ⁿCₙ = 2ⁿ</b>।</li><li>x = −1 रखो: ⁿC₀ − ⁿC₁ + ⁿC₂ − … = 0, अतः सम स्थान के गुणांकों का योग, विषम स्थान के गुणांकों के योग के बराबर है, हर एक <b>2ⁿ⁻¹</b>।</li><li>बहुपद के <b>गुणांकों का योग</b> निकालने के लिए सभी चर 1 रखो।</li><li>x बहुत छोटा हो तो (1 + x)ⁿ ≈ 1 + nx। उदाहरण (1.01)¹⁰ = (1 + 0.01)¹⁰ ≈ 1 + 0.1 + 0.0045 = 1.1045।</li></ul><p><b>शेषफल:</b> aⁿ को m से भाग देने पर शेषफल के लिए a को (m का गुणज) ± 1 के रूप में लिखो, फैलाओ और देखो कौन-से पद बचते हैं। 7¹⁰³ ÷ 25 में: 7² = 49 = 50 − 1, अतः घात 7·(50 − 1)⁵¹ है, जिसका शेषफल केवल 7·(−1)⁵¹ = −7 से आता है। 25 जोड़ने पर 18।</p><p><b>अपना प्रसार जाँचो:</b> a = b = 1 रखने पर गुणांकों का योग 2ⁿ आना चाहिए।</p>')}
