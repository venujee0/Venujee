/* ===== Class 11 Physics: Thermal Properties of Matter (diagrams reused from ch11_p3_a.js) ===== */
CH = CH.concat([
{
id:'physics-thermal-properties', subject:'physics', cls:11, ord:12,
title:B('Thermal Properties of Matter','पदार्थ के तापीय गुण'),
blurb:B('Temperature scales, expansion, calorimetry, latent heat, conduction, convection and radiation.','ताप के पैमाने, प्रसार, ऊष्मामिति, गुप्त ऊष्मा, चालन, संवहन और विकिरण।'),
sections:[
 {h:B('Heat, temperature and scales','ऊष्मा, ताप और तापमान के पैमाने'),
  body:B(
   '<p><b>Temperature</b> tells how hot a body is. It decides the direction in which heat flows. <b>Heat</b> is the energy that flows from a hotter body to a colder body because of the temperature difference. Heat is measured in joule (J) or calorie, where 1 cal = 4.2 J.</p><p>Three scales are in common use. The lower fixed point is the ice point and the upper fixed point is the steam point of water at 1 atm.</p><ul><li>Celsius: 0 °C to 100 °C (100 divisions).</li><li>Fahrenheit: 32 °F to 212 °F (180 divisions).</li><li>Kelvin (SI): 273 K to 373 K (100 divisions). T(K) = t(°C) + 273.</li></ul><p>The common conversion is</p><p class="eq">'+F('C','5')+' = '+F('F − 32','9')+' = '+F('K − 273','5')+'</p><p>A change of 1 °C equals a change of 1 K, and equals a change of 9/5 °F. The two scales Celsius and Fahrenheit read the same at −40 degrees.</p>',
   '<p><b>ताप</b> (temperature) बताता है कि कोई वस्तु कितनी गर्म है। यही तय करता है कि ऊष्मा किस दिशा में बहेगी। <b>ऊष्मा</b> (heat) वह ऊर्जा है जो तापांतर के कारण गर्म वस्तु से ठंडी वस्तु की ओर प्रवाहित होती है। ऊष्मा को जूल (J) या कैलोरी में मापते हैं, जहाँ 1 cal = 4.2 J।</p><p>तीन पैमाने सामान्यतः प्रयोग होते हैं। निचला नियत बिंदु जल का हिमांक और ऊपरी नियत बिंदु 1 atm पर जल का भाप बिंदु है।</p><ul><li>सेल्सियस: 0 °C से 100 °C (100 भाग)।</li><li>फ़ॉरेनहाइट: 32 °F से 212 °F (180 भाग)।</li><li>केल्विन (SI): 273 K से 373 K (100 भाग)। T(K) = t(°C) + 273।</li></ul><p>सामान्य रूपांतरण सूत्र है</p><p class="eq">'+F('C','5')+' = '+F('F − 32','9')+' = '+F('K − 273','5')+'</p><p>1 °C का अंतर 1 K के अंतर के बराबर और 9/5 °F के अंतर के बराबर होता है। सेल्सियस और फ़ॉरेनहाइट पैमाने −40 पर एक ही पाठ्यांक देते हैं।</p>')},
 {h:B('Thermal expansion','तापीय प्रसार'),
  body:B(
   '<p>Most solids, liquids and gases expand on heating. For a small rise in temperature ΔT the expansion is proportional to ΔT and to the original size.</p><ul><li><b>Linear:</b> ΔL = L α ΔT, where α is the coefficient of linear expansion.</li><li><b>Area:</b> ΔA = A β ΔT, with β = 2α.</li><li><b>Volume:</b> ΔV = V γ ΔT, with γ = 3α.</li></ul><p>So α : β : γ = 1 : 2 : 3. The unit of α is °C⁻¹ or K⁻¹. For steel α ≈ 1.2 × 10⁻⁵ K⁻¹.</p><p>Points to remember:</p><ul><li>A hole in a plate expands exactly as if it were made of the same material as the plate.</li><li>A bimetallic strip bends towards the metal with the smaller α when heated, because the other metal expands more.</li><li>Gases have a much larger γ than solids. For an ideal gas at constant pressure γ = 1/T.</li><li><b>Anomalous expansion of water:</b> from 0 °C to 4 °C water contracts on heating. Its density is maximum at 4 °C. This is why lakes freeze from the top.</li></ul>',
   '<p>अधिकांश ठोस, द्रव और गैसें गर्म करने पर फैलते हैं। ताप में थोड़ी वृद्धि ΔT के लिए प्रसार ΔT के और वस्तु के मूल आमाप के अनुक्रमानुपाती होता है।</p><ul><li><b>रैखिक:</b> ΔL = L α ΔT, जहाँ α रैखिक प्रसार गुणांक है।</li><li><b>क्षेत्र:</b> ΔA = A β ΔT, जहाँ β = 2α।</li><li><b>आयतन:</b> ΔV = V γ ΔT, जहाँ γ = 3α।</li></ul><p>अतः α : β : γ = 1 : 2 : 3। α का मात्रक °C⁻¹ या K⁻¹ है। इस्पात के लिए α ≈ 1.2 × 10⁻⁵ K⁻¹।</p><p>याद रखने योग्य बातें:</p><ul><li>प्लेट में बना छिद्र ठीक उसी तरह फैलता है जैसे प्लेट के पदार्थ का बना ठोस टुकड़ा फैलता।</li><li>द्विधात्विक पट्टी (bimetallic strip) गर्म करने पर कम α वाली धातु की ओर मुड़ती है, क्योंकि दूसरी धातु अधिक फैलती है।</li><li>गैसों का γ ठोसों से बहुत अधिक होता है। आदर्श गैस के लिए स्थिर दाब पर γ = 1/T।</li><li><b>जल का असंगत प्रसार:</b> 0 °C से 4 °C तक जल गर्म करने पर सिकुड़ता है। 4 °C पर इसका घनत्व अधिकतम होता है। इसी कारण झीलें ऊपर से जमती हैं।</li></ul>')},
 {h:B('Specific heat and calorimetry','विशिष्ट ऊष्मा और ऊष्मामिति'),
  body:B(
   '<p>The heat needed to change the temperature of a body of mass m by ΔT is</p><p class="eq">Q = m s ΔT = C ΔT</p><p>where s is the <b>specific heat</b> (heat per unit mass per degree) and C = ms is the <b>heat capacity</b>. For water s = 4200 J kg⁻¹ K⁻¹ = 1 cal g⁻¹ °C⁻¹, and for ice s ≈ 2100 J kg⁻¹ K⁻¹ = 0.5 cal g⁻¹ °C⁻¹. Water has a high specific heat, so it heats and cools slowly. This is why coastal areas have a mild climate.</p><p><b>Calorimetry</b> is the measurement of heat exchanged. It is based on the principle of conservation of energy: if no heat is lost to the surroundings,</p><p class="eq">heat lost by hot bodies = heat gained by cold bodies</p><p>The <b>water equivalent</b> of a body is the mass of water that would need the same heat for the same rise in temperature. It equals ms (in g, with s in cal g⁻¹ °C⁻¹). When two substances at different temperatures are mixed, the final temperature lies between the two and is found by equating heat lost and heat gained.</p>',
   '<p>m द्रव्यमान की किसी वस्तु का ताप ΔT बदलने के लिए आवश्यक ऊष्मा</p><p class="eq">Q = m s ΔT = C ΔT</p><p>होती है, जहाँ s <b>विशिष्ट ऊष्मा</b> (प्रति इकाई द्रव्यमान, प्रति डिग्री ऊष्मा) है और C = ms <b>ऊष्मा धारिता</b> है। जल के लिए s = 4200 J kg⁻¹ K⁻¹ = 1 cal g⁻¹ °C⁻¹ और बर्फ़ के लिए s ≈ 2100 J kg⁻¹ K⁻¹ = 0.5 cal g⁻¹ °C⁻¹। जल की विशिष्ट ऊष्मा अधिक होती है, इसलिए वह धीरे-धीरे गर्म और ठंडा होता है। इसी कारण समुद्र तटीय क्षेत्रों की जलवायु सम रहती है।</p><p><b>ऊष्मामिति</b> (calorimetry) में आदान-प्रदान की गई ऊष्मा मापी जाती है। यह ऊर्जा संरक्षण पर आधारित है: यदि परिवेश में ऊष्मा की हानि न हो, तो</p><p class="eq">गर्म वस्तुओं द्वारा खोई ऊष्मा = ठंडी वस्तुओं द्वारा ली गई ऊष्मा</p><p>किसी वस्तु का <b>जल तुल्यांक</b> (water equivalent) जल का वह द्रव्यमान है जिसका ताप उतना ही बढ़ाने में उतनी ही ऊष्मा लगे। यह ms के बराबर है (g में, जब s cal g⁻¹ °C⁻¹ में हो)। भिन्न ताप के दो पदार्थ मिलाने पर अंतिम ताप दोनों के बीच होता है और इसे खोई तथा ली गई ऊष्मा बराबर रखकर निकालते हैं।</p>')},
 {h:B('Change of state and latent heat','अवस्था परिवर्तन और गुप्त ऊष्मा'),
  body:B(
   '<p>During a change of state (melting, boiling) the temperature stays constant even though heat is being supplied. The heat goes into changing the arrangement of molecules, not their kinetic energy. The heat needed per unit mass is the <b>latent heat</b> L.</p><p class="eq">Q = m L</p><ul><li>Latent heat of fusion of ice: L<sub>f</sub> = 80 cal/g = 3.36 × 10⁵ J/kg.</li><li>Latent heat of vaporisation of water: L<sub>v</sub> = 540 cal/g = 2.26 × 10⁶ J/kg.</li></ul><p>The figure shows the heating curve of ice taken from −20 °C. There are three sloping parts, where the temperature rises and Q = ms ΔT, and two flat parts, where the state changes and Q = mL. The slope is smaller (the curve is flatter) where the specific heat is larger.</p><p>Steam at 100 °C burns more than water at 100 °C because each gram of steam carries an extra 540 cal. A boiling point rises with pressure, and the melting point of ice falls slightly with pressure.</p>',
   '<p>अवस्था परिवर्तन (गलन, क्वथन) के दौरान ऊष्मा देने पर भी ताप नियत रहता है। ऊष्मा अणुओं की गतिज ऊर्जा नहीं, उनकी व्यवस्था बदलने में लगती है। प्रति इकाई द्रव्यमान आवश्यक ऊष्मा <b>गुप्त ऊष्मा</b> (latent heat) L कहलाती है।</p><p class="eq">Q = m L</p><ul><li>बर्फ़ की गलन की गुप्त ऊष्मा: L<sub>f</sub> = 80 cal/g = 3.36 × 10⁵ J/kg।</li><li>जल की वाष्पन की गुप्त ऊष्मा: L<sub>v</sub> = 540 cal/g = 2.26 × 10⁶ J/kg।</li></ul><p>चित्र में −20 °C की बर्फ़ का तापन वक्र दिखाया गया है। इसमें तीन ढलान वाले भाग हैं, जहाँ ताप बढ़ता है और Q = ms ΔT होता है, तथा दो समतल भाग हैं, जहाँ अवस्था बदलती है और Q = mL होता है। जहाँ विशिष्ट ऊष्मा अधिक होती है वहाँ वक्र अधिक समतल (कम ढाल वाला) होता है।</p><p>100 °C की भाप, 100 °C के जल से अधिक जलाती है, क्योंकि भाप के प्रत्येक ग्राम में 540 cal ऊष्मा अतिरिक्त होती है। दाब बढ़ने पर क्वथनांक बढ़ता है और बर्फ़ का गलनांक थोड़ा घटता है।</p>'),
  dg:'thermal_1',
  cap:B('Heating curve of ice from −20 °C. The flat parts are the changes of state at constant temperature.','−20 °C की बर्फ़ का तापन वक्र। समतल भाग स्थिर ताप पर अवस्था परिवर्तन दर्शाते हैं।')},
 {h:B('Conduction','चालन'),
  body:B(
   '<p><b>Conduction</b> is the transfer of heat through a material without any bulk motion of the material. It happens in solids, mainly through vibrating atoms and free electrons (which is why metals are good conductors).</p><p>In the <b>steady state</b> the temperature at each point of a rod no longer changes and the same heat flows through every cross-section. For a rod of length L, area A and conductivity K with end temperatures T₁ and T₂,</p><p class="eq">H = '+F('Q','t')+' = '+F('K A (T₁ − T₂)','L')+' = '+F('T₁ − T₂','R')+'</p><p>where R = L/KA is the <b>thermal resistance</b>. The law looks like Ohm’s law: heat current H plays the role of current, temperature difference the role of potential difference.</p><ul><li>Resistances in <b>series</b> add: R = R₁ + R₂. The same H flows, and the temperature drops add up.</li><li>In <b>parallel</b> the conductances add: 1/R = 1/R₁ + 1/R₂, and the temperature difference is common.</li></ul><p>The unit of K is W m⁻¹ K⁻¹.</p>',
   '<p><b>चालन</b> (conduction) में पदार्थ के किसी भी भाग के स्थूल गति किए बिना उसमें से ऊष्मा का स्थानांतरण होता है। यह ठोसों में मुख्यतः कंपन करते परमाणुओं और मुक्त इलेक्ट्रॉनों द्वारा होता है (इसीलिए धातुएँ अच्छी चालक हैं)।</p><p><b>स्थायी अवस्था</b> में छड़ के प्रत्येक बिंदु का ताप बदलना बंद कर देता है और हर अनुप्रस्थ काट से समान ऊष्मा प्रवाहित होती है। L लंबाई, A क्षेत्रफल और K चालकता की छड़ के सिरों के ताप T₁ और T₂ हों, तो</p><p class="eq">H = '+F('Q','t')+' = '+F('K A (T₁ − T₂)','L')+' = '+F('T₁ − T₂','R')+'</p><p>यहाँ R = L/KA <b>तापीय प्रतिरोध</b> है। यह नियम ओम के नियम जैसा है: ऊष्मा धारा H, धारा का और तापांतर, विभवांतर का काम करता है।</p><ul><li><b>श्रेणी</b> में प्रतिरोध जुड़ते हैं: R = R₁ + R₂। H समान रहता है और ताप-पतन जुड़ते हैं।</li><li><b>समांतर</b> में चालकताएँ जुड़ती हैं: 1/R = 1/R₁ + 1/R₂ और तापांतर उभयनिष्ठ रहता है।</li></ul><p>K का मात्रक W m⁻¹ K⁻¹ है।</p>'),
  dg:'thermal_2',
  cap:B('Two rods in series. The same heat current flows through both and the junction settles at a temperature between T₁ and T₂.','श्रेणी में जुड़ी दो छड़ें। दोनों में समान ऊष्मा धारा बहती है और संधि का ताप T₁ और T₂ के बीच स्थिर हो जाता है।')},
 {h:B('Convection and radiation','संवहन और विकिरण'),
  body:B(
   '<p><b>Convection</b> is heat transfer by the actual movement of a fluid (liquid or gas). Hot fluid becomes less dense and rises, cooler fluid sinks, and a current is set up. This is <i>natural</i> convection (sea breeze, boiling water). If a pump or fan drives the flow, it is <i>forced</i> convection.</p><p><b>Radiation</b> is heat transfer by electromagnetic waves. It needs no medium and travels at the speed of light. Every body above 0 K radiates. Dark rough surfaces are good absorbers and also good emitters, and a perfectly <b>black body</b> absorbs all radiation falling on it.</p><p><b>Stefan’s law.</b> The power radiated by a body of surface area A at absolute temperature T is</p><p class="eq">P = e σ A T⁴</p><p>where σ = 5.67 × 10⁻⁸ W m⁻² K⁻⁴ and e is the emissivity (e = 1 for a black body). A body at T in surroundings at T₀ loses net power</p><p class="eq">P<sub>net</sub> = e σ A (T⁴ − T₀⁴)</p><p>Temperatures must be in kelvin. If T is doubled, the power rises 16 times.</p>',
   '<p><b>संवहन</b> (convection) में तरल (द्रव या गैस) की वास्तविक गति द्वारा ऊष्मा का स्थानांतरण होता है। गर्म तरल का घनत्व कम हो जाता है और वह ऊपर उठता है, ठंडा तरल नीचे आता है और धारा बन जाती है। यह <i>प्राकृतिक</i> संवहन है (समुद्री समीर, उबलता जल)। यदि पंप या पंखे से प्रवाह कराया जाए तो यह <i>प्रेरित</i> संवहन है।</p><p><b>विकिरण</b> (radiation) में ऊष्मा का स्थानांतरण विद्युत चुंबकीय तरंगों द्वारा होता है। इसके लिए किसी माध्यम की आवश्यकता नहीं होती और यह प्रकाश की चाल से चलता है। 0 K से ऊपर की प्रत्येक वस्तु विकिरण करती है। काली खुरदरी सतहें अच्छी अवशोषक और अच्छी उत्सर्जक भी होती हैं, और पूर्ण <b>कृष्णिका</b> (black body) अपने ऊपर पड़ने वाले सारे विकिरण को अवशोषित कर लेती है।</p><p><b>स्टीफ़न का नियम।</b> पृष्ठीय क्षेत्रफल A और परम ताप T वाली वस्तु द्वारा विकिरित शक्ति</p><p class="eq">P = e σ A T⁴</p><p>होती है, जहाँ σ = 5.67 × 10⁻⁸ W m⁻² K⁻⁴ और e उत्सर्जकता है (कृष्णिका के लिए e = 1)। T ताप की वस्तु का, T₀ ताप के परिवेश में, नेट शक्ति ह्रास</p><p class="eq">P<sub>net</sub> = e σ A (T⁴ − T₀⁴)</p><p>होता है। ताप केल्विन में ही लेना है। T दोगुना करने पर शक्ति 16 गुनी हो जाती है।</p>')},
 {h:B('Newton’s law of cooling and Wien’s law','न्यूटन का शीतलन नियम और वीन का नियम'),
  body:B(
   '<p><b>Newton’s law of cooling.</b> For a small difference between a body and its surroundings, the rate of loss of heat is proportional to the temperature difference:</p><p class="eq">'+F('dT','dt')+' = −k (T − T₀)</p><p>so the temperature falls exponentially towards T₀: T = T₀ + (T₁ − T₀)e<sup>−kt</sup>. For a short interval in which the body cools from T₁ to T₂, we use the average temperature:</p><p class="eq">'+F('T₁ − T₂','t')+' = k '+F('T₁ + T₂','2')+' − k T₀</p><p>The cooling is faster when the body is much hotter than the surroundings.</p><p><b>Wien’s displacement law.</b> A hot body emits a spectrum of wavelengths. The wavelength λ<sub>m</sub> at which the emission is maximum shifts to shorter values as the temperature rises:</p><p class="eq">λ<sub>m</sub> T = b = 2.898 × 10⁻³ m K</p><p>This is why a heated iron piece turns from dull red to orange to white. The total area under the curve (the total emitted power) rises as T⁴, in agreement with Stefan’s law.</p>',
   '<p><b>न्यूटन का शीतलन नियम।</b> जब वस्तु और परिवेश के ताप में अंतर कम हो, तो ऊष्मा ह्रास की दर तापांतर के अनुक्रमानुपाती होती है:</p><p class="eq">'+F('dT','dt')+' = −k (T − T₀)</p><p>अतः ताप T₀ की ओर चरघातांकी रूप से घटता है: T = T₀ + (T₁ − T₀)e<sup>−kt</sup>। यदि वस्तु थोड़े समय में T₁ से T₂ तक ठंडी हो, तो औसत ताप लेते हैं:</p><p class="eq">'+F('T₁ − T₂','t')+' = k '+F('T₁ + T₂','2')+' − k T₀</p><p>वस्तु परिवेश से जितनी अधिक गर्म हो, शीतलन उतना तेज़ होता है।</p><p><b>वीन का विस्थापन नियम।</b> गर्म वस्तु अनेक तरंगदैर्घ्यों का वर्णक्रम उत्सर्जित करती है। जिस तरंगदैर्घ्य λ<sub>m</sub> पर उत्सर्जन अधिकतम होता है, वह ताप बढ़ने पर छोटे मान की ओर खिसकती है:</p><p class="eq">λ<sub>m</sub> T = b = 2.898 × 10⁻³ m K</p><p>इसीलिए गर्म किया जा रहा लोहे का टुकड़ा पहले हल्का लाल, फिर नारंगी और फिर सफ़ेद हो जाता है। वक्र के नीचे का कुल क्षेत्रफल (कुल उत्सर्जित शक्ति) T⁴ से बढ़ता है, जो स्टीफ़न के नियम के अनुरूप है।</p>'),
  dg:'thermal_3',
  cap:B('Black-body spectra. At higher temperature the peak is taller and moves to a shorter wavelength.','कृष्णिका वर्णक्रम। अधिक ताप पर शिखर ऊँचा होता है और छोटी तरंगदैर्घ्य की ओर खिसकता है।')}
],

examples:[
 {lv:'easy',
  q:B('Convert 77 °F into °C and into K. At what temperature do the Celsius and Fahrenheit scales read the same?','77 °F को °C और K में बदलो। किस ताप पर सेल्सियस और फ़ॉरेनहाइट पैमाने समान पाठ्यांक देते हैं?'),
  a:B('<p>C = (F − 32) × 5/9 = (77 − 32) × 5/9 = 25 °C, and K = 25 + 273 = <b>298 K</b>.</p><p>Same reading x: x = (x − 32) × 5/9, so 9x = 5x − 160, giving x = <b>−40</b> (−40 °C = −40 °F).</p>','<p>C = (F − 32) × 5/9 = (77 − 32) × 5/9 = 25 °C और K = 25 + 273 = <b>298 K</b>।</p><p>समान पाठ्यांक x के लिए x = (x − 32) × 5/9, अतः 9x = 5x − 160, जिससे x = <b>−40</b> (−40 °C = −40 °F)।</p>')},
 {lv:'easy',
  q:B('A steel rail 30 m long is laid at 10 °C. By how much will it expand at 50 °C? (α = 1.2 × 10⁻⁵ K⁻¹)','10 °C पर 30 m लंबी इस्पात की पटरी बिछाई गई। 50 °C पर यह कितनी बढ़ जाएगी? (α = 1.2 × 10⁻⁵ K⁻¹)'),
  a:S('<p>ΔL = L α ΔT = 30 × 1.2 × 10⁻⁵ × 40 = 1.44 × 10⁻² m = <b>1.44 cm</b></p>')},
 {lv:'medium',
  q:B('200 g of water at 80 °C is mixed with 300 g of water at 20 °C. Find the final temperature, ignoring heat loss. Then find the final temperature when 50 g of ice at 0 °C is dropped into 200 g of water at 40 °C (L<sub>f</sub> = 80 cal/g).','80 °C का 200 g जल 20 °C के 300 g जल में मिलाया गया। ऊष्मा हानि नगण्य मानकर अंतिम ताप ज्ञात करो। फिर 40 °C के 200 g जल में 0 °C की 50 g बर्फ़ डालने पर अंतिम ताप ज्ञात करो (L<sub>f</sub> = 80 cal/g)।'),
  a:B('<p>First: 200 × (80 − T) = 300 × (T − 20), so 16000 − 200T = 300T − 6000, giving T = 22000/500 = <b>44 °C</b>.</p><p>Second: the water can give 200 × 1 × 40 = 8000 cal in cooling to 0 °C. Melting the ice needs 50 × 80 = 4000 cal, so all the ice melts. Then 200 × (40 − T) = 4000 + 50 × (T − 0), giving 8000 − 200T = 4000 + 50T, so T = 4000/250 = <b>16 °C</b>.</p>','<p>पहला: 200 × (80 − T) = 300 × (T − 20), अतः 16000 − 200T = 300T − 6000, जिससे T = 22000/500 = <b>44 °C</b>।</p><p>दूसरा: 0 °C तक ठंडा होने में जल 200 × 1 × 40 = 8000 cal दे सकता है। बर्फ़ पिघलाने में 50 × 80 = 4000 cal लगती है, इसलिए सारी बर्फ़ पिघल जाती है। तब 200 × (40 − T) = 4000 + 50 × (T − 0), अतः 8000 − 200T = 4000 + 50T, जिससे T = 4000/250 = <b>16 °C</b>।</p>')},
 {lv:'medium',
  q:B('How much heat is needed to convert 10 g of ice at −10 °C into steam at 100 °C? (s of ice = 0.5 cal g⁻¹ °C⁻¹, L<sub>f</sub> = 80 cal/g, L<sub>v</sub> = 540 cal/g, 1 cal = 4.2 J)','−10 °C की 10 g बर्फ़ को 100 °C की भाप में बदलने के लिए कितनी ऊष्मा चाहिए? (बर्फ़ की s = 0.5 cal g⁻¹ °C⁻¹, L<sub>f</sub> = 80 cal/g, L<sub>v</sub> = 540 cal/g, 1 cal = 4.2 J)'),
  a:B('<p>Ice from −10 to 0 °C: 10 × 0.5 × 10 = 50 cal</p><p>Melting: 10 × 80 = 800 cal</p><p>Water from 0 to 100 °C: 10 × 1 × 100 = 1000 cal</p><p>Boiling: 10 × 540 = 5400 cal</p><p>Total = 50 + 800 + 1000 + 5400 = <b>7250 cal</b> = 7250 × 4.2 = <b>30450 J</b>.</p>','<p>−10 से 0 °C तक बर्फ़: 10 × 0.5 × 10 = 50 cal</p><p>गलन: 10 × 80 = 800 cal</p><p>0 से 100 °C तक जल: 10 × 1 × 100 = 1000 cal</p><p>क्वथन: 10 × 540 = 5400 cal</p><p>कुल = 50 + 800 + 1000 + 5400 = <b>7250 cal</b> = 7250 × 4.2 = <b>30450 J</b>।</p>')},
 {lv:'medium',
  q:B('A copper rod (K = 400 W m⁻¹ K⁻¹) and a steel rod (K = 50 W m⁻¹ K⁻¹), each 20 cm long and of cross-section 4 cm², are joined end to end. The free end of copper is at 100 °C and the free end of steel is at 0 °C. Find the heat current and the temperature of the junction.','तांबे की छड़ (K = 400 W m⁻¹ K⁻¹) और इस्पात की छड़ (K = 50 W m⁻¹ K⁻¹), प्रत्येक 20 cm लंबी और 4 cm² अनुप्रस्थ काट की, सिरे से सिरा मिलाकर जोड़ी गई हैं। तांबे का मुक्त सिरा 100 °C पर और इस्पात का मुक्त सिरा 0 °C पर है। ऊष्मा धारा और संधि का ताप ज्ञात करो।'),
  a:B('<p>R<sub>1</sub> = L/(K₁A) = 0.2/(400 × 4 × 10⁻⁴) = 1.25 K/W</p><p>R<sub>2</sub> = 0.2/(50 × 4 × 10⁻⁴) = 10 K/W</p><p>Series: R = 11.25 K/W, so H = 100/11.25 = <b>8.89 W</b>.</p><p>Drop across copper = H R₁ = 8.89 × 1.25 = 11.1 °C, so the junction is at 100 − 11.1 = <b>88.9 °C</b>.</p>','<p>R<sub>1</sub> = L/(K₁A) = 0.2/(400 × 4 × 10⁻⁴) = 1.25 K/W</p><p>R<sub>2</sub> = 0.2/(50 × 4 × 10⁻⁴) = 10 K/W</p><p>श्रेणी में: R = 11.25 K/W, अतः H = 100/11.25 = <b>8.89 W</b>।</p><p>तांबे पर ताप-पतन = H R₁ = 8.89 × 1.25 = 11.1 °C, इसलिए संधि का ताप 100 − 11.1 = <b>88.9 °C</b> है।</p>')},
 {lv:'hard',

D3.pv3d={
  en:'Gas in a cylinder: four thermodynamic processes on the P–V graph',hi:'सिलिंडर में गैस: P–V ग्राफ पर चार ऊष्मागतिकी प्रक्रम',h:0.9,scale:0.62,center:[0.3,0,0],spin:true,view:{yaw:-0.35,pitch:0.2,zoom:1},
  params:[{k:'k',en:'Process (1 isochoric, 2 isobaric, 3 isothermal, 4 adiabatic)',hi:'प्रक्रम (1 समआयतनिक, 2 समदाबी, 3 समतापी, 4 रुद्धोष्म)',min:1,max:4,val:3,step:1,unit:''}],
  frame:function(S,t,P,l){
    var k=P.k,g=1.4,i,P0=2,V0=1,Vf=2;
    function Pk(kk,V){return kk===1?P0:(kk===2?P0:(kk===3?P0*V0/V:P0*Math.pow(V0/V,g)))}
    var x0=-0.1,y0=-0.5,ux=0.8,uy=0.42;
    function G(V,Pp,z){return [x0+(V-0.4)*ux,y0+Pp*uy,z||0]}
    S.arrow([x0,y0,0],[x0+1.5,y0,0],'ink',1.3);S.arrow([x0,y0,0],[x0,y0+1.2,0],'ink',1.3);
    S.text([x0+1.55,y0-0.05,0],'V','ink',11,'left',true);S.text([x0,y0+1.28,0],'P','ink',11,'center',true);
    var names=[sx(l,'isochoric (V constant)','समआयतनिक (V अचर)'),sx(l,'isobaric (P constant)','समदाबी (P अचर)'),sx(l,'isothermal (T constant)','समतापी (T अचर)'),sx(l,'adiabatic (Q = 0)','रुद्धोष्म (Q = 0)')];
    function curve(kk){var pts=[];if(kk===1){for(i=0;i<=10;i++)pts.push(G(V0,P0-i*0.1))}else{for(i=0;i<=30;i++){var V=V0+(Vf-V0)*i/30;pts.push(G(V,Pk(kk,V)))}}return pts}
    for(var kk=1;kk<=4;kk++)if(kk!==k)S.path(curve(kk),'muted',1);
    var c=curve(k);S.path(c,'accent',3.4);
    var ph=(t*0.35)%1.4;if(ph>1)ph=1;
    var idx=Math.round(ph*(c.length-1)),Vc=k===1?V0:V0+(Vf-V0)*ph;
    var area=[G(V0,0),c[0]].concat(c.slice(0,idx+1)).concat([G(k===1?V0:Vc,0)]);
    if(k!==1)S.poly(area,'hi',0.3);
    S.sphere(c[idx],0.05,'hi',true);
    var cx=-1.15,pistonY=-0.4+(Vc*0.45);
    S.box([cx,-0.05,0],[0.5,1.1,0.4],'soft');
    S.box([cx,pistonY-0.2,0.0],[0.46,0.06,0.36],'ink');
    S.line([cx,pistonY-0.18,0],[cx,pistonY+0.35,0],'ink',3);
    S.box([cx,pistonY-0.55,0],[0.4,0.6,0.3],'bad');
    S.text([cx,-0.7,0],sx(l,'gas','गैस'),'bad',10,'center',true);
    var W=[0,2,2*Math.log(2),(2-Pk(4,2)*2)/(g-1)][k-1],dU=[(1-2)/(g-1),(4-2)/(g-1),0,-(2-Pk(4,2)*2)/(g-1)][k-1],Q=W+dU;
    S.hud(0.04,0.07,names[k-1],'accent',12,'left',true);
    S.hud(0.04,0.16,'W = '+W.toFixed(2)+'   ΔU = '+dU.toFixed(2)+'   Q = '+Q.toFixed(2),'ink',12,'left',true);
    S.hud(0.04,0.25,sx(l,'Shaded area under the curve = work done','वक्र के नीचे छायांकित क्षेत्र = किया गया कार्य'),'muted',10,'left');
  }
};
D3.carnot3d={
  en:'Carnot cycle: the most efficient engine between two temperatures',hi:'कार्नो चक्र: दो तापमानों के बीच सबसे दक्ष इंजन',h:0.9,scale:0.82,center:[0.05,0,0],spin:true,view:{yaw:-0.4,pitch:0.25,zoom:1},
  params:[{k:'T',en:'Hot source T₁ (K), cold sink T₂ = 300 K',hi:'तप्त स्रोत T₁ (K), शीतल सिंक T₂ = 300 K',min:350,max:600,val:600,step:50,unit:''}],
  frame:function(S,t,P,l){
    var T1=P.T,T2=300,g=1.4,VA=1,VB=1.6,i;
    var VC=VB*Math.pow(T1/T2,1/(g-1)),VD=VA*Math.pow(T1/T2,1/(g-1));
    var x0=-0.9,y0=-0.5,ux=0.2,uy=0.0013;
    function G(V,Pp,z){return [x0+Math.log(V)*0.62,y0+Math.log(Pp/20)*0.3,z||0]}
    var segs=[],pts=[];
    function add(f,a,b,n){for(i=0;i<=n;i++){var V=a+(b-a)*i/n;pts.push([V,f(V)])}}
    add(function(V){return T1/V},VA,VB,20);
    add(function(V){return T1*Math.pow(VB,g-1)*Math.pow(V,-g)},VB,VC,24);
    add(function(V){return T2/V},VC,VD,24);
    add(function(V){return T2*Math.pow(VD,g-1)*Math.pow(V,-g)},VD,VA,24);
    S.arrow([x0,y0,0],[x0+2.0,y0,0],'ink',1.3);S.arrow([x0,y0,0],[x0,y0+1.15,0],'ink',1.3);
    S.text([x0+2.05,y0-0.05,0],sx(l,'V (log scale)','V (लॉग पैमाना)'),'ink',10,'left',true);S.text([x0,y0+1.2,0],sx(l,'P (log)','P (लॉग)'),'ink',10,'center',true);
    var loop=pts.map(function(p){return G(p[0],p[1],0)});
    S.poly(loop,'hi',0.25,'hi');
    S.path(loop.concat([loop[0]]),'accent',3.2);
    var n=pts.length,ph=((t*0.12)%1)*(n-1),ii=Math.floor(ph);
    S.sphere(loop[ii],0.055,'hi',true);
    var stage=ii<20?sx(l,'A → B isothermal expansion at T₁ (absorbs heat)','A → B समतापी प्रसार T₁ पर (ऊष्मा लेता)'):(ii<45?sx(l,'B → C adiabatic expansion (cools to T₂)','B → C रुद्धोष्म प्रसार (T₂ तक ठंडा)'):(ii<70?sx(l,'C → D isothermal compression at T₂ (rejects heat)','C → D समतापी संपीडन T₂ पर (ऊष्मा त्यागता)'):sx(l,'D → A adiabatic compression (heats to T₁)','D → A रुद्धोष्म संपीडन (T₁ तक गर्म)')));
    S.hud(0.04,0.07,'T₁ = '+T1+' K   T₂ = '+T2+' K','ink',12,'left',true);
    S.hud(0.04,0.16,'η = 1 − T₂/T₁ = '+Math.round((1-T2/T1)*100)+'%','accent',13,'left',true);
    S.hud(0.04,0.25,stage,'hi',10.5,'left',true);
  }
};

CH=CH.concat([{
id:'physics-thermodynamics', subject:'physics', cls:11, ord:12,
title:B('Thermodynamics','ऊष्मागतिकी'),
blurb:B('Zeroth, first and second laws, thermodynamic processes, specific heats and the Carnot engine.','शून्यवाँ, पहला और दूसरा नियम, ऊष्मागतिकी प्रक्रम, विशिष्ट ऊष्माएँ और कार्नो इंजन।'),
sections:[
 {h:B('Thermal equilibrium, internal energy, heat and work','ऊष्मीय साम्य, आंतरिक ऊर्जा, ऊष्मा और कार्य'),
  body:B(
   '<p class="def"><b>In simple words:</b> thermodynamics is the study of how heat turns into work and back. The <b>system</b> is the gas (or object) we study; everything else is the <b>surroundings</b>.</p><p><b>Zeroth law:</b> if A is in thermal equilibrium with C and B is in equilibrium with C, then A and B are in equilibrium with each other. This is why a thermometer works: it gives a number called <b>temperature</b>.</p><ul><li><b>Internal energy U</b> is the total kinetic + potential energy of the molecules. For an ideal gas it depends <b>only on temperature</b>.</li><li><b>Heat Q</b> is energy that flows because of a temperature difference. <b>Work W</b> is energy transferred by a force moving something (e.g. a piston).</li><li>Q and W are <b>not</b> properties of the state; they depend on the path. U, P, V, T are <b>state functions</b>.</li></ul><p><b>Work by a gas</b> when volume changes:</p><p class="eq">W = ∫ P dV  = area under the P–V graph</p><p>For constant pressure: W = PΔV. Work done <b>by</b> the gas is positive (expansion); work done <b>on</b> the gas is negative.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> ऊष्मागतिकी यह अध्ययन है कि ऊष्मा कैसे कार्य में बदलती है और कार्य ऊष्मा में। <b>निकाय</b> वह गैस (या वस्तु) है जिसका हम अध्ययन करते हैं; बाकी सब <b>परिवेश</b> है।</p><p><b>शून्यवाँ नियम:</b> यदि A, C के साथ और B, C के साथ ऊष्मीय साम्य में है तो A और B आपस में भी साम्य में हैं। इसीलिए थर्मामीटर काम करता है: वह <b>तापमान</b> नाम की संख्या देता है।</p><ul><li><b>आंतरिक ऊर्जा U</b> अणुओं की कुल गतिज + स्थितिज ऊर्जा है। आदर्श गैस के लिए यह <b>केवल तापमान</b> पर निर्भर है।</li><li><b>ऊष्मा Q</b> वह ऊर्जा है जो तापांतर के कारण बहती है। <b>कार्य W</b> वह ऊर्जा है जो बल द्वारा किसी चीज़ (जैसे पिस्टन) को हिलाने से स्थानांतरित होती है।</li><li>Q और W अवस्था के गुण <b>नहीं</b> हैं; वे पथ पर निर्भर हैं। U, P, V, T <b>अवस्था फलन</b> हैं।</li></ul><p>आयतन बदलने पर <b>गैस द्वारा कार्य</b>:</p><p class="eq">W = ∫ P dV  = P–V ग्राफ के नीचे का क्षेत्रफल</p><p>अचर दाब पर: W = PΔV। गैस <b>द्वारा</b> किया कार्य धनात्मक (प्रसार) है; गैस <b>पर</b> किया कार्य ऋणात्मक।</p>')},
 {h:B('First law and thermodynamic processes','पहला नियम और ऊष्मागतिकी प्रक्रम'),
  body:B(
   '<p class="def"><b>In simple words:</b> energy cannot be created or destroyed. The heat you give a gas either raises its internal energy or lets it do work.</p><p class="eq">Q = ΔU + W</p><p class="eq">ΔU = n C<sub>v</sub> ΔT    (for any process of an ideal gas)</p><p><b>Four processes</b> (ideal gas):</p><ul><li><b>Isochoric</b> (V constant): W = 0, so Q = ΔU.</li><li><b>Isobaric</b> (P constant): W = PΔV = nRΔT, Q = nC<sub>p</sub>ΔT.</li><li><b>Isothermal</b> (T constant, slow): ΔU = 0, so Q = W = nRT ln(V₂/V₁). PV = constant.</li><li><b>Adiabatic</b> (no heat exchange, fast): Q = 0, so W = −ΔU. PV<sup>γ</sup> = constant.</li></ul><p class="eq">W<sub>adiabatic</sub> = (P₁V₁ − P₂V₂)/(γ − 1) = nR(T₁ − T₂)/(γ − 1)</p><p>On the P–V graph an adiabatic curve is <b>steeper</b> than an isothermal one. In the figure, pick the process and read W, ΔU and Q.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> ऊर्जा न बनाई जा सकती है न नष्ट की जा सकती है। गैस को दी गई ऊष्मा या तो उसकी आंतरिक ऊर्जा बढ़ाती है या उसे कार्य करने देती है।</p><p class="eq">Q = ΔU + W</p><p class="eq">ΔU = n C<sub>v</sub> ΔT    (आदर्श गैस के हर प्रक्रम के लिए)</p><p><b>चार प्रक्रम</b> (आदर्श गैस):</p><ul><li><b>समआयतनिक</b> (V अचर): W = 0, अतः Q = ΔU।</li><li><b>समदाबी</b> (P अचर): W = PΔV = nRΔT, Q = nC<sub>p</sub>ΔT।</li><li><b>समतापी</b> (T अचर, धीमा): ΔU = 0, अतः Q = W = nRT ln(V₂/V₁)। PV = अचर।</li><li><b>रुद्धोष्म</b> (ऊष्मा का आदान-प्रदान नहीं, तेज़): Q = 0, अतः W = −ΔU। PV<sup>γ</sup> = अचर।</li></ul><p class="eq">W<sub>रुद्धोष्म</sub> = (P₁V₁ − P₂V₂)/(γ − 1) = nR(T₁ − T₂)/(γ − 1)</p><p>P–V ग्राफ पर रुद्धोष्म वक्र समतापी से <b>अधिक तीखा</b> होता है। चित्र में प्रक्रम चुनो और W, ΔU और Q पढ़ो।</p>'),
  d3:'pv3d',
  cap:B('The piston moves and the point travels along the chosen curve. The shaded area under it is the work done by the gas.','पिस्टन चलता है और बिंदु चुने गए वक्र पर चलता है। उसके नीचे का छायांकित क्षेत्र गैस द्वारा किया कार्य है।')},
 {h:B('Specific heats of a gas','गैस की विशिष्ट ऊष्माएँ'),
  body:B(
   '<p class="def"><b>In simple words:</b> a gas can be heated in a closed box (volume fixed) or with a movable lid (pressure fixed). With the lid free, part of the heat is spent pushing the lid out as work, so you need <b>more</b> heat for the same rise in temperature.</p><ul><li><b>C<sub>v</sub></b>: molar specific heat at constant volume. All the heat raises U.</li><li><b>C<sub>p</sub></b>: molar specific heat at constant pressure. C<sub>p</sub> &gt; C<sub>v</sub>.</li></ul><p class="eq">C<sub>p</sub> − C<sub>v</sub> = R        γ = C<sub>p</sub>/C<sub>v</sub></p><ul><li>Monatomic gas: C<sub>v</sub> = 3R/2, C<sub>p</sub> = 5R/2, γ = 5/3.</li><li>Diatomic gas (room temperature): C<sub>v</sub> = 5R/2, C<sub>p</sub> = 7R/2, γ = 7/5.</li><li>Adiabatic relations: PV<sup>γ</sup> = constant, TV<sup>γ−1</sup> = constant, T<sup>γ</sup>P<sup>1−γ</sup> = constant.</li></ul><p><b>Why adiabatic compression heats a gas:</b> the work done on it has nowhere to go but into U, so T rises. This is how a bicycle pump gets hot, and how a diesel engine lights its fuel.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> गैस को बंद डिब्बे में (आयतन स्थिर) या खुले ढक्कन के साथ (दाब स्थिर) गर्म किया जा सकता है। ढक्कन मुक्त हो तो ऊष्मा का कुछ भाग ढक्कन को बाहर धकेलने में कार्य के रूप में खर्च होता है, इसलिए उतना ही तापमान बढ़ाने के लिए <b>अधिक</b> ऊष्मा चाहिए।</p><ul><li><b>C<sub>v</sub></b>: स्थिर आयतन पर मोलर विशिष्ट ऊष्मा। पूरी ऊष्मा U बढ़ाती है।</li><li><b>C<sub>p</sub></b>: स्थिर दाब पर मोलर विशिष्ट ऊष्मा। C<sub>p</sub> &gt; C<sub>v</sub>।</li></ul><p class="eq">C<sub>p</sub> − C<sub>v</sub> = R        γ = C<sub>p</sub>/C<sub>v</sub></p><ul><li>एकपरमाणुक गैस: C<sub>v</sub> = 3R/2, C<sub>p</sub> = 5R/2, γ = 5/3।</li><li>द्विपरमाणुक गैस (कमरे के तापमान पर): C<sub>v</sub> = 5R/2, C<sub>p</sub> = 7R/2, γ = 7/5।</li><li>रुद्धोष्म संबंध: PV<sup>γ</sup> = अचर, TV<sup>γ−1</sup> = अचर, T<sup>γ</sup>P<sup>1−γ</sup> = अचर।</li></ul><p><b>रुद्धोष्म संपीडन गैस को क्यों गर्म करता है:</b> उस पर किए गए कार्य के पास U में जाने के अलावा कोई रास्ता नहीं, इसलिए T बढ़ता है। इसी से साइकिल का पंप गर्म होता है और डीज़ल इंजन ईंधन जलाता है।</p>')},
 {h:B('Second law, heat engines and the Carnot cycle','दूसरा नियम, ऊष्मा इंजन और कार्नो चक्र'),
  body:B(
   '<p class="def"><b>In simple words:</b> the first law allows heat to flow either way, but nature only lets it flow <b>from hot to cold</b> by itself, and no engine can turn all the heat into work. The second law says so.</p><ul><li><b>Kelvin–Planck:</b> no engine can take heat from one reservoir and turn all of it into work.</li><li><b>Clausius:</b> heat cannot flow from cold to hot on its own, without work.</li></ul><p><b>Heat engine:</b> takes Q₁ from a hot source, does work W, and rejects Q₂ to a cold sink.</p><p class="eq">η = W / Q₁ = 1 − Q₂/Q₁</p><p><b>Carnot engine</b> (ideal, reversible) has the maximum efficiency possible between temperatures T₁ and T₂ (in kelvin):</p><p class="eq">η = 1 − T₂ / T₁</p><ul><li>Four steps: isothermal expansion at T₁, adiabatic expansion, isothermal compression at T₂, adiabatic compression.</li><li>η = 100% would need T₂ = 0 K, which is impossible.</li><li><b>Refrigerator:</b> runs the cycle backwards. Coefficient of performance COP = Q₂/W = T₂/(T₁ − T₂).</li></ul><p>In the figure, raise T₁: the enclosed loop (the net work) gets bigger and the efficiency rises.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> पहला नियम ऊष्मा को दोनों ओर बहने देता है, पर प्रकृति में ऊष्मा अपने आप केवल <b>गर्म से ठंडे</b> की ओर बहती है, और कोई इंजन सारी ऊष्मा को कार्य में नहीं बदल सकता। दूसरा नियम यही कहता है।</p><ul><li><b>केल्विन–प्लांक:</b> कोई इंजन एक ही भंडार से ऊष्मा लेकर उस सब को कार्य में नहीं बदल सकता।</li><li><b>क्लॉसियस:</b> बिना कार्य किए ऊष्मा ठंडे से गर्म की ओर अपने आप नहीं बह सकती।</li></ul><p><b>ऊष्मा इंजन:</b> गर्म स्रोत से Q₁ लेता है, कार्य W करता है और ठंडे सिंक को Q₂ त्यागता है।</p><p class="eq">η = W / Q₁ = 1 − Q₂/Q₁</p><p><b>कार्नो इंजन</b> (आदर्श, उत्क्रमणीय) T₁ और T₂ (केल्विन में) के बीच अधिकतम संभव दक्षता देता है:</p><p class="eq">η = 1 − T₂ / T₁</p><ul><li>चार चरण: T₁ पर समतापी प्रसार, रुद्धोष्म प्रसार, T₂ पर समतापी संपीडन, रुद्धोष्म संपीडन।</li><li>η = 100% के लिए T₂ = 0 K चाहिए, जो असंभव है।</li><li><b>प्रशीतक:</b> चक्र को उलटा चलाता है। निष्पादन गुणांक COP = Q₂/W = T₂/(T₁ − T₂)।</li></ul><p>चित्र में T₁ बढ़ाओ: घिरा हुआ लूप (कुल कार्य) बड़ा होता है और दक्षता बढ़ती है।</p>'),
  d3:'carnot3d',
  cap:B('The point goes round the four steps of the Carnot cycle (drawn on log scales to show the shape clearly). The shaded loop is the net work per cycle.','बिंदु कार्नो चक्र के चारों चरणों में घूमता है (आकार साफ दिखाने के लिए लॉग पैमाने पर)। छायांकित लूप प्रति चक्र कुल कार्य है।')}
],

 {lv:'medium',

  en:'A point in 3D space: the box of coordinates',hi:'3D अंतरिक्ष में बिंदु: निर्देशांकों का डिब्बा',h:0.85,scale:0.58,center:[0,0.3,0],spin:true,view:{yaw:-0.7,pitch:0.4,zoom:1},
  params:[
    {k:'x',en:'x',hi:'x',min:-6,max:6,val:2,step:1,unit:''},
    {k:'y',en:'y',hi:'y',min:-6,max:6,val:3,step:1,unit:''},
    {k:'z',en:'z',hi:'z',min:-6,max:6,val:6,step:1,unit:''}
  ],
  frame:function(S,t,P,l){
    var u=0.17,x=P.x,y=P.y,z=P.z,i,j,k;
    function M(X,Y,Z){return [X*u,Z*u,-Y*u]}
    S.floor([M(-7,-7,0),M(7,-7,0),M(7,7,0),M(-7,7,0)],'soft',0.45,'line');
    S.arrow(M(-7,0,0),M(7.6,0,0),'accent',1.6);S.arrow(M(0,-7,0),M(0,7.6,0),'good',1.6);S.arrow(M(0,0,-7),M(0,0,7.6),'bad',1.6);
    S.text(M(8.6,0,0),'X','accent',13,'center',true);S.text(M(0,8.6,0),'Y','good',13,'center',true);S.text(M(0,0,8.6),'Z','bad',13,'center',true);
    var cx=[0,x],cy=[0,y],cz=[0,z];
    for(i=0;i<2;i++)for(j=0;j<2;j++)for(k=0;k<2;k++){
      if(i===0)S.line(M(cx[0],cy[j],cz[k]),M(cx[1],cy[j],cz[k]),'muted',1);
      if(j===0)S.line(M(cx[i],cy[0],cz[k]),M(cx[i],cy[1],cz[k]),'muted',1);
      if(k===0)S.line(M(cx[i],cy[j],cz[0]),M(cx[i],cy[j],cz[1]),'muted',1);
    }
    S.line(M(0,0,0),M(x,0,0),'accent',3);S.line(M(x,0,0),M(x,y,0),'good',3);S.line(M(x,y,0),M(x,y,z),'bad',3);
    S.line(M(0,0,0),M(x,y,z),'hi',2.6);
    S.sphere(M(0,0,0),0.045,'ink');S.text(M(-0.8,0,-0.9),'O','ink',11,'center',true);
    S.sphere(M(x,y,z),0.065,'hi',true);
    S.text(M(x,y,z+1.2),'P','hi',13,'center',true);
    var s=(Math.sin(t*1.2)+1)/2;
    S.sphere(M(x*s,y*s,z*s),0.04,'ink',true);
    var d2=x*x+y*y+z*z,d=Math.sqrt(d2);
    var oc={'+++':'I','-++':'II','--+':'III','+-+':'IV','++-':'V','-+-':'VI','---':'VII','+--':'VIII'};
    var on=(!x||!y||!z);
    var ot=on?sx(l,'on a plane or axis','किसी तल या अक्ष पर'):sx(l,'octant ','अष्टांश ')+oc[(x>0?'+':'-')+(y>0?'+':'-')+(z>0?'+':'-')];
    S.hud(0.04,0.07,'P('+x+', '+y+', '+z+')  ·  '+ot,'hi',13,'left',true);
    S.hud(0.04,0.16,'OP = √('+x*x+' + '+y*y+' + '+z*z+') = '+(Math.round(d*100)/100),'ink',12,'left',true);
    S.hud(0.04,0.25,sx(l,'x along X, then y along Y, then z up Z','x, X-अक्ष पर; फिर y, Y-अक्ष पर; फिर z ऊपर Z-अक्ष पर'),'muted',9.5,'left');
  }
};
D3.sect3d={
  en:'Section formula: a point dividing a segment in m : n',hi:'विभाजन सूत्र: रेखाखंड को m : n में बाँटने वाला बिंदु',h:0.85,scale:0.95,center:[0,0,0],spin:true,view:{yaw:-0.6,pitch:0.42,zoom:1},
  params:[
    {k:'m',en:'m (AP part)',hi:'m (AP भाग)',min:1,max:5,val:1,step:1,unit:''},
    {k:'n',en:'n (PB part)',hi:'n (PB भाग)',min:1,max:5,val:2,step:1,unit:''}
  ],
  frame:function(S,t,P,l){
    var u=0.12,m=P.m,n=P.n,i;
    function M(X,Y,Z){return [(X-2)*u,(Z-4)*u,-(Y-1)*u]}
    function f(v){return String(Math.round(v*100)/100)}
    var A=[-1,-2,1],B=[5,4,7];
    var px=(n*A[0]+m*B[0])/(m+n),py=(n*A[1]+m*B[1])/(m+n),pz=(n*A[2]+m*B[2])/(m+n);
    S.floor([M(-3,-4,0),M(8,-4,0),M(8,6,0),M(-3,6,0)],'soft',0.45,'line');
    S.arrow(M(-3,0,0),M(8.4,0,0),'accent',1.3);S.arrow(M(0,-4,0),M(0,6.4,0),'good',1.3);S.arrow(M(0,0,0),M(0,0,8.6),'bad',1.3);
    S.text(M(9.4,0,0),'X','accent',12,'center',true);S.text(M(0,7.4,0),'Y','good',12,'center',true);S.text(M(0,0,9.6),'Z','bad',12,'center',true);
    S.line(M(A[0],A[1],A[2]),M(B[0],B[1],B[2]),'ink',2.4);
    S.line(M(A[0],A[1],A[2]),M(px,py,pz),'accent',4);S.line(M(px,py,pz),M(B[0],B[1],B[2]),'good',4);
    S.line(M(px,py,pz),M(px,py,0),'muted',1.1);S.line(M(A[0],A[1],A[2]),M(A[0],A[1],0),'muted',1.1);S.line(M(B[0],B[1],B[2]),M(B[0],B[1],0),'muted',1.1);
    S.sphere(M(A[0],A[1],A[2]),0.06,'accent',true);S.sphere(M(B[0],B[1],B[2]),0.06,'good',true);S.sphere(M(px,py,pz),0.07,'hi',true);
    S.text(M(A[0],A[1],A[2]+1.1),'A','accent',13,'center',true);S.text(M(B[0],B[1],B[2]+1.1),'B','good',13,'center',true);S.text(M(px,py,pz+1.1),'P','hi',13,'center',true);
    var s=(Math.sin(t*1.1)+1)/2;
    S.sphere(M(A[0]+(B[0]-A[0])*s,A[1]+(B[1]-A[1])*s,A[2]+(B[2]-A[2])*s),0.035,'ink',true);
    S.hud(0.04,0.07,'A(−1, −2, 1)   B(5, 4, 7)','ink',12,'left',true);
    S.hud(0.04,0.16,'AP : PB = '+m+' : '+n,'accent',13,'left',true);
    S.hud(0.04,0.25,'P = ('+f(px)+', '+f(py)+', '+f(pz)+')','hi',13,'left',true);
  }
};

CH=CH.concat([{
id:'maths-three-d-geometry', subject:'maths', cls:11, ord:12,
title:B('Introduction to Three Dimensional Geometry','त्रिविमीय ज्यामिति का परिचय'),
blurb:B('Coordinate axes and planes, octants, the distance formula, the section formula and simple applications in space.','निर्देशांक अक्ष और तल, अष्टांश, दूरी सूत्र, विभाजन सूत्र और अंतरिक्ष में सरल अनुप्रयोग।'),
sections:[
 {h:B('Axes, planes and octants','अक्ष, तल और अष्टांश'),
  body:B(
   '<p class="def"><b>In simple words:</b> a point on a paper needs two numbers (x, y). A point in a room needs <b>three</b>: how far along the floor to the right (x), how far along the floor forward (y), and how high up (z).</p><p>Three number lines meet at one point O (the <b>origin</b>), each at 90° to the other two. These are the <b>X-axis, Y-axis and Z-axis</b>. Every two axes make a plane: the <b>XY-plane</b> (z = 0), the <b>YZ-plane</b> (x = 0) and the <b>ZX-plane</b> (y = 0). These three planes cut space into <b>8 octants</b>.</p><p class="eq">P(x, y, z)</p><ul><li>Any point on the X-axis looks like (a, 0, 0), on the Y-axis (0, b, 0), on the Z-axis (0, 0, c).</li><li>A point in the XY-plane has z = 0, in the YZ-plane x = 0, in the ZX-plane y = 0.</li><li>Distance of P from the XY-plane = |z|, from the YZ-plane = |x|, from the ZX-plane = |y|.</li></ul><table><tr><th>Octant</th><th>I</th><th>II</th><th>III</th><th>IV</th><th>V</th><th>VI</th><th>VII</th><th>VIII</th></tr><tr><td>x</td><td>+</td><td>−</td><td>−</td><td>+</td><td>+</td><td>−</td><td>−</td><td>+</td></tr><tr><td>y</td><td>+</td><td>+</td><td>−</td><td>−</td><td>+</td><td>+</td><td>−</td><td>−</td></tr><tr><td>z</td><td>+</td><td>+</td><td>+</td><td>+</td><td>−</td><td>−</td><td>−</td><td>−</td></tr></table><p>In the figure the point P is reached in three steps: x along X, then y along Y, then z up. The four corners of this box give all its coordinates. Move the sliders and rotate the box to see how the octant changes.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> कागज़ पर बिंदु के लिए दो संख्याएँ (x, y) चाहिए। कमरे में बिंदु के लिए <b>तीन</b> चाहिए: फर्श पर दाईं ओर कितना दूर (x), फर्श पर आगे कितना दूर (y), और कितना ऊँचा (z)।</p><p>तीन संख्या रेखाएँ एक बिंदु O (<b>मूल बिंदु</b>) पर मिलती हैं और हर दो आपस में 90° पर होती हैं। ये <b>X-अक्ष, Y-अक्ष और Z-अक्ष</b> हैं। हर दो अक्ष एक तल बनाते हैं: <b>XY-तल</b> (z = 0), <b>YZ-तल</b> (x = 0) और <b>ZX-तल</b> (y = 0)। ये तीनों तल अंतरिक्ष को <b>8 अष्टांशों</b> में बाँटते हैं।</p><p class="eq">P(x, y, z)</p><ul><li>X-अक्ष पर कोई भी बिंदु (a, 0, 0), Y-अक्ष पर (0, b, 0), Z-अक्ष पर (0, 0, c) होता है।</li><li>XY-तल के बिंदु में z = 0, YZ-तल में x = 0, ZX-तल में y = 0।</li><li>P की XY-तल से दूरी = |z|, YZ-तल से = |x|, ZX-तल से = |y|।</li></ul><table><tr><th>अष्टांश</th><th>I</th><th>II</th><th>III</th><th>IV</th><th>V</th><th>VI</th><th>VII</th><th>VIII</th></tr><tr><td>x</td><td>+</td><td>−</td><td>−</td><td>+</td><td>+</td><td>−</td><td>−</td><td>+</td></tr><tr><td>y</td><td>+</td><td>+</td><td>−</td><td>−</td><td>+</td><td>+</td><td>−</td><td>−</td></tr><tr><td>z</td><td>+</td><td>+</td><td>+</td><td>+</td><td>−</td><td>−</td><td>−</td><td>−</td></tr></table><p>चित्र में बिंदु P तक तीन चरणों में पहुँचते हैं: पहले x, X के अनुदिश; फिर y, Y के अनुदिश; फिर z ऊपर की ओर। इस डिब्बे के कोनों से सारे निर्देशांक मिल जाते हैं। स्लाइडर चलाओ और डिब्बे को घुमाकर देखो कि अष्टांश कैसे बदलता है।</p>'),
  d3:'point3d',
  cap:B('A point P(x, y, z) sits at the corner of a box built from its three coordinates. The diagonal OP is its distance from the origin.','बिंदु P(x, y, z) अपने तीनों निर्देशांकों से बने डिब्बे के कोने पर होता है। विकर्ण OP मूल बिंदु से उसकी दूरी है।')},
 {h:B('Distance between two points','दो बिंदुओं के बीच की दूरी'),
  body:B(
   '<p class="def"><b>In simple words:</b> the distance between two points in space is the length of the diagonal of the box that has the two points at opposite corners. Use Pythagoras twice: once on the floor, once going up.</p><p>For P(x₁, y₁, z₁) and Q(x₂, y₂, z₂):</p><p class="eq">PQ = √[(x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²]</p><ul><li>From the origin: OP = √(x² + y² + z²). In the figure above, P(2, 3, 6) gives OP = √(4 + 9 + 36) = 7.</li><li>The order of the points does not matter, because every difference is squared.</li><li>Distance from a point to an axis, for example from P(x, y, z) to the X-axis, is √(y² + z²).</li></ul><p><b>Why it works:</b> on the floor the diagonal is √(Δx² + Δy²). That floor diagonal and the height Δz form a right triangle, so the full distance is √(Δx² + Δy² + Δz²).</p><p><b>Sphere:</b> all points at a fixed distance r from a centre (a, b, c) form a sphere.</p><p class="eq">(x − a)² + (y − b)² + (z − c)² = r²</p><p>Example: the points at distance 3 from the origin satisfy x² + y² + z² = 9.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> अंतरिक्ष में दो बिंदुओं के बीच की दूरी उस डिब्बे के विकर्ण की लंबाई है जिसके आमने-सामने के कोनों पर वे दो बिंदु हैं। पाइथागोरस दो बार लगाओ: एक बार फर्श पर, एक बार ऊपर जाते हुए।</p><p>P(x₁, y₁, z₁) और Q(x₂, y₂, z₂) के लिए:</p><p class="eq">PQ = √[(x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²]</p><ul><li>मूल बिंदु से: OP = √(x² + y² + z²)। ऊपर के चित्र में P(2, 3, 6) से OP = √(4 + 9 + 36) = 7।</li><li>बिंदुओं का क्रम मायने नहीं रखता, क्योंकि हर अंतर का वर्ग होता है।</li><li>बिंदु P(x, y, z) की X-अक्ष से दूरी √(y² + z²) होती है।</li></ul><p><b>यह क्यों काम करता है:</b> फर्श पर विकर्ण √(Δx² + Δy²) है। यह फर्श का विकर्ण और ऊँचाई Δz एक समकोण त्रिभुज बनाते हैं, इसलिए पूरी दूरी √(Δx² + Δy² + Δz²) है।</p><p><b>गोला:</b> केंद्र (a, b, c) से निश्चित दूरी r पर स्थित सभी बिंदु गोला बनाते हैं।</p><p class="eq">(x − a)² + (y − b)² + (z − c)² = r²</p><p>उदाहरण: मूल बिंदु से दूरी 3 वाले बिंदु x² + y² + z² = 9 को संतुष्ट करते हैं।</p>')},
 {h:B('Section formula, midpoint and centroid','विभाजन सूत्र, मध्य बिंदु और केंद्रक'),
  body:B(
   '<p class="def"><b>In simple words:</b> a point P that sits on the line AB and cuts it in the ratio <b>m : n</b> means AP : PB = m : n. For example, 1 : 2 means P is one-third of the way from A to B.</p><p>For A(x₁, y₁, z₁) and B(x₂, y₂, z₂), the point P dividing AB <b>internally</b> in the ratio m : n is</p><p class="eq">P = ( (mx₂ + nx₁)/(m + n),  (my₂ + ny₁)/(m + n),  (mz₂ + nz₁)/(m + n) )</p><ul><li><b>Midpoint</b> (m = n): ((x₁ + x₂)/2, (y₁ + y₂)/2, (z₁ + z₂)/2).</li><li><b>External division</b> in m : n: replace n by −n, so the denominator is m − n.</li><li><b>Centroid</b> of a triangle with vertices (x₁, y₁, z₁), (x₂, y₂, z₂), (x₃, y₃, z₃): ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3, (z₁ + z₂ + z₃)/3).</li></ul><p><b>Memory trick:</b> each coordinate of P is a weighted average. The far point is multiplied by the near part of the ratio, which is why m goes with B (the point P is nearer to A when m is small).</p><p>Example: A(−1, −2, 1), B(5, 4, 7), ratio 1 : 2. P = ((5 + 2(−1))/3, (4 + 2(−2))/3, (7 + 2·1)/3) = (1, 0, 3). This is exactly what the figure shows. Change m and n and watch P slide along AB.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> रेखा AB पर स्थित वह बिंदु P जो उसे <b>m : n</b> के अनुपात में काटे, यानी AP : PB = m : n। उदाहरण के लिए 1 : 2 का मतलब P, A से B की ओर एक-तिहाई दूरी पर है।</p><p>A(x₁, y₁, z₁) और B(x₂, y₂, z₂) के लिए AB को m : n में <b>अंतः</b> विभाजित करने वाला बिंदु P है</p><p class="eq">P = ( (mx₂ + nx₁)/(m + n),  (my₂ + ny₁)/(m + n),  (mz₂ + nz₁)/(m + n) )</p><ul><li><b>मध्य बिंदु</b> (m = n): ((x₁ + x₂)/2, (y₁ + y₂)/2, (z₁ + z₂)/2)।</li><li><b>बाह्य विभाजन</b> m : n में: n की जगह −n रखो, अतः हर m − n होगा।</li><li>शीर्ष (x₁, y₁, z₁), (x₂, y₂, z₂), (x₃, y₃, z₃) वाले त्रिभुज का <b>केंद्रक</b>: ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3, (z₁ + z₂ + z₃)/3)।</li></ul><p><b>याद रखने की युक्ति:</b> P का हर निर्देशांक भारित औसत है। दूर वाले बिंदु को अनुपात के पास वाले भाग से गुणा करते हैं, इसीलिए m, B के साथ जाता है (m छोटा हो तो P, A के पास होता है)।</p><p>उदाहरण: A(−1, −2, 1), B(5, 4, 7), अनुपात 1 : 2। P = ((5 + 2(−1))/3, (4 + 2(−2))/3, (7 + 2·1)/3) = (1, 0, 3)। चित्र यही दिखाता है। m और n बदलो और P को AB पर सरकते देखो।</p>'),
  d3:'sect3d',
  cap:B('P divides AB in the ratio m : n. Changing m and n slides P along the line, and its coordinates update with the formula.','P, AB को m : n में बाँटता है। m और n बदलने पर P रेखा पर सरकता है और उसके निर्देशांक सूत्र के अनुसार बदलते हैं।')},
 {h:B('Using the formulas: shapes and checks','सूत्रों का प्रयोग: आकृतियाँ और जाँच'),
  body:B(
   '<p class="def"><b>In simple words:</b> distance and section formulas let you <b>prove</b> things about points without drawing: whether three points lie on a line, whether a triangle is right-angled, and what shape four points make.</p><ul><li><b>Collinear points</b> A, B, C: the longest of AB, BC, CA equals the sum of the other two. Example: AB + BC = AC means B lies between A and C.</li><li><b>Equilateral triangle:</b> AB = BC = CA.</li><li><b>Isosceles triangle:</b> two sides equal.</li><li><b>Right-angled triangle:</b> the square of the longest side equals the sum of the squares of the other two.</li><li><b>Parallelogram ABCD:</b> the diagonals AC and BD have the <b>same midpoint</b>.</li><li><b>Plane dividing a segment:</b> the YZ-plane has x = 0, so put the x-coordinate of the dividing point equal to zero and solve for the ratio. The same idea works for z = 0 (XY-plane) and y = 0 (ZX-plane).</li></ul><p><b>Tip:</b> to compare triangles it is easier to compare the <b>squares</b> of the sides. This avoids messy square roots.</p><p>Example: A(0, 7, 10), B(−1, 6, 6), C(−4, 9, 6). AB² = 1 + 1 + 16 = 18, BC² = 9 + 9 + 0 = 18, CA² = 16 + 4 + 16 = 36. Since AB² + BC² = CA² and AB = BC, the triangle is right-angled and isosceles, with the right angle at B.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> दूरी और विभाजन सूत्रों से तुम बिना चित्र बनाए चीज़ें <b>सिद्ध</b> कर सकते हो: तीन बिंदु एक रेखा पर हैं या नहीं, त्रिभुज समकोण है या नहीं, और चार बिंदु कौन-सी आकृति बनाते हैं।</p><ul><li><b>संरेख बिंदु</b> A, B, C: AB, BC, CA में सबसे बड़ी भुजा बाकी दो के योग के बराबर होती है। उदाहरण: AB + BC = AC का अर्थ है B, A और C के बीच है।</li><li><b>समबाहु त्रिभुज:</b> AB = BC = CA।</li><li><b>समद्विबाहु त्रिभुज:</b> दो भुजाएँ बराबर।</li><li><b>समकोण त्रिभुज:</b> सबसे बड़ी भुजा का वर्ग बाकी दो भुजाओं के वर्गों के योग के बराबर।</li><li><b>समांतर चतुर्भुज ABCD:</b> विकर्ण AC और BD का <b>मध्य बिंदु एक ही</b> होता है।</li><li><b>तल द्वारा रेखाखंड का विभाजन:</b> YZ-तल में x = 0 होता है, इसलिए विभाजन बिंदु के x-निर्देशांक को शून्य रखकर अनुपात निकालो। यही विधि z = 0 (XY-तल) और y = 0 (ZX-तल) के लिए भी चलती है।</li></ul><p><b>सुझाव:</b> त्रिभुजों की तुलना के लिए भुजाओं के <b>वर्ग</b> की तुलना आसान है। इससे वर्गमूल की झंझट बचती है।</p><p>उदाहरण: A(0, 7, 10), B(−1, 6, 6), C(−4, 9, 6)। AB² = 1 + 1 + 16 = 18, BC² = 9 + 9 + 0 = 18, CA² = 16 + 4 + 16 = 36। चूँकि AB² + BC² = CA² और AB = BC, त्रिभुज समकोण और समद्विबाहु है, समकोण B पर।</p>')}
],

 {lv:'medium',

  a:B('<p>AB² = 1 + 1 + 16 = 18. BC² = 9 + 9 + 0 = 18. CA² = 16 + 4 + 16 = 36.</p><p>AB² = BC², so AB = BC (isosceles). Also AB² + BC² = 36 = CA², so the angle at B is a right angle.</p><p>Hence the triangle is <b>right-angled and isosceles</b>.</p>','<p>AB² = 1 + 1 + 16 = 18। BC² = 9 + 9 + 0 = 18। CA² = 16 + 4 + 16 = 36।</p><p>AB² = BC², अतः AB = BC (समद्विबाहु)। साथ ही AB² + BC² = 36 = CA², इसलिए B पर कोण समकोण है।</p><p>अतः त्रिभुज <b>समकोण और समद्विबाहु</b> है।</p>')},

blurb:B('Radian measure, the unit circle, identities, compound and multiple angles, and trigonometric equations.','रेडियन माप, इकाई वृत्त, सर्वसमिकाएँ, संयुक्त और बहु कोण तथा त्रिकोणमितीय समीकरण।'),
sections:[
 {h:B('Angles and radian measure','कोण और रेडियन माप'),
  body:B(
   '<p>An angle is positive when measured anticlockwise and negative when measured clockwise. Two common units are:</p><ul><li><b>Degree:</b> one full turn = 360°.</li><li><b>Radian:</b> the angle subtended at the centre by an arc equal in length to the radius. One full turn = 2π radians.</li></ul><p class="eq">π radian = 180°, so 1 radian ≈ 57.3°</p><p>To convert: degrees × π/180 = radians, and radians × 180/π = degrees. For instance 75° = 5π/12 rad.</p><p>In a circle of radius r, an arc of length l subtends an angle θ (in <b>radians</b>) given by</p><p class="eq">l = rθ</p><p>The area of a sector is A = ½r²θ. These formulas hold only when θ is in radians.</p>',
   '<p>घड़ी की उलटी दिशा में मापा कोण धनात्मक और घड़ी की दिशा में मापा कोण ऋणात्मक होता है। दो प्रचलित मात्रक हैं:</p><ul><li><b>अंश (degree):</b> एक पूरा चक्कर = 360°।</li><li><b>रेडियन:</b> वह कोण जो त्रिज्या के बराबर लंबाई के चाप द्वारा केंद्र पर बनता है। एक पूरा चक्कर = 2π रेडियन।</li></ul><p class="eq">π रेडियन = 180°, अतः 1 रेडियन ≈ 57.3°</p><p>परिवर्तन: अंश × π/180 = रेडियन और रेडियन × 180/π = अंश। उदाहरण: 75° = 5π/12 रेडियन।</p><p>त्रिज्या r के वृत्त में l लंबाई का चाप केंद्र पर θ कोण (<b>रेडियन</b> में) बनाए तो</p><p class="eq">l = rθ</p><p>त्रिज्यखंड का क्षेत्रफल A = ½r²θ। ये सूत्र केवल तब सही हैं जब θ रेडियन में हो।</p>')},
 {h:B('Ratios, signs and the unit circle','अनुपात, चिह्न और इकाई वृत्त'),
  body:B(
   '<p>On the <b>unit circle</b> (radius 1, centre at the origin), a point P at angle θ has coordinates (cos θ, sin θ). So</p><p class="eq">sin θ = y, cos θ = x, tan θ = y/x</p><p>and cosec θ, sec θ, cot θ are the reciprocals of sin, cos, tan.</p><ul><li>sin²θ + cos²θ = 1</li><li>1 + tan²θ = sec²θ and 1 + cot²θ = cosec²θ</li><li>−1 ≤ sin θ ≤ 1 and −1 ≤ cos θ ≤ 1</li></ul><p><b>Signs</b> follow the quadrant: quadrant I all positive, II only sin, III only tan, IV only cos. Remember <b>A-S-T-C</b>.</p><p><b>Standard values:</b></p><ul><li>sin 0°, 30°, 45°, 60°, 90° = 0, ½, 1/√2, √3/2, 1</li><li>cos at the same angles = 1, √3/2, 1/√2, ½, 0</li><li>tan 30° = 1/√3, tan 45° = 1, tan 60° = √3</li></ul>',
   '<p><b>इकाई वृत्त</b> (त्रिज्या 1, केंद्र मूलबिंदु) पर कोण θ वाले बिंदु P के निर्देशांक (cos θ, sin θ) होते हैं। अतः</p><p class="eq">sin θ = y, cos θ = x, tan θ = y/x</p><p>और cosec θ, sec θ, cot θ क्रमशः sin, cos, tan के व्युत्क्रम हैं।</p><ul><li>sin²θ + cos²θ = 1</li><li>1 + tan²θ = sec²θ और 1 + cot²θ = cosec²θ</li><li>−1 ≤ sin θ ≤ 1 और −1 ≤ cos θ ≤ 1</li></ul><p><b>चिह्न</b> चतुर्थांश पर निर्भर करते हैं: प्रथम में सभी धनात्मक, द्वितीय में केवल sin, तृतीय में केवल tan, चतुर्थ में केवल cos। याद रखो <b>A-S-T-C</b>।</p><p><b>मानक मान:</b></p><ul><li>sin 0°, 30°, 45°, 60°, 90° = 0, ½, 1/√2, √3/2, 1</li><li>इन्हीं कोणों पर cos = 1, √3/2, 1/√2, ½, 0</li><li>tan 30° = 1/√3, tan 45° = 1, tan 60° = √3</li></ul>'),
  dg:'trig_1',
  cap:B('P(cos θ, sin θ) on the unit circle. The quadrant decides the signs (A-S-T-C).','इकाई वृत्त पर P(cos θ, sin θ)। चतुर्थांश से चिह्न तय होते हैं (A-S-T-C)।')},
 {h:B('Graphs and periodicity','ग्राफ और आवर्तता'),
  body:B(
   '<p>sin x and cos x are <b>periodic</b> with period 2π; tan x has period π.</p><ul><li>sin x: odd function, range [−1, 1], zero at x = nπ.</li><li>cos x: even function, range [−1, 1], zero at x = (2n + 1)π/2.</li><li>tan x: odd, range ℝ, not defined at x = (2n + 1)π/2.</li></ul><p>The graph of cos x is the graph of sin x shifted left by π/2, because cos x = sin(x + π/2).</p><p><b>Reduction to the first quadrant:</b></p><ul><li>sin(−θ) = −sin θ, cos(−θ) = cos θ.</li><li>sin(π − θ) = sin θ, cos(π − θ) = −cos θ.</li><li>sin(π + θ) = −sin θ, tan(π + θ) = tan θ.</li><li>sin(π/2 − θ) = cos θ, cos(π/2 − θ) = sin θ.</li></ul><p>For a·sin x + b·cos x the maximum is √(a² + b²) and the minimum is −√(a² + b²).</p>',
   '<p>sin x और cos x <b>आवर्ती</b> हैं जिनका आवर्तकाल 2π है; tan x का आवर्तकाल π है।</p><ul><li>sin x: विषम फलन, परिसर [−1, 1], शून्य x = nπ पर।</li><li>cos x: सम फलन, परिसर [−1, 1], शून्य x = (2n + 1)π/2 पर।</li><li>tan x: विषम, परिसर ℝ, x = (2n + 1)π/2 पर अपरिभाषित।</li></ul><p>cos x का ग्राफ, sin x के ग्राफ को π/2 बाएँ खिसकाने पर मिलता है, क्योंकि cos x = sin(x + π/2)।</p><p><b>प्रथम चतुर्थांश में समानयन:</b></p><ul><li>sin(−θ) = −sin θ, cos(−θ) = cos θ।</li><li>sin(π − θ) = sin θ, cos(π − θ) = −cos θ।</li><li>sin(π + θ) = −sin θ, tan(π + θ) = tan θ।</li><li>sin(π/2 − θ) = cos θ, cos(π/2 − θ) = sin θ।</li></ul><p>a·sin x + b·cos x का अधिकतम मान √(a² + b²) और न्यूनतम −√(a² + b²) होता है।</p>'),
  dg:'trig_2',
  cap:B('One full period of sin x and cos x. They are the same wave, shifted by π/2.','sin x और cos x का एक पूरा आवर्त। दोनों एक ही तरंग हैं, π/2 के खिसकाव के साथ।')},
 {h:B('Compound and multiple angles','संयुक्त और बहु कोण'),
  body:B(
   '<p><b>Sum and difference:</b></p><ul><li>sin(A ± B) = sin A cos B ± cos A sin B</li><li>cos(A ± B) = cos A cos B ∓ sin A sin B</li><li>tan(A ± B) = (tan A ± tan B)/(1 ∓ tan A tan B)</li></ul><p><b>Double angle:</b></p><ul><li>sin 2A = 2 sin A cos A</li><li>cos 2A = cos²A − sin²A = 2cos²A − 1 = 1 − 2sin²A</li><li>tan 2A = 2 tan A/(1 − tan²A)</li></ul><p><b>Triple angle:</b> sin 3A = 3 sin A − 4 sin³A and cos 3A = 4 cos³A − 3 cos A.</p><p><b>Product to sum:</b> 2 sin A cos B = sin(A + B) + sin(A − B), and 2 cos A cos B = cos(A + B) + cos(A − B).</p><p>Useful values: sin 15° = (√6 − √2)/4, sin 75° = (√6 + √2)/4, tan 15° = 2 − √3.</p>',
   '<p><b>योग और अंतर:</b></p><ul><li>sin(A ± B) = sin A cos B ± cos A sin B</li><li>cos(A ± B) = cos A cos B ∓ sin A sin B</li><li>tan(A ± B) = (tan A ± tan B)/(1 ∓ tan A tan B)</li></ul><p><b>द्विकोण:</b></p><ul><li>sin 2A = 2 sin A cos A</li><li>cos 2A = cos²A − sin²A = 2cos²A − 1 = 1 − 2sin²A</li><li>tan 2A = 2 tan A/(1 − tan²A)</li></ul><p><b>त्रिकोण:</b> sin 3A = 3 sin A − 4 sin³A और cos 3A = 4 cos³A − 3 cos A।</p><p><b>गुणनफल से योग:</b> 2 sin A cos B = sin(A + B) + sin(A − B) और 2 cos A cos B = cos(A + B) + cos(A − B)।</p><p>उपयोगी मान: sin 15° = (√6 − √2)/4, sin 75° = (√6 + √2)/4, tan 15° = 2 − √3।</p>')},
 {h:B('Trigonometric equations','त्रिकोणमितीय समीकरण'),
  body:B(
   '<p>A trigonometric equation has infinitely many solutions because the functions repeat. The <b>general solutions</b> (n is any integer) are:</p><ul><li>sin x = sin α ⇒ x = nπ + (−1)ⁿα</li><li>cos x = cos α ⇒ x = 2nπ ± α</li><li>tan x = tan α ⇒ x = nπ + α</li></ul><p>Also sin²x = sin²α, cos²x = cos²α and tan²x = tan²α all give x = nπ ± α.</p><p><b>Method:</b></p><ol><li>Reduce the equation to one function of one angle, using identities.</li><li>Find the principal value α in the correct quadrants.</li><li>Write the general solution.</li><li>If an interval is given, put in integer values of n and keep the answers inside it.</li></ol><p>For a·sin x + b·cos x = c, divide by √(a² + b²). A solution exists only when |c| ≤ √(a² + b²).</p>',
   '<p>त्रिकोणमितीय फलन दोहराते हैं, इसलिए समीकरण के अनंत हल होते हैं। <b>व्यापक हल</b> (n कोई पूर्णांक) ये हैं:</p><ul><li>sin x = sin α ⇒ x = nπ + (−1)ⁿα</li><li>cos x = cos α ⇒ x = 2nπ ± α</li><li>tan x = tan α ⇒ x = nπ + α</li></ul><p>साथ ही sin²x = sin²α, cos²x = cos²α और tan²x = tan²α सभी का हल x = nπ ± α है।</p><p><b>विधि:</b></p><ol><li>सर्वसमिकाओं से समीकरण को एक कोण के एक फलन में लाओ।</li><li>सही चतुर्थांशों में मुख्य मान α ज्ञात करो।</li><li>व्यापक हल लिखो।</li><li>अंतराल दिया हो तो n के पूर्णांक मान रखो और अंतराल के भीतर के उत्तर ही लो।</li></ol><p>a·sin x + b·cos x = c के लिए √(a² + b²) से भाग दो। हल तभी है जब |c| ≤ √(a² + b²)।</p>')}
],

  q:B('Solve 2sin²x = 1 for x in [0, 2π].','[0, 2π] में 2sin²x = 1 हल करो।'),

 {lv:'hard',

CH = CH.concat([
{
id:'physics-units-measurements', subject:'physics', cls:11, ord:1,
title:B('Units and Measurements','मात्रक और मापन'),
blurb:B('SI units, dimensional analysis, significant figures, errors and the vernier calliper and screw gauge.','SI मात्रक, विमीय विश्लेषण, सार्थक अंक, त्रुटियाँ तथा वर्नियर कैलिपर और पेचमापी।'),
sections:[
 {h:B('Physical quantities and SI units','भौतिक राशियाँ और SI मात्रक'),
  body:B(
   '<p>Measuring a physical quantity means comparing it with a standard called a <b>unit</b>. The result is written as (number) × (unit). A change of unit changes the number but not the quantity.</p><p>The <b>SI system</b> has seven <b>base quantities</b>:</p><ul><li>Length: metre (m)</li><li>Mass: kilogram (kg)</li><li>Time: second (s)</li><li>Electric current: ampere (A)</li><li>Temperature: kelvin (K)</li><li>Amount of substance: mole (mol)</li><li>Luminous intensity: candela (cd)</li></ul><p>All other units are <b>derived units</b>, made from the base units. For example, the unit of force is the newton, 1 N = 1 kg m s⁻². Plane angle (radian) and solid angle (steradian) are supplementary units and are dimensionless.</p><p>Useful conversions: 1 light year = 9.46 × 10¹⁵ m, 1 Å = 10⁻¹⁰ m, 1 fermi = 10⁻¹⁵ m, 1 atomic mass unit = 1.66 × 10⁻²⁷ kg.</p>',
   '<p>किसी भौतिक राशि को मापने का अर्थ है उसकी तुलना एक मानक से करना, जिसे <b>मात्रक</b> (unit) कहते हैं। परिणाम (संख्या) × (मात्रक) के रूप में लिखा जाता है। मात्रक बदलने पर संख्या बदलती है, राशि नहीं।</p><p><b>SI पद्धति</b> में सात <b>मूल राशियाँ</b> (base quantities) हैं:</p><ul><li>लंबाई: मीटर (m)</li><li>द्रव्यमान: किलोग्राम (kg)</li><li>समय: सेकंड (s)</li><li>विद्युत धारा: ऐम्पियर (A)</li><li>ताप: केल्विन (K)</li><li>पदार्थ की मात्रा: मोल (mol)</li><li>ज्योति तीव्रता: कैंडेला (cd)</li></ul><p>बाकी सभी मात्रक मूल मात्रकों से बने <b>व्युत्पन्न मात्रक</b> हैं। जैसे बल का मात्रक न्यूटन है, 1 N = 1 kg m s⁻²। समतल कोण (रेडियन) और ठोस कोण (स्टेरेडियन) पूरक मात्रक हैं और विमाहीन हैं।</p><p>उपयोगी परिवर्तन: 1 प्रकाश वर्ष = 9.46 × 10¹⁵ m, 1 Å = 10⁻¹⁰ m, 1 फर्मी = 10⁻¹⁵ m, 1 परमाणु द्रव्यमान मात्रक = 1.66 × 10⁻²⁷ kg।</p>')},
 {h:B('Dimensions and dimensional analysis','विमाएँ और विमीय विश्लेषण'),
  body:B(
   '<p>The <b>dimensions</b> of a quantity are the powers to which the base quantities are raised to represent it. Mass, length and time are written as [M], [L], [T]. For example:</p><ul><li>Velocity: [L T⁻¹]; acceleration: [L T⁻²]</li><li>Force: [M L T⁻²]; work and energy: [M L² T⁻²]</li><li>Pressure: [M L⁻¹ T⁻²]; power: [M L² T⁻³]</li><li>Momentum: [M L T⁻¹]; impulse: [M L T⁻¹]</li><li>Planck’s constant h: [M L² T⁻¹]; gravitational constant G: [M⁻¹ L³ T⁻²]</li></ul><p><b>Principle of homogeneity:</b> every term in a correct physical equation has the same dimensions. Only quantities with the same dimensions can be added or subtracted.</p><p><b>Uses.</b> (1) Checking an equation. (2) Converting units from one system to another. (3) Deriving a relation between quantities, for example T = k √(l/g) for a simple pendulum.</p><p><b>Limits.</b> It cannot give the value of a dimensionless constant (like 2π or ½). It fails for relations with a sum or difference of terms such as v = u + at when deriving, and for functions like sin, log and exponential. It cannot tell whether a quantity is a scalar or a vector.</p>',
   '<p>किसी राशि की <b>विमाएँ</b> (dimensions) वे घात हैं जिन पर मूल राशियों को उठाने से वह राशि प्रदर्शित होती है। द्रव्यमान, लंबाई और समय को [M], [L], [T] लिखते हैं। उदाहरण:</p><ul><li>वेग: [L T⁻¹]; त्वरण: [L T⁻²]</li><li>बल: [M L T⁻²]; कार्य और ऊर्जा: [M L² T⁻²]</li><li>दाब: [M L⁻¹ T⁻²]; शक्ति: [M L² T⁻³]</li><li>संवेग: [M L T⁻¹]; आवेग: [M L T⁻¹]</li><li>प्लांक नियतांक h: [M L² T⁻¹]; गुरुत्वीय नियतांक G: [M⁻¹ L³ T⁻²]</li></ul><p><b>समांगता का सिद्धांत:</b> सही भौतिक समीकरण के प्रत्येक पद की विमाएँ समान होती हैं। केवल समान विमा वाली राशियों को ही जोड़ा या घटाया जा सकता है।</p><p><b>उपयोग।</b> (1) समीकरण की जाँच। (2) एक पद्धति के मात्रकों को दूसरी में बदलना। (3) राशियों के बीच संबंध निकालना, जैसे सरल लोलक के लिए T = k √(l/g)।</p><p><b>सीमाएँ।</b> यह विमाहीन नियतांक (जैसे 2π या ½) का मान नहीं दे सकता। जिन संबंधों में कई पदों का योग या अंतर हो, उन्हें निकालने में यह विफल रहता है, और sin, log तथा चरघातांकी फलनों के लिए भी। यह नहीं बता सकता कि राशि अदिश है या सदिश।</p>')},
 {h:B('Significant figures','सार्थक अंक'),
  body:B(
   '<p><b>Significant figures</b> are the digits in a measured value that are known reliably, plus the first uncertain digit. They show the precision of a measurement.</p><p>Rules for counting:</p><ul><li>All non-zero digits are significant: 2.43 has 3.</li><li>Zeros between non-zero digits are significant: 1007 has 4.</li><li>Leading zeros are not significant: 0.00230 has 3.</li><li>Trailing zeros after a decimal point are significant: 4.50 has 3, 2.0 has 2.</li><li>Trailing zeros in a whole number without a decimal point are ambiguous. Write 4.50 × 10³ to show 3 significant figures.</li><li>Changing units does not change the count: 2.50 cm = 0.0250 m, both have 3.</li></ul><p><b>Arithmetic.</b> In multiplication and division, the answer has as many significant figures as the factor with the fewest. In addition and subtraction, the answer keeps as many <i>decimal places</i> as the number with the fewest decimal places.</p><p><b>Rounding.</b> If the digit to be dropped is more than 5, increase the previous digit by 1. If it is less than 5, leave it. Exact numbers and counted numbers (like 2 in 2πr) have unlimited significant figures.</p>',
   '<p><b>सार्थक अंक</b> (significant figures) किसी मापे गए मान के वे अंक हैं जो विश्वसनीय रूप से ज्ञात हैं, साथ में पहला संदिग्ध अंक। ये माप की परिशुद्धता दर्शाते हैं।</p><p>गिनने के नियम:</p><ul><li>सभी शून्येतर अंक सार्थक होते हैं: 2.43 में 3 हैं।</li><li>शून्येतर अंकों के बीच के शून्य सार्थक हैं: 1007 में 4 हैं।</li><li>शुरू के शून्य सार्थक नहीं होते: 0.00230 में 3 हैं।</li><li>दशमलव के बाद अंत के शून्य सार्थक होते हैं: 4.50 में 3, 2.0 में 2।</li><li>दशमलव रहित पूर्ण संख्या के अंत के शून्य अस्पष्ट होते हैं। 3 सार्थक अंक दिखाने के लिए 4.50 × 10³ लिखो।</li><li>मात्रक बदलने से गिनती नहीं बदलती: 2.50 cm = 0.0250 m, दोनों में 3 अंक।</li></ul><p><b>अंकगणित।</b> गुणा और भाग में उत्तर में उतने सार्थक अंक रखते हैं जितने सबसे कम अंकों वाले गुणनखंड में हों। जोड़ और घटाव में उत्तर में उतने <i>दशमलव स्थान</i> रखते हैं जितने सबसे कम दशमलव स्थानों वाली संख्या में हों।</p><p><b>पूर्णांकन।</b> जो अंक हटाना है वह 5 से बड़ा हो तो पिछले अंक में 1 जोड़ दो, 5 से छोटा हो तो छोड़ दो। यथार्थ संख्याओं और गिनती की संख्याओं (जैसे 2πr में 2) के सार्थक अंक अनंत माने जाते हैं।</p>')},
 {h:B('Errors in measurement','मापन में त्रुटियाँ'),
  body:B(
   '<p>No measurement is perfect. The difference between the measured and the true value is the <b>error</b>.</p><ul><li><b>Systematic errors</b> push every reading the same way: zero error, faulty instrument, personal bias. They can be reduced by calibration.</li><li><b>Random errors</b> vary unpredictably from reading to reading. They are reduced by taking many readings.</li><li><b>Least count error</b> is the smallest value an instrument can read.</li></ul><p>Take n readings a₁, a₂, ..., aₙ.</p><p class="eq">a<sub>mean</sub> = '+F('a₁ + a₂ + ... + aₙ','n')+'</p><p><b>Absolute error</b> of each reading: Δaᵢ = |a<sub>mean</sub> − aᵢ|. The <b>mean absolute error</b> is</p><p class="eq">Δa<sub>mean</sub> = '+F('Σ |Δaᵢ|','n')+'</p><p><b>Relative error</b> = Δa<sub>mean</sub> / a<sub>mean</sub>. It has no unit.</p><p><b>Percentage error</b> = (Δa<sub>mean</sub> / a<sub>mean</sub>) × 100 %.</p><p>The result is quoted as a = a<sub>mean</sub> ± Δa<sub>mean</sub>. A smaller relative error means a more precise result.</p>',
   '<p>कोई भी माप पूर्ण नहीं होता। मापे गए और वास्तविक मान के अंतर को <b>त्रुटि</b> (error) कहते हैं।</p><ul><li><b>क्रमबद्ध त्रुटियाँ</b> हर पाठ्यांक को एक ही दिशा में खिसकाती हैं: शून्यांक त्रुटि, दोषपूर्ण यंत्र, व्यक्तिगत पूर्वाग्रह। अंशांकन से इन्हें घटाया जा सकता है।</li><li><b>यादृच्छिक त्रुटियाँ</b> हर पाठ्यांक में अनिश्चित रूप से बदलती हैं। बहुत से पाठ्यांक लेकर इन्हें घटाते हैं।</li><li><b>अल्पतमांक त्रुटि</b> यंत्र द्वारा पढ़ा जा सकने वाला सबसे छोटा मान है।</li></ul><p>मान लो n पाठ्यांक a₁, a₂, ..., aₙ हैं।</p><p class="eq">a<sub>माध्य</sub> = '+F('a₁ + a₂ + ... + aₙ','n')+'</p><p>प्रत्येक पाठ्यांक की <b>निरपेक्ष त्रुटि</b>: Δaᵢ = |a<sub>माध्य</sub> − aᵢ|। <b>माध्य निरपेक्ष त्रुटि</b></p><p class="eq">Δa<sub>माध्य</sub> = '+F('Σ |Δaᵢ|','n')+'</p><p><b>सापेक्ष त्रुटि</b> = Δa<sub>माध्य</sub> / a<sub>माध्य</sub>। इसका कोई मात्रक नहीं होता।</p><p><b>प्रतिशत त्रुटि</b> = (Δa<sub>माध्य</sub> / a<sub>माध्य</sub>) × 100 %।</p><p>परिणाम a = a<sub>माध्य</sub> ± Δa<sub>माध्य</sub> के रूप में लिखा जाता है। सापेक्ष त्रुटि जितनी कम, परिणाम उतना परिशुद्ध।</p>')},
 {h:B('Combination of errors','त्रुटियों का संयोजन'),
  body:B(
   '<p>Let A and B be measured with absolute errors ΔA and ΔB. The maximum possible error in a result Z is found as follows.</p><ul><li><b>Sum, Z = A + B:</b> ΔZ = ΔA + ΔB.</li><li><b>Difference, Z = A − B:</b> ΔZ = ΔA + ΔB. Errors add even in a difference, because in the worst case each error pushes the result the same way.</li><li><b>Product or quotient, Z = A × B or A / B:</b></li></ul><p class="eq">'+F('ΔZ','Z')+' = '+F('ΔA','A')+' + '+F('ΔB','B')+'</p><ul><li><b>Power, Z = Aⁿ:</b></li></ul><p class="eq">'+F('ΔZ','Z')+' = |n| '+F('ΔA','A')+'</p><p>For a general expression Z = Aᵖ Bᵠ / Cʳ,</p><p class="eq">'+F('ΔZ','Z')+' = p '+F('ΔA','A')+' + q '+F('ΔB','B')+' + r '+F('ΔC','C')+'</p><p>Every term is added, whether the quantity is in the numerator or the denominator, and the power multiplies its relative error. Note that the sum and difference rule uses <i>absolute</i> errors, while the product and power rule uses <i>relative</i> errors.</p>',
   '<p>मान लो A और B को निरपेक्ष त्रुटियों ΔA और ΔB के साथ मापा गया। परिणाम Z में अधिकतम संभावित त्रुटि इस प्रकार निकालते हैं।</p><ul><li><b>योग, Z = A + B:</b> ΔZ = ΔA + ΔB।</li><li><b>अंतर, Z = A − B:</b> ΔZ = ΔA + ΔB। अंतर में भी त्रुटियाँ जुड़ती हैं, क्योंकि सबसे बुरी स्थिति में हर त्रुटि परिणाम को एक ही दिशा में धकेलती है।</li><li><b>गुणनफल या भागफल, Z = A × B या A / B:</b></li></ul><p class="eq">'+F('ΔZ','Z')+' = '+F('ΔA','A')+' + '+F('ΔB','B')+'</p><ul><li><b>घात, Z = Aⁿ:</b></li></ul><p class="eq">'+F('ΔZ','Z')+' = |n| '+F('ΔA','A')+'</p><p>व्यापक व्यंजक Z = Aᵖ Bᵠ / Cʳ के लिए</p><p class="eq">'+F('ΔZ','Z')+' = p '+F('ΔA','A')+' + q '+F('ΔB','B')+' + r '+F('ΔC','C')+'</p><p>हर पद जुड़ता है, चाहे राशि अंश में हो या हर में, और घात सापेक्ष त्रुटि को गुणा करती है। ध्यान दो कि योग और अंतर के नियम में <i>निरपेक्ष</i> त्रुटियाँ और गुणा तथा घात के नियम में <i>सापेक्ष</i> त्रुटियाँ ली जाती हैं।</p>')},
 {h:B('Vernier calliper','वर्नियर कैलिपर'),
  body:B(
   '<p>A vernier calliper measures lengths more finely than a plain scale. It has a main scale and a sliding vernier scale. If N vernier divisions (VSD) equal N − 1 main scale divisions (MSD), then</p><p class="eq">1 VSD = '+F('N − 1','N')+' MSD</p><p>The <b>least count</b> is the difference between one MSD and one VSD:</p><p class="eq">LC = 1 MSD − 1 VSD = '+F('1 MSD','N')+'</p><p>For a standard calliper, 1 MSD = 1 mm and N = 10, so LC = 0.1 mm = 0.01 cm.</p><p><b>Reading</b> = MSR + n × LC, where MSR is the main scale reading just before the vernier zero and n is the vernier division that coincides with a main scale division.</p><p><b>Zero error.</b> If the jaws are closed and the zeros do not coincide, note the error. For a positive zero error e (vernier zero is to the right of the main zero, coinciding division n gives e = n × LC), the corrected reading is observed − e. For a negative zero error the correction is added.</p>',
   '<p>वर्नियर कैलिपर सादे पैमाने से अधिक सूक्ष्मता से लंबाई मापता है। इसमें एक मुख्य पैमाना और एक सरकने वाला वर्नियर पैमाना होता है। यदि N वर्नियर भाग (VSD) मुख्य पैमाने के N − 1 भागों (MSD) के बराबर हों, तो</p><p class="eq">1 VSD = '+F('N − 1','N')+' MSD</p><p><b>अल्पतमांक</b> (least count) एक MSD और एक VSD का अंतर है:</p><p class="eq">LC = 1 MSD − 1 VSD = '+F('1 MSD','N')+'</p><p>सामान्य कैलिपर में 1 MSD = 1 mm और N = 10, इसलिए LC = 0.1 mm = 0.01 cm।</p><p><b>पाठ्यांक</b> = MSR + n × LC, जहाँ MSR वर्नियर शून्य के ठीक पहले का मुख्य पैमाने का पाठ्यांक है और n वह वर्नियर भाग है जो मुख्य पैमाने के किसी भाग से मिलता है।</p><p><b>शून्यांक त्रुटि।</b> जबड़े बंद करने पर यदि दोनों शून्य न मिलें तो त्रुटि नोट करो। धनात्मक शून्यांक त्रुटि e (वर्नियर शून्य मुख्य शून्य के दाईं ओर, मिलने वाले भाग n से e = n × LC) हो तो संशोधित पाठ्यांक = प्रेक्षित − e। ऋणात्मक त्रुटि में संशोधन जोड़ा जाता है।</p>'),
  dg:'units_1',
  cap:B('Vernier scale reading 3.4 mm. The 4th vernier division coincides with a main scale division.','वर्नियर पैमाने का पाठ्यांक 3.4 mm। वर्नियर का चौथा भाग मुख्य पैमाने के एक भाग से मिलता है।')},
 {h:B('Screw gauge','पेचमापी'),
  body:B(
   '<p>A <b>screw gauge</b> (micrometer) measures small thicknesses such as the diameter of a wire. When the circular scale makes one full turn, the screw advances by one <b>pitch</b> along the linear (pitch) scale.</p><p class="eq">LC = '+F('pitch','number of circular divisions')+'</p><p>For pitch 1 mm and 100 divisions, LC = 0.01 mm. For pitch 0.5 mm and 50 divisions, LC is also 0.01 mm.</p><p><b>Reading</b> = PSR + CSR × LC, where PSR is the pitch scale reading and CSR is the circular scale division level with the reference line.</p><p><b>Zero error.</b> With the studs touching, if the circular zero lies below the reference line by k divisions, the zero error is +k × LC (positive) and it is subtracted. If it lies above by k divisions, the error is −k × LC and it is added. So</p><p class="eq">true reading = observed reading − zero error</p><p>Always use the ratchet to avoid over-tightening. Take several readings at different places and in perpendicular directions, then find the mean.</p>',
   '<p><b>पेचमापी</b> (screw gauge) तार के व्यास जैसी छोटी मोटाइयाँ मापता है। वृत्तीय पैमाने का एक पूरा चक्कर लगने पर पेच रैखिक (चूड़ी) पैमाने पर एक <b>चूड़ी अंतराल</b> (pitch) आगे बढ़ता है।</p><p class="eq">LC = '+F('चूड़ी अंतराल','वृत्तीय पैमाने के भागों की संख्या')+'</p><p>चूड़ी अंतराल 1 mm और 100 भाग हों तो LC = 0.01 mm। चूड़ी अंतराल 0.5 mm और 50 भाग होने पर भी LC = 0.01 mm।</p><p><b>पाठ्यांक</b> = PSR + CSR × LC, जहाँ PSR चूड़ी पैमाने का पाठ्यांक है और CSR वृत्तीय पैमाने का वह भाग है जो संदर्भ रेखा के सामने है।</p><p><b>शून्यांक त्रुटि।</b> स्टड छूने पर यदि वृत्तीय शून्य संदर्भ रेखा से k भाग नीचे हो तो शून्यांक त्रुटि +k × LC (धनात्मक) है और इसे घटाते हैं। यदि वह k भाग ऊपर हो तो त्रुटि −k × LC है और इसे जोड़ते हैं। अतः</p><p class="eq">सही पाठ्यांक = प्रेक्षित पाठ्यांक − शून्यांक त्रुटि</p><p>अधिक कसने से बचने के लिए हमेशा रैचेट का उपयोग करो। अलग-अलग स्थानों पर और परस्पर लंबवत दिशाओं में कई पाठ्यांक लो और माध्य निकालो।</p>'),
  dg:'units_2',
  cap:B('Screw gauge reading 2.36 mm: PSR = 2 mm and CSR = 36 divisions.','पेचमापी का पाठ्यांक 2.36 mm: PSR = 2 mm और CSR = 36 भाग।')}
],

examples:[

 {lv:'easy',
  q:B('Write the number of significant figures in (a) 0.00230, (b) 4.50 × 10³, (c) 1007. Then give 12.5 + 3.27 and 2.6 × 3.42 with the correct significant figures.','(a) 0.00230, (b) 4.50 × 10³, (c) 1007 में सार्थक अंकों की संख्या लिखो। फिर 12.5 + 3.27 और 2.6 × 3.42 को सही सार्थक अंकों में दो।'),
  a:B('<p>(a) <b>3</b>, (b) <b>3</b>, (c) <b>4</b>.</p><p>12.5 + 3.27 = 15.77. The least precise number (12.5) has 1 decimal place, so the answer is <b>15.8</b>.</p><p>2.6 × 3.42 = 8.892. The fewest significant figures is 2 (from 2.6), so the answer is <b>8.9</b>.</p>','<p>(a) <b>3</b>, (b) <b>3</b>, (c) <b>4</b>।</p><p>12.5 + 3.27 = 15.77। सबसे कम परिशुद्ध संख्या (12.5) में 1 दशमलव स्थान है, इसलिए उत्तर <b>15.8</b>।</p><p>2.6 × 3.42 = 8.892। सबसे कम सार्थक अंक 2 हैं (2.6 से), इसलिए उत्तर <b>8.9</b>।</p>')},
 {lv:'medium',
  q:B('The time period T of a simple pendulum may depend on its length l, mass m and the acceleration due to gravity g. Use dimensions to find the form of T.','सरल लोलक का आवर्तकाल T उसकी लंबाई l, द्रव्यमान m और गुरुत्वीय त्वरण g पर निर्भर हो सकता है। विमाओं से T का रूप ज्ञात करो।'),
  a:B('<p>Let T = k lᵃ mᵇ gᶜ. Dimensions: [T] = [L]ᵃ [M]ᵇ [L T⁻²]ᶜ = Lᵃ⁺ᶜ Mᵇ T⁻²ᶜ.</p><p>Compare powers: M: b = 0. T: −2c = 1, so c = −½. L: a + c = 0, so a = ½.</p><p>Hence <b>T = k √(l/g)</b>. The mass does not appear. (Dimensional analysis cannot give k; experiment gives k = 2π.)</p>','<p>मान लो T = k lᵃ mᵇ gᶜ। विमाएँ: [T] = [L]ᵃ [M]ᵇ [L T⁻²]ᶜ = Lᵃ⁺ᶜ Mᵇ T⁻²ᶜ।</p><p>घातों की तुलना: M: b = 0। T: −2c = 1, इसलिए c = −½। L: a + c = 0, इसलिए a = ½।</p><p>अतः <b>T = k √(l/g)</b>। द्रव्यमान नहीं आता। (विमाओं से k नहीं मिलता; प्रयोग से k = 2π मिलता है।)</p>')},
 {lv:'medium',
  q:B('The mass of a solid is 20.0 ± 0.1 g and its volume is 5.0 ± 0.1 cm³. Find the density with the maximum percentage error.','एक ठोस का द्रव्यमान 20.0 ± 0.1 g और आयतन 5.0 ± 0.1 cm³ है। घनत्व और उसमें अधिकतम प्रतिशत त्रुटि ज्ञात करो।'),
  a:B('<p>ρ = m / V = 20.0 / 5.0 = 4.0 g/cm³</p><p>Δρ/ρ = Δm/m + ΔV/V = 0.1/20.0 + 0.1/5.0 = 0.005 + 0.020 = 0.025</p><p>Percentage error = <b>2.5 %</b>. Δρ = 0.025 × 4.0 = 0.1, so <b>ρ = 4.0 ± 0.1 g/cm³</b></p>','<p>ρ = m / V = 20.0 / 5.0 = 4.0 g/cm³</p><p>Δρ/ρ = Δm/m + ΔV/V = 0.1/20.0 + 0.1/5.0 = 0.005 + 0.020 = 0.025</p><p>प्रतिशत त्रुटि = <b>2.5 %</b>। Δρ = 0.025 × 4.0 = 0.1, इसलिए <b>ρ = 4.0 ± 0.1 g/cm³</b></p>')},
 {lv:'hard',
  q:B('To find g, a pendulum of length l = 1.00 m (measured to 1 mm) is timed for 50 oscillations. The total time is 100.0 s with a stopwatch of least count 0.1 s. Find g = 4π²l/T² and its percentage error.','g ज्ञात करने के लिए l = 1.00 m लंबाई (1 mm तक मापी) के लोलक के 50 दोलनों का समय लिया गया। स्टॉपवॉच का अल्पतमांक 0.1 s है और कुल समय 100.0 s है। g = 4π²l/T² और उसमें प्रतिशत त्रुटि ज्ञात करो।'),
  a:B('<p>T = 100.0 / 50 = 2.00 s. g = 4π² × 1.00 / (2.00)² = <b>9.87 m/s²</b>.</p><p>Δl/l = 0.001/1.00 = 0.1 %. The time error is 0.1 s on 100.0 s, so ΔT/T = 0.1 %. (Timing 50 oscillations makes the relative error the same.)</p><p>Δg/g = Δl/l + 2 ΔT/T = 0.1 + 2(0.1) = <b>0.3 %</b>, so Δg ≈ 0.03 m/s² and g = 9.87 ± 0.03 m/s².</p>','<p>T = 100.0 / 50 = 2.00 s। g = 4π² × 1.00 / (2.00)² = <b>9.87 m/s²</b>।</p><p>Δl/l = 0.001/1.00 = 0.1 %। समय में त्रुटि 100.0 s पर 0.1 s है, इसलिए ΔT/T = 0.1 %। (50 दोलनों का समय लेने से सापेक्ष त्रुटि यही रहती है।)</p><p>Δg/g = Δl/l + 2 ΔT/T = 0.1 + 2(0.1) = <b>0.3 %</b>, इसलिए Δg ≈ 0.03 m/s² और g = 9.87 ± 0.03 m/s²।</p>')},
 {lv:'medium',
  q:B('A screw gauge has pitch 1 mm and 100 circular divisions. With the studs touching, the circular zero is 4 divisions below the reference line. For a wire, PSR = 3 mm and CSR = 25. Find the true diameter.','एक पेचमापी का चूड़ी अंतराल 1 mm और वृत्तीय भाग 100 हैं। स्टड छूने पर वृत्तीय शून्य संदर्भ रेखा से 4 भाग नीचे है। एक तार के लिए PSR = 3 mm और CSR = 25 है। तार का सही व्यास ज्ञात करो।'),
  a:B('<p>LC = 1/100 = 0.01 mm. Zero error = +4 × 0.01 = +0.04 mm.</p><p>Observed = 3 + 25 × 0.01 = 3.25 mm</p><p>True diameter = 3.25 − 0.04 = <b>3.21 mm</b></p>','<p>LC = 1/100 = 0.01 mm। शून्यांक त्रुटि = +4 × 0.01 = +0.04 mm।</p><p>प्रेक्षित = 3 + 25 × 0.01 = 3.25 mm</p><p>सही व्यास = 3.25 − 0.04 = <b>3.21 mm</b></p>')}
],
rev:{

mis:{
