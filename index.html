 {h:B('Oxidation number rules','ऑक्सीकरण संख्या के नियम'),
  body:B(
   '<p class="def"><b>In simple words:</b> the <b>oxidation number (O.N.)</b> is a bookkeeping charge — what charge an atom would have if every bond were fully ionic. It lets us track electron loss/gain even in covalent molecules.</p><ul><li>O.N. of a free element = 0 (Na, O₂, P₄).</li><li>O.N. of a simple ion = its charge (Na⁺ = +1, Cl⁻ = −1).</li><li>O.N. of H = +1 (except in metal hydrides like NaH, where it is −1).</li><li>O.N. of O = −2 (except in peroxides like H₂O₂, where it is −1, and in OF₂, where it is +2).</li><li>Sum of O.N. in a neutral compound = 0; in a polyion = the ion’s charge.</li><li>Fluorine is always −1 in its compounds (most electronegative element).</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>ऑक्सीकरण संख्या (O.N.)</b> एक हिसाब-किताब वाला आवेश है — अगर हर बंध पूरी तरह आयनिक होता तो परमाणु पर कौन-सा आवेश होता। यह सहसंयोजक अणुओं में भी इलेक्ट्रॉन की हानि/प्राप्ति का हिसाब रखने देता है।</p><ul><li>मुक्त तत्व का O.N. = 0 (Na, O₂, P₄)।</li><li>सरल आयन का O.N. = उसका आवेश (Na⁺ = +1, Cl⁻ = −1)।</li><li>H का O.N. = +1 (धातु हाइड्राइडों जैसे NaH को छोड़कर, जहाँ यह −1 है)।</li><li>O का O.N. = −2 (परऑक्साइडों जैसे H₂O₂ को छोड़कर, जहाँ यह −1 है, और OF₂ में +2)।</li><li>उदासीन यौगिक में O.N. का योग = 0; बहुपरमाणुक आयन में = उस आयन का आवेश।</li><li>यौगिकों में फ्लोरीन हमेशा −1 होता है (सबसे विद्युतऋणात्मक तत्व)।</li></ul>')},
 {h:B('Types of redox reactions','अपचयोपचय अभिक्रियाओं के प्रकार'),
  body:B(
   '<p class="def"><b>In simple words:</b> redox reactions come in a few common shapes, and recognising the shape helps you spot O.N. changes faster.</p><ul><li><b>Combination:</b> e.g. C + O₂ → CO₂ (C goes from 0 to +4).</li><li><b>Decomposition:</b> e.g. 2H₂O → 2H₂ + O₂.</li><li><b>Displacement:</b> a more reactive element displaces a less reactive one, e.g. Zn + CuSO₄ → ZnSO₄ + Cu.</li><li><b>Disproportionation:</b> the <b>same</b> element is simultaneously oxidised and reduced, e.g. Cl₂ + 2NaOH → NaCl + NaOCl + H₂O (Cl goes from 0 to both −1 and +1).</li><li>Combustion and most metal-extraction reactions are also redox.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> अपचयोपचय अभिक्रियाएँ कुछ सामान्य रूपों में आती हैं, और रूप पहचानने से O.N. में बदलाव जल्दी दिखता है।</p><ul><li><b>संयोजन:</b> जैसे C + O₂ → CO₂ (C, 0 से +4 तक जाता है)।</li><li><b>वियोजन:</b> जैसे 2H₂O → 2H₂ + O₂।</li><li><b>विस्थापन:</b> अधिक क्रियाशील तत्व कम क्रियाशील को विस्थापित करता है, जैसे Zn + CuSO₄ → ZnSO₄ + Cu।</li><li><b>विषमानुपातन:</b> <b>एक ही</b> तत्व एक साथ ऑक्सीकृत और अपचयित होता है, जैसे Cl₂ + 2NaOH → NaCl + NaOCl + H₂O (Cl, 0 से −1 और +1 दोनों में जाता है)।</li><li>दहन और अधिकांश धातु-निष्कर्षण अभिक्रियाएँ भी अपचयोपचय हैं।</li></ul>')},

   '<p class="def"><b>सरल शब्दों में:</b> <b>आयन-इलेक्ट्रॉन (अर्ध-अभिक्रिया) विधि</b> में समीकरण को ऑक्सीकरण अर्ध और अपचयन अर्ध में बाँटो, हर एक को संतुलित करो (पहले परमाणु, फिर O को H₂O से, फिर H को H⁺ से, फिर आवेश को इलेक्ट्रॉनों से), और दोनों को जोड़ो ताकि इलेक्ट्रॉन कट जाएँ।</p><p class="eq">E°<sub>cell</sub> = E°<sub>कैथोड</sub> − E°<sub>एनोड</sub></p><ul><li>अपचयन <b>कैथोड</b> पर होता है, ऑक्सीकरण <b>एनोड</b> पर।</li><li>यदि E°<sub>cell</sub> धनात्मक है, तो अभिक्रिया जैसी लिखी है वैसी ही स्वतःप्रवर्तित है।</li><li>जिसका मानक अपचयन विभव अधिक धनात्मक (ऊँचा) हो, वह <b>अधिक प्रबल ऑक्सीकारक</b> है।</li><li>क्षारीय माध्यम में, H⁺ से संतुलित करने के बाद दोनों ओर बराबर OH⁻ जोड़कर H⁺ को H₂O में बदल दो।</li></ul>')

 {lv:'hard',
  q:B('Balance by the ion-electron method in acidic medium: MnO₄⁻ + C₂O₄²⁻ → Mn²⁺ + CO₂.','आयन-इलेक्ट्रॉन विधि से अम्लीय माध्यम में संतुलित करो: MnO₄⁻ + C₂O₄²⁻ → Mn²⁺ + CO₂।'),
  a:B('<p>Reduction: MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O.</p><p>Oxidation: C₂O₄²⁻ → 2CO₂ + 2e⁻.</p><p>Equalise electrons (×2 reduction, ×5 oxidation) and add:</p><p class="eq">2MnO₄⁻ + 5C₂O₄²⁻ + 16H⁺ → 2Mn²⁺ + 10CO₂ + 8H₂O</p>','<p>अपचयन: MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O।</p><p>ऑक्सीकरण: C₂O₄²⁻ → 2CO₂ + 2e⁻।</p><p>इलेक्ट्रॉन बराबर करो (अपचयन ×2, ऑक्सीकरण ×5) और जोड़ो:</p><p class="eq">2MnO₄⁻ + 5C₂O₄²⁻ + 16H⁺ → 2Mn²⁺ + 10CO₂ + 8H₂O</p>')}
],
rev:{
 en:['Oxidation = loss of electrons (O.N. up); reduction = gain of electrons (O.N. down).','Oxidation and reduction always occur together.','The reducing agent is itself oxidised; the oxidising agent is itself reduced.','Sum of O.N. = 0 for a neutral compound, = charge for an ion.','Disproportionation: the same element is both oxidised and reduced.','E°cell = E°cathode − E°anode; positive means spontaneous.'],
 hi:['ऑक्सीकरण = इलेक्ट्रॉन की हानि (O.N. बढ़ता है); अपचयन = इलेक्ट्रॉन की प्राप्ति (O.N. घटता है)।','ऑक्सीकरण और अपचयन हमेशा साथ होते हैं।','अपचायक स्वयं ऑक्सीकृत होता है; ऑक्सीकारक स्वयं अपचयित होता है।','उदासीन यौगिक में O.N. का योग = 0, आयन में = आवेश।','विषमानुपातन: एक ही तत्व ऑक्सीकृत और अपचयित दोनों होता है।','E°cell = E°कैथोड − E°एनोड; धनात्मक यानी स्वतःप्रवर्तित।']},
mis:{
 en:['Mixing up which species is oxidised and which is the oxidising agent.','Forgetting the exceptions for O.N. of H and O (hydrides, peroxides).','Balancing atoms but forgetting to balance charge with electrons.','Thinking the species with lower reduction potential is the stronger oxidising agent (it’s the opposite).'],

D3.torque3d={
  en:'Torque of a spanner: τ = r × F points along the axis',hi:'पाने का बल-आघूर्ण: τ = r × F अक्ष के अनुदिश',h:0.9,scale:0.9,center:[0,0.1,0],spin:true,view:{yaw:-0.6,pitch:0.45,zoom:1},
  params:[
    {k:'r',en:'Arm length r (×10 cm)',hi:'भुजा की लंबाई r (×10 cm)',min:1,max:5,val:3,step:1,unit:''},
    {k:'F',en:'Force F (N)',hi:'बल F (N)',min:10,max:50,val:30,step:10,unit:''},
    {k:'an',en:'Angle between r and F (°)',hi:'r और F के बीच कोण (°)',min:30,max:90,val:90,step:15,unit:''}
  ],
  frame:function(S,t,P,l){
    var r=P.r*0.1,F=P.F,an=P.an*Math.PI/180,tau=r*F*Math.sin(an),ph=0.5*(t*tau*0.12),i;
    var cp=Math.cos(ph),sp=Math.sin(ph),sc=0.3/1.0;
    function R(x,z){return [x*cp+z*sp,-x*sp+z*cp]}
    function P3(x,y,z){var q=R(x,z);return [q[0],y,q[1]]}
    var L=r*3.2;
    S.floor([[-1.3,0,-1.0],[1.3,0,-1.0],[1.3,0,1.0],[-1.3,0,1.0]],'soft',0.6,'line');
    var tip=[L,0,0];
    S.ring([0,0.02,0],0.09,'xz','ink',3);
    S.box(P3(L/2,0.04,0),[L,0.04,0.07],'muted');
    var a=P3(0,0.04,0);S.sphere(a,0.07,'ink',true);
    var fx=Math.cos(an),fz=-Math.sin(an),fl=0.012*F+0.1;
    var tp=P3(L,0.05,0),fe=P3(L+fx*fl,0.05,fz*fl);
    S.arrow(tp,fe,'hi',3.2);
    S.text([fe[0]+0.05,0.1,fe[2]],'F','hi',12,'left',true);
    S.line(a,tp,'accent',1.2);S.text([P3(L/2,0.12,0.12)[0],0.13,P3(L/2,0.12,0.12)[2]],'r','accent',12,'center',true);
    var ta=0.012*tau*3+0.1;
    S.arrow([0,0.05,0],[0,0.05+ta,0],'bad',3.4);S.text([0.07,0.05+ta+0.05,0],'τ','bad',13,'left',true);
    S.hud(0.04,0.07,'r = '+Math.round(r*100)+' cm   F = '+F+' N   θ = '+P.an+'°','ink',12,'left',true);
    S.hud(0.04,0.16,'τ = rF sin θ = '+(Math.round(tau*100)/100)+' N·m','bad',13,'left',true);
    S.hud(0.04,0.25,sx(l,'τ points up (right-hand rule); longer arm = more turning','τ ऊपर की ओर (दायाँ हाथ नियम); लंबी भुजा = अधिक घुमाव'),'muted',10,'left');
  }
};
D3.roll3d={
  en:'Rolling race down an incline: ring, disc, solid sphere, hollow sphere',hi:'ढलान पर लोटने की दौड़: छल्ला, डिस्क, ठोस गोला, खोखला गोला',h:0.95,scale:0.55,center:[0,0,0],spin:true,view:{yaw:-0.45,pitch:0.5,zoom:1},
  params:[{k:'th',en:'Incline angle θ (°)',hi:'आनत कोण θ (°)',min:10,max:40,val:25,step:5,unit:''}],
  frame:function(S,t,P,l){
    var th=P.th*Math.PI/180,c=Math.cos(th),s=Math.sin(th),Lw=2.0,Ax=-1.0,Ay=-0.5,Rr=0.13,g=10,i;
    function pt(u,v,z){return [Ax+u*c-v*s,Ay+u*s+v*c,z||0]}
    var bodies=[['ring',1,'accent'],['disc',0.5,'good'],['solid sphere',0.4,'hi'],['hollow sphere',2/3,'bad']];
    var zs=[-0.75,-0.25,0.25,0.75];
    S.floor([[-1.5,Ay,-1.1],[1.5,Ay,-1.1],[1.5,Ay,1.1],[-1.5,Ay,1.1]],'soft',0.5,'line');
    S.poly([pt(0,0,-1.05),pt(Lw,0,-1.05),pt(Lw,0,1.05),pt(0,0,1.05)],'muted',0.4,'ink');
    var tt=t%4.5,fin=false;
    bodies.forEach(function(b,k){
      var a=g*s/(1+b[1]),dist=0.5*a*0.09*tt*tt,sp=Math.max(0.15,Lw-0.15-dist);
      if(sp<=0.16)fin=true;
      var ph=(Lw-sp)/Rr,z=zs[k],C=pt(sp,Rr,z);
      var cyl=(k<2);
      if(k===2){S.sphere(C,Rr,b[2]);}
      else if(k===3){S.sphere(C,Rr,b[2]);S.ring(C,Rr*1.001,'xy','ink',1.4)}
      else{
        S.ring([C[0],C[1],z-0.09],Rr,'xy',b[2],2.4);S.ring([C[0],C[1],z+0.09],Rr,'xy',b[2],2.4);
        if(k===1)S.poly((function(){var q=[];for(var j=0;j<24;j++){var an=j/24*6.2832;q.push([C[0]+Rr*Math.cos(an),C[1]+Rr*Math.sin(an),z+0.09])}return q})(),b[2],0.45,b[2]);
      }
      var mk=[C[0]+Rr*Math.cos(-ph),C[1]+Rr*Math.sin(-ph),z+(cyl?0.095:0.0)];
      S.line([C[0],C[1],z+(cyl?0.095:0.0)],mk,'ink',2);S.sphere(mk,0.02,'ink');
      S.text(pt(Lw+0.05,0.0,z),b[0],b[2],10,'left',true);
    });
    S.hud(0.04,0.07,'a = g sin θ / (1 + I/mR²),  θ = '+P.th+'°','ink',11.5,'left',true);
    S.hud(0.04,0.16,sx(l,'Winner: solid sphere, then disc, hollow sphere, ring','विजेता: ठोस गोला, फिर डिस्क, खोखला गोला, छल्ला'),'accent',11,'left',true);
    S.hud(0.04,0.25,sx(l,'Less I/mR² means more speed (same mass and radius)','कम I/mR² का अर्थ अधिक चाल (द्रव्यमान और त्रिज्या समान)'),'muted',10,'left');
  }
};

CH=CH.concat([{
id:'physics-rotational-motion', subject:'physics', cls:11, ord:7,
title:B('System of Particles and Rotational Motion','कणों के निकाय और घूर्णी गति'),
blurb:B('Centre of mass, torque, angular momentum, moment of inertia, rotational equations and rolling motion.','द्रव्यमान केंद्र, बल-आघूर्ण, कोणीय संवेग, जड़त्व आघूर्ण, घूर्णन के समीकरण और लोटनिक गति।'),
sections:[
 {h:B('Centre of mass','द्रव्यमान केंद्र'),
  body:B(
   '<p class="def"><b>In simple words:</b> the <b>centre of mass</b> (COM) is the one point where the whole mass of a body or system behaves as if it were concentrated. If you throw a spinning stick, its COM moves in a smooth parabola, no matter how the stick tumbles.</p><p class="eq">x<sub>cm</sub> = (m₁x₁ + m₂x₂ + …) / (m₁ + m₂ + …)</p><ul><li>It is a weighted average of positions. It lies closer to the heavier mass.</li><li>Same for y and z. For continuous bodies, use symmetry: COM of a uniform rod is at its middle; of a ring, disc, sphere at the centre.</li><li>Velocity of COM: v<sub>cm</sub> = Σmv/Σm. If no external force acts, v<sub>cm</sub> stays constant.</li><li>Internal forces (like an explosion) cannot move the COM.</li></ul><p>Example: 2 kg at x = 0 and 3 kg at x = 5 m. x<sub>cm</sub> = (2 × 0 + 3 × 5)/5 = 3 m, nearer the 3 kg mass.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>द्रव्यमान केंद्र</b> (COM) वह एक बिंदु है जहाँ पूरे पिंड या निकाय का द्रव्यमान केंद्रित मानकर चल सकते हैं। घूमती छड़ी फेंको तो उसका COM चिकने परवलय में चलता है, चाहे छड़ी कैसे भी लुढ़के।</p><p class="eq">x<sub>cm</sub> = (m₁x₁ + m₂x₂ + …) / (m₁ + m₂ + …)</p><ul><li>यह स्थितियों का भारित औसत है। यह भारी द्रव्यमान के पास होता है।</li><li>y और z के लिए भी यही। सतत पिंडों में सममिति का प्रयोग करो: एकसमान छड़ का COM मध्य में; छल्ले, डिस्क, गोले का केंद्र पर।</li><li>COM का वेग: v<sub>cm</sub> = Σmv/Σm। कोई बाहरी बल न हो तो v<sub>cm</sub> अचर रहता है।</li><li>आंतरिक बल (जैसे विस्फोट) COM को नहीं हिला सकते।</li></ul><p>उदाहरण: x = 0 पर 2 kg और x = 5 m पर 3 kg। x<sub>cm</sub> = (2 × 0 + 3 × 5)/5 = 3 m, 3 kg द्रव्यमान के पास।</p>')},
 {h:B('Torque and angular momentum','बल-आघूर्ण और कोणीय संवेग'),
  body:B(
   '<p class="def"><b>In simple words:</b> <b>torque</b> is the turning effect of a force. Pushing a door near the hinge is hard, near the handle is easy: the same force but a longer arm gives more torque.</p><p class="eq">τ = r × F        |τ| = r F sin θ = F × (perpendicular distance)</p><ul><li>Unit: N·m. Direction by the right-hand rule: curl fingers from r to F, the thumb gives τ, along the axis.</li><li>A force through the axis (r = 0) or along r (θ = 0°) gives no torque.</li><li><b>Equilibrium</b> needs net force = 0 <b>and</b> net torque = 0.</li></ul><p><b>Angular momentum</b> is the rotational version of momentum.</p><p class="eq">L = r × p = I ω        τ = dL/dt = I α</p><p><b>Conservation:</b> if net external torque is zero, L stays constant. A skater pulling her arms in reduces I, so ω must increase: I₁ω₁ = I₂ω₂.</p><p>In the figure, a longer spanner or a force at 90° gives the largest torque. The red arrow τ shows its direction along the axis.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>बल-आघूर्ण</b> किसी बल का घुमाने वाला प्रभाव है। कब्ज़े के पास दरवाज़ा धकेलना कठिन है और हैंडल के पास आसान: बल वही, पर लंबी भुजा से बल-आघूर्ण अधिक।</p><p class="eq">τ = r × F        |τ| = r F sin θ = F × (लंबवत दूरी)</p><ul><li>मात्रक: N·m। दिशा दायाँ हाथ नियम से: उँगलियाँ r से F की ओर मोड़ो, अंगूठा τ देता है, अक्ष के अनुदिश।</li><li>अक्ष से गुज़रता बल (r = 0) या r के अनुदिश बल (θ = 0°) कोई बल-आघूर्ण नहीं देता।</li><li><b>संतुलन</b> के लिए परिणामी बल = 0 <b>और</b> परिणामी बल-आघूर्ण = 0 चाहिए।</li></ul><p><b>कोणीय संवेग</b> संवेग का घूर्णी रूप है।</p><p class="eq">L = r × p = I ω        τ = dL/dt = I α</p><p><b>संरक्षण:</b> यदि परिणामी बाह्य बल-आघूर्ण शून्य हो तो L अचर रहता है। स्केटर बाँहें समेटे तो I घटता है, इसलिए ω बढ़ना ही है: I₁ω₁ = I₂ω₂।</p><p>चित्र में लंबा पाना या 90° पर बल सबसे अधिक बल-आघूर्ण देता है। लाल तीर τ उसकी अक्ष के अनुदिश दिशा दिखाता है।</p>'),
  d3:'torque3d',
  cap:B('The spanner turns the bolt. Change the arm, the force and the angle: the red torque arrow grows with r F sin θ.','पाना बोल्ट को घुमाता है। भुजा, बल और कोण बदलो: लाल बल-आघूर्ण तीर r F sin θ के साथ बढ़ता है।')},
 {h:B('Moment of inertia','जड़त्व आघूर्ण'),
  body:B(
   '<p class="def"><b>In simple words:</b> <b>moment of inertia</b> I is the “rotational mass”. It tells how hard it is to start or stop a body spinning. Mass far from the axis counts much more, because of the r².</p><p class="eq">I = Σ m r²        KE<sub>rot</sub> = ½ I ω²</p><p><b>Rotation matches straight-line motion:</b></p><table><tr><th>Linear</th><th>x</th><th>v</th><th>a</th><th>m</th><th>F</th><th>p</th></tr><tr><td>Rotational</td><td>θ</td><td>ω</td><td>α</td><td>I</td><td>τ</td><td>L</td></tr></table><p>So F = ma becomes τ = Iα and KE = ½mv² becomes ½Iω². The equations of motion are the same with these swaps: ω = ω₀ + αt, θ = ω₀t + ½αt².</p><table><tr><th>Body (axis)</th><th>I</th></tr><tr><td>Ring, about its centre axis</td><td>MR²</td></tr><tr><td>Disc / solid cylinder</td><td>½MR²</td></tr><tr><td>Solid sphere (diameter)</td><td>⅖MR²</td></tr><tr><td>Hollow sphere (diameter)</td><td>⅔MR²</td></tr><tr><td>Rod, about its centre</td><td>ML²/12</td></tr><tr><td>Rod, about one end</td><td>ML²/3</td></tr></table><p><b>Parallel axis theorem:</b> I = I<sub>cm</sub> + Md² (axis parallel to one through the COM, distance d apart).</p><p><b>Perpendicular axis theorem</b> (flat plates): I<sub>z</sub> = I<sub>x</sub> + I<sub>y</sub>.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>जड़त्व आघूर्ण</b> I “घूर्णी द्रव्यमान” है। यह बताता है कि किसी पिंड को घुमाना शुरू करना या रोकना कितना कठिन है। अक्ष से दूर का द्रव्यमान r² के कारण कहीं अधिक मायने रखता है।</p><p class="eq">I = Σ m r²        KE<sub>rot</sub> = ½ I ω²</p><p><b>घूर्णन सीधी रेखा की गति से मेल खाता है:</b></p><table><tr><th>रैखिक</th><th>x</th><th>v</th><th>a</th><th>m</th><th>F</th><th>p</th></tr><tr><td>घूर्णी</td><td>θ</td><td>ω</td><td>α</td><td>I</td><td>τ</td><td>L</td></tr></table><p>अतः F = ma बन जाता है τ = Iα और KE = ½mv² बन जाती है ½Iω²। गति के समीकरण इन्हीं अदला-बदली के साथ वही हैं: ω = ω₀ + αt, θ = ω₀t + ½αt²।</p><table><tr><th>पिंड (अक्ष)</th><th>I</th></tr><tr><td>छल्ला, केंद्र अक्ष के परितः</td><td>MR²</td></tr><tr><td>डिस्क / ठोस बेलन</td><td>½MR²</td></tr><tr><td>ठोस गोला (व्यास)</td><td>⅖MR²</td></tr><tr><td>खोखला गोला (व्यास)</td><td>⅔MR²</td></tr><tr><td>छड़, केंद्र के परितः</td><td>ML²/12</td></tr><tr><td>छड़, एक सिरे के परितः</td><td>ML²/3</td></tr></table><p><b>समांतर अक्ष प्रमेय:</b> I = I<sub>cm</sub> + Md² (अक्ष, COM वाले अक्ष के समांतर और d दूरी पर)।</p><p><b>लंबवत अक्ष प्रमेय</b> (समतल पट्टिकाएँ): I<sub>z</sub> = I<sub>x</sub> + I<sub>y</sub>।</p>')},
 {h:B('Rolling motion','लोटनिक गति'),
  body:B(
   '<p class="def"><b>In simple words:</b> rolling is spinning and moving forward at the same time, without slipping. The bottom point touching the ground is momentarily at rest.</p><p class="eq">v = ω R        KE = ½ m v² + ½ I ω² = ½ m v² (1 + I/(mR²))</p><ul><li>Part of the energy goes into spinning, so a rolling body has more total KE than a sliding one at the same v.</li><li>On an incline of angle θ (rolling without slipping), with I = k m R²:</li></ul><p class="eq">a = g sin θ / (1 + k)        v = √[2 g h / (1 + k)]</p><ul><li>k = 1 (ring), ½ (disc), ⅖ (solid sphere), ⅔ (hollow sphere).</li><li>The smaller the k, the larger the acceleration. So the <b>solid sphere wins</b>, then the disc, then the hollow sphere, and the ring comes last. The result does not depend on mass or radius.</li></ul><p>The figure runs the race for you. Change the angle: every body speeds up, but the order stays the same.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> लोटनिक गति में पिंड एक साथ घूमता भी है और आगे भी बढ़ता है, बिना फिसले। ज़मीन को छूता नीचे का बिंदु क्षणभर के लिए विराम में होता है।</p><p class="eq">v = ω R        KE = ½ m v² + ½ I ω² = ½ m v² (1 + I/(mR²))</p><ul><li>ऊर्जा का कुछ भाग घूमने में लगता है, इसलिए समान v पर लोटते पिंड की कुल KE फिसलते पिंड से अधिक होती है।</li><li>θ कोण के आनत तल पर (बिना फिसले लोटना), I = k m R² के साथ:</li></ul><p class="eq">a = g sin θ / (1 + k)        v = √[2 g h / (1 + k)]</p><ul><li>k = 1 (छल्ला), ½ (डिस्क), ⅖ (ठोस गोला), ⅔ (खोखला गोला)।</li><li>k जितना छोटा, त्वरण उतना अधिक। इसलिए <b>ठोस गोला जीतता है</b>, फिर डिस्क, फिर खोखला गोला, और छल्ला सबसे अंत में। परिणाम द्रव्यमान या त्रिज्या पर निर्भर नहीं करता।</li></ul><p>चित्र तुम्हारे लिए दौड़ चलाता है। कोण बदलो: हर पिंड तेज़ होता है, पर क्रम वही रहता है।</p>'),
  d3:'roll3d',
  cap:B('Four bodies of the same mass and radius race down the slope. The one with the smallest I/mR² wins.','समान द्रव्यमान और त्रिज्या के चार पिंड ढलान पर दौड़ते हैं। जिसका I/mR² सबसे छोटा है वह जीतता है।')}
],

  a:B('<p>x<sub>cm</sub> = (2 × 0 + 3 × 5)/(2 + 3) = 15/5 = <b>3 m</b>.</p>','<p>x<sub>cm</sub> = (2 × 0 + 3 × 5)/(2 + 3) = 15/5 = <b>3 m</b>।</p>')},
 {lv:'easy',

  a:B('<p>Perpendicular: τ = rF = 0.3 × 20 = <b>6 N·m</b>.</p><p>At 30°: τ = rF sin 30° = 6 × 0.5 = <b>3 N·m</b>.</p>','<p>लंबवत: τ = rF = 0.3 × 20 = <b>6 N·m</b>।</p><p>30° पर: τ = rF sin 30° = 6 × 0.5 = <b>3 N·m</b>।</p>')},
 {lv:'medium',
  q:B('Find the moment of inertia of a disc of mass 2 kg and radius 0.5 m about its central axis. If a torque of 1 N·m acts, find the angular acceleration.','2 kg द्रव्यमान और 0.5 m त्रिज्या की डिस्क का केंद्रीय अक्ष के परितः जड़त्व आघूर्ण ज्ञात करो। यदि 1 N·m का बल-आघूर्ण लगे तो कोणीय त्वरण ज्ञात करो।'),

 {lv:'medium',

  a:B('<p>I<sub>cm</sub> = ML²/12 = 3 × 4/12 = 1 kg·m². Distance to the end d = L/2 = 1 m.</p><p>I = I<sub>cm</sub> + Md² = 1 + 3 × 1 = <b>4 kg·m²</b>. This equals ML²/3 = 3 × 4/3 = 4 ✓.</p>','<p>I<sub>cm</sub> = ML²/12 = 3 × 4/12 = 1 kg·m²। सिरे तक दूरी d = L/2 = 1 m।</p><p>I = I<sub>cm</sub> + Md² = 1 + 3 × 1 = <b>4 kg·m²</b>। यह ML²/3 = 3 × 4/3 = 4 के बराबर है ✓।</p>')},
 {lv:'medium',

  a:B('<p>I₁ω₁ = I₂ω₂ gives ω₂ = 4 × 2/1 = <b>8 rad/s</b>.</p><p>KE before = ½ × 4 × 4 = 8 J. KE after = ½ × 1 × 64 = 32 J. The extra 24 J comes from the work she does pulling her arms in.</p>','<p>I₁ω₁ = I₂ω₂ से ω₂ = 4 × 2/1 = <b>8 rad/s</b>।</p><p>पहले KE = ½ × 4 × 4 = 8 J। बाद में KE = ½ × 1 × 64 = 32 J। अतिरिक्त 24 J बाँहें समेटने में उसके किए कार्य से आती है।</p>')},
 {lv:'hard',
  q:B('A solid sphere rolls without slipping down a 30° incline (g = 10 m/s²). Find (a) its acceleration, (b) the acceleration of a ring on the same incline, (c) the speed of the sphere after descending a height of 1.4 m.','एक ठोस गोला 30° के आनत तल पर बिना फिसले लोटता है (g = 10 m/s²)। (a) उसका त्वरण, (b) उसी तल पर छल्ले का त्वरण, (c) 1.4 m ऊँचाई उतरने के बाद गोले की चाल ज्ञात करो।'),
  a:B('<p>(a) k = ⅖: a = g sin θ/(1 + k) = 10 × 0.5/1.4 = <b>3.57 m/s²</b>.</p><p>(b) k = 1: a = 5/2 = <b>2.5 m/s²</b>. The sphere is faster.</p><p>(c) v = √[2gh/(1 + k)] = √(2 × 10 × 1.4/1.4) = √20 = <b>4.47 m/s</b>.</p>','<p>(a) k = ⅖: a = g sin θ/(1 + k) = 10 × 0.5/1.4 = <b>3.57 m/s²</b>।</p><p>(b) k = 1: a = 5/2 = <b>2.5 m/s²</b>। गोला तेज़ है।</p><p>(c) v = √[2gh/(1 + k)] = √(2 × 10 × 1.4/1.4) = √20 = <b>4.47 m/s</b>।</p>')}
],

D3.seq3d={
  en:'Arithmetic vs geometric growth',hi:'समांतर बनाम गुणोत्तर वृद्धि',h:0.82,scale:0.58,center:[0,0.5,0],spin:true,view:{yaw:-0.5,pitch:0.4,zoom:1},
  params:[{k:'d',en:'AP difference d',hi:'AP अंतर d',min:1,max:4,val:2,step:1,unit:''},{k:'r',en:'GP ratio r',hi:'GP अनुपात r',min:1.1,max:2,val:1.5,step:0.1,unit:''}],
  frame:function(S,t,P,l){
    var N=8,i,d=P.d,r=P.r,ap=[],gp=[],mx=0;
    for(i=0;i<N;i++){ap.push(1+i*d);gp.push(Math.pow(r,i));mx=Math.max(mx,ap[i],gp[i])}
    var sc=1.5/mx,w=0.16,grow=Math.min(N,(t*1.5)%(N+3));
    S.floor([[-1.5,0,-1.1],[1.5,0,-1.1],[1.5,0,1.1],[-1.5,0,1.1]],'soft',0.7,'line');
    for(i=0;i<N;i++){
      var f=Math.max(0,Math.min(1,grow-i)),x=(i-(N-1)/2)*0.34;
      if(f>0){
        var h1=ap[i]*sc*f,h2=gp[i]*sc*f;
        S.box([x,h1/2,0.4],[w,Math.max(0.01,h1),w],'hi');
        S.box([x,h2/2,-0.4],[w,Math.max(0.01,h2),w],'accent');
      }
      S.text([x,-0.12,0.65],String(i+1),'muted',10.5,'center');
    }
    var sa=N/2*(2+(N-1)*d),sg=(Math.pow(r,N)-1)/(r-1);
    S.text([-1.45,0.1,0.4],'AP','hi',12,'left',true);S.text([-1.45,0.1,-0.4],'GP','accent',12,'left',true);
    S.hud(0.04,0.07,sx(l,'AP (front): a = 1, d = ','AP (आगे): a = 1, d = ')+d,'hi',12,'left',true);
    S.hud(0.04,0.16,sx(l,'GP (back): a = 1, r = ','GP (पीछे): a = 1, r = ')+r.toFixed(1),'accent',12,'left',true);
    S.hud(0.04,0.25,'S₈ (AP) = '+sa+'   S₈ (GP) = '+sg.toFixed(1),'ink',12,'left',true);
  }
};
D3.bounce3d={
  en:'Bouncing ball and an infinite GP',hi:'उछलती गेंद और अनंत GP',h:0.84,scale:0.78,center:[1.1,0.5,0],view:{yaw:-0.35,pitch:0.28,zoom:1},
  params:[{k:'r',en:'Bounce ratio r',hi:'उछाल अनुपात r',min:0.3,max:0.8,val:0.6,step:0.1,unit:''}],
  frame:function(S,t,P,l){
    var r=P.r,H=1.4,i,seg=[],T=Math.sqrt(H),tot=T;
    seg.push({s:Math.sqrt(H),h:H,t0:0,first:true});
    var h=H*r,tt=T;
    for(i=0;i<16;i++){var s=Math.sqrt(h);seg.push({s:s,h:h,t0:tt,first:false});tt+=2*s;h*=r}
    var Tend=tt+0.8,tau=t%(Tend+1);
    function pos(tx){
      if(tx<=T)return H*(1-(tx/T)*(tx/T));
      for(var k=1;k<seg.length;k++){var g=seg[k];if(tx<g.t0+2*g.s){var u=(tx-g.t0-g.s)/g.s;return g.h*(1-u*u)}}
      return 0;
    }
    S.floor([[-0.4,0,-0.7],[3.2,0,-0.7],[3.2,0,0.7],[-0.4,0,0.7]],'soft',0.8,'line');
    S.rod([-0.1,0,0],[-0.1,H*1.05,0],0.02,'ink');
    var hh=H;for(i=0;i<7;i++){S.line([-0.18,hh,0],[0.0,hh,0],'muted',1.4);S.line([0,hh,0],[3.0,hh,0],'line',1,true);hh*=r}
    var x=0.0+Math.min(tau,Tend)*0.2,trail=[];
    for(i=0;i<=80;i++){var q=Math.min(tau,Tend)*i/80;trail.push([q*0.2,pos(q),0])}
    S.path(trail,'accent',2);
    var y=pos(Math.min(tau,Tend));
    S.shadow([x,0,0],0.1,0);
    S.sphere([x,y+0.09,0],0.09,'hi',true);
    var D=H*(1+r)/(1-r);
    S.hud(0.04,0.07,sx(l,'Heights: 1.4, 1.4r, 1.4r², …','ऊँचाइयाँ: 1.4, 1.4r, 1.4r², …'),'accent',12,'left',true);
    S.hud(0.04,0.16,sx(l,'Total path = H(1 + r)/(1 − r) = ','कुल पथ = H(1 + r)/(1 − r) = ')+D.toFixed(2),'hi',12,'left',true);
    S.hud(0.04,0.25,sx(l,'The sum of the infinite GP stops growing.','अनंत GP का योग बढ़ना बंद कर देता है।'),'muted',11,'left');
  }
};

CH=CH.concat([{
id:'maths-sequences-series', subject:'maths', cls:11, ord:9,
title:B('Sequences and Series','अनुक्रम तथा श्रेणी'),
blurb:B('Arithmetic and geometric progressions, infinite series, the AM–GM inequality and special sums.','समांतर और गुणोत्तर श्रेढ़ी, अनंत श्रेणी, AM–GM असमिका और विशेष योग।'),
sections:[
 {h:B('Sequences and arithmetic progression','अनुक्रम और समांतर श्रेढ़ी'),
  body:B(
   '<p class="def"><b>In simple words:</b> a <b>sequence</b> is a list of numbers in a definite order, such as 2, 5, 8, 11, … A <b>series</b> is the same numbers added up: 2 + 5 + 8 + 11 + …</p><p>An <b>arithmetic progression (AP)</b> is a sequence where each term is the previous term plus a fixed number d, the <b>common difference</b>.</p><p class="eq">aₙ = a + (n − 1)d</p><p class="eq">Sₙ = (n/2)[2a + (n − 1)d] = (n/2)(first + last)</p><ul><li>Three terms in AP: take them as a − d, a, a + d.</li><li>Four terms in AP: a − 3d, a − d, a + d, a + 3d.</li><li>If a, b, c are in AP, then 2b = a + c.</li><li><b>Arithmetic mean</b> of a and b is (a + b)/2. To insert k means between a and b, use d = (b − a)/(k + 1).</li></ul><p>Example: for 3, 7, 11, … the 10th term is 3 + 9 × 4 = 39 and the sum of 20 terms is 10 × (6 + 76) = 820.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>अनुक्रम</b> निश्चित क्रम में संख्याओं की सूची है, जैसे 2, 5, 8, 11, … <b>श्रेणी</b> उन्हीं संख्याओं का योग है: 2 + 5 + 8 + 11 + …</p><p><b>समांतर श्रेढ़ी (AP)</b> ऐसा अनुक्रम है जिसमें हर पद, पिछले पद में एक निश्चित संख्या d जोड़ने से बनता है। इस d को <b>सार्व अंतर</b> कहते हैं।</p><p class="eq">aₙ = a + (n − 1)d</p><p class="eq">Sₙ = (n/2)[2a + (n − 1)d] = (n/2)(प्रथम + अंतिम)</p><ul><li>AP के तीन पद लेने हों तो a − d, a, a + d लो।</li><li>AP के चार पद: a − 3d, a − d, a + d, a + 3d।</li><li>यदि a, b, c AP में हैं तो 2b = a + c।</li><li>a और b का <b>समांतर माध्य</b> (a + b)/2 है। a और b के बीच k माध्य डालने के लिए d = (b − a)/(k + 1) लो।</li></ul><p>उदाहरण: 3, 7, 11, … का 10 वाँ पद 3 + 9 × 4 = 39 है और 20 पदों का योग 10 × (6 + 76) = 820 है।</p>')},
 {h:B('Geometric progression','गुणोत्तर श्रेढ़ी'),
  body:B(
   '<p class="def"><b>In simple words:</b> in a <b>geometric progression (GP)</b> each term is the previous term <b>multiplied</b> by a fixed number r, the <b>common ratio</b>. An AP grows by equal steps; a GP grows by equal <i>factors</i>, so it soon outruns an AP.</p><p class="eq">aₙ = a rⁿ⁻¹</p><p class="eq">Sₙ = a(rⁿ − 1)/(r − 1)  (r ≠ 1)</p><ul><li>If a, b, c are in GP, then b² = ac.</li><li>Three terms in GP: a/r, a, ar.</li><li><b>Geometric mean</b> of a and b is √(ab).</li><li>Inserting k geometric means between a and b: ratio r = (b/a)^(1/(k+1)).</li></ul><p>Example: for 2, 6, 18, … the 6th term is 2 × 3⁵ = 486 and S₆ = 2(3⁶ − 1)/2 = 728.</p><p>In the figure, the front row of bars is an AP and the back row is a GP. Change d and r and watch how quickly the back row takes over.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> <b>गुणोत्तर श्रेढ़ी (GP)</b> में हर पद, पिछले पद को एक निश्चित संख्या r से <b>गुणा</b> करने पर बनता है। r को <b>सार्व अनुपात</b> कहते हैं। AP बराबर कदमों में बढ़ती है; GP बराबर <i>गुणकों</i> में बढ़ती है, इसलिए वह जल्दी AP से आगे निकल जाती है।</p><p class="eq">aₙ = a rⁿ⁻¹</p><p class="eq">Sₙ = a(rⁿ − 1)/(r − 1)  (r ≠ 1)</p><ul><li>यदि a, b, c GP में हैं तो b² = ac।</li><li>GP के तीन पद: a/r, a, ar।</li><li>a और b का <b>गुणोत्तर माध्य</b> √(ab) है।</li><li>a और b के बीच k गुणोत्तर माध्य डालने पर अनुपात r = (b/a)^(1/(k+1))।</li></ul><p>उदाहरण: 2, 6, 18, … का 6 वाँ पद 2 × 3⁵ = 486 है और S₆ = 2(3⁶ − 1)/2 = 728।</p><p>चित्र में आगे के स्तंभ AP हैं और पीछे के स्तंभ GP। d और r बदलकर देखो कि पीछे वाली पंक्ति कितनी जल्दी आगे निकल जाती है।</p>'),
  d3:'seq3d',
  cap:B('Front bars: an AP grows in equal steps. Back bars: a GP grows by equal factors and overtakes.','आगे के स्तंभ: AP बराबर कदमों में बढ़ती है। पीछे के स्तंभ: GP बराबर गुणकों में बढ़कर आगे निकल जाती है।')},
 {h:B('Infinite GP and the AM–GM inequality','अनंत GP और AM–GM असमिका'),
  body:B(
   '<p class="def"><b>In simple words:</b> if |r| &lt; 1 the terms of a GP get smaller and smaller, so even infinitely many of them add to a finite number.</p><p class="eq">S∞ = a/(1 − r),  |r| &lt; 1</p><p>Examples: 8 + 4 + 2 + … = 8/(1 − ½) = 16. A recurring decimal like 0.636363… = 0.63 + 0.0063 + … = 0.63/(1 − 0.01) = 7/11.</p><p>A ball dropped from H that rebounds to r times its previous height travels a total distance <b>H(1 + r)/(1 − r)</b>. With H = 10 m and r = 3/5 this is 10 × 1.6/0.4 = 40 m. The figure shows the bounces piling up near the floor.</p><p><b>AM ≥ GM ≥ HM</b> for positive numbers:</p><p class="eq">(a + b)/2 ≥ √(ab) ≥ 2ab/(a + b)</p><p>Equality holds only when a = b. Use it for extremes: for x &gt; 0, x + 4/x ≥ 2√4 = 4, so the minimum is 4 at x = 2.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> यदि |r| &lt; 1 हो तो GP के पद छोटे से और छोटे होते जाते हैं, इसलिए अनंत पदों का योग भी एक परिमित संख्या होता है।</p><p class="eq">S∞ = a/(1 − r),  |r| &lt; 1</p><p>उदाहरण: 8 + 4 + 2 + … = 8/(1 − ½) = 16। आवर्ती दशमलव 0.636363… = 0.63 + 0.0063 + … = 0.63/(1 − 0.01) = 7/11।</p><p>H ऊँचाई से गिराई गई गेंद, यदि हर बार पिछली ऊँचाई की r गुनी उछले, तो कुल दूरी <b>H(1 + r)/(1 − r)</b> तय करती है। H = 10 m और r = 3/5 के लिए यह 10 × 1.6/0.4 = 40 m है। चित्र में उछाल फर्श के पास सिमटते दिखते हैं।</p><p>धनात्मक संख्याओं के लिए <b>AM ≥ GM ≥ HM</b>:</p><p class="eq">(a + b)/2 ≥ √(ab) ≥ 2ab/(a + b)</p><p>समानता केवल तब है जब a = b। चरम मान के लिए प्रयोग करो: x &gt; 0 के लिए x + 4/x ≥ 2√4 = 4, अतः न्यूनतम मान x = 2 पर 4 है।</p>'),
  d3:'bounce3d',
  cap:B('A bouncing ball: the heights 1.4, 1.4r, 1.4r², … form a GP. With r &lt; 1 the total distance stays finite.','उछलती गेंद: ऊँचाइयाँ 1.4, 1.4r, 1.4r², … एक GP बनाती हैं। r &lt; 1 होने पर कुल दूरी परिमित रहती है।')},
 {h:B('Special series and sums','विशेष श्रेणियाँ और योग'),
  body:B(
   '<p>Three sums appear again and again. Remember them.</p><p class="eq">Σk = n(n + 1)/2</p><p class="eq">Σk² = n(n + 1)(2n + 1)/6</p><p class="eq">Σk³ = [n(n + 1)/2]²</p><ul><li>Σk³ is the square of Σk.</li><li>For n = 10: Σk = 55, Σk² = 385, Σk³ = 3025.</li><li>To sum a series like 1·2 + 2·3 + 3·4 + …, write the general term kth as k(k + 1) = k² + k, then use the three formulas: for n = 10 it is 385 + 55 = 440.</li></ul><p><b>Method of differences:</b> if the general term can be written as f(k) − f(k + 1), the sum telescopes. For example 1/(k(k + 1)) = 1/k − 1/(k + 1), so the sum of n terms is 1 − 1/(n + 1) = n/(n + 1).</p><p><b>Arithmetico-geometric series</b> a, (a + d)r, (a + 2d)r², … : multiply the sum by r and subtract.</p><p>Always check your formula with n = 1 and n = 2.</p>',
   '<p>तीन योग बार-बार आते हैं। इन्हें याद रखो।</p><p class="eq">Σk = n(n + 1)/2</p><p class="eq">Σk² = n(n + 1)(2n + 1)/6</p><p class="eq">Σk³ = [n(n + 1)/2]²</p><ul><li>Σk³, Σk का वर्ग है।</li><li>n = 10 के लिए: Σk = 55, Σk² = 385, Σk³ = 3025।</li><li>1·2 + 2·3 + 3·4 + … जैसी श्रेणी के लिए व्यापक पद k(k + 1) = k² + k लिखो और तीनों सूत्र लगाओ: n = 10 के लिए 385 + 55 = 440।</li></ul><p><b>अंतर विधि:</b> यदि व्यापक पद f(k) − f(k + 1) के रूप में लिखा जा सके तो योग कटकर सरल हो जाता है। जैसे 1/(k(k + 1)) = 1/k − 1/(k + 1), अतः n पदों का योग 1 − 1/(n + 1) = n/(n + 1)।</p><p><b>समांतर-गुणोत्तर श्रेणी</b> a, (a + d)r, (a + 2d)r², … : योग को r से गुणा करो और घटाओ।</p><p>अपना सूत्र हमेशा n = 1 और n = 2 पर जाँचो।</p>')}
],

 {lv:'medium',
  q:B('Insert 4 arithmetic means between 3 and 18.','3 और 18 के बीच 4 समांतर माध्य डालो।'),

 {lv:'medium',
  q:B('Find the sum to infinity of 8 + 4 + 2 + 1 + … Express 0.636363… as a fraction.','8 + 4 + 2 + 1 + … का अनंत योग ज्ञात करो। 0.636363… को भिन्न के रूप में व्यक्त करो।'),
  a:B('<p>a = 8, r = ½: S∞ = 8/(1 − ½) = <b>16</b>.</p><p>0.636363… = 0.63 + 0.0063 + …, a = 0.63, r = 0.01: S∞ = 0.63/0.99 = 63/99 = <b>7/11</b>.</p>','<p>a = 8, r = ½: S∞ = 8/(1 − ½) = <b>16</b>।</p><p>0.636363… = 0.63 + 0.0063 + …, a = 0.63, r = 0.01: S∞ = 0.63/0.99 = 63/99 = <b>7/11</b>।</p>')},
 {lv:'medium',
  q:B('A ball is dropped from 10 m and rebounds to 3/5 of its previous height each time. Find the total distance travelled before it stops.','एक गेंद 10 m से गिराई जाती है और हर बार अपनी पिछली ऊँचाई की 3/5 उछलती है। रुकने तक तय की गई कुल दूरी ज्ञात करो।'),
  a:B('<p>Downward distances: 10 + 6 + 3.6 + … (GP with r = 3/5) = 10/(1 − 0.6) = 25.</p><p>Upward distances: 6 + 3.6 + … = 6/(1 − 0.6) = 15.</p><p>Total = 25 + 15 = <b>40 m</b>.</p>','<p>नीचे की दूरियाँ: 10 + 6 + 3.6 + … (r = 3/5 वाली GP) = 10/(1 − 0.6) = 25।</p><p>ऊपर की दूरियाँ: 6 + 3.6 + … = 6/(1 − 0.6) = 15।</p><p>कुल = 25 + 15 = <b>40 m</b>।</p>')},
 {lv:'hard',
  q:B('Three numbers in AP have sum 21 and product 231. Find them. Also find the minimum value of x + 4/x for x &gt; 0.','AP में तीन संख्याओं का योग 21 और गुणनफल 231 है। उन्हें ज्ञात करो। साथ ही x &gt; 0 के लिए x + 4/x का न्यूनतम मान भी ज्ञात करो।'),

rev:{

 hi:['AP: हर बार d जोड़ो; aₙ = a + (n − 1)d और Sₙ = (n/2)(प्रथम + अंतिम)।','GP: हर बार r से गुणा करो; aₙ = a rⁿ⁻¹; S∞ = a/(1 − r) केवल तब जब |r| &lt; 1।','AP के तीन पद: a − d, a, a + d। GP के तीन पद: a/r, a, ar।','AM ≥ GM ≥ HM, समानता केवल बराबर संख्याओं के लिए; GM² = AM × HM।','Σk = n(n + 1)/2, Σk² = n(n + 1)(2n + 1)/6, Σk³ = (Σk)²।','1/(k(k + 1)) जैसे योग के लिए आंशिक भिन्न बनाओ ताकि पद कट जाएँ।']},

CH=CH.concat([{
id:'maths-sets-relations', subject:'maths', cls:11, ord:1,
title:B('Sets and Relations','समुच्चय और संबंध'),
blurb:B('Sets, Venn diagrams, counting with sets, Cartesian products and the types of relations.','समुच्चय, वेन आरेख, समुच्चयों से गिनती, कार्तीय गुणनफल और संबंधों के प्रकार।'),
sections:[
 {h:B('Sets and their types','समुच्चय और उनके प्रकार'),
  body:B(
   '<p>A <b>set</b> is a well-defined collection of objects, called its elements. We write x ∈ A if x belongs to A. A set can be written in <b>roster form</b>, A = {1, 2, 3}, or in <b>set-builder form</b>, A = {x : x is a natural number less than 4}.</p><ul><li><b>Empty set</b> ∅ has no element. A <b>singleton</b> has exactly one element.</li><li><b>Finite</b> sets can be counted, and n(A) is the number of elements. <b>Infinite</b> sets cannot.</li><li>A ⊆ B (<b>subset</b>) if every element of A is in B. If also A ≠ B, then A is a <b>proper subset</b>.</li><li>Two sets are <b>equal</b> if each is a subset of the other.</li><li>The <b>universal set</b> U contains all the elements under discussion.</li></ul><p>The <b>power set</b> P(A) is the set of all subsets of A. If n(A) = n, then n(P(A)) = 2ⁿ. Such a set has 2ⁿ − 1 proper subsets.</p>',
   '<p><b>समुच्चय</b> वस्तुओं का सुपरिभाषित संग्रह है, जिन वस्तुओं को उसके अवयव कहते हैं। यदि x, A का अवयव है तो x ∈ A लिखते हैं। समुच्चय को <b>रोस्टर रूप</b> A = {1, 2, 3} में या <b>समुच्चय-निर्माण रूप</b> A = {x : x, 4 से छोटी प्राकृत संख्या है} में लिखा जा सकता है।</p><ul><li><b>रिक्त समुच्चय</b> ∅ में कोई अवयव नहीं होता। <b>एकल समुच्चय</b> में ठीक एक अवयव होता है।</li><li><b>परिमित</b> समुच्चय के अवयव गिने जा सकते हैं और n(A) अवयवों की संख्या है। <b>अपरिमित</b> समुच्चय के अवयव गिने नहीं जा सकते।</li><li>यदि A का हर अवयव B में हो, तो A ⊆ B (<b>उपसमुच्चय</b>)। साथ ही A ≠ B हो तो A <b>उचित उपसमुच्चय</b> है।</li><li>दो समुच्चय <b>समान</b> हैं यदि हर एक दूसरे का उपसमुच्चय हो।</li><li><b>सार्वत्रिक समुच्चय</b> U में चर्चा के सभी अवयव होते हैं।</li></ul><p>A के सभी उपसमुच्चयों के समुच्चय को <b>घात समुच्चय</b> P(A) कहते हैं। यदि n(A) = n हो तो n(P(A)) = 2ⁿ। ऐसे समुच्चय के 2ⁿ − 1 उचित उपसमुच्चय होते हैं।</p>')},
 {h:B('Operations and Venn diagrams','संक्रियाएँ और वेन आरेख'),
  body:B(
   '<ul><li><b>Union</b> A ∪ B: elements in A or B or both.</li><li><b>Intersection</b> A ∩ B: elements in both. If A ∩ B = ∅ the sets are <b>disjoint</b>.</li><li><b>Difference</b> A − B: elements in A but not in B. So A − B = A ∩ B′.</li><li><b>Complement</b> A′: elements of U not in A.</li><li><b>Symmetric difference</b> A △ B = (A − B) ∪ (B − A).</li></ul><p>A <b>Venn diagram</b> draws each set as a circle inside a rectangle for U. The overlap of two circles is A ∩ B.</p><p><b>De Morgan’s laws:</b> (A ∪ B)′ = A′ ∩ B′ and (A ∩ B)′ = A′ ∪ B′.</p><p><b>Counting:</b> n(A ∪ B) = n(A) + n(B) − n(A ∩ B).</p>',
   '<ul><li><b>संघ</b> A ∪ B: वे अवयव जो A में या B में या दोनों में हों।</li><li><b>सर्वनिष्ठ (प्रतिच्छेदन)</b> A ∩ B: वे अवयव जो दोनों में हों। यदि A ∩ B = ∅ तो समुच्चय <b>असंयुक्त</b> कहलाते हैं।</li><li><b>अंतर</b> A − B: वे अवयव जो A में हों पर B में नहीं। अतः A − B = A ∩ B′।</li><li><b>पूरक</b> A′: U के वे अवयव जो A में नहीं हैं।</li><li><b>सममित अंतर</b> A △ B = (A − B) ∪ (B − A)।</li></ul><p><b>वेन आरेख</b> में हर समुच्चय को U के आयत के भीतर एक वृत्त से दिखाते हैं। दो वृत्तों का उभयनिष्ठ भाग A ∩ B होता है।</p><p><b>डी मॉर्गन के नियम:</b> (A ∪ B)′ = A′ ∩ B′ और (A ∩ B)′ = A′ ∪ B′।</p><p><b>गिनती:</b> n(A ∪ B) = n(A) + n(B) − n(A ∩ B)।</p>'),
  dg:'sets_1',
  cap:B('Two sets with 20 elements only in A, 10 in both, 15 only in B and 5 in neither. The shaded lens is A ∩ B.','दो समुच्चय: केवल A में 20, दोनों में 10, केवल B में 15 और किसी में नहीं 5 अवयव। छायांकित भाग A ∩ B है।')},
 {h:B('Counting with three sets and set laws','तीन समुच्चयों से गिनती और समुच्चय के नियम'),
  body:B(
   '<p>For three finite sets,</p><p class="eq">n(A ∪ B ∪ C) = n(A) + n(B) + n(C) − n(A ∩ B) − n(B ∩ C) − n(A ∩ C) + n(A ∩ B ∩ C)</p><p>Useful laws:</p><ul><li>Commutative: A ∪ B = B ∪ A, A ∩ B = B ∩ A.</li><li>Associative: (A ∪ B) ∪ C = A ∪ (B ∪ C).</li><li>Distributive: A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C), and A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C).</li><li>A ∪ A′ = U, A ∩ A′ = ∅, (A′)′ = A.</li><li>A ⊆ B ⇔ A ∩ B = A ⇔ A ∪ B = B.</li></ul><p><b>Word problems:</b> draw the Venn diagram and fill the innermost region first, which is the one belonging to all the sets. Then work outwards by subtraction.</p>',
   '<p>तीन परिमित समुच्चयों के लिए,</p><p class="eq">n(A ∪ B ∪ C) = n(A) + n(B) + n(C) − n(A ∩ B) − n(B ∩ C) − n(A ∩ C) + n(A ∩ B ∩ C)</p><p>उपयोगी नियम:</p><ul><li>क्रम-विनिमेय: A ∪ B = B ∪ A, A ∩ B = B ∩ A।</li><li>साहचर्य: (A ∪ B) ∪ C = A ∪ (B ∪ C)।</li><li>वितरण: A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C) और A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)।</li><li>A ∪ A′ = U, A ∩ A′ = ∅, (A′)′ = A।</li><li>A ⊆ B ⇔ A ∩ B = A ⇔ A ∪ B = B।</li></ul><p><b>शब्द-प्रश्न:</b> वेन आरेख बनाओ और सबसे भीतरी भाग भरो, यानी जो सभी समुच्चयों में है। फिर घटाते हुए बाहर की ओर बढ़ो।</p>')},
 {h:B('Cartesian product and relations','कार्तीय गुणनफल और संबंध'),
  body:B(
   '<p>The <b>Cartesian product</b> A × B is the set of all ordered pairs (a, b) with a ∈ A and b ∈ B. In general A × B ≠ B × A, and n(A × B) = n(A) · n(B).</p><p>A <b>relation</b> R from A to B is any subset of A × B. If (a, b) ∈ R we write a R b.</p><ul><li><b>Domain</b>: the set of first elements of the pairs.</li><li><b>Co-domain</b>: the set B.</li><li><b>Range</b>: the set of second elements that actually occur. Range ⊆ co-domain.</li></ul><p>If n(A) = m and n(B) = n, the number of relations from A to B is 2<sup>mn</sup>, because each of the mn pairs may be in or out.</p>',
   '<p><b>कार्तीय गुणनफल</b> A × B उन सभी क्रमित युग्मों (a, b) का समुच्चय है जिनमें a ∈ A और b ∈ B। सामान्यतः A × B ≠ B × A, और n(A × B) = n(A) · n(B)।</p><p>A से B तक <b>संबंध</b> R, A × B का कोई भी उपसमुच्चय है। यदि (a, b) ∈ R हो तो a R b लिखते हैं।</p><ul><li><b>प्रांत (domain)</b>: युग्मों के प्रथम अवयवों का समुच्चय।</li><li><b>सहप्रांत (co-domain)</b>: समुच्चय B।</li><li><b>परिसर (range)</b>: दूसरे अवयवों का वह समुच्चय जो वास्तव में आते हैं। परिसर ⊆ सहप्रांत।</li></ul><p>यदि n(A) = m और n(B) = n हो, तो A से B तक संबंधों की संख्या 2<sup>mn</sup> है, क्योंकि mn युग्मों में से हर एक संबंध में हो भी सकता है और नहीं भी।</p>'),
  dg:'sets_2',
  cap:B('R = {(1, 2), (2, 4), (3, 6)} from A = {1, 2, 3} to B = {2, 4, 6, 8}.','A = {1, 2, 3} से B = {2, 4, 6, 8} तक R = {(1, 2), (2, 4), (3, 6)}।')},
 {h:B('Types of relations','संबंधों के प्रकार'),
  body:B(
   '<p>A relation R on a set A (that is, a subset of A × A) can be:</p><ul><li><b>Reflexive</b>: (a, a) ∈ R for every a ∈ A.</li><li><b>Symmetric</b>: (a, b) ∈ R implies (b, a) ∈ R.</li><li><b>Transitive</b>: (a, b) ∈ R and (b, c) ∈ R imply (a, c) ∈ R.</li><li><b>Equivalence relation</b>: reflexive, symmetric and transitive together.</li></ul><p>An equivalence relation splits A into <b>equivalence classes</b>, which do not overlap and together cover A. For example, “a − b is divisible by 5” on the integers gives five classes, by remainder 0 to 4.</p><p>Counting on a set with n elements:</p><ul><li>Reflexive relations: 2<sup>n² − n</sup></li><li>Symmetric relations: 2<sup>n(n + 1)/2</sup></li><li>Reflexive and symmetric: 2<sup>n(n − 1)/2</sup></li></ul>',
   '<p>समुच्चय A पर संबंध R (यानी A × A का उपसमुच्चय) ये हो सकता है:</p><ul><li><b>स्वतुल्य</b>: हर a ∈ A के लिए (a, a) ∈ R।</li><li><b>सममित</b>: (a, b) ∈ R से (b, a) ∈ R मिले।</li><li><b>संक्रमी</b>: (a, b) ∈ R और (b, c) ∈ R से (a, c) ∈ R मिले।</li><li><b>तुल्यता संबंध</b>: स्वतुल्य, सममित और संक्रमी, तीनों एक साथ।</li></ul><p>तुल्यता संबंध A को <b>तुल्यता वर्गों</b> में बाँट देता है, जो आपस में नहीं मिलते और मिलकर पूरे A को ढक लेते हैं। उदाहरण: पूर्णांकों पर “a − b, 5 से विभाजित है” के पाँच वर्ग मिलते हैं, शेषफल 0 से 4 के अनुसार।</p><p>n अवयवों वाले समुच्चय पर गिनती:</p><ul><li>स्वतुल्य संबंध: 2<sup>n² − n</sup></li><li>सममित संबंध: 2<sup>n(n + 1)/2</sup></li><li>स्वतुल्य और सममित: 2<sup>n(n − 1)/2</sup></li></ul>')}
],

  a:B('<p>Subsets: 2⁵ = <b>32</b>.</p><p>Proper subsets: 32 − 1 = <b>31</b> (remove the set itself).</p><p>Non-empty proper subsets: 32 − 2 = <b>30</b> (remove ∅ and the set itself).</p>','<p>उपसमुच्चय: 2⁵ = <b>32</b>।</p><p>उचित उपसमुच्चय: 32 − 1 = <b>31</b> (समुच्चय स्वयं हटाओ)।</p><p>अरिक्त उचित उपसमुच्चय: 32 − 2 = <b>30</b> (∅ और समुच्चय स्वयं हटाओ)।</p>')},

  a:B('<p>A × B has 3 × 4 = 12 pairs, so relations from A to B: 2¹² = <b>4096</b>.</p><p>A × A has 9 pairs, so relations on A: 2⁹ = <b>512</b>.</p>','<p>A × B में 3 × 4 = 12 युग्म हैं, इसलिए A से B तक संबंध: 2¹² = <b>4096</b>।</p><p>A × A में 9 युग्म हैं, इसलिए A पर संबंध: 2⁹ = <b>512</b>।</p>')},
 {lv:'medium',
  q:B('On A = {1, 2, 3}, let R = {(1, 1), (2, 2), (3, 3), (1, 2), (2, 1)}. Is R an equivalence relation?','A = {1, 2, 3} पर R = {(1, 1), (2, 2), (3, 3), (1, 2), (2, 1)} दिया है। क्या R तुल्यता संबंध है?'),
  a:B('<p><b>Reflexive:</b> (1, 1), (2, 2), (3, 3) are all in R.</p><p><b>Symmetric:</b> (1, 2) is there with (2, 1), and the other pairs are of the form (a, a).</p><p><b>Transitive:</b> (1, 2) and (2, 1) give (1, 1) ✓. (2, 1) and (1, 2) give (2, 2) ✓. No other chain gives a new pair.</p><p>So R is an <b>equivalence relation</b>.</p>','<p><b>स्वतुल्य:</b> (1, 1), (2, 2), (3, 3) तीनों R में हैं।</p><p><b>सममित:</b> (1, 2) के साथ (2, 1) भी है, बाकी युग्म (a, a) रूप के हैं।</p><p><b>संक्रमी:</b> (1, 2) और (2, 1) से (1, 1) ✓। (2, 1) और (1, 2) से (2, 2) ✓। कोई और श्रृंखला नया युग्म नहीं देती।</p><p>इसलिए R एक <b>तुल्यता संबंध</b> है।</p>')},
 {lv:'hard',
  q:B('For a set with 3 elements, find the number of reflexive relations, symmetric relations, and relations that are both reflexive and symmetric.','3 अवयवों वाले समुच्चय के लिए स्वतुल्य संबंधों, सममित संबंधों और स्वतुल्य तथा सममित दोनों संबंधों की संख्या ज्ञात करो।'),
  a:B('<p>n = 3, so there are n² = 9 pairs, of which 3 are diagonal pairs (a, a).</p><p>Reflexive: the 3 diagonal pairs are forced, the other 6 are free: 2⁶ = <b>64</b>.</p><p>Symmetric: the 3 diagonal pairs are free, and the 3 off-diagonal pairs {a, b} are chosen together with their mirror: 2³ × 2³ = 2⁶ = <b>64</b>.</p><p>Reflexive and symmetric: the diagonal is forced, and 3 mirror pairs are free: 2³ = <b>8</b>.</p>','<p>n = 3, इसलिए n² = 9 युग्म हैं, जिनमें 3 विकर्ण युग्म (a, a) हैं।</p><p>स्वतुल्य: 3 विकर्ण युग्म अनिवार्य हैं, बाकी 6 स्वतंत्र: 2⁶ = <b>64</b>।</p><p>सममित: 3 विकर्ण युग्म स्वतंत्र हैं, और 3 जोड़ी {a, b} अपने दर्पण-युग्म के साथ चुनी जाती हैं: 2³ × 2³ = 2⁶ = <b>64</b>।</p><p>स्वतुल्य और सममित: विकर्ण अनिवार्य और 3 दर्पण-जोड़ियाँ स्वतंत्र: 2³ = <b>8</b>।</p>')}
],
rev:{

}]);

D3.stats3d={
  en:'Spread of data: deviations from the mean',hi:'आँकड़ों का फैलाव: माध्य से विचलन',h:0.85,scale:0.66,center:[0,-0.3,0],spin:true,view:{yaw:-0.55,pitch:0.4,zoom:1},
  params:[{k:'s',en:'Spread s',hi:'फैलाव s',min:1,max:4,val:2,step:1,unit:''}],
  frame:function(S,t,P,l){
    var s=P.s,d=[-3,-2,-1,0,0,1,2,3],uy=0.045,i,mean=10,v,sq=0,ad=0;
    S.floor([[-1.1,0,-0.45],[1.1,0,-0.45],[1.1,0,0.45],[-1.1,0,0.45]],'soft',0.6,'line');
    S.poly([[-1.1,mean*uy,-0.4],[1.1,mean*uy,-0.4],[1.1,mean*uy,0.4],[-1.1,mean*uy,0.4]],'hi',0.18,'hi');
    S.text([1.2,mean*uy,0],sx(l,'mean','माध्य'),'hi',11,'left',true);
    var idx=Math.floor(t*0.8)%8;
    for(i=0;i<8;i++){
      v=mean+s*d[i];sq+=(v-mean)*(v-mean);ad+=Math.abs(v-mean);
      var x=(i-3.5)*0.27,c=v>mean?'accent':(v<mean?'good':'muted');
      S.box([x,v*uy/2,0],[0.17,v*uy,0.17],c);
      if(v!==mean)S.line([x,mean*uy,0.15],[x,v*uy,0.15],i===idx?'bad':'ink',i===idx?3.2:1.4);
      S.text([x,-0.1,0.1],String(v),i===idx?'bad':'muted',10,'center',i===idx);
    }
    var n=8,vr=sq/n,sd=Math.sqrt(vr),dv=s*d[idx];
    S.hud(0.04,0.07,sx(l,'Mean = 10   Mean deviation = ','माध्य = 10   माध्य विचलन = ')+(Math.round(ad/n*100)/100),'ink',12,'left',true);
    S.hud(0.04,0.16,sx(l,'Variance = ','प्रसरण = ')+(Math.round(vr*100)/100)+sx(l,'   SD = ','   मानक विचलन = ')+(Math.round(sd*100)/100),'accent',13,'left',true);
    S.hud(0.04,0.25,sx(l,'Marked bar: (x − mean)² = ','चिह्नित स्तंभ: (x − माध्य)² = ')+dv*dv,'bad',11,'left',true);
  }
};

CH=CH.concat([{
id:'maths-statistics', subject:'maths', cls:11, ord:14,
title:B('Statistics','सांख्यिकी'),
blurb:B('Measures of dispersion: range, mean deviation, variance, standard deviation and coefficient of variation.','विचलन के माप: परिसर, माध्य विचलन, प्रसरण, मानक विचलन और विचरण गुणांक।'),
sections:[
 {h:B('Why spread matters: range and mean deviation','फैलाव क्यों ज़रूरी: परिसर और माध्य विचलन'),
  body:B(
   '<p class="def"><b>In simple words:</b> two classes can have the same average marks, yet in one class everybody scored about the same and in the other the marks are all over the place. The <b>average</b> shows the centre. A <b>measure of dispersion</b> shows how <b>spread out</b> the data is.</p><p><b>Range</b> is the simplest measure.</p><p class="eq">Range = largest value − smallest value</p><p>It uses only two numbers, so one odd value can change it a lot.</p><p><b>Mean deviation</b> asks: on average, how far is each value from the mean?</p><p class="eq">M.D. = Σ|xᵢ − x̄| / n</p><ul><li>First find the mean x̄.</li><li>Take each distance |xᵢ − x̄|. The bars mean we ignore the sign, otherwise positives and negatives cancel to zero.</li><li>Add the distances and divide by n.</li></ul><p>Example: 6, 7, 10, 12, 13, 4, 8, 12. Mean = 72/8 = 9. Distances: 3, 2, 1, 3, 4, 5, 1, 3, total 22. M.D. = 22/8 = 2.75.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> दो कक्षाओं के औसत अंक समान हो सकते हैं, फिर भी एक में सबने लगभग बराबर अंक पाए और दूसरे में अंक बहुत बिखरे हैं। <b>औसत</b> केंद्र बताता है। <b>विचलन का माप</b> बताता है कि आँकड़े कितने <b>फैले</b> हैं।</p><p><b>परिसर</b> सबसे सरल माप है।</p><p class="eq">परिसर = सबसे बड़ा मान − सबसे छोटा मान</p><p>यह केवल दो संख्याओं का उपयोग करता है, इसलिए एक अजीब मान इसे बहुत बदल सकता है।</p><p><b>माध्य विचलन</b> पूछता है: औसतन हर मान माध्य से कितनी दूर है?</p><p class="eq">M.D. = Σ|xᵢ − x̄| / n</p><ul><li>पहले माध्य x̄ निकालो।</li><li>हर दूरी |xᵢ − x̄| लो। मापांक का अर्थ है चिह्न छोड़ दो, वरना धनात्मक और ऋणात्मक कटकर शून्य हो जाएँगे।</li><li>दूरियाँ जोड़ो और n से भाग दो।</li></ul><p>उदाहरण: 6, 7, 10, 12, 13, 4, 8, 12। माध्य = 72/8 = 9। दूरियाँ: 3, 2, 1, 3, 4, 5, 1, 3, योग 22। M.D. = 22/8 = 2.75।</p>')},
 {h:B('Variance and standard deviation','प्रसरण और मानक विचलन'),
  body:B(
   '<p class="def"><b>In simple words:</b> instead of ignoring signs, <b>square</b> each distance from the mean. Squaring also makes big gaps count more. The average of these squares is the <b>variance</b>. Its square root is the <b>standard deviation (SD)</b>, which is in the same units as the data.</p><p class="eq">σ² = Σ(xᵢ − x̄)² / n        σ = √σ²</p><p><b>Shortcut</b> (no need to subtract the mean every time):</p><p class="eq">σ² = Σxᵢ²/n − (x̄)²</p><ul><li>Small SD: values are packed close to the mean.</li><li>Large SD: values are spread far from the mean.</li><li>Adding the same number to every value does <b>not</b> change the SD (the whole picture just slides).</li><li>Multiplying every value by k multiplies the SD by |k|, and the variance by k².</li></ul><p>In the figure, each bar is a data value and the glowing plane is the mean. The vertical line on each bar is its deviation. Raise the spread slider: the deviations grow, and the variance grows 4 times when the spread doubles. The red line marks one deviation at a time and its square is shown.</p><p>Example: 2, 4, 4, 4, 5, 5, 7, 9 has mean 5, squared deviations 9, 1, 1, 1, 0, 0, 4, 16 (sum 32). Variance = 32/8 = 4 and SD = 2.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> चिह्न छोड़ने के बजाय माध्य से हर दूरी का <b>वर्ग</b> लो। वर्ग करने से बड़े अंतर का असर भी ज़्यादा होता है। इन वर्गों का औसत <b>प्रसरण</b> है। उसका वर्गमूल <b>मानक विचलन (SD)</b> है, जिसकी इकाई आँकड़ों वाली ही होती है।</p><p class="eq">σ² = Σ(xᵢ − x̄)² / n        σ = √σ²</p><p><b>शॉर्टकट</b> (हर बार माध्य घटाने की ज़रूरत नहीं):</p><p class="eq">σ² = Σxᵢ²/n − (x̄)²</p><ul><li>छोटा SD: मान माध्य के पास सटे हैं।</li><li>बड़ा SD: मान माध्य से दूर फैले हैं।</li><li>हर मान में एक ही संख्या जोड़ने से SD <b>नहीं</b> बदलता (पूरी तस्वीर बस खिसक जाती है)।</li><li>हर मान को k से गुणा करने पर SD, |k| गुना और प्रसरण k² गुना हो जाता है।</li></ul><p>चित्र में हर स्तंभ एक आँकड़ा है और चमकता तल माध्य है। हर स्तंभ पर खड़ी रेखा उसका विचलन है। फैलाव का स्लाइडर बढ़ाओ: विचलन बढ़ते हैं और फैलाव दोगुना होने पर प्रसरण 4 गुना हो जाता है। लाल रेखा एक-एक विचलन को चिह्नित करती है और उसका वर्ग दिखता है।</p><p>उदाहरण: 2, 4, 4, 4, 5, 5, 7, 9 का माध्य 5 है, विचलन के वर्ग 9, 1, 1, 1, 0, 0, 4, 16 (योग 32)। प्रसरण = 32/8 = 4 और SD = 2।</p>'),
  d3:'stats3d',
  cap:B('Each bar is a data value, the plane is the mean, and the vertical lines are the deviations. A bigger spread gives a bigger variance.','हर स्तंभ एक आँकड़ा है, तल माध्य है और खड़ी रेखाएँ विचलन हैं। फैलाव बढ़ने पर प्रसरण बढ़ता है।')},
 {h:B('Grouped data and the step-deviation shortcut','वर्गीकृत आँकड़े और पद-विचलन शॉर्टकट'),
  body:B(
   '<p class="def"><b>In simple words:</b> when values repeat, write each value x with its frequency f (how many times). Then every sum is multiplied by f.</p><p class="eq">x̄ = Σfx / N        σ² = Σfx²/N − (x̄)²        N = Σf</p><p>For continuous classes (like 10 to 20), use the <b>class mark</b> (middle value) as x.</p><p><b>Step-deviation:</b> pick an assumed mean A and class width h, and let u = (x − A)/h. The numbers become small.</p><p class="eq">σ² = h² [ Σfu²/N − (Σfu/N)² ]</p><p>The SD does not depend on the assumed mean A. That is why the shortcut works.</p><p>Example: x = 3, 8, 13, 18, 23 with f = 5, 10, 20, 40, 25. N = 100. Σfx = 1650, so x̄ = 16.5. Σfx² = 30250, so σ² = 302.5 − 272.25 = 30.25 and σ = 5.5.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> जब मान दोहराए जाते हैं तो हर मान x को उसकी बारंबारता f (कितनी बार) के साथ लिखो। तब हर योग में f का गुणा होता है।</p><p class="eq">x̄ = Σfx / N        σ² = Σfx²/N − (x̄)²        N = Σf</p><p>सतत वर्गों (जैसे 10 से 20) के लिए <b>वर्ग-चिह्न</b> (मध्य मान) को x लो।</p><p><b>पद-विचलन:</b> कल्पित माध्य A और वर्ग-अंतराल h लो, और u = (x − A)/h रखो। संख्याएँ छोटी हो जाती हैं।</p><p class="eq">σ² = h² [ Σfu²/N − (Σfu/N)² ]</p><p>SD कल्पित माध्य A पर निर्भर नहीं करता। इसीलिए यह शॉर्टकट काम करता है।</p><p>उदाहरण: x = 3, 8, 13, 18, 23 और f = 5, 10, 20, 40, 25। N = 100। Σfx = 1650, अतः x̄ = 16.5। Σfx² = 30250, अतः σ² = 302.5 − 272.25 = 30.25 और σ = 5.5।</p>')},
 {h:B('Coefficient of variation: who is more consistent?','विचरण गुणांक: कौन ज़्यादा संगत है?'),
  body:B(
   '<p class="def"><b>In simple words:</b> an SD of 10 means little if the mean is 1000 but a lot if the mean is 20. To compare two data sets fairly, express the SD as a <b>percentage of the mean</b>.</p><p class="eq">C.V. = (σ / x̄) × 100</p><ul><li>The <b>smaller</b> C.V. means the data is <b>more consistent</b> (less relative spread).</li><li>The <b>larger</b> C.V. means the data is more variable.</li><li>C.V. has no units, so we can compare marks with heights or prices.</li></ul><p>Example: team A scores a mean of 50 with SD 10, team B a mean of 80 with SD 12. C.V. of A = 20%, C.V. of B = 15%. Team B is more consistent, even though its SD is larger.</p><p><b>Quick check list:</b> range uses 2 values, M.D. uses the absolute gaps, variance uses squares, SD is the square root of variance, C.V. is SD as a percentage of the mean.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> SD = 10 का कोई खास अर्थ नहीं यदि माध्य 1000 हो, पर बहुत बड़ा अर्थ है यदि माध्य 20 हो। दो आँकड़ा-समूहों की निष्पक्ष तुलना के लिए SD को <b>माध्य के प्रतिशत</b> के रूप में लिखो।</p><p class="eq">C.V. = (σ / x̄) × 100</p><ul><li><b>छोटा</b> C.V. यानी आँकड़े <b>अधिक संगत</b> (सापेक्ष फैलाव कम)।</li><li><b>बड़ा</b> C.V. यानी आँकड़े अधिक परिवर्तनशील।</li><li>C.V. की कोई इकाई नहीं होती, इसलिए अंकों की तुलना ऊँचाई या कीमतों से भी हो सकती है।</li></ul><p>उदाहरण: टीम A का माध्य 50 और SD 10, टीम B का माध्य 80 और SD 12। A का C.V. = 20%, B का C.V. = 15%। टीम B अधिक संगत है, भले ही उसका SD बड़ा है।</p><p><b>जल्दी जाँच सूची:</b> परिसर 2 मान लेता है, M.D. निरपेक्ष अंतर लेता है, प्रसरण वर्ग लेता है, SD प्रसरण का वर्गमूल है, C.V. माध्य के प्रतिशत में SD है।</p>')}
],

  a:B('<p>Mean = 40/8 = 5.</p><p>Squared deviations: 9, 1, 1, 1, 0, 0, 4, 16. Sum = 32.</p><p>Variance = 32/8 = <b>4</b>. SD = <b>2</b>.</p>','<p>माध्य = 40/8 = 5।</p><p>विचलन के वर्ग: 9, 1, 1, 1, 0, 0, 4, 16। योग = 32।</p><p>प्रसरण = 32/8 = <b>4</b>। SD = <b>2</b>।</p>')},
 {lv:'medium',
  q:B('For 10 values, Σx = 50 and Σx² = 290. Find the variance.','10 मानों के लिए Σx = 50 और Σx² = 290 है। प्रसरण ज्ञात करो।'),

  a:B('<p>N = 100. Σfx = 15 + 80 + 260 + 720 + 575 = 1650, so x̄ = 16.5.</p><p>Σfx² = 45 + 640 + 3380 + 12960 + 13225 = 30250.</p><p>σ² = 302.5 − 272.25 = 30.25, so σ = <b>5.5</b>.</p>','<p>N = 100। Σfx = 15 + 80 + 260 + 720 + 575 = 1650, अतः x̄ = 16.5।</p><p>Σfx² = 45 + 640 + 3380 + 12960 + 13225 = 30250।</p><p>σ² = 302.5 − 272.25 = 30.25, अतः σ = <b>5.5</b>।</p>')},
 {lv:'hard',
  q:B('Series A has mean 50 and SD 10; series B has mean 80 and SD 12. Which is more consistent? If every value of A is doubled and then 3 is added, find the new mean and SD.','श्रेणी A का माध्य 50 और SD 10 है; श्रेणी B का माध्य 80 और SD 12 है। कौन अधिक संगत है? यदि A के हर मान को दोगुना करके 3 जोड़ दिया जाए तो नया माध्य और SD ज्ञात करो।'),
  a:B('<p>C.V. of A = 10/50 × 100 = 20%. C.V. of B = 12/80 × 100 = 15%.</p><p>B has the smaller C.V., so <b>B is more consistent</b>.</p><p>New values = 2x + 3. New mean = 2(50) + 3 = <b>103</b>. Adding 3 does not change the SD, and doubling doubles it: new SD = <b>20</b>.</p>','<p>A का C.V. = 10/50 × 100 = 20%। B का C.V. = 12/80 × 100 = 15%।</p><p>B का C.V. छोटा है, अतः <b>B अधिक संगत है</b>।</p><p>नए मान = 2x + 3। नया माध्य = 2(50) + 3 = <b>103</b>। 3 जोड़ने से SD नहीं बदलता और दोगुना करने से दोगुना होता है: नया SD = <b>20</b>।</p>')}

D3.line3d={
  en:'Shortest distance from a point to a line',hi:'बिंदु से रेखा की न्यूनतम दूरी',h:0.82,scale:0.62,center:[0,0,0],spin:true,view:{yaw:-0.45,pitch:0.42,zoom:1},
  params:[{k:'th',en:'Line angle θ',hi:'रेखा का कोण θ',min:0,max:170,val:30,step:5,unit:'°'},{k:'c',en:'y-intercept c',hi:'y-अंतःखंड c',min:-3,max:3,val:-1,step:1,unit:''}],
  frame:function(S,t,P,l){
    var u=0.2,th=P.th*Math.PI/180,c=P.c,d=[Math.cos(th),Math.sin(th)],Q=[0,c],Pt=[3,2],i;
    S.floor([[-1.3,-1.3,0],[1.3,-1.3,0],[1.3,1.3,0],[-1.3,1.3,0]],'soft',0.7,'line');
    for(i=-6;i<=6;i++){S.line2([i*u,-1.2,0],[i*u,1.2,0],'line');S.line2([-1.2,i*u,0],[1.2,i*u,0],'line')}
    S.arrow([-1.3,0,0],[1.35,0,0],'ink',1.4);S.arrow([0,-1.3,0],[0,1.35,0],'ink',1.4);
    S.text([1.45,-0.1,0],'x','muted',12,'center',true);S.text([0.1,1.45,0],'y','muted',12,'center',true);
    var lo=-14,hi=14,s;
    for(s=-14;s<=14;s+=0.05){var x=Q[0]+s*d[0],y=Q[1]+s*d[1];if(Math.abs(x)>6||Math.abs(y)>6){if(s<0)lo=s+0.05;else{hi=s-0.05;break}}}
    S.line([(Q[0]+lo*d[0])*u,(Q[1]+lo*d[1])*u,0],[(Q[0]+hi*d[0])*u,(Q[1]+hi*d[1])*u,0],'accent',3.4);
    var dot=(Pt[0]-Q[0])*d[0]+(Pt[1]-Q[1])*d[1],F=[Q[0]+dot*d[0],Q[1]+dot*d[1]],dist=Math.abs((Pt[0]-Q[0])*d[1]-(Pt[1]-Q[1])*d[0]);
    var sw=2.6*Math.sin(t*1.1),M=[F[0]+sw*d[0],F[1]+sw*d[1]],dm=Math.sqrt(Math.pow(Pt[0]-M[0],2)+Math.pow(Pt[1]-M[1],2));
    S.line([Pt[0]*u,Pt[1]*u,0],[F[0]*u,F[1]*u,0],'good',2,true);
    S.line([Pt[0]*u,Pt[1]*u,0],[M[0]*u,M[1]*u,0],'hi',2);
    S.sphere([F[0]*u,F[1]*u,0],0.04,'good');
    S.sphere([M[0]*u,M[1]*u,0],0.05,'hi',true);
    S.sphere([Pt[0]*u,Pt[1]*u,0],0.065,'ink',true);
    S.text([Pt[0]*u+0.14,Pt[1]*u+0.1,0],'P(3, 2)','ink',12,'center',true);
    S.sphere([0,c*u,0],0.04,'accent');
    var m=Math.abs(P.th-90)<0.5?null:Math.tan(th);
    S.hud(0.04,0.07,m===null?sx(l,'slope: vertical line','ढाल: ऊर्ध्वाधर रेखा'):sx(l,'slope m = tan θ = ','ढाल m = tan θ = ')+m.toFixed(2),'accent',12,'left',true);
    S.hud(0.04,0.16,sx(l,'shortest distance = ','न्यूनतम दूरी = ')+dist.toFixed(2),'good',12,'left',true);
    S.hud(0.04,0.25,sx(l,'red segment now = ','लाल खंड अभी = ')+dm.toFixed(2)+sx(l,'  (never smaller)','  (कभी कम नहीं)'),'hi',12,'left',true);
  }
};

CH=CH.concat([{

title:B('Straight Lines','सरल रेखाएँ'),
blurb:B('Slope, equations of a line, angle between lines, distance of a point from a line and the area of a triangle.','ढाल, रेखा के समीकरण, रेखाओं के बीच कोण, बिंदु से रेखा की दूरी और त्रिभुज का क्षेत्रफल।'),
sections:[
 {h:B('Slope and basic formulas','ढाल और मूल सूत्र'),
  body:B(
   '<p class="def"><b>In simple words:</b> the <b>slope</b> of a line tells how steep it is: how much y rises for each 1 step along x.</p><p class="eq">m = tan θ = (y₂ − y₁)/(x₂ − x₁)</p><p>θ is the angle the line makes with the positive x-axis (measured anticlockwise, 0° ≤ θ &lt; 180°).</p><ul><li>Horizontal line: m = 0. Vertical line: slope is not defined.</li><li><b>Parallel</b> lines have equal slopes: m₁ = m₂.</li><li><b>Perpendicular</b> lines have m₁ · m₂ = −1.</li><li>Three points are <b>collinear</b> if the slopes of AB and BC are equal.</li></ul><p><b>Distance</b> between (x₁, y₁) and (x₂, y₂): √[(x₂ − x₁)² + (y₂ − y₁)²].</p><p><b>Section formula:</b> the point dividing the join in the ratio m : n internally is ((mx₂ + nx₁)/(m + n), (my₂ + ny₁)/(m + n)). For the midpoint take m = n.</p><p>Example: the line through (1, 2) and (3, 8) has slope (8 − 2)/(3 − 1) = 3, so it rises 3 for every 1 across.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> रेखा का <b>ढाल</b> बताता है कि वह कितनी तीखी है: x में 1 कदम चलने पर y कितना बढ़ता है।</p><p class="eq">m = tan θ = (y₂ − y₁)/(x₂ − x₁)</p><p>θ वह कोण है जो रेखा धनात्मक x-अक्ष से बनाती है (वामावर्त मापा, 0° ≤ θ &lt; 180°)।</p><ul><li>क्षैतिज रेखा: m = 0। ऊर्ध्वाधर रेखा: ढाल परिभाषित नहीं।</li><li><b>समांतर</b> रेखाओं के ढाल बराबर होते हैं: m₁ = m₂।</li><li><b>लंबवत</b> रेखाओं के लिए m₁ · m₂ = −1।</li><li>तीन बिंदु <b>संरेख</b> हैं यदि AB और BC के ढाल बराबर हों।</li></ul><p>(x₁, y₁) और (x₂, y₂) के बीच <b>दूरी</b>: √[(x₂ − x₁)² + (y₂ − y₁)²]।</p><p><b>विभाजन सूत्र:</b> मिलाने वाली रेखा को m : n में अंतः विभाजित करने वाला बिंदु ((mx₂ + nx₁)/(m + n), (my₂ + ny₁)/(m + n)) है। मध्य बिंदु के लिए m = n लो।</p><p>उदाहरण: (1, 2) और (3, 8) से जाने वाली रेखा का ढाल (8 − 2)/(3 − 1) = 3 है, अर्थात 1 आगे चलने पर 3 ऊपर चढ़ती है।</p>')},
 {h:B('Equations of a line','रेखा के समीकरण'),
  body:B(
   '<p class="def"><b>In simple words:</b> a line is the set of all points (x, y) that satisfy one linear equation. Pick the form that uses the information you are given.</p><ul><li><b>Slope–intercept:</b> y = mx + c (slope m, cuts the y-axis at c).</li><li><b>Point–slope:</b> y − y₁ = m(x − x₁).</li><li><b>Two-point:</b> y − y₁ = [(y₂ − y₁)/(x₂ − x₁)](x − x₁).</li><li><b>Intercept form:</b> x/a + y/b = 1 (cuts the axes at a and b).</li><li><b>Normal form:</b> x cos α + y sin α = p, where p is the distance from the origin.</li><li><b>General form:</b> Ax + By + C = 0, with slope −A/B.</li></ul><p>Examples: a line with x-intercept 4 and y-intercept 3 is x/4 + y/3 = 1, or 3x + 4y = 12. Its distance from the origin is 12/5.</p><p>x = k is a vertical line and y = k is a horizontal line.</p><p>To find where two lines meet, solve their equations together. For 2x + y = 5 and x − y = 1, adding gives 3x = 6, so the point is (2, 1).</p>',
   '<p class="def"><b>सरल शब्दों में:</b> रेखा उन सभी बिंदुओं (x, y) का समुच्चय है जो एक रैखिक समीकरण को संतुष्ट करते हैं। जो जानकारी दी गई हो, उसी के अनुरूप रूप चुनो।</p><ul><li><b>ढाल–अंतःखंड:</b> y = mx + c (ढाल m, y-अक्ष को c पर काटती है)।</li><li><b>बिंदु–ढाल:</b> y − y₁ = m(x − x₁)।</li><li><b>द्वि-बिंदु:</b> y − y₁ = [(y₂ − y₁)/(x₂ − x₁)](x − x₁)।</li><li><b>अंतःखंड रूप:</b> x/a + y/b = 1 (अक्षों को a और b पर काटती है)।</li><li><b>लंब रूप:</b> x cos α + y sin α = p, जहाँ p मूलबिंदु से दूरी है।</li><li><b>व्यापक रूप:</b> Ax + By + C = 0, ढाल −A/B।</li></ul><p>उदाहरण: जिस रेखा का x-अंतःखंड 4 और y-अंतःखंड 3 हो वह x/4 + y/3 = 1, यानी 3x + 4y = 12 है। मूलबिंदु से इसकी दूरी 12/5 है।</p><p>x = k ऊर्ध्वाधर रेखा है और y = k क्षैतिज रेखा।</p><p>दो रेखाएँ कहाँ मिलती हैं, यह जानने के लिए उनके समीकरण साथ हल करो। 2x + y = 5 और x − y = 1 के लिए जोड़ने पर 3x = 6, अतः बिंदु (2, 1) है।</p>')},
 {h:B('Angle and distance','कोण और दूरी'),
  body:B(
   '<p class="def"><b>In simple words:</b> the angle between two lines depends only on their slopes, and the distance from a point to a line is the length of the perpendicular, the shortest path.</p><p class="eq">tan φ = |(m₁ − m₂)/(1 + m₁m₂)|</p><p>For lines y = x and y = √3x: tan φ = (√3 − 1)/(1 + √3) = 2 − √3, so φ = 15°. If m₁m₂ = −1 the denominator is zero and φ = 90°.</p><p><b>Distance of (x₁, y₁) from Ax + By + C = 0:</b></p><p class="eq">d = |Ax₁ + By₁ + C|/√(A² + B²)</p><p><b>Distance between parallel lines</b> Ax + By + C₁ = 0 and Ax + By + C₂ = 0:</p><p class="eq">d = |C₁ − C₂|/√(A² + B²)</p><p>Example: (2, 3) from 3x + 4y − 5 = 0 is |6 + 12 − 5|/5 = 13/5.</p><p>In the figure the green dashed segment is the perpendicular. The red segment slides along the line and is never shorter than green. Change θ and c to move the line and watch the distance change.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> दो रेखाओं के बीच का कोण केवल उनके ढालों पर निर्भर करता है और बिंदु से रेखा की दूरी लंब की लंबाई है, जो सबसे छोटा रास्ता है।</p><p class="eq">tan φ = |(m₁ − m₂)/(1 + m₁m₂)|</p><p>रेखाओं y = x और y = √3x के लिए: tan φ = (√3 − 1)/(1 + √3) = 2 − √3, अतः φ = 15°। यदि m₁m₂ = −1 हो तो हर शून्य है और φ = 90°।</p><p><b>(x₁, y₁) की Ax + By + C = 0 से दूरी:</b></p><p class="eq">d = |Ax₁ + By₁ + C|/√(A² + B²)</p><p><b>समांतर रेखाओं</b> Ax + By + C₁ = 0 और Ax + By + C₂ = 0 <b>के बीच दूरी:</b></p><p class="eq">d = |C₁ − C₂|/√(A² + B²)</p><p>उदाहरण: (2, 3) की 3x + 4y − 5 = 0 से दूरी |6 + 12 − 5|/5 = 13/5 है।</p><p>चित्र में हरा बिंदुदार खंड लंब है। लाल खंड रेखा पर सरकता है और हरे से कभी छोटा नहीं होता। θ और c बदलकर रेखा खिसकाओ और दूरी बदलती देखो।</p>'),
  d3:'line3d',
  cap:B('The perpendicular (green) is the shortest segment from P to the line. The red segment slides along the line.','लंब (हरा) P से रेखा तक का सबसे छोटा खंड है। लाल खंड रेखा पर सरकता है।')},
 {h:B('Area, families of lines and tricks','क्षेत्रफल, रेखा-कुल और युक्तियाँ'),
  body:B(
   '<p><b>Area of a triangle</b> with vertices (x₁, y₁), (x₂, y₂), (x₃, y₃):</p><p class="eq">Area = ½ |x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|</p><p>The area is zero exactly when the three points are collinear. For (1, 1), (4, 5), (7, 1) it is ½ |1(4) + 4(0) + 7(−4)| = ½ × 24 = 12.</p><p><b>Family of lines through an intersection:</b> the lines through the meeting point of L₁ = 0 and L₂ = 0 are L₁ + λL₂ = 0. Choose λ using the extra condition given.</p><p><b>Concurrent lines:</b> three lines pass through one point if the point of intersection of two of them satisfies the third.</p><ul><li><b>Reflection</b> of (a, b) in the line y = x is (b, a).</li><li>The <b>bisectors</b> of the angles between two lines are the points equidistant from both lines.</li><li><b>Equal intercepts:</b> a line through (2, 3) with equal non-zero intercepts is x/a + y/a = 1, so x + y = a. Substituting (2, 3) gives a = 5, so x + y = 5.</li></ul><p>When stuck, draw a rough sketch. Many answers become obvious.</p>',
   '<p>शीर्षों (x₁, y₁), (x₂, y₂), (x₃, y₃) वाले <b>त्रिभुज का क्षेत्रफल</b>:</p><p class="eq">क्षेत्रफल = ½ |x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|</p><p>क्षेत्रफल शून्य तभी है जब तीनों बिंदु संरेख हों। (1, 1), (4, 5), (7, 1) के लिए यह ½ |1(4) + 4(0) + 7(−4)| = ½ × 24 = 12 है।</p><p><b>प्रतिच्छेद से जाने वाली रेखाओं का कुल:</b> L₁ = 0 और L₂ = 0 के कटान बिंदु से जाने वाली रेखाएँ L₁ + λL₂ = 0 होती हैं। दी गई अतिरिक्त शर्त से λ निकालो।</p><p><b>संगामी रेखाएँ:</b> तीन रेखाएँ एक बिंदु से जाती हैं यदि उनमें से दो का कटान बिंदु तीसरी को संतुष्ट करे।</p><ul><li>रेखा y = x में (a, b) का <b>प्रतिबिंब</b> (b, a) है।</li><li>दो रेखाओं के बीच कोणों के <b>समद्विभाजक</b> वे बिंदु हैं जो दोनों रेखाओं से समान दूरी पर हों।</li><li><b>समान अंतःखंड:</b> (2, 3) से जाने वाली, समान अशून्य अंतःखंडों वाली रेखा x/a + y/a = 1, यानी x + y = a है। (2, 3) रखने पर a = 5, अतः x + y = 5।</li></ul><p>अटक जाओ तो मोटा चित्र बनाओ। कई उत्तर स्पष्ट हो जाते हैं।</p>')}
],

examples:[
 {lv:'easy',
  q:B('Find the slope and the equation of the line through (1, 2) and (3, 8).','(1, 2) और (3, 8) से जाने वाली रेखा का ढाल और समीकरण ज्ञात करो।'),
  a:B('<p>Slope m = (8 − 2)/(3 − 1) = <b>3</b>.</p><p>Point–slope with (1, 2): y − 2 = 3(x − 1), so <b>y = 3x − 1</b>.</p><p>Check with (3, 8): 3(3) − 1 = 8 ✓.</p>','<p>ढाल m = (8 − 2)/(3 − 1) = <b>3</b>।</p><p>(1, 2) के साथ बिंदु–ढाल रूप: y − 2 = 3(x − 1), अतः <b>y = 3x − 1</b>।</p><p>(3, 8) से जाँच: 3(3) − 1 = 8 ✓।</p>')},
 {lv:'easy',
  q:B('A line has x-intercept 4 and y-intercept 3. Find its equation and its distance from the origin.','एक रेखा का x-अंतःखंड 4 और y-अंतःखंड 3 है। उसका समीकरण और मूलबिंदु से दूरी ज्ञात करो।'),
  a:B('<p>x/4 + y/3 = 1. Multiply by 12: <b>3x + 4y = 12</b>.</p><p>Distance from the origin = |0 + 0 − 12|/√(9 + 16) = <b>12/5</b> = 2.4.</p>','<p>x/4 + y/3 = 1। 12 से गुणा करने पर <b>3x + 4y = 12</b>।</p><p>मूलबिंदु से दूरी = |0 + 0 − 12|/√(9 + 16) = <b>12/5</b> = 2.4।</p>')},
 {lv:'medium',
  q:B('Find the acute angle between the lines y = x and y = √3 x.','रेखाओं y = x और y = √3 x के बीच न्यून कोण ज्ञात करो।'),
  a:B('<p>m₁ = 1, m₂ = √3.</p><p>tan φ = |(√3 − 1)/(1 + √3)| = (√3 − 1)/(√3 + 1) = 2 − √3 = tan 15°.</p><p>So the angle is <b>15°</b>. (Directly: the lines make 45° and 60° with the x-axis, and 60° − 45° = 15°.)</p>','<p>m₁ = 1, m₂ = √3।</p><p>tan φ = |(√3 − 1)/(1 + √3)| = (√3 − 1)/(√3 + 1) = 2 − √3 = tan 15°।</p><p>अतः कोण <b>15°</b> है। (सीधे: रेखाएँ x-अक्ष से 45° और 60° बनाती हैं और 60° − 45° = 15°।)</p>')},
 {lv:'medium',
  q:B('Find the distance of (2, 3) from 3x + 4y − 5 = 0, and the distance between 3x + 4y + 5 = 0 and 3x + 4y − 10 = 0.','(2, 3) की 3x + 4y − 5 = 0 से दूरी और 3x + 4y + 5 = 0 व 3x + 4y − 10 = 0 के बीच की दूरी ज्ञात करो।'),
  a:B('<p>First: |3(2) + 4(3) − 5|/√(9 + 16) = 13/5 = <b>2.6</b>.</p><p>Second: |5 − (−10)|/5 = 15/5 = <b>3</b>.</p>','<p>पहली: |3(2) + 4(3) − 5|/√(9 + 16) = 13/5 = <b>2.6</b>।</p><p>दूसरी: |5 − (−10)|/5 = 15/5 = <b>3</b>।</p>')},
 {lv:'medium',
  q:B('Find the area of the triangle with vertices (1, 1), (4, 5) and (7, 1).','शीर्षों (1, 1), (4, 5) और (7, 1) वाले त्रिभुज का क्षेत्रफल ज्ञात करो।'),
  a:B('<p>Area = ½ |1(5 − 1) + 4(1 − 1) + 7(1 − 5)| = ½ |4 + 0 − 28| = ½ × 24 = <b>12</b>.</p><p>Check: the base from (1, 1) to (7, 1) is 6 and the height is 5 − 1 = 4, so ½ × 6 × 4 = 12 ✓.</p>','<p>क्षेत्रफल = ½ |1(5 − 1) + 4(1 − 1) + 7(1 − 5)| = ½ |4 + 0 − 28| = ½ × 24 = <b>12</b>।</p><p>जाँच: (1, 1) से (7, 1) तक आधार 6 है और ऊँचाई 5 − 1 = 4, अतः ½ × 6 × 4 = 12 ✓।</p>')},
 {lv:'hard',
  q:B('Find the line through (2, 3) which has equal non-zero intercepts on the axes, and find where 2x + y = 5 meets x − y = 1.','(2, 3) से जाने वाली वह रेखा ज्ञात करो जिसके अक्षों पर अंतःखंड बराबर और अशून्य हों। साथ ही 2x + y = 5 और x − y = 1 का कटान बिंदु ज्ञात करो।'),
  a:B('<p>Equal intercepts: x/a + y/a = 1, i.e. x + y = a. Since (2, 3) lies on it, a = 5. The line is <b>x + y = 5</b>.</p><p>Adding 2x + y = 5 and x − y = 1 gives 3x = 6, x = 2, then y = 1. They meet at <b>(2, 1)</b>.</p>','<p>बराबर अंतःखंड: x/a + y/a = 1, यानी x + y = a। (2, 3) इस पर है, अतः a = 5। रेखा <b>x + y = 5</b> है।</p><p>2x + y = 5 और x − y = 1 जोड़ने पर 3x = 6, x = 2, फिर y = 1। दोनों <b>(2, 1)</b> पर मिलती हैं।</p>')}
],
rev:{
 en:['Slope m = tan θ = Δy/Δx; parallel m₁ = m₂, perpendicular m₁m₂ = −1.','Choose the form of the line from the data: slope–intercept, point–slope, two-point or intercept.','Angle between lines: tan φ = |(m₁ − m₂)/(1 + m₁m₂)|.','Distance of a point from a line: |Ax₁ + By₁ + C|/√(A² + B²).','Area of a triangle is zero if the three points are collinear.','Lines through the meeting point of L₁ and L₂ form the family L₁ + λL₂ = 0.'],
 hi:['ढाल m = tan θ = Δy/Δx; समांतर m₁ = m₂, लंबवत m₁m₂ = −1।','दी गई जानकारी से रेखा का रूप चुनो: ढाल–अंतःखंड, बिंदु–ढाल, द्वि-बिंदु या अंतःखंड।','रेखाओं के बीच कोण: tan φ = |(m₁ − m₂)/(1 + m₁m₂)|।','बिंदु से रेखा की दूरी: |Ax₁ + By₁ + C|/√(A² + B²)।','तीन बिंदु संरेख हों तो त्रिभुज का क्षेत्रफल शून्य होता है।','L₁ और L₂ के कटान बिंदु से जाने वाली रेखाओं का कुल L₁ + λL₂ = 0 है।']},

D3.atom3d={
  en:'Bohr model: electrons circling the nucleus in shells',hi:'बोर मॉडल: नाभिक के चारों ओर कोशों में घूमते इलेक्ट्रॉन',h:0.9,scale:0.78,center:[0,0,0],spin:true,view:{yaw:-0.3,pitch:0.4,zoom:1},
  params:[{k:'Z',en:'Atomic number Z',hi:'परमाणु क्रमांक Z',min:1,max:20,val:11,step:1,unit:''}],
  frame:function(S,t,P,l){
    var Z=P.Z,caps=[2,8,8,2],rem=Z,shells=[],i,q;
    for(i=0;i<4&&rem>0;i++){var take=Math.min(caps[i],rem);shells.push(take);rem-=take}
    S.sphere([0,0,0],0.1,'bad',true);
    for(i=0;i<shells.length;i++){
      var R=0.3+0.24*i,sp=1.1-0.18*i,n=shells[i];
      S.ring([0,0,0],R,'xy','muted',1.2);
      for(q=0;q<n;q++){
        var a=t*sp+q*2*Math.PI/n;
        S.sphere([R*Math.cos(a),R*Math.sin(a),0],0.045,'accent',true);
      }
    }
    var cfg=shells.join(',');
    S.hud(0.04,0.07,'Z = '+Z+'   '+sx(l,'shells (K,L,M,N) = ','कोश (K,L,M,N) = ')+cfg,'accent',12,'left',true);
    S.hud(0.04,0.16,'Eₙ = −13.6/n² eV (H atom)    rₙ = 0.529 n² Å','ink',12,'left',true);
    S.hud(0.04,0.25,sx(l,'Inner shells hold fewer electrons and move faster; outer shells are larger.','भीतरी कोश में कम इलेक्ट्रॉन होते हैं और वे तेज़ घूमते हैं; बाहरी कोश बड़े होते हैं।'),'muted',10,'left');
  }
};

CH=CH.concat([{
id:'chemistry-structure-of-atom', subject:'chemistry', cls:11, ord:2,
title:B('Structure of Atom','परमाणु की संरचना'),
blurb:B('Subatomic particles, the Bohr model, quantum numbers and orbitals, and how electrons fill them.','उपपरमाण्विक कण, बोर मॉडल, क्वांटम संख्याएँ और कक्षक, तथा इलेक्ट्रॉन इन्हें कैसे भरते हैं।'),
sections:[
 {h:B('Subatomic particles and early models','उपपरमाण्विक कण और प्रारंभिक मॉडल'),
  body:B(
   '<p class="def"><b>In simple words:</b> an atom is built from three tiny particles: <b>protons</b> (positive, in the nucleus), <b>neutrons</b> (neutral, in the nucleus) and <b>electrons</b> (negative, moving around the nucleus). The nucleus is extremely small but holds almost all the mass.</p><ul><li><b>Thomson’s model (plum pudding):</b> electrons scattered in a sphere of positive charge. Discarded after Rutherford’s experiment.</li><li><b>Rutherford’s gold-foil experiment:</b> most α-particles passed straight through a thin gold foil, but a few bounced back sharply. This showed that an atom is mostly empty space with a tiny, dense, positively charged <b>nucleus</b> at the centre, and electrons revolve around it.</li></ul><p class="eq">Mass number A = Z + n        Atomic number Z = number of protons</p><ul><li><b>Isotopes</b>: same Z, different A (different number of neutrons), e.g. ¹H, ²H, ³H.</li><li><b>Isobars</b>: same A, different Z. <b>Isotones</b>: same number of neutrons.</li><li>Rutherford’s model could not explain why electrons don’t spiral into the nucleus, or the line spectrum of hydrogen — this needed Bohr’s model.</li></ul>',
   '<p class="def"><b>सरल शब्दों में:</b> परमाणु तीन छोटे कणों से बना है: <b>प्रोटॉन</b> (धनात्मक, नाभिक में), <b>न्यूट्रॉन</b> (उदासीन, नाभिक में) और <b>इलेक्ट्रॉन</b> (ऋणात्मक, नाभिक के चारों ओर घूमते हुए)। नाभिक बहुत छोटा है पर लगभग पूरा द्रव्यमान रखता है।</p><ul><li><b>थॉमसन का मॉडल (प्लम पुडिंग):</b> धनावेश के गोले में बिखरे इलेक्ट्रॉन। रदरफोर्ड के प्रयोग के बाद खारिज।</li><li><b>रदरफोर्ड का स्वर्ण-पत्र प्रयोग:</b> अधिकांश α-कण पतली सोने की पन्नी से सीधे निकल गए, पर कुछ तेज़ी से वापस लौटे। इससे पता चला कि परमाणु ज़्यादातर खाली जगह है, और केंद्र में एक बहुत छोटा, घना, धनावेशित <b>नाभिक</b> है, जिसके चारों ओर इलेक्ट्रॉन घूमते हैं।</li></ul><p class="eq">द्रव्यमान संख्या A = Z + n        परमाणु क्रमांक Z = प्रोटॉनों की संख्या</p><ul><li><b>समस्थानिक (Isotopes)</b>: समान Z, भिन्न A (न्यूट्रॉनों की संख्या भिन्न), जैसे ¹H, ²H, ³H।</li><li><b>समभारिक (Isobars)</b>: समान A, भिन्न Z। <b>समन्यूट्रॉनिक (Isotones)</b>: समान न्यूट्रॉन संख्या।</li><li>रदरफोर्ड का मॉडल यह नहीं बता सका कि इलेक्ट्रॉन नाभिक में क्यों नहीं गिरते, या हाइड्रोजन का रेखा स्पेक्ट्रम क्यों बनता है — इसके लिए बोर के मॉडल की ज़रूरत पड़ी।</li></ul>')},
 {h:B('Bohr model and atomic spectra','बोर मॉडल और परमाण्विक स्पेक्ट्रम'),
  body:B(
   '<p class="def"><b>In simple words:</b> Bohr said electrons can only move in certain fixed circular paths (<b>orbits</b>), each with a fixed energy. They don’t lose energy while staying in an orbit — they only absorb or release energy when they <b>jump</b> between orbits.</p><p class="eq">E<sub>n</sub> = −13.6 Z²/n² eV        r<sub>n</sub> = 0.529 n²/Z Å</p><ul><li>n = 1, 2, 3… is the <b>principal quantum number</b> (orbit number). Larger n means larger orbit and higher (less negative) energy.</li><li>When an electron falls from a higher orbit n₂ to a lower orbit n₁, it releases a photon: <b>ΔE = E<sub>n₂</sub> − E<sub>n₁</sub> = hν</b>.</li><li><b>Rydberg formula</b> for the wavelength of the emitted light: 1/λ = R(1/n₁² − 1/n₂²), R = 1.097 × 10⁷ m⁻¹.</li><li><b>Lyman series</b> (n₁ = 1, UV), <b>Balmer series</b> (n₁ = 2, visible), <b>Paschen series</b> (n₁ = 3, IR).</li></ul><p>Bohr’s model explains hydrogen’s spectrum very well but fails for atoms with more than one electron, and cannot explain why some orbits are preferred (it simply assumes it).</p>',
   '<p class="def"><b>सरल शब्दों में:</b> बोर ने कहा कि इलेक्ट्रॉन केवल कुछ तय गोलाकार पथों (<b>कक्षाओं</b>) में ही घूम सकते हैं, हर कक्षा की एक तय ऊर्जा होती है। कक्षा में रहते हुए वे ऊर्जा नहीं खोते — वे केवल तभी ऊर्जा लेते या छोड़ते हैं जब वे कक्षाओं के बीच <b>छलांग</b> लगाते हैं।</p><p class="eq">E<sub>n</sub> = −13.6 Z²/n² eV        r<sub>n</sub> = 0.529 n²/Z Å</p><ul><li>n = 1, 2, 3… <b>मुख्य क्वांटम संख्या</b> (कक्षा संख्या) है। बड़ा n यानी बड़ी कक्षा और अधिक (कम ऋणात्मक) ऊर्जा।</li><li>जब इलेक्ट्रॉन ऊँची कक्षा n₂ से नीची कक्षा n₁ में गिरता है, तो वह एक फोटॉन छोड़ता है: <b>ΔE = E<sub>n₂</sub> − E<sub>n₁</sub> = hν</b>।</li><li>उत्सर्जित प्रकाश की तरंगदैर्घ्य के लिए <b>रिडबर्ग सूत्र</b>: 1/λ = R(1/n₁² − 1/n₂²), R = 1.097 × 10⁷ m⁻¹।</li><li><b>लाइमन श्रेणी</b> (n₁ = 1, UV), <b>बामर श्रेणी</b> (n₁ = 2, दृश्य प्रकाश), <b>पाशन श्रेणी</b> (n₁ = 3, IR)।</li></ul><p>बोर का मॉडल हाइड्रोजन का स्पेक्ट्रम बहुत अच्छे से समझाता है, पर एक से अधिक इलेक्ट्रॉन वाले परमाणुओं के लिए विफल रहता है, और यह नहीं बता पाता कि कुछ कक्षाएँ ही क्यों चुनी जाती हैं (वह बस इसे मान लेता है)।</p>'),
  d3:'atom3d',

 {h:B('Quantum mechanical model','क्वांटम यांत्रिक मॉडल'),
  body:B(
   '<p class="def"><b>In simple words:</b> electrons are too small and fast to have both an exact position and an exact speed at once — we can only talk about the <b>probability</b> of finding one in a region of space. That region is called an <b>orbital</b>.</p><p class="eq">λ = h/mv  (de Broglie)        Δx·Δp ≥ h/4π  (Heisenberg uncertainty)</p><ul><li>Four quantum numbers describe each electron:</li><li><b>Principal (n)</b> = 1, 2, 3… — shell, size and energy.</li><li><b>Azimuthal (l)</b> = 0 to n−1 — sub-shell shape: l = 0 (s, spherical), 1 (p, dumbbell), 2 (d), 3 (f).</li><li><b>Magnetic (m<sub>l</sub>)</b> = −l to +l — orientation of the orbital in space.</li><li><b>Spin (m<sub>s</sub>)</b> = +½ or −½ — the electron’s intrinsic spin.</li></ul><p>An <b>orbital</b> (one set of n, l, m<sub>l</sub>) can hold at most 2 electrons, which must have opposite spin.</p>',
   '<p class="def"><b>सरल शब्दों में:</b> इलेक्ट्रॉन इतने छोटे और तेज़ हैं कि उनकी स्थिति और चाल दोनों एक साथ ठीक-ठीक नहीं बताई जा सकतीं — हम केवल यह बता सकते हैं कि किसी जगह उसे पाने की <b>प्रायिकता</b> कितनी है। उस क्षेत्र को <b>कक्षक</b> कहते हैं।</p><p class="eq">λ = h/mv  (डी ब्रॉग्ली)        Δx·Δp ≥ h/4π  (हाइज़ेनबर्ग अनिश्चितता)</p><ul><li>हर इलेक्ट्रॉन को चार क्वांटम संख्याएँ बताती हैं:</li><li><b>मुख्य (n)</b> = 1, 2, 3… — कोश, आकार और ऊर्जा।</li><li><b>दिगंशी (l)</b> = 0 से n−1 — उपकोश का आकार: l = 0 (s, गोलाकार), 1 (p, डम्बल), 2 (d), 3 (f)।</li><li><b>चुंबकीय (m<sub>l</sub>)</b> = −l से +l — कक्षक की अंतरिक्ष में दिशा।</li><li><b>चक्रण (m<sub>s</sub>)</b> = +½ या −½ — इलेक्ट्रॉन का अपना चक्रण।</li></ul><p>एक <b>कक्षक</b> (n, l, m<sub>l</sub> का एक समुच्चय) अधिकतम 2 इलेक्ट्रॉन रख सकता है, जिनका चक्रण विपरीत होना चाहिए।</p>')},
 {h:B('Filling electrons: Aufbau, Pauli and Hund','इलेक्ट्रॉन भरना: आउफबाऊ, पाउली और हुंड'),
  body:B(
   '<p class="def"><b>In simple words:</b> electrons fill orbitals the way water fills a container — lowest level first — but follow three rules so the filling matches real atoms.</p><ul><li><b>Aufbau principle:</b> electrons fill orbitals in order of increasing energy: 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p…</li><li><b>Pauli exclusion principle:</b> no two electrons in the same atom can have all four quantum numbers identical (so each orbital holds at most 2, with opposite spins).</li><li><b>Hund’s rule:</b> electrons occupy degenerate orbitals (like the three 2p orbitals) singly, with parallel spins, before any one is doubly filled.</li></ul><p class="eq">s: 2 electrons        p: 6 electrons        d: 10 electrons        f: 14 electrons</p><ul><li><b>Extra stability:</b> half-filled (p³, d⁵, f⁷) and fully-filled (p⁶, d¹⁰, f¹⁴) sub-shells are extra stable, due to symmetry and exchange energy — this is why Cr is [Ar]3d⁵4s¹ and Cu is [Ar]3d¹⁰4s¹, not the “expected” configuration.</li></ul>',
